name: Start home props and adult cadence handoff
on:
  push:
    paths:
      - '.github/workflows/start-home-props-adult-cadence.yml'
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add IN PROGRESS handoff entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          marker='## Current Work\n'
          entry='''\n### 2026-09-11 — Unclip Little Home carried props and calm adult movement\n\n**Status: IN PROGRESS**\n\n**User goal:** Fix the Little Home adults' carried tools/packages so they are not cut off by the Latchling circular outline, and make adult movement much less frequent because the current home scene feels too busy.\n\n**Diagnosis / implementation plan:** The Little Home carried items are CSS `::after` props positioned partly outside each adult resident, but the shared decorative `.latchling` sphere uses `overflow:hidden`, clipping those props at the circular body edge. Keep the spherical body/background/border circular while allowing external resident props to render outside the element. Adult choreography currently rests only 4.2–8.8 seconds normally and 9–13 seconds on occasional long rests; increase those rest windows substantially into a calm tens-of-seconds cadence and stagger initial outings so the three adults do not begin moving in quick succession. Preserve movement paths, prop art, children, play ball, faces, suits, home layout, and reduced-motion behavior.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, primarily `title-island-concepts/index.html`, optionally `index.html` only for cache freshness, plus temporary self-removing browser-validation helpers. Puzzle gameplay, board-piece styling, Atlas, story/cinematics outside the home iframe, audio, and campaign data are out of scope.\n\n**Validation plan:** Render the exact production Little Home iframe at phone size and DPR 1/3; force each adult into an outing state and assert its carried prop extends beyond the resident border box without being clipped while the resident remains circular. Verify normal adult rest windows are at least 35 seconds, long-rest windows are substantially longer, initial moves are staggered, movement durations/paths are unchanged, reduced-motion still suppresses outings, children remain unchanged, and no page errors occur. Capture close-ups of all three adults carrying their props.\n\n**Deployment plan:** Commit this IN PROGRESS entry before product edits, validate through a temporary self-removing GitHub Actions browser workflow, deploy the accepted clean state to GitHub Pages, then close this entry with exact commits/runs/artifacts and verify only the permanent repository-access guard remains.\n\n'''
          if marker not in s:
              raise SystemExit('Current Work marker missing')
          p.write_text(s.replace(marker, marker+entry, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Start home props and adult cadence handoff'
          git push
      - name: Self-remove starter
        shell: bash
        run: |
          git pull --ff-only origin main
          git rm -f .github/workflows/start-home-props-adult-cadence.yml
          git commit -m 'Remove home props cadence starter'
          git push
