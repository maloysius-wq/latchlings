name: Apply Final Cinematic Detail Patch
on:
  push:
    paths:
      - '.github/workflows/apply-final-detail-patch.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Apply final details
        run: |
          python3 .github/final_detail_patch.py
          node --check cinematics400.js
          grep -q 'cin-telescope-mount' cinematics400.js
          grep -q 'style400-cinematics-refine2.css' index.html
      - name: Commit and cleanup
        run: |
          rm -f .github/final_detail_patch.py .github/workflows/apply-final-detail-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cinematics400.js index.html style400-cinematics-refine2.css .github/final_detail_patch.py .github/workflows/apply-final-detail-patch.yml
          git commit -m 'Finish cinematic scene detailing'
          git pull --rebase origin main
          git push origin HEAD:main
