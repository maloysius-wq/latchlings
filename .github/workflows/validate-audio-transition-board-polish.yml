name: Validate audio transition and board polish
on:
  push:
    paths:
      - '.github/workflows/validate-audio-transition-board-polish.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        run: sha256sum music400.js game400-a.js game400-b.js index.html story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js style400-atlas-progression.css > /tmp/protected-before.sha
      - name: Apply candidate polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sfx400.js'); s=p.read_text()
          s=s.replace("  const BASE = 'assets/sfx/';\n","  const BASE = 'assets/sfx/';\n  const SFX_OUTPUT_SCALE = 0.60;\n",1)
          s=s.replace('    audio.volume = volume;','    audio.volume = Math.max(0, Math.min(1, volume * SFX_OUTPUT_SCALE));',1)
          if s.count('SFX_OUTPUT_SCALE')!=2: raise SystemExit('SFX scale patch mismatch')
          p.write_text(s)
          p=Path('style400-ui.css'); s=p.read_text()
          s=s.replace('::view-transition-group(root){animation-duration:210ms;animation-timing-function:cubic-bezier(.18,.76,.2,1);}','::view-transition-group(root){animation-duration:420ms;animation-timing-function:cubic-bezier(.18,.76,.2,1);}',1)
          s=s.replace('animation:latchlingsSwipeRightOld 210ms cubic-bezier(.18,.76,.2,1) both;','animation:latchlingsSwipeRightOld 420ms cubic-bezier(.18,.76,.2,1) both;',1)
          if 'latchlingsSwipeRightOld 210ms' in s: raise SystemExit('old transition timing remains')
          p.write_text(s)
          p=Path('style400-board-surfaces.css'); s=p.read_text(); patch=Path('.github/tmp/board-polish-override.css').read_text()
          if '/* Bold puzzle-square override:' in s: raise SystemExit('board patch already present')
          p.write_text(s.rstrip()+'\n\n'+patch.strip()+'\n')
          PY
          node --check sfx400.js
          node --check game400-a.js
          node --check game400-b.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          python3 -m pip install --quiet pillow
      - name: Serve candidate
        run: python3 -m http.server 4173 >/tmp/latchlings-polish-http.log 2>&1 &
      - name: Validate 40 board identities and audio/transition settings
        shell: bash
        run: |
          mkdir -p polish-audit/boards
          cp .github/tmp/validate-audio-transition-board-polish.mjs ./validate-audio-transition-board-polish.mjs
          node validate-audio-transition-board-polish.mjs
      - name: Pixel-check bold surfaces and build contact sheet
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw
          files=sorted(Path('polish-audit/boards').glob('ch*-r*-l*.png'),key=lambda p:(int(p.name.split('-')[0][2:]),int(p.name.split('-')[1][1:])))
          if len(files)!=40: raise SystemExit(f'expected 40 board renders, found {len(files)}')
          ratios=[]
          ims=[]
          for p in files:
              im=Image.open(p).convert('RGB'); ims.append(im)
              px=list(im.getdata()); near=sum(1 for r,g,b in px if r>238 and g>238 and b>225)/len(px)
              ratios.append((p.name,near))
              if near>.38: raise SystemExit(f'{p.name} still too near-white: {near:.3f}')
          tw=240; th=240; pad=22; lab=26
          sheet=Image.new('RGB',(5*(tw+pad)+pad,8*(th+lab+pad)+pad),(238,241,244)); d=ImageDraw.Draw(sheet)
          for i,(p,im) in enumerate(zip(files,ims)):
              ch=i//5+1; rg=i%5+1; im.thumbnail((tw,th)); x=pad+(i%5)*(tw+pad); y=pad+(i//5)*(th+lab+pad)
              sheet.paste(im,(x+(tw-im.width)//2,y+(th-im.height)//2)); d.text((x,y+th+4),f'Chapter {ch} / Range {rg}',fill=(25,42,63))
          sheet.save('polish-audit/board-40-contact-sheet.png')
          Path('polish-audit/pixel-ratios.txt').write_text('\n'.join(f'{n}: {r:.4f}' for n,r in ratios))
          PY
      - name: Verify protected source unchanged
        run: sha256sum -c /tmp/protected-before.sha
      - name: Commit accepted product
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json validate-audio-transition-board-polish.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sfx400.js style400-ui.css style400-board-surfaces.css
          git commit -m 'Tune SFX transitions and puzzle surfaces'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-transition-board-polish-renders
          path: polish-audit
          if-no-files-found: warn
      - name: Self-remove validation helpers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --ff-only origin main
          git rm .github/workflows/validate-audio-transition-board-polish.yml .github/tmp/board-polish-override.css .github/tmp/validate-audio-transition-board-polish.mjs .github/workflows/bump-audio-transition-board-polish.yml
          git commit -m 'Remove audio transition board polish helpers'
          git push
