name: Apply Cinematic Polish Handoff
on:
  push:
    paths:
      - '.github/workflows/apply-cinematic-polish-handoff.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Update handoff
        run: python3 .github/cinematic_polish_handoff.py
      - name: Commit handoff and cleanup
        run: |
          rm -f .github/cinematic_polish_handoff.py
          rm -f .github/workflows/apply-cinematic-polish-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/cinematic_polish_handoff.py .github/workflows/apply-cinematic-polish-handoff.yml
          git commit -m 'Start professional cinematic visual QA'
          git pull --rebase origin main
          git push origin HEAD:main
