name: Record CC0 Title Gallery Hosting Work

on:
  push:
    paths:
      - '.github/workflows/start-cc0-title-gallery-hosting.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy plan into development handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          handoff = Path('DEVELOPMENT_HANDOFF.md')
          plan = Path('.handoff/cc0-title-gallery-hosting-plan.md')
          text = handoff.read_text()
          heading = '### 2026-09-01 — Host second CC0 asset-based title concept gallery'
          if heading not in text:
              marker = '## Current Work\n\n'
              if marker not in text:
                  raise SystemExit('Current Work marker missing')
              text = text.replace(marker, marker + plan.read_text(), 1)
              handoff.write_text(text)
          PY
      - name: Commit handoff start and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/start-cc0-title-gallery-hosting.yml
          rm -f .handoff/cc0-title-gallery-hosting-plan.md
          rmdir .handoff 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Start CC0 title gallery hosting handoff'
          git pull --rebase origin main
          git push origin HEAD:main
