name: Record CC0 Title Gallery Hosting Work

on:
  push:
    paths:
      - '.github/workflows/start-cc0-title-gallery-hosting.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add current work entry
        shell: bash
        env:
          HANDOFF_ENTRY_B64: IyMjIDIwMjYtMDktMDEg4oCUIEhvc3Qgc2Vjb25kIENDMCBhc3NldC1iYXNlZCB0aXRsZSBjb25jZXB0IGdhbGxlcnkKCi**STATUS_PLACEHOLDER**
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          text=p.read_text()
          heading='### 2026-09-01 — Host second CC0 asset-based title concept gallery'
          if heading not in text:
              entry=base64.b64decode(os.environ['HANDOFF_ENTRY_B64']).decode('utf-8')
              marker='## Current Work\n\n'
              if marker not in text:
                  raise SystemExit('Current Work marker missing')
              text=text.replace(marker, marker+entry, 1)
              p.write_text(text)
          PY
      - name: Commit handoff start and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/start-cc0-title-gallery-hosting.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-cc0-title-gallery-hosting.yml
          git commit -m 'Start CC0 title gallery hosting handoff'
          git pull --rebase origin main
          git push origin HEAD:main
