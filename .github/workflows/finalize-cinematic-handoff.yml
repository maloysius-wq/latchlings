name: Finalize Campaign Cinematic Handoff
on:
  push:
    paths:
      - '.github/workflows/finalize-cinematic-handoff.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close cinematic handoff entry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          title='### 2026-09-04 — Add animated campaign cinematics and durable cinematic script'
          start=s.index(title)
          end=s.index('\n---\n',start)
          entry=s[start:end]
          if entry.count('**Status: IN PROGRESS**')!=1:
              raise SystemExit('cinematic handoff is not uniquely IN PROGRESS')
          entry=entry.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          anchor='**Deployment plan:** Commit this handoff entry before product edits. Implement the isolated cinematic system and script, run static and Chromium validation through a temporary self-removing workflow, inspect the render artifact manually, refine if needed, confirm repository hygiene, deploy the exact accepted product state through GitHub Pages, then close this entry with implementation/audit/deployment commit and run IDs.'
          if entry.count(anchor)!=1:
              raise SystemExit('deployment-plan anchor missing')
          summary=r'''

#### Completion summary

**Recovery result:** The vanished chat script could not be recovered from repository search or available personal context, so the cinematic plan was reconstructed from the actual production canon rather than guessed from memory. `STORY_BIBLE.md`, `story400.js`, the current Story Card system, and campaign progression all pointed to the same four-film structure. The result is now durable in `CINEMATICS_SCRIPT.md`, so the scripts and trigger logic no longer depend on chat history.

**Implemented cinematic structure:** Four player-paced animated cinematics are now part of the production campaign. **The Skyway** runs before the first normal Level 1 Story Card and contains seven beats covering natural island drift, Little Home and its five residents, what the Skyway does, the player’s Waykeeper role, the distinction between named story residents and the helper crew on puzzle boards, the universal select/direction/snap/stop/nest language, and the morning-route incident that launches Chapter 1. **Across the Drift** runs before Level 251 and makes the regional separation visible while establishing that yesterday’s map cannot simply be restored. **Old Maps, New Routes** runs before Level 301 and delivers the central Copperline revelation that contradictory historical maps were all correct for their own moment because Waykeepers continually rewrote routes. **Homeward** runs before Level 351 and establishes the community-maintained living Waykeeper network before Aurora Crown. The existing Level 400 **Skyway Restored** ending remains the campaign’s final payoff and was intentionally not duplicated with another mandatory film.

**Runtime and progression behavior:** `cinematics400.js` owns the reusable full-screen cinematic player and persistent seen state (`latchlings_cinematics_seen_v1`). Cinematics are player-paced rather than timer-forced, with Continue/final-action controls, Skip, Enter/Space advancement, Escape skip, beat progress, and reduced-motion support. `game400-a.js` gates the normal Story Card until any required cinematic finishes and now waits for the existing screen View Transition to settle before opening a cinematic, preventing the opening film from being captured inside the Home→Game swipe. Milestone films only auto-trigger when normal campaign progress has actually unlocked Levels 251/301/351, so direct Daily-style jumps cannot reveal them early. `game400-b.js` adds an unlock-aware replay library to Story & Residents and Reset Progress clears cinematic seen state so a fresh campaign receives the opening again.

**Visual system:** `style400-cinematics.css` provides the dedicated cinematic presentation layer: floating islands, flexible Skyway route lights, Little Home/cottage/tree staging, refined spherical resident and helper models, the Waykeeper compass, the animated route-board demonstration, Prism horizon/telescope imagery, Copperline map revisions and automation imagery, regional signal networks, and Aurora Crown lighting. The route demonstration visibly shows full-size helper pieces snapping toward a rock, another helper acting as a stopper, and a matching safe nest. Final visual refinement moved Little Home’s island clipping onto its soil/body pseudo-layer so the cottage roof and tree canopy correctly extend above the island instead of being clipped, while keeping the island centered in both the opening and Homeward scenes.

**Durable script source:** `CINEMATICS_SCRIPT.md` contains the complete narration/dialogue, visual intent, trigger, replay-unlock rule, and gameplay/story meaning for every beat in all four films. It also explicitly records that later chapter-specific mechanics such as anchors, gates, rails, turners, switches, and doors remain chapter introductions rather than being dumped into the opening.

**Files changed:** New durable product files are `CINEMATICS_SCRIPT.md`, `cinematics400.js`, and `style400-cinematics.css`. Integration changes are in `index.html`, `game400-a.js`, and `game400-b.js`, plus this handoff journal. `story400.js`, `story-theme400.js`, all `campaign400-*` files, solver data, music/SFX files, the production Little Home title source, and the existing Level 400 ending were not changed.

**Implementation commits:** Script source `fa7fcdbdb7e1b80119a2664d8ed5337697a921fb`; cinematic runtime `7e7cdfe11e640d9f9bf8dc088807622fa2ca3a9a`; cinematic styling `da0014a532984481bf73d6178e26a6953cb21cd0`; production loader/library integration `c735418c5f8ddc3145d93c7beda84c962ae4e2f6`; progression/Story integration `da76ad473eab8631de9bf38fb8c4995fa3b54997`; settled transition/demo/Home staging refinement `b69d6208c71037355c357eaaee67d42a6b3268a5`; and final Little Home scenery repair `31a6b3387955853b3fcf34ad903048f1029b00bd`. Audit-clean commit `4a355a621fe84cc81e8758c1d36e3b4362de5082` has the same accepted product tree after the last temporary audit self-removed.

**Functional validation:** Full campaign-cinematic audit run `33909276970` passed static checks plus Chromium at the production 390×844 viewport and a wide viewport. It verified opening-before-Story-Card ordering, all seven opening beats, seen-state behavior, Level 251/301/351 trigger correctness, low-progress spoiler protection, Skip, unlocked/locked replay states in Story & Residents, Reset Progress clearing cinematic history, no horizontal overflow, no browser errors, and `prefers-reduced-motion: reduce`. Artifact `9950724459` (`campaign-cinematic-renders`) captured the opening world, route demo, Copperline revelation, and Homeward network.

**Visual refinement validation:** Manual inspection of the first functional artifact caught three presentation defects despite the green assertions: the opening was momentarily entering during the existing root View Transition, helper pieces in the mini-board were visually collapsing because their demo positioning made them inline, and centered Little Home motion was losing its centering translation. Those were fixed in `b69d6208c71037355c357eaaee67d42a6b3268a5`. Refined visual audit run `33909576607` then passed settled-state/geometry checks and produced artifact `9950824458`. Manual inspection of that artifact found the remaining island `clip-path` issue hiding the cottage/tree; `31a6b3387955853b3fcf34ad903048f1029b00bd` moved clipping to the island body layer. Final scenery audit run `33909814678` passed and artifact `9950912226` was manually inspected and accepted: the cottage and tree are clearly visible above Little Home, all five residents remain legible, Homeward is centered, and the surrounding route network remains behind the focal home.

**Audit-history note:** Initial audit run `33908938623` failed because its first assertion sampled `data-screen` during the game’s pre-existing asynchronous View Transition even though the cinematic itself had opened correctly. A temporary correction helper run `33909184242` then hit GitHub’s workflow-edit permission restriction for Actions tokens; it did not alter product code. The audit was corrected through the GitHub connector and rerun successfully as `33909276970`. The failed helper workflow was removed, and all later temporary workflows self-removed normally.

**Repository hygiene:** All cinematic implementation, audit, correction, refinement, and final-render workflows have been removed. `.github/workflows/validate-repository-access-guard.yml` is the only durable workflow on `main`.

**Deployment:** GitHub Pages run `33909871306` completed successfully for accepted audit-clean commit `4a355a621fe84cc81e8758c1d36e3b4362de5082`. This is the deployed cinematic product state. The handoff closeout is documentation-only and follows that accepted deployment.

**Remaining risk / next action:** No blocking cinematic issue remains. The films are intentionally text-driven, CSS-animated, and player-paced; dedicated cinematic-only voice acting or bespoke music cues were not part of the recovered canonical requirement and were not added. Future cinematic revisions should edit `CINEMATICS_SCRIPT.md` first so script and implementation remain traceable. Any new substantive feature should begin with a new `IN PROGRESS` handoff entry rather than reopening this completed cinematic recovery.
'''
          entry=entry.replace(anchor,anchor+summary,1)
          s=s[:start]+entry+s[end:]
          p.write_text(s)
          PY
          grep -A3 'Add animated campaign cinematics and durable cinematic script' DEVELOPMENT_HANDOFF.md | grep -q 'Status: COMPLETED'
          grep -q '33909871306' DEVELOPMENT_HANDOFF.md
          grep -q '9950912226' DEVELOPMENT_HANDOFF.md
      - name: Commit final handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-cinematic-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/finalize-cinematic-handoff.yml
          git commit -m 'Close animated campaign cinematic handoff'
          git pull --rebase origin main
          git push origin HEAD:main
