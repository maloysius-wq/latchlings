name: Close SFX Normalization Handoff

on:
  push:
    paths:
      - '.github/workflows/close-sfx-normalization.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          text=p.read_text()
          title='### 2026-09-05 — Nest and victory SFX loudness normalization'
          start=text.index(title)
          end=text.index('\n---\n', start)
          section=text[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in section:
              section += '''\n\n#### Completion summary\n\n**Implementation:** `sfx400.js` is the only product file changed. The successful-nest `capture.wav` playback gain was reduced from `0.34` to `0.14` (about -7.7 dB), and the ordinary level-clear `level-clear.wav` gain was reduced from `0.24` to `0.12` (-6.0 dB). The level-clear cue delay was increased from `115 ms` to `280 ms`. Because the capture asset is about 324 ms long, the final-nest sequence now leaves only a short tail overlap instead of stacking the two bright confirmation transients for most of the capture sound. Source WAV assets, pitch, playback rate, gameplay timing, campaign data, music, and every unrelated SFX definition were left unchanged. Product commit: `f7ed9d956cb8794115ae32a07d7b9656fe469524` (`Normalize nest and level-clear SFX`). A compare against the clean pre-product state confirmed exactly one product file changed, with three value edits.\n\n**Validation:** Static assertions confirmed the new `0.14` capture gain, `0.12` clear gain, and `280 ms` clear delay while preserving unrelated `invalid`, `levelLose`, and `campaignComplete` levels. The first temporary browser-validation run `34011074374` failed only because its Playwright script was written under `/tmp`, outside Node's repository module-resolution path; static mix assertions had already passed and no product code was changed in response. The corrected self-removing validation run `34011123867` completed successfully. Its runtime browser smoke test loaded the production page without page errors, exercised the public `LatchlingsSFX` API, and printed `SFX_RUNTIME_NORMALIZATION_OK {"capture":0.14,"clear":0.12,"control":0.28,"spacingMs":280}`.\n\n**Deployment and hygiene:** After validation, the temporary validator self-removed on clean-main commit `440f456554342ecdebf5e64b72cf429140e3f969`. GitHub Pages run `34011150717` successfully built and deployed that clean product state. `.github/workflows/validate-repository-access-guard.yml` was confirmed as the only durable workflow before this closeout helper was created; this helper self-removes immediately after recording the completion.\n\n**Remaining risk / next action:** Loudness perception still varies by phone speaker, headphones, and device volume, so the final subjective check belongs on a real device. The reductions are intentionally substantial because the reported problem was extreme/piercing. There is no known functional blocker. If real-device listening still finds either cue too sharp, the next action is a small additional gain trim to that individual cue rather than altering the source asset or unrelated mix.\n'''
          text=text[:start]+section+text[end:]
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "Complete SFX normalization handoff"
            git push
          fi
          git pull --ff-only origin main
          rm -f .github/workflows/close-sfx-normalization.yml
          git add .github/workflows/close-sfx-normalization.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove SFX closeout helper"
            git push
          fi
