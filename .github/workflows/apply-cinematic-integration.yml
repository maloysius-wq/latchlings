name: Apply Cinematic Game Integration
on:
  push:
    paths:
      - '.github/workflows/apply-cinematic-integration.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch game integration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          a=Path('game400-a.js')
          s=a.read_text()
          old="function startLevel(L){currentLevel=Math.max(1,Math.min(400,L));const lev=LEVELS[currentLevel-1];if(!lev){showError('Missing level '+currentLevel);return}chapterView=Math.ceil(currentLevel/50);rangeView=Math.floor(((currentLevel-1)%50)/10);applyTheme(chapterView);positions=lev.pieces.map(p=>p.pos.slice());doorMask=0;movesUsed=0;selected=0;hintStep=0;animating=false;screen('game');renderGame(true);if(window.LatchlingsStoryTheme)window.LatchlingsStoryTheme.enterLevel(currentLevel)}"
          new="function startLevel(L){currentLevel=Math.max(1,Math.min(400,L));const lev=LEVELS[currentLevel-1];if(!lev){showError('Missing level '+currentLevel);return}chapterView=Math.ceil(currentLevel/50);rangeView=Math.floor(((currentLevel-1)%50)/10);applyTheme(chapterView);positions=lev.pieces.map(p=>p.pos.slice());doorMask=0;movesUsed=0;selected=0;hintStep=0;animating=false;screen('game');renderGame(true);const enterStory=()=>{if(window.LatchlingsStoryTheme)window.LatchlingsStoryTheme.enterLevel(currentLevel)};if(window.LatchlingsCinematics&&window.LatchlingsCinematics.maybeShowBeforeLevel(currentLevel,progress.unlocked,enterStory))return;enterStory()}"
          if s.count(old)!=1: raise SystemExit(f'startLevel replacement count {s.count(old)}')
          a.write_text(s.replace(old,new))

          b=Path('game400-b.js')
          s=b.read_text()
          old="function renderStoryScreen(){if(!STORY)return;const ch=STORY.currentChapter(progress),c=STORY.chapters[ch-1],premise=document.getElementById('storyPremise'),role=document.getElementById('storyRole'),cast=document.getElementById('storyCast'),chapter=document.getElementById('storyChapter');if(premise)premise.textContent=STORY.premise;if(role)role.innerHTML=`<strong>You are the ${STORY.playerRole}</strong><span>The Skyway is a living route network built to change as the floating islands drift. Your puzzle routes are the everyday work of keeping homes and neighbors connected.</span>${storyHelperCrewHtml()}`;if(cast)cast.innerHTML=STORY.cast.map(storyResidentCard).join('');if(chapter)chapter.innerHTML=`<strong>Chapter ${ch}: ${c.name}</strong><span>${c.theme}</span><p>${c.desc}</p>`}"
          new="function renderStoryScreen(){if(!STORY)return;const ch=STORY.currentChapter(progress),c=STORY.chapters[ch-1],premise=document.getElementById('storyPremise'),role=document.getElementById('storyRole'),cast=document.getElementById('storyCast'),chapter=document.getElementById('storyChapter'),cinematics=document.getElementById('storyCinematics');if(premise)premise.textContent=STORY.premise;if(role)role.innerHTML=`<strong>You are the ${STORY.playerRole}</strong><span>The Skyway is a living route network built to change as the floating islands drift. Your puzzle routes are the everyday work of keeping homes and neighbors connected.</span>${storyHelperCrewHtml()}`;if(cast)cast.innerHTML=STORY.cast.map(storyResidentCard).join('');if(chapter)chapter.innerHTML=`<strong>Chapter ${ch}: ${c.name}</strong><span>${c.theme}</span><p>${c.desc}</p>`;if(cinematics&&window.LatchlingsCinematics)window.LatchlingsCinematics.renderLibrary(cinematics,progress.unlocked)}"
          if s.count(old)!=1: raise SystemExit(f'renderStoryScreen replacement count {s.count(old)}')
          s=s.replace(old,new)
          old="document.getElementById('confirmReset').onclick=()=>{progress={unlocked:1,stars:{}};saveProgress();chapterView=1;rangeView=0;closeModal();renderChapter()}"
          new="document.getElementById('confirmReset').onclick=()=>{progress={unlocked:1,stars:{}};if(window.LatchlingsCinematics)window.LatchlingsCinematics.reset();saveProgress();chapterView=1;rangeView=0;closeModal();renderChapter()}"
          if s.count(old)!=1: raise SystemExit(f'reset replacement count {s.count(old)}')
          b.write_text(s.replace(old,new))
          PY
          node --check game400-a.js
          node --check game400-b.js
          node --check cinematics400.js
          grep -q 'maybeShowBeforeLevel(currentLevel,progress.unlocked,enterStory)' game400-a.js
          grep -q 'renderLibrary(cinematics,progress.unlocked)' game400-b.js
          grep -q 'LatchlingsCinematics.reset()' game400-b.js
      - name: Commit integration and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-cinematic-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game400-a.js game400-b.js .github/workflows/apply-cinematic-integration.yml
          git commit -m 'Integrate campaign cinematics with progression'
          git pull --rebase origin main
          git push origin HEAD:main
