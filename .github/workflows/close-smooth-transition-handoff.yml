name: Close smooth transition handoff
on:
  push:
    paths:
      - '.github/workflows/close-smooth-transition-handoff.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/close-smooth-transition-handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Close smooth transition handoff'
          git push
      - name: Self-remove closeout helper
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/close-smooth-transition-handoff.yml .github/tmp/close-smooth-transition-handoff.py
          git commit -m 'Remove smooth transition closeout helper'
          git push
