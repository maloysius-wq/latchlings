name: Astra Little Home committed-live validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-little-home-live.yml'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out committed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require promoted product parent and exact accepted bytes
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "5003f8c8e8421713f49374ab6b8c39d2af1cc3f1"
          git fetch origin astra-little-home-candidate
          git diff --exit-code 119ece1000cdab69c902ec75d2b0d89881372bd1 -- game400-a.js game400-b.js title-island-concepts/index.html index.html
          node --check game400-a.js
          node --check game400-b.js

      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise committed main
        shell: bash
        run: |
          mkdir -p /tmp/astra-home-live
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/astra-home-live-http.log 2>&1 &
          echo $! >/tmp/astra-home-live-http.pid
          cat > .astra-home-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const results=[];
          const sizes=[{name:'short',width:320,height:568},{name:'phone',width:390,height:844},{name:'wide',width:430,height:932}];
          for(const size of sizes){
            const context=await browser.newContext({viewport:{width:size.width,height:size.height},reducedMotion:'no-preference'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console ${m.text()}`)});
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            const frame=page.frames().find(f=>f.url().includes('title-island-concepts'));
            if(!frame)throw new Error(`${size.name}: Little Home iframe missing`);
            await frame.waitForSelector('#c2 .play');
            await page.waitForTimeout(120);
            const fresh=await frame.evaluate(()=>({label:document.querySelector('#c2 .home-primary-copy strong')?.textContent||'',meta:document.querySelector('#c2 .home-primary-copy small')?.textContent||'',keepsakes:document.querySelectorAll('#c2 .story-keepsake.memory-unlocked').length}));
            if(!fresh.label.startsWith('Begin ')||fresh.meta!=='Level 1 · Chapter 1'||fresh.keepsakes!==0)throw new Error(`${size.name}: fresh Home mismatch ${JSON.stringify(fresh)}`);

            await page.evaluate(()=>{progress={unlocked:251,stars:{50:3,100:3,150:3,200:3,250:3}};saveProgress();updateHome(false)});
            await page.waitForTimeout(120);
            const returning=await frame.evaluate(()=>({label:document.querySelector('#c2 .home-primary-copy strong')?.textContent||'',meta:document.querySelector('#c2 .home-primary-copy small')?.textContent||'',keepsakes:document.querySelectorAll('#c2 .story-keepsake.memory-unlocked').length}));
            if(returning.label!=='Continue Old Ways'||returning.meta!=='Level 251 · Chapter 6'||returning.keepsakes!==5)throw new Error(`${size.name}: returning Home mismatch ${JSON.stringify(returning)}`);

            await frame.evaluate(()=>document.querySelector('[data-memory="telescope"]')?.click());
            await page.waitForSelector('#overlay.show');
            const memory=(await page.locator('#modal h2').textContent())?.trim();
            if(memory!=='Prism Telescope')throw new Error(`${size.name}: memory mismatch ${memory}`);
            await page.click('#homeMemoryClose');

            await page.evaluate(()=>{progress={unlocked:351,stars:{50:3,100:3,150:3,200:3,250:3,300:3,350:3}};saveProgress();window.LatchlingsPrefs.set('motion','system');updateHome(false)});
            await page.waitForTimeout(80);
            if(size.name==='phone'){
              const work=await frame.evaluate(async()=>{stopLittleHomeAdultMotion();littleHomeSceneActive=true;document.documentElement.dataset.motion='system';littleHomeStoryStage=7;littleHomeAdultTurn=0;await runLittleHomeAdultMove();const a=littleHomeAdults[0];const out={resident:a.dataset.resident,target:a.dataset.lastWorkTarget,action:a.dataset.lastWorkAction,cycles:Number(a.dataset.completedWorkCycles||0)};stopLittleHomeAdultMotion();return out});
              if(work.resident!=='Pippa'||work.target!=='blue flowers'||!work.action||work.cycles<1)throw new Error(`phone: work cycle mismatch ${JSON.stringify(work)}`);
            }

            await page.evaluate(()=>{window.LatchlingsPrefs.set('motion','reduced');updateHome(false)});
            await page.waitForTimeout(100);
            const reduced=await frame.evaluate(()=>({motion:document.documentElement.dataset.motion,next:document.querySelector('#c2')?.dataset.nextAdultMoveMs||'',running:[...document.querySelectorAll('#c2 .resident')].flatMap(el=>el.getAnimations()).filter(a=>a.playState==='running').length}));
            if(reduced.motion!=='reduced'||reduced.next!=='paused'||reduced.running!==0)throw new Error(`${size.name}: Reduced Motion mismatch ${JSON.stringify(reduced)}`);

            await page.evaluate(()=>{window.LatchlingsPrefs.set('motion','system');screen('levels')});
            await page.waitForTimeout(80);
            const offscreen=await frame.evaluate(()=>({scene:document.documentElement.dataset.sceneActive,next:document.querySelector('#c2')?.dataset.nextAdultMoveMs||'',running:[...document.querySelectorAll('#c2 .resident.adult')].flatMap(el=>el.getAnimations()).filter(a=>a.playState==='running').length}));
            if(offscreen.scene!=='false'||offscreen.next!=='paused'||offscreen.running!==0)throw new Error(`${size.name}: offscreen motion mismatch ${JSON.stringify(offscreen)}`);

            await page.evaluate(()=>{screen('home');progress={unlocked:400,stars:{50:3,100:3,150:3,200:3,250:3,300:3,350:3,400:3}};saveProgress();updateHome(false)});
            await page.waitForTimeout(100);
            const completed=await frame.evaluate(()=>({label:document.querySelector('#c2 .home-primary-copy strong')?.textContent||'',meta:document.querySelector('#c2 .home-primary-copy small')?.textContent||''}));
            if(completed.label!=='Replay Aurora Crown'||completed.meta!=='Level 400 · final route')throw new Error(`${size.name}: completion CTA mismatch ${JSON.stringify(completed)}`);
            if(errors.length)throw new Error(`${size.name}: ${errors.join('; ')}`);
            if(size.name==='phone')await page.screenshot({path:'/tmp/astra-home-live/committed-home.png',fullPage:true});
            results.push({size:size.name,fresh,returning,reduced,offscreen,completed});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('/tmp/astra-home-live/results.json',JSON.stringify(results,null,2));
          console.log(JSON.stringify(results,null,2));
          JS
          node .astra-home-live.mjs
          rm -f .astra-home-live.mjs
          kill $(cat /tmp/astra-home-live-http.pid) || true

      - name: Upload committed-live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-little-home-committed-live-evidence
          path: /tmp/astra-home-live
          if-no-files-found: warn
