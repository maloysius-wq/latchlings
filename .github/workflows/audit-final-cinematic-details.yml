name: Audit Final Cinematic Detail Frames
on:
  push:
    paths:
      - '.github/workflows/audit-final-cinematic-details.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static detail assertions
        run: |
          set -euo pipefail
          node --check cinematics400.js
          grep -q 'style400-cinematics-refine2.css' index.html
          grep -q 'cin-telescope-mount' cinematics400.js
          grep -q 'cin-home-reference-wrap:after{display:none' style400-cinematics-refine2.css
          grep -q 'cin-islands.prism .cin-island-top:before' style400-cinematics-refine2.css
      - name: Install Chromium
        run: |
          T="$RUNNER_TEMP/latchlings-final-detail-audit"
          mkdir -p "$T" && cd "$T"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Render rejected-then-refined frames
        run: |
          T="$RUNNER_TEMP/latchlings-final-detail-audit"
          cat > "$T/audit.mjs" <<'MJS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const ok=(c,m)=>{if(!c)throw new Error(m)},out=process.env.GITHUB_WORKSPACE+'/final-detail-renders';fs.mkdirSync(out,{recursive:true});
          const b=await chromium.launch({headless:true}),c=await b.newContext({viewport:{width:390,height:844}}),p=await c.newPage(),errors=[];
          p.on('pageerror',e=>errors.push('page:'+e.message));p.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});p.on('requestfailed',r=>{const u=r.url(),e=r.failure()?.errorText||'';if(/\.(wav|mp3|ogg|m4a)($|\?)/i.test(u)&&/ERR_ABORTED/.test(e))return;errors.push('request:'+u+':'+e)});
          await p.goto('http://127.0.0.1:8165/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.LatchlingsCinematics);
          async function shot(id,beat,file){await p.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id);await p.waitForSelector(`#cinematicOverlay.show[data-cinematic="${id}"]`);for(let i=0;i<beat;i++){await p.click('#cinematicNext');await p.waitForTimeout(90)}await p.waitForTimeout(300);await p.screenshot({path:out+'/'+file,fullPage:true})}
          await shot('across-drift',0,'prism-gardens-final.png');const prism=await p.evaluate(()=>({crystals:document.querySelectorAll('.cin-islands.prism .cin-island-prop').length,flowers:getComputedStyle(document.querySelector('.cin-islands.prism .cin-island-top'),'::before').content,overflow:document.documentElement.scrollWidth>innerWidth+1}));ok(prism.crystals===5&&prism.flowers!=='none'&&!prism.overflow,'Prism detail regression '+JSON.stringify(prism));await p.keyboard.press('Escape');await p.waitForFunction(()=>!document.getElementById('cinematicOverlay').classList.contains('show'));
          await shot('across-drift',1,'familiar-porch-final.png');const porch=await p.evaluate(()=>({mount:!!document.querySelector('.cin-telescope-mount'),legs:document.querySelectorAll('.cin-telescope-mount b').length,home:!!document.querySelector('.cin-distant-home'),overflow:document.documentElement.scrollWidth>innerWidth+1}));ok(porch.mount&&porch.legs===3&&porch.home&&!porch.overflow,'Porch detail regression '+JSON.stringify(porch));await p.keyboard.press('Escape');await p.waitForFunction(()=>!document.getElementById('cinematicOverlay').classList.contains('show'));
          await shot('homeward',5,'homeward-final.png');const home=await p.evaluate(()=>({nodes:document.querySelectorAll('.cin-network .node').length,iframe:document.querySelectorAll('iframe.cin-home-reference').length,vignette:getComputedStyle(document.querySelector('.cin-home-reference-wrap'),'::after').display,overflow:document.documentElement.scrollWidth>innerWidth+1}));ok(home.nodes===8&&home.iframe===1&&home.vignette==='none'&&!home.overflow,'Homeward detail regression '+JSON.stringify(home));const f=p.frames().find(x=>x.url().includes('cinematic=1'));ok(f,'Homeward iframe missing');const fh=await f.evaluate(()=>({html:getComputedStyle(document.documentElement).backgroundColor,body:getComputedStyle(document.body).backgroundColor,residents:document.querySelectorAll('#c2 .resident').length}));ok(fh.html==='rgba(0, 0, 0, 0)'&&fh.body==='rgba(0, 0, 0, 0)'&&fh.residents===5,'Homeward iframe parity '+JSON.stringify(fh));
          await p.goto('http://127.0.0.1:8165/title-island-concepts/?c=2&embed=1',{waitUntil:'domcontentloaded'});await p.waitForSelector('#c2 .island-model');await p.waitForTimeout(300);const title=await p.evaluate(()=>({mode:document.body.classList.contains('cinematic-mode'),play:!!document.querySelector('#c2 .play'),residents:document.querySelectorAll('#c2 .resident').length}));ok(!title.mode&&title.play&&title.residents===5,'normal title regression '+JSON.stringify(title));await p.screenshot({path:out+'/normal-title-final.png',fullPage:true});
          ok(errors.length===0,'browser errors '+errors.join(' | '));await b.close();console.log('FINAL_DETAIL_VISUALS_OK');
          MJS
          python3 -m http.server 8165 >/tmp/latchlings-final-detail-http.log 2>&1 &
          PID=$!; trap 'kill $PID || true' EXIT
          cd "$T" && node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-cinematic-detail-renders
          path: final-detail-renders/*.png
          if-no-files-found: error
      - name: Self-remove detail audit
        run: |
          rm -rf final-detail-renders
          rm -f .github/workflows/audit-final-cinematic-details.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete final cinematic detail audit'
          git pull --rebase origin main
          git push origin HEAD:main
