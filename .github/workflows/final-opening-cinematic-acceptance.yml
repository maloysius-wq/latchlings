name: Final Opening Cinematic Acceptance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/latchlings-server.log 2>&1 &
          sleep 2
      - name: Audit opening cinematic
        shell: bash
        run: |
          set -euo pipefail
          cat > cinematic-final-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const OUT='cinematic-final-audit';fs.mkdirSync(OUT,{recursive:true});
          const fail=m=>{throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          await context.addInitScript(()=>{
            localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1}));
            localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars:{}}));
          });
          const page=await context.newPage();page.setDefaultTimeout(12000);const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));
          page.on('console',m=>{if(m.type()==='error'&&!/favicon|ERR_ABORTED|Failed to load resource/i.test(m.text()))errors.push('console: '+m.text())});
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.LatchlingsCinematics&&window.LatchlingsCinematicGeometry&&window.LatchlingsCinematicDialogue);
          await page.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));
          await page.waitForFunction(()=>document.getElementById('cinematicOverlay')?.classList.contains('show'));
          const manifest=[];
          for(let idx=0;idx<7;idx++){
            if(idx)await page.evaluate(()=>window.LatchlingsCinematics.next());
            await page.waitForFunction(n=>window.LatchlingsCinematics.beat===n&&document.getElementById('cinematicOverlay')?.dataset.beat===String(n+1),idx);
            await page.waitForTimeout(700);
            const d=await page.evaluate(()=>{
              const rectObj=r=>({left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height});
              const overlap=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
              const stage=document.getElementById('cinematicStage'),sr=stage.getBoundingClientRect(),pairs=window.LatchlingsCinematicGeometry.ROUTE_PAIRS;
              const groups=[...stage.querySelectorAll(':scope > .cin-dialogue-layer')].map(layer=>[...layer.querySelectorAll('.cin-speech-bubble')].map(b=>{
                const r=b.getBoundingClientRect(),p=b.closest('[data-speaker]')?.querySelector('.dialogue-portrait')?.getBoundingClientRect(),tail=parseFloat(getComputedStyle(b).getPropertyValue('--cin-tail-x'))||50,px=p?p.left+p.width/2:null,tailX=r.left+r.width*tail/100;
                return {speaker:b.closest('[data-speaker]')?.dataset.speaker||'',rect:rectObj(r),portrait:p?rectObj(p):null,tailX,tailError:px==null?999:Math.abs(tailX-px)};
              }));
              const routeSets=[...stage.querySelectorAll('.cin-islands')].map(islands=>{const geoms=islands.__latchRouteGeometry||[];return geoms.map((g,i)=>{if(!g)return null;const a=islands.querySelector(`:scope > .cin-island.${pairs[i][0]}`)?.getBoundingClientRect(),b=islands.querySelector(`:scope > .cin-island.${pairs[i][1]}`)?.getBoundingClientRect(),p1={x:sr.left+g.x1,y:sr.top+g.y1},p2={x:sr.left+g.x2,y:sr.top+g.y2},inside=(p,r)=>!!r&&p.x>=r.left-2&&p.x<=r.right+2&&p.y>=r.top-2&&p.y<=r.bottom+2;return {from:pairs[i][0],to:pairs[i][1],startInside:inside(p1,a),endInside:inside(p2,b),g}}).filter(Boolean)});
              const trees=[...stage.querySelectorAll('.prop-tree[data-detailed-tree="true"]')].map(t=>({crowns:t.querySelectorAll('.cin-tree-crown').length,wood:getComputedStyle(t.querySelector('.cin-tree-trunk')).backgroundImage,grass:getComputedStyle(t.querySelector('.cin-tree-crown')).backgroundImage}));
              const beat=window.LatchlingsCinematics.beat+1,bubbles=[...stage.querySelectorAll('.cin-speech-bubble')].map(x=>rectObj(x.getBoundingClientRect())),dialogue=[...stage.querySelectorAll('.cin-speech-bubble,.cin-dialogue-speaker .dialogue-portrait,.cin-intro-person .dialogue-portrait')].map(x=>rectObj(x.getBoundingClientRect())),focal=[];
              if(beat===2||beat===7){const frame=stage.querySelector('.cin-home-reference'),doc=frame?.contentDocument,cot=doc?.querySelector('#c2 .cottage');if(frame&&cot){const fr=frame.getBoundingClientRect(),cr=cot.getBoundingClientRect(),sx=fr.width/(frame.clientWidth||fr.width),sy=fr.height/(frame.clientHeight||fr.height);focal.push({left:fr.left+cr.left*sx,top:fr.top+cr.top*sy,right:fr.left+cr.right*sx,bottom:fr.top+cr.bottom*sy})}}
              if(beat===4){const r=stage.querySelector('.cin-compass')?.getBoundingClientRect();if(r)focal.push(rectObj(r))}
              if(beat===5){const r=stage.querySelector('.cin-helper-story')?.getBoundingClientRect();if(r)focal.push(rectObj(r))}
              if(beat===6){const r=stage.querySelector('.cin-demo-board')?.getBoundingClientRect();if(r)focal.push(rectObj(r))}
              const focalOverlap=focal.reduce((s,f)=>s+dialogue.reduce((n,r)=>n+overlap(f,r),0),0);
              return {beat,groups,routeSets,trees,bubbles,stage:rectObj(sr),focal,focalOverlap,overflow:document.documentElement.scrollWidth-window.innerWidth,narratorLabel:/Narrator/i.test(document.getElementById('cinematicLines')?.textContent||''),copy:document.getElementById('cinematicOverlay')?.innerText||''};
            });
            if(d.overflow>1||d.narratorLabel)fail(`opening overflow/narrator beat ${idx+1}: ${JSON.stringify(d)}`);
            if(/prototype error|command post|command center|implementation choice|development choice|requester|you did.?n.t want|we are not going to/i.test(d.copy))fail(`development copy beat ${idx+1}`);
            for(const group of d.groups){if(group.length>1){const hs=group.map(x=>x.rect.height),tops=group.map(x=>x.rect.top),bottoms=group.map(x=>x.rect.bottom);if(Math.max(...hs)-Math.min(...hs)>1.5||Math.max(...tops)-Math.min(...tops)>2||Math.max(...bottoms)-Math.min(...bottoms)>2)fail(`speech band mismatch beat ${idx+1}: ${JSON.stringify(group)}`)}if(group.some(x=>x.tailError>3.5))fail(`tail misses speaker beat ${idx+1}: ${JSON.stringify(group)}`)}
            if(d.routeSets.flat().some(x=>!x.startInside||!x.endInside))fail(`detached route beat ${idx+1}: ${JSON.stringify(d.routeSets)}`);
            if([0,2,3].includes(idx)&&(!d.trees.length||d.trees.some(t=>t.crowns!==3||!/wood\.jpg/.test(t.wood)||!/grass\.jpg/.test(t.grass))))fail(`tree material beat ${idx+1}: ${JSON.stringify(d.trees)}`);
            if(d.bubbles.some(r=>r.left<d.stage.left-1||r.right>d.stage.right+1||r.top<d.stage.top-1||r.bottom>d.stage.bottom+1))fail(`bubble outside stage beat ${idx+1}: ${JSON.stringify(d)}`);
            if(d.focal.length&&d.focalOverlap>3)fail(`dialogue overlaps focal art beat ${idx+1}: ${d.focalOverlap}`);
            if(idx===2){const samples=[];for(let s=0;s<3;s++){await page.waitForTimeout(320);samples.push(await page.evaluate(()=>{const stage=document.getElementById('cinematicStage'),sr=stage.getBoundingClientRect(),cargo=stage.querySelector('.cin-route-cargo'),geoms=cargo?.__latchRouteGeometry||[],dist=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l)),x=a.x+t*dx,y=a.y+t*dy;return Math.hypot(p.x-x,p.y-y)};return [...(cargo?.querySelectorAll('i')||[])].map((el,j)=>{const r=el.getBoundingClientRect(),g=geoms[j],p={x:r.left+r.width/2-sr.left,y:r.top+r.height/2-sr.top};return {x:p.x,y:p.y,d:g?dist(p,{x:g.x1,y:g.y1},{x:g.x2,y:g.y2}):999}})}));}if(samples.flat().some(x=>x.d>3))fail(`cargo left route ${JSON.stringify(samples)}`);if(!samples[0].some((p,j)=>Math.hypot(p.x-samples[2][j].x,p.y-samples[2][j].y)>5))fail(`cargo did not travel ${JSON.stringify(samples)}`);d.cargoSamples=samples;}
            await page.screenshot({path:`${OUT}/opening-${String(idx+1).padStart(2,'0')}.png`,fullPage:false,animations:'disabled'});manifest.push(d);
          }
          fs.writeFileSync(`${OUT}/manifest.json`,JSON.stringify(manifest,null,2));
          await page.evaluate(()=>window.LatchlingsCinematics.finish(false));await context.close();
          const compact=await browser.newContext({viewport:{width:390,height:700},reducedMotion:'reduce'});const cp=await compact.newPage();cp.setDefaultTimeout(12000);await cp.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});await cp.waitForFunction(()=>window.LatchlingsCinematics&&window.LatchlingsCinematicGeometry);await cp.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));for(let i=0;i<6;i++){await cp.evaluate(()=>window.LatchlingsCinematics.next());await cp.waitForTimeout(130)}await cp.waitForFunction(()=>document.getElementById('cinematicOverlay')?.dataset.beat==='7');await cp.waitForTimeout(550);const compactData=await cp.evaluate(()=>{const ro=r=>({left:r.left,right:r.right,top:r.top,bottom:r.bottom}),stage=document.getElementById('cinematicStage').getBoundingClientRect(),b=[...document.querySelectorAll('#cinematicStage .cin-speech-bubble')].map(x=>ro(x.getBoundingClientRect()));return {stage:ro(stage),b,overflow:document.documentElement.scrollWidth-window.innerWidth}});if(compactData.overflow>1||compactData.b.some(r=>r.left<compactData.stage.left-1||r.right>compactData.stage.right+1||r.top<compactData.stage.top-1||r.bottom>compactData.stage.bottom+1))fail(`compact opening regression ${JSON.stringify(compactData)}`);await cp.screenshot({path:`${OUT}/opening-07-compact.png`,fullPage:false,animations:'disabled'});await compact.close();if(errors.length)fail(errors.join('\n'));await browser.close();console.log('OPENING_CINEMATIC_ACCEPTED');
          EOF
          node cinematic-final-audit.mjs
      - name: Build cinematic contact sheet
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          files=sorted(glob.glob('cinematic-final-audit/opening-??.png'))
          if files:
              w=195;h=int(w*844/390);cols=4;rows=math.ceil(len(files)/cols);canvas=Image.new('RGB',(cols*w,rows*(h+18)),'white');draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(files):
                  im=Image.open(f).convert('RGB');im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+18);canvas.paste(im,(x,y));draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save('cinematic-final-audit/opening-contact-sheet.jpg',quality=92)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-opening-cinematic-acceptance
          path: cinematic-final-audit
          if-no-files-found: warn
      - name: Self-remove workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f cinematic-final-audit.mjs
          git pull --ff-only origin main
          rm -f .github/workflows/final-opening-cinematic-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/final-opening-cinematic-acceptance.yml
          if ! git diff --cached --quiet; then git commit -m "Remove final opening cinematic audit" && git push; fi
