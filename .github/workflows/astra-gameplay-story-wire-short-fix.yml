name: Astra gameplay story wire short fix

on:
  push:
    branches: [astra-gameplay-story-candidate]
    paths:
      - '.github/workflows/astra-gameplay-story-wire-short-fix.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-gameplay-story-candidate
          fetch-depth: 0
      - name: Fold short-phone correction into canonical candidate helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/tmp/astra_gameplay_story_candidate.py')
          s=p.read_text(encoding='utf-8')
          marker="exec(Path('.github/tmp/astra_gameplay_story_short_phone_fix.py').read_text(encoding='utf-8'), {'__name__':'__main__'})"
          anchor="print('Astra gameplay + story coherence candidate patch applied.')"
          assert anchor in s
          if marker not in s:
              s=s.replace(anchor, marker+'\n'+anchor, 1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F "astra_gameplay_story_short_phone_fix.py" .github/tmp/astra_gameplay_story_candidate.py
      - name: Commit helper wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/tmp/astra_gameplay_story_candidate.py
          if git diff --cached --quiet; then
            echo "Candidate helper already wired."
            exit 0
          fi
          git commit -m "Apply short-phone fix in gameplay candidate helper"
          git push origin HEAD:astra-gameplay-story-candidate
