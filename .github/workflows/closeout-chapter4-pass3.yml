name: Close Chapter 4 Pass 3 handoff

on:
  push:
    paths:
      - '.github/workflows/closeout-chapter4-pass3.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete Chapter 4 Pass 3 handoff
        run: |
          python .github/tmp/closeout-chapter4-pass3.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Complete Pass 3 Chapter 4 Masquerade handoff"
          git push
      - name: Self-remove closeout helper
        run: |
          git pull --rebase
          git rm .github/workflows/closeout-chapter4-pass3.yml .github/tmp/closeout-chapter4-pass3.py
          git commit -m "Remove Chapter 4 Pass 3 closeout helper"
          git push
