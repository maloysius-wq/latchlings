name: Start Swipe Transition Work

on:
  push:
    paths:
      - '.github/workflows/start-swipe-transition-work.yml'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add current work entry
        run: python3 .github/scripts/start_swipe_transition_work.py
      - name: Validate current work entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('DEVELOPMENT_HANDOFF.md').read_text()
          h='### 2026-09-03 — Replace veil transition with fast right-swipe motion blur and CC0 whoosh'
          s=t.index(h);e=t.index('\n---',s);x=t[s:e]
          for token in ['**Status: IN PROGRESS**','View Transitions API','OpenGameArt `Swishes Sound Pack`','same-screen `game` calls']:
              assert token in x,token
          print('SWIPE_TRANSITION_HANDOFF_OK')
          PY
      - name: Commit handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/start-swipe-transition-work.yml .github/scripts/start_swipe_transition_work.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-swipe-transition-work.yml .github/scripts/start_swipe_transition_work.py
          git commit -m 'Start swipe transition and CC0 whoosh work'
          git pull --rebase origin main
          git push origin HEAD:main
