name: Refine Randomized Little Home Adult Movement

on:
  push:
    paths:
      - '.github/workflows/refine-little-home-random-adult-movement.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply randomized adult movement
        run: python3 .github/scripts/refine_little_home_random_adult_movement.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          roles=re.findall(r'data-role="(adult|child)"',c2)
          if len(roles)!=5 or roles.count('adult')!=3 or roles.count('child')!=2:
              raise SystemExit(f'Expected 3 adults / 2 children, got {roles}')
          for token in [
              '#c2 .life-garden.adult-outing{animation:littleHomeGarden var(--adult-move-duration,5.2s) ease-in-out 1 both}',
              '#c2 .life-parcel.adult-outing{animation:littleHomeParcel var(--adult-move-duration,5.4s) ease-in-out 1 both}',
              '#c2 .life-tree.adult-outing{animation:littleHomeTree var(--adult-move-duration,5.6s) ease-in-out 1 both}',
              'LITTLE_HOME_ADULT_IDLE_MIN=4200',
              'LITTLE_HOME_ADULT_IDLE_MAX=8800',
              'LITTLE_HOME_ADULT_LONG_IDLE_MIN=9000',
              'LITTLE_HOME_ADULT_LONG_IDLE_MAX=13000',
              'LITTLE_HOME_ADULT_MOVE_MIN=4400',
              'LITTLE_HOME_ADULT_MOVE_MAX=6000',
              "adult.dataset.motionState='idle'",
              "adult.dataset.motionState='moving'",
              "adult.classList.add('adult-outing')",
              "adult.addEventListener('animationend'"
          ]:
              if token not in t:
                  raise SystemExit(f'Missing randomized movement token: {token}')
          if '#c2 .life-garden{animation:littleHomeGarden 9.2s ease-in-out infinite}' in t or '#c2 .life-parcel{animation:littleHomeParcel 10.4s ease-in-out infinite}' in t or '#c2 .life-tree{animation:littleHomeTree 11.1s ease-in-out infinite}' in t:
              raise SystemExit('Legacy perpetual adult movement remains')
          for token in ['#c2 .kid-one{animation:littleHomeKidOne 6.1s cubic-bezier(.42,0,.36,1) infinite}','#c2 .kid-two{animation:littleHomeKidTwo 6.1s cubic-bezier(.42,0,.36,1) infinite reverse}']:
              if token not in t:
                  raise SystemExit('Child movement changed unexpectedly')
          if c2.count('class="flower ')!=3 or c2.count('class="cloud ')!=4 or 'class="deck' in c2 or 'class="fence' in c2:
              raise SystemExit('Existing scene polish regressed')
          if '<img' in t.lower() or 'https://' in c2 or 'http://' in c2:
              raise SystemExit('Unexpected runtime image/hotlink')
          print('RANDOM_ADULT_STATIC_OK', {'residents':5,'adults':3,'children':2})
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js style400-game.css

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-random-node"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and screenshots
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-random-node"
          mkdir -p random-adult-renders
          python3 -m http.server 8128 >/tmp/little-home-random-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cp .github/scripts/validate_little_home_random_adult_movement.mjs "$TEST_NODE/validate_little_home_random_adult_movement.mjs"
          node "$TEST_NODE/validate_little_home_random_adult_movement.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-random-adult-renders
          path: random-adult-renders/*.png
          if-no-files-found: error

      - name: Commit validated movement and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf random-adult-renders
          rm -f .github/workflows/refine-little-home-random-adult-movement.yml .github/scripts/refine_little_home_random_adult_movement.py .github/scripts/validate_little_home_random_adult_movement.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-random-adult-movement.yml .github/scripts/refine_little_home_random_adult_movement.py .github/scripts/validate_little_home_random_adult_movement.mjs
          git commit -m 'Give Little Home adults randomized rest periods'
          git pull --rebase origin main
          git push origin HEAD:main
