name: Close Music Volume Fix Handoff
on:
  push:
    paths:
      - '.github/workflows/close-volume-fix-handoff.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff
        run: python3 .github/scripts/close_volume_fix_handoff.py
      - name: Validate closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('DEVELOPMENT_HANDOFF.md').read_text();h='### 2026-09-03 — Clamp music fade volume to valid media range';s=t.index(h);e=t.index('\n---',s);x=t[s:e]
          for token in ['**Status: COMPLETED**','33808735414','08ab99ae0124da0e0650d8d59bce730271599814','33808806522','149 assignments']:
              assert token in x,token
          print('VOLUME_FIX_HANDOFF_CLOSURE_OK')
          PY
      - name: Commit handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/close-volume-fix-handoff.yml .github/scripts/close_volume_fix_handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-volume-fix-handoff.yml .github/scripts/close_volume_fix_handoff.py
          git commit -m 'Close music volume clamp fix handoff'
          git pull --rebase origin main
          git push origin HEAD:main
