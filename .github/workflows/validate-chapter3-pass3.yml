name: Validate Chapter 3 Pass 3 campaign application

on:
  push:
    paths:
      - '.github/workflows/validate-chapter3-pass3.yml'
      - '.github/tmp/apply-chapter3-pass3.py'
      - '.github/tmp/validate-chapter3-pass3.mjs'

permissions:
  contents: write

env:
  PROMOTE: 'false'
  PRODUCT_FILES: >-
    game400-a.js game400-b.js style400-production-slice.css style400-skyway-atlas.css title-island-concepts/index.html LEVEL_SELECT_ART_DIRECTION.md index.html

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect puzzle data and unrelated runtime systems
        run: |
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js story400.js story-grounding400.js STORY_BIBLE.md cinematics400.js cinematic-dialogue400.js gameplay-story-rail400.js story-theme400.js music400.js sfx400.js style400-game.css style400-board-surfaces.css > /tmp/protected-before.sha256

      - name: Apply Chapter 3 Pass 3 candidate
        run: python .github/tmp/apply-chapter3-pass3.py

      - name: Static validation
        run: |
          node --check game400-a.js
          node --check game400-b.js
          sha256sum -c /tmp/protected-before.sha256
          python - <<'PY'
          from pathlib import Path
          import subprocess
          expected=set('game400-a.js game400-b.js style400-production-slice.css style400-skyway-atlas.css title-island-concepts/index.html LEVEL_SELECT_ART_DIRECTION.md index.html'.split())
          changed=set()
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              path=line[3:]
              if path.startswith('.github/tmp/') or path=='.github/workflows/validate-chapter3-pass3.yml':
                  continue
              changed.add(path)
          if changed != expected:
              raise SystemExit(f'Chapter 3 Pass 3 product diff mismatch: expected {sorted(expected)}, got {sorted(changed)}')
          a=Path('game400-a.js').read_text(); b=Path('game400-b.js').read_text(); css=Path('style400-production-slice.css').read_text(); atlas=Path('style400-skyway-atlas.css').read_text(); home=Path('title-island-concepts/index.html').read_text(); art=Path('LEVEL_SELECT_ART_DIRECTION.md').read_text(); html=Path('index.html').read_text()
          assert "VISUAL_CHAPTER_MODES={1:'sunpetal',2:'lanternwood',3:'lodestone'}" in a
          assert '#game[data-visual-slice="lodestone"]' in css and 'data-board-range="5"' in css
          assert '.chapter-three-reward' in css and '.lodestone-reward-marker' in css and '.lodestone-reward-anchor' in css
          assert 'showChapterThreeReward' in b and "focusHomeReward('anchor')" in b and 'currentLevel===150' in b
          assert '.theme-ch3 .atlas-map.atlas-range-2 .atlas-scene em' in atlas
          assert 'old Waykeeper marker slab' in art and 'cyan anchor-ring glyph' in art
          assert 'story-focus-anchor' in home and "e.data.focus==='anchor'" in home
          assert '20260912-ch3pass3-1' in html
          print('CHAPTER3_PASS3_STATIC_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance and screenshot matrix
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-ch3-pass3-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 300s node .github/tmp/validate-chapter3-pass3.mjs
          sha256sum -c /tmp/protected-before.sha256

      - name: Upload Chapter 3 Pass 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-pass3-campaign-application
          path: /tmp/chapter3-pass3
          if-no-files-found: warn

      - name: Commit accepted Chapter 3 product files
        if: env.PROMOTE == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $PRODUCT_FILES
          git commit -m "Apply Pass 3 production treatment to Lodestone"
          git push

      - name: Self-remove Chapter 3 validation helpers
        if: env.PROMOTE == 'true'
        run: |
          rm -rf node_modules
          git reset --hard HEAD
          git clean -fd
          git pull --rebase
          git rm .github/workflows/validate-chapter3-pass3.yml .github/tmp/apply-chapter3-pass3.py .github/tmp/validate-chapter3-pass3.mjs
          git commit -m "Remove Chapter 3 Pass 3 validator"
          git push
