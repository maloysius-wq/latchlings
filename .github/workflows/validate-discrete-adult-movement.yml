name: Validate discrete adult movement
on:
  push:
    paths:
      - '.github/workflows/validate-discrete-adult-movement.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        shell: bash
        run: sha256sum style400-game.css game400-a.js game400-b.js sfx400.js music400.js style400-ui.css style400-themes.css style400-skyway-atlas.css style400-atlas-progression.css style400-board-surfaces.css story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/discrete-adult-protected.sha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Apply candidate
        shell: bash
        run: |
          python3 .github/tmp/apply-discrete-adult-movement.py
          git diff --check
          grep -q 'LITTLE_HOME_ADULT_GAP_MIN=4000' title-island-concepts/index.html
          grep -q 'LITTLE_HOME_ADULT_GAP_MAX=10000' title-island-concepts/index.html
          grep -q 'scheduleNextLittleHomeAdultMove' title-island-concepts/index.html
          if grep -q 'adult-outing' title-island-concepts/index.html; then exit 1; fi
          if grep -q '@keyframes littleHomeGarden' title-island-concepts/index.html; then exit 1; fi
          grep -q 'v=20260911-discretesteps5' index.html
      - name: Serve candidate
        shell: bash
        run: python3 -m http.server 4173 >/tmp/latchlings-discrete-adult-http.log 2>&1 &
      - name: Browser-check discrete movement
        shell: bash
        run: |
          node .github/tmp/validate-discrete-adult-movement.mjs
          echo DISCRETE_ADULT_MOVEMENT_ACCEPTED
      - name: Verify protected source unchanged
        shell: bash
        run: sha256sum -c /tmp/discrete-adult-protected.sha
      - name: Commit accepted product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html index.html
          git commit -m 'Make home adult movement discrete'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: discrete-adult-movement-audit
          path: discrete-adult-movement-audit
      - name: Self-remove validation helpers
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/validate-discrete-adult-movement.yml .github/tmp/validate-discrete-adult-movement.mjs .github/tmp/apply-discrete-adult-movement.py
          git commit -m 'Remove discrete adult movement validator'
          git push
