name: Validate audit production visual slice

on:
  push:
    paths:
      - '.github/workflows/validate-audit-visual-slice.yml'
      - '.github/tmp/apply-audit-visual-slice.py'
      - '.github/tmp/style400-production-slice.css'
      - '.github/tmp/validate-audit-visual-slice.mjs'

permissions:
  contents: write

env:
  PROMOTE: 'false'
  PRODUCT_FILES: >-
    index.html game400-a.js game400-b.js cinematics400.js title-island-concepts/index.html style400-production-slice.css

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect puzzle and story source hashes
        run: sha256sum campaign400-{1,2,3,4,5,6,7,8}.js story400.js story-grounding400.js > /tmp/protected-before.sha256

      - name: Apply visual slice candidate
        run: python .github/tmp/apply-audit-visual-slice.py

      - name: Static validation
        run: |
          node --check game400-a.js
          node --check game400-b.js
          node --check cinematics400.js
          sha256sum -c /tmp/protected-before.sha256
          python - <<'PY'
          from pathlib import Path
          import subprocess
          expected=set('index.html game400-a.js game400-b.js cinematics400.js title-island-concepts/index.html style400-production-slice.css'.split())
          changed=set()
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              path=line[3:]
              if path.startswith('.github/tmp/') or path=='.github/workflows/validate-audit-visual-slice.yml':
                  continue
              changed.add(path)
          if changed != expected:
              raise SystemExit(f'visual slice product diff mismatch: {sorted(changed)}')
          a=Path('game400-a.js').read_text();b=Path('game400-b.js').read_text();c=Path('cinematics400.js').read_text();h=Path('index.html').read_text();css=Path('style400-production-slice.css').read_text();title=Path('title-island-concepts/index.html').read_text()
          assert "VISUAL_SLICE_LEVELS={1:'sunpetal',366:'aurora-dense'}" in a
          assert 'data-pi="${nestI}"' in a and 'selected-match' in a
          assert 'cin-porch-production' in c and "character('Pip','lookout-pip')" in c
          assert 'showChapterOneReward' in b and "focusHomeReward('mailbox')" in b
          assert 'style400-production-slice.css?v=20260912-slice1' in h
          assert 'story-focus-mailbox' in title
          assert '#game[data-visual-slice="sunpetal"]' in css and '#game[data-visual-slice="aurora-dense"]' in css and '[data-visual="porch"]' in css and '.chapter-reward-card' in css
          print('AUDIT_VISUAL_SLICE_STATIC_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance and screenshot matrix
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-visual-slice-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 210s node .github/tmp/validate-audit-visual-slice.mjs

      - name: Upload visual slice audit
        uses: actions/upload-artifact@v4
        with:
          name: audit-production-visual-slice
          path: /tmp/audit-visual-slice

      - name: Commit accepted visual slice product files
        if: env.PROMOTE == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $PRODUCT_FILES
          git commit -m "Build production visual slice"
          git push

      - name: Self-remove visual slice validation helpers
        if: env.PROMOTE == 'true'
        run: |
          rm -rf node_modules
          git reset --hard HEAD
          git clean -fd
          git pull --rebase
          git rm .github/workflows/validate-audit-visual-slice.yml .github/tmp/apply-audit-visual-slice.py .github/tmp/style400-production-slice.css .github/tmp/validate-audit-visual-slice.mjs
          git commit -m "Remove production visual slice validator"
          git push
