name: Close Full-Bleed Home Sky Handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-full-bleed-home-sky.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-10 — Make the Little Home sky full-bleed to the screen edges'
          start=s.find(heading)
          if start < 0: raise SystemExit('full-bleed handoff entry missing')
          end=s.find('\n---\n', start)
          if end < 0: raise SystemExit('full-bleed handoff terminator missing')
          block=s[start:end]
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in block:
              block += '''\n\n#### Completion summary\n\n**Result:** COMPLETED. The visible inner portrait-frame boundary on Little Home has been removed. The production home wrapper now fills `100vw × 100svh` instead of preserving a centered 390:844 aspect-ratio box, and the embedded Little Home `.phone` likewise fills the iframe viewport. The sky gradient, skywash, and animated clouds therefore continue to the physical screen edges; edge clouds are clipped only by the actual viewport rather than by a narrower internal frame. Product commit: `70df99d0cbb565eeb6f8e96f6da15c8e91f7bba1` (`Make Little Home sky full bleed`). Files changed: `style400-ui.css` and `title-island-concepts/index.html`.\n\n**Compact behavior:** The former 390×700 compact appearance had been triggered accidentally because the aspect-ratio-constrained iframe shrank to roughly 323px wide. With the iframe now truly full width, that compact layout is preserved intentionally through a `max-height:740px` production rule. The approved compact title/tagline, island position, Play button, and Daily Puzzle / Level Select sizing remain intact while the sky now fills the entire 390px width. No button action, Little Home art, story, gameplay, campaign, solver, audio, or cinematic dialogue behavior changed.\n\n**Validation and visual acceptance:** Successful acceptance run `34498020576` passed static checks and Chromium geometry/overflow tests at 390×844, 390×700, and 430×932, plus cinematic scene-only regression coverage. Artifact `10160634925` (`full-bleed-home-sky-render`) contains the three production renders, cinematic regression image, and measured geometry. At both 390-wide production targets, wrapper, iframe, and inner phone measure the full viewport width; the left and right edge clouds extend beyond x=0 / x=viewport and therefore clip naturally at the physical screen edge; there is no horizontal overflow; and title, tagline, island, Play, and secondary controls remain inside the viewport. Manual inspection of the 390×844 and 390×700 screenshots confirmed that the plain side gutters and visible inner scene boundary are gone and the existing composition remains balanced. The first two implementation-helper attempts committed no product files: run `34497685505` failed because its test script was placed outside the Node module path, and run `34497853561` failed because the regression assertion measured the cinematic scene before accounting for its existing `.76` transform. Both were validation-harness issues only and were corrected before product commit.\n\n**Deployment and hygiene:** The successful implementation helper self-removed on clean product state `80029f73dff18d62edaa67916dc7541b1557f11a`. GitHub Pages run `34498099572` completed successfully for that clean state. Before this documentation-only closeout helper, `.github/workflows/validate-repository-access-guard.yml` was the only durable workflow. This helper self-removes after recording completion.\n\n**Remaining risk / next action:** No known blocker remains. The actual compact and standard 390px-wide shells were visually reviewed, and a 430×932 geometry regression also passed. Future substantially different viewport shapes should receive their own visual acceptance pass, but the home sky is now structurally full-bleed rather than dependent on a portrait iframe width.\n'''
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "Complete full-bleed home sky handoff"
            git push
          fi
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm -f .github/workflows/close-full-bleed-home-sky.yml
          git add .github/workflows/close-full-bleed-home-sky.yml
          git commit -m "Remove full-bleed sky closeout helper"
          git push
