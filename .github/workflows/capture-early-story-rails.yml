name: Capture Early Story Rail Visual Acceptance
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-early-story-rails.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser tooling
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture unobstructed rails
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/rail-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          mkdir -p rail-visual-acceptance
          cat > rail-visual-acceptance/capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await page.addInitScript(()=>{
            localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars:{}}));
            localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1}));
          });
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.evaluate(()=>{ try{document.startViewTransition=undefined}catch(_){} });
          for(const level of [1,4,8,12,16,20,21]){
            await page.evaluate(l=>window.startLevel(l),level);
            await page.waitForTimeout(160);
            await page.evaluate(()=>{
              const o=document.getElementById('storyCardOverlay');
              if(o){o.classList.remove('show');o.setAttribute('aria-hidden','true');o.style.display='none'}
            });
            const rail=page.locator('#mechanicNote');
            await rail.screenshot({path:`rail-visual-acceptance/rail-${String(level).padStart(2,'0')}.png`});
          }
          await browser.close();
          JS
          node rail-visual-acceptance/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: early-story-rail-visual-acceptance
          path: rail-visual-acceptance/*.png
          if-no-files-found: error
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          rm -f .github/workflows/capture-early-story-rails.yml
          git add .github/workflows/capture-early-story-rails.yml
          git commit -m "Remove early story rail capture helper"
          git push
