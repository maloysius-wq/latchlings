name: Rerun Final Visual Story Board Audit
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rehydrate corrected audit script
        shell: bash
        run: |
          set -euo pipefail
          git show ad6889ce63c720426964e7a324f88bc91ea53a34:.github/workflows/final-visual-story-board-audit.yml > /tmp/prior-audit.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/prior-audit.yml').read_text()
          marker="cat > /tmp/final-audit.mjs <<'EOF'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          EOF\n",start)
          script=text[start:end]
          Path('final-audit.mjs').write_text(script)
          PY
          grep -q "FINAL_VISUAL_AUDIT_OK" final-audit.mjs
      - name: Static scope checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'style400-level-variation\.css|level-variation400\.js' index.html
          ! grep -Eiq 'prototype error|command post|command center|implementation choice|development choice|requester|you did.?n.t want|we are not going to' index.html story-grounding400.js cinematics400.js cinematic-dialogue400.js gameplay-story-rail400.js game400-a.js game400-b.js
          git diff --exit-code d8db67e06c63c22a6caef83d124d8856deaf91c6 -- campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-b.js
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/latchlings-server.log 2>&1 &
          sleep 2
      - name: Run final browser audit
        shell: bash
        run: |
          set -euo pipefail
          node final-audit.mjs
      - name: Build contact sheets
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          os.makedirs('final-visual-audit/contact-sheets',exist_ok=True)
          def sheet(files,out,cols,w):
              if not files:return
              h=int(w*844/390);rows=math.ceil(len(files)/cols);canvas=Image.new('RGB',(cols*w,rows*(h+18)),'white');draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(files):
                  im=Image.open(f).convert('RGB');im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+18);canvas.paste(im,(x,y));draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save(out,quality=92)
          sheet(sorted(glob.glob('final-visual-audit/gameplay/level-*.png')),'final-visual-audit/contact-sheets/sunpetal-boundaries.jpg',5,156)
          sheet(sorted(glob.glob('final-visual-audit/gameplay/chapter-*.png')),'final-visual-audit/contact-sheets/chapter-rails.jpg',4,156)
          sheet(sorted(glob.glob('final-visual-audit/cinematic/opening-??.png')),'final-visual-audit/contact-sheets/opening.jpg',4,195)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-visual-story-board-audit-rerun
          path: final-visual-audit
          if-no-files-found: warn
      - name: Self-remove rerun audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f final-audit.mjs
          git pull --ff-only origin main
          rm -f .github/workflows/rerun-final-visual-story-board-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rerun-final-visual-story-board-audit.yml
          if ! git diff --cached --quiet; then git commit -m "Remove rerun visual story board audit" && git push; fi
