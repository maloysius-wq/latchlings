name: Audit All Cinematic Beats Baseline
on:
  push:
    paths:
      - '.github/workflows/audit-all-cinematic-beats-baseline.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chromium
        run: |
          TEST_NODE="$RUNNER_TEMP/latchlings-all-beats"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Render every cinematic beat
        run: |
          TEST_NODE="$RUNNER_TEMP/latchlings-all-beats"
          cat > "$TEST_NODE/render.mjs" <<'MJS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const out=process.env.GITHUB_WORKSPACE+'/baseline-all-beats';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844}});
          const page=await ctx.newPage();const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8161/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.LatchlingsCinematics);
          const ids=['opening','across-drift','old-maps','homeward'];const manifest=[];
          for(const id of ids){
            const count=await page.evaluate(id=>LatchlingsCinematics.CINEMATICS[id].beats.length,id);
            await page.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id);await page.waitForSelector(`#cinematicOverlay.show[data-cinematic="${id}"]`);
            for(let i=0;i<count;i++){
              if(i>0){await page.click('#cinematicNext');await page.waitForTimeout(100)}
              await page.waitForTimeout(220);
              const meta=await page.evaluate(()=>{const stage=document.getElementById('cinematicStage').getBoundingClientRect(),shell=document.querySelector('.cinematic-shell').getBoundingClientRect();const vis=[...document.querySelectorAll('#cinematicStage *')].filter(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return r.width>1&&r.height>1&&s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity>0}).length;return{id:LatchlingsCinematics.active,beat:LatchlingsCinematics.beat,title:document.getElementById('cinematicBeat').textContent,visual:document.getElementById('cinematicOverlay').dataset.visual,stage:{x:stage.x,y:stage.y,w:stage.width,h:stage.height},shell:{x:shell.x,y:shell.y,w:shell.width,h:shell.height},visibleElements:vis,overflow:document.documentElement.scrollWidth>innerWidth+1}});
              const name=`${id}-${String(i+1).padStart(2,'0')}-${meta.visual}.png`;await page.screenshot({path:out+'/'+name,fullPage:true});manifest.push({...meta,file:name});
            }
            await page.keyboard.press('Escape');await page.waitForFunction(()=>!document.getElementById('cinematicOverlay').classList.contains('show'));
          }
          // Shipping title reference at the exact phone viewport.
          await page.goto('http://127.0.0.1:8161/title-island-concepts/?c=2&embed=1',{waitUntil:'domcontentloaded'});await page.waitForSelector('#c2 .island-model');await page.waitForTimeout(500);await page.screenshot({path:out+'/REFERENCE-title-little-home.png',fullPage:true});
          const ref=await page.evaluate(()=>{const stage=document.querySelector('#c2 .scene').getBoundingClientRect(),island=document.querySelector('#c2 .island-model').getBoundingClientRect();return{stage:{x:stage.x,y:stage.y,w:stage.width,h:stage.height},island:{x:island.x,y:island.y,w:island.width,h:island.height},textures:[...document.querySelectorAll('#c2 .island-side,#c2 .island-rim,#c2 .island-top,#c2 .house-front,#c2 .house-side,#c2 .trunk')].map(e=>getComputedStyle(e).backgroundImage)}});
          fs.writeFileSync(out+'/manifest.json',JSON.stringify({beats:manifest,reference:ref,errors},null,2));
          if(manifest.length!==24)throw new Error('Expected 24 beats, got '+manifest.length);if(manifest.some(x=>x.overflow))throw new Error('Horizontal overflow in baseline');if(errors.length)throw new Error(errors.join(' | '));
          await browser.close();console.log('BASELINE_ALL_24_BEATS_OK');
          MJS
          python3 -m http.server 8161 >/tmp/latchlings-baseline-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cd "$TEST_NODE"
          node render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-all-24-cinematic-beats
          path: baseline-all-beats/*
          if-no-files-found: error
      - name: Self-remove baseline workflow
        run: |
          rm -rf baseline-all-beats
          rm -f .github/workflows/audit-all-cinematic-beats-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete baseline all-beat cinematic audit'
          git pull --rebase origin main
          git push origin HEAD:main
