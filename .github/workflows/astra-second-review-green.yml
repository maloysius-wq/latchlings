name: Astra Second Review GREEN Candidate

on:
  push:
    branches:
      - astra-second-review-finishing
    paths:
      - '.github/workflows/astra-second-review-green.yml'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-second-review-finishing
          fetch-depth: 0
      - name: Protect accepted source before patch
        shell: bash
        run: |
          set -euo pipefail
          for f in campaign400-{1..8}.js; do
            test "$(git rev-parse 9dffa07d9f1fcd0c48029e13e8a641596c630fc8:$f)" = "$(git hash-object "$f")"
          done
      - name: Apply bounded S1-S3 candidate
        run: python .github/tmp/astra_second_review_patch.py
      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          node --check cinematics400.js
          for f in campaign400-{1..8}.js; do
            test "$(git rev-parse 9dffa07d9f1fcd0c48029e13e8a641596c630fc8:$f)" = "$(git hash-object "$f")"
          done
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          for f in $changed; do
            case "$f" in
              cinematics400.js|style400-cinematics.css|style400-story-theme.css|index.html) ;;
              *) echo "Unexpected product path changed: $f"; exit 1;;
            esac
          done
      - name: Install browser runner
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate bounded candidate and capture visual proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p second-review-evidence
          python3 -m http.server 4173 >/tmp/latchlings-green-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/tmp/astra_second_review_candidate.cjs
      - name: Commit accepted candidate product
        shell: bash
        run: |
          set -euo pipefail
          git restore package.json package-lock.json 2>/dev/null || true
          for f in campaign400-{1..8}.js; do
            test "$(git rev-parse 9dffa07d9f1fcd0c48029e13e8a641596c630fc8:$f)" = "$(git hash-object "$f")"
          done
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cinematics400.js style400-cinematics.css style400-story-theme.css index.html
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git commit -m 'Implement Astra second-review finishing pass [skip ci]'
          git push origin HEAD:astra-second-review-finishing
          git rev-parse HEAD > second-review-evidence/candidate-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: astra-second-review-candidate-evidence
          path: second-review-evidence
          if-no-files-found: error
