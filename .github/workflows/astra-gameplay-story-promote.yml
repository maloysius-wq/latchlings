name: Astra gameplay story promote and live verify

on:
  push:
    branches: [astra-gameplay-story-candidate]
    paths:
      - '.github/workflows/astra-gameplay-story-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    outputs:
      main_sha: ${{ steps.commit.outputs.main_sha }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require expected main base
        run: |
          test "$(git rev-parse HEAD)" = "b81751ddd6e188cbbf4b38ca22ebb3abd1d6ad27"
          git fetch origin astra-gameplay-story-candidate
          git cat-file -e d2639e7^{commit}

      - name: Snapshot protected accepted sources
        run: |
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js cinematics400.js cinematic-dialogue400.js style400-cinematics.css gameplay-story-rail400.js style400-story-rail-board.css title-island-concepts/index.html style400-skyway-atlas.css style400-atlas-progression.css pass3-chapter5-prism.js pass3-chapter6-copperline.js pass3-chapter7-stormswitch.js > /tmp/protected-before.sha256

      - name: Promote exact accepted product bytes
        run: |
          git checkout d2639e7 -- game400-a.js game400-b.js story-theme400.js style400-story-theme.css index.html pass3-chapter8-aurora.js
          for f in game400-a.js game400-b.js story-theme400.js style400-story-theme.css index.html pass3-chapter8-aurora.js; do
            test "$(git hash-object "$f")" = "$(git rev-parse d2639e7:$f)"
          done
          sha256sum -c /tmp/protected-before.sha256
          node --check game400-a.js
          node --check game400-b.js
          node --check story-theme400.js
          node --check pass3-chapter8-aurora.js

      - name: Commit promotion
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game400-a.js game400-b.js story-theme400.js style400-story-theme.css index.html pass3-chapter8-aurora.js
          git commit -m "Accept gameplay and Story coherence pass"
          git push origin HEAD:main
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  live:
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out committed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify committed provenance and protected slices
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.promote.outputs.main_sha }}"
          git fetch origin astra-gameplay-story-candidate
          for f in game400-a.js game400-b.js story-theme400.js style400-story-theme.css index.html pass3-chapter8-aurora.js; do
            test "$(git hash-object "$f")" = "$(git rev-parse d2639e7:$f)"
          done
          git diff --exit-code b81751ddd6e188cbbf4b38ca22ebb3abd1d6ad27 HEAD -- campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js cinematics400.js cinematic-dialogue400.js style400-cinematics.css gameplay-story-rail400.js style400-story-rail-board.css title-island-concepts/index.html style400-skyway-atlas.css style400-atlas-progression.css pass3-chapter5-prism.js pass3-chapter6-copperline.js pass3-chapter7-stormswitch.js
          node --check game400-a.js
          node --check game400-b.js
          node --check story-theme400.js
          node --check pass3-chapter8-aurora.js

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate committed main runtime
        run: |
          mkdir -p /tmp/astra-gameplay-story-live
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/astra-live-http.log 2>&1 &
          echo $! >/tmp/astra-live-http.pid
          cat > .astra-gameplay-story-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const out={};

          // Short-phone containment + touch geometry + mastery.
          {
            const context=await browser.newContext({viewport:{width:320,height:568}}),page=await context.newPage();
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            await page.evaluate(()=>{startLevel(2);window.LatchlingsStoryTheme?.close(false);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true)});
            await page.waitForTimeout(380);
            await page.evaluate(()=>{window.LatchlingsStoryTheme?.close(false);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true)});
            out.short=await page.evaluate(()=>({bottom:document.querySelector('#game .controls').getBoundingClientRect().bottom,mastery:document.getElementById('masteryGuide')?.textContent.trim(),hits:[...document.querySelectorAll('#game .dpad-hit')].map(x=>{const r=x.getBoundingClientRect();return {w:r.width,h:r.height}}),stacking:{board:Number(getComputedStyle(document.getElementById('board')).zIndex)||0,props:Number(getComputedStyle(document.getElementById('levelProps')).zIndex)||0,pointer:getComputedStyle(document.getElementById('levelProps')).pointerEvents}}));
            if(out.short.bottom>568.5||!out.short.mastery.includes('3★')||out.short.hits.some(x=>x.w<44||x.h<44)||!(out.short.stacking.board>out.short.stacking.props)||out.short.stacking.pointer!=='none')throw new Error(`short ${JSON.stringify(out.short)}`);
            await page.screenshot({path:'/tmp/astra-gameplay-story-live/short-gameplay.png',fullPage:true});
            await context.close();
          }

          // Full mechanics/story/regression verification on normal phone.
          {
            const context=await browser.newContext({viewport:{width:390,height:844}}),page=await context.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            const labels={};
            for(const [field,selector] of [['suitGates','.gate.suit'],['colorGates','.gate.color'],['rails','.rail'],['turners','.turner']]){
              const L=await page.evaluate(field=>{for(let i=0;i<LEVELS.length;i++)if((LEVELS[i][field]||[]).length)return i+1;return 0},field);
              await page.evaluate(L=>{startLevel(L);window.LatchlingsStoryTheme?.close(false);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true)},L);await page.waitForTimeout(40);
              labels[field]=await page.locator(selector).first().getAttribute('aria-label');if(!labels[field])throw new Error(`${field} missing label`);
            }
            const switchLevel=await page.evaluate(()=>{for(let i=0;i<LEVELS.length;i++){const l=LEVELS[i];if((l.switches||[]).length&&(l.doors||[]).length)return i+1}return 0});
            await page.evaluate(L=>{startLevel(L);window.LatchlingsStoryTheme?.close(false)},switchLevel);await page.waitForTimeout(60);
            const linked=await page.evaluate(()=>({switches:[...document.querySelectorAll('.switch-tile')].map(x=>({link:x.dataset.link,label:x.querySelector('.mechanic-link-badge')?.textContent.trim(),aria:x.getAttribute('aria-label')})),doors:[...document.querySelectorAll('.door-tile')].map(x=>({link:x.dataset.link,label:x.querySelector('.mechanic-link-badge')?.textContent.trim(),state:x.querySelector('.door-state-label')?.textContent.trim(),aria:x.getAttribute('aria-label')}))}));
            if(!linked.switches.length||!linked.doors.length||linked.switches.some(x=>!x.label||!x.aria)||linked.doors.some(x=>!x.label||x.state!=='CLOSED'||!x.aria))throw new Error(`links ${JSON.stringify(linked)}`);
            const firstDoor=linked.doors[0];await page.evaluate(link=>{const d=(LEVELS[currentLevel-1].doors||[]).find(x=>String(x[2])===String(link));doorMask|=(1<<d[2]);renderGame(true)},firstDoor.link);
            const opened=await page.evaluate(link=>{const d=[...document.querySelectorAll('.door-tile')].find(x=>x.dataset.link===String(link));return {open:d?.classList.contains('open'),state:d?.querySelector('.door-state-label')?.textContent.trim(),aria:d?.getAttribute('aria-label')}},firstDoor.link);
            if(!opened.open||opened.state!=='OPEN'||!opened.aria?.toLowerCase().includes('open'))throw new Error(`open ${JSON.stringify(opened)}`);

            const blocker=await page.evaluate(()=>{const dirs={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};for(let L=151;L<=400;L++){const lev=LEVELS[L-1],occ=new Set(lev.pieces.map(p=>p.pos.join(',')));for(let pi=0;pi<lev.pieces.length;pi++)for(const [dir,[dr,dc]] of Object.entries(dirs)){const p=lev.pieces[pi],r=p.pos[0]+dr,c=p.pos[1]+dc,key=`${r},${c}`;if(r<0||c<0||r>=lev.size||c>=lev.size)continue;if((lev.rocks||[]).some(x=>x[0]===r&&x[1]===c)||[...occ].some(x=>x===key&&x!==p.pos.join(',')))continue;const door=(lev.doors||[]).find(x=>x[0]===r&&x[1]===c);if(door)return {L,pi,dir,type:'door'};const sg=(lev.suitGates||[]).find(x=>x[0]===r&&x[1]===c);if(sg&&sg[2]!==p.suit)return {L,pi,dir,type:'suitGate'};const cg=(lev.colorGates||[]).find(x=>x[0]===r&&x[1]===c);if(cg&&cg[2]!==p.color)return {L,pi,dir,type:'colorGate'};const rail=(lev.rails||[]).find(x=>x[0]===r&&x[1]===c);if(rail&&rail[2]!==dir)return {L,pi,dir,type:'rail'}}}return null});
            await page.evaluate(b=>{startLevel(b.L);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true)},blocker);await page.waitForTimeout(380);await page.evaluate(b=>{window.LatchlingsStoryTheme?.close(false);selected=b.pi;renderPieces(LEVELS[currentLevel-1]);moveSelected(b.dir)},blocker);await page.waitForTimeout(90);
            const rejected=await page.evaluate(()=>({feedback:document.getElementById('mechanicNote')?.dataset.feedback,text:document.getElementById('mechanicNote')?.textContent.replace(/\s+/g,' ').trim(),storyOpen:document.getElementById('storyCardOverlay')?.classList.contains('show')}));if(rejected.feedback!=='blocked'||rejected.storyOpen||rejected.text.length<12)throw new Error(`blocked ${JSON.stringify(rejected)}`);
            await page.screenshot({path:'/tmp/astra-gameplay-story-live/blocker-feedback.png',fullPage:true});

            await page.evaluate(()=>{startLevel(1);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true);window.LatchlingsStoryTheme?.close(false);lastNestArrival=0;positions[0]=null;renderGame(true)});
            const nest=await page.evaluate(()=>({resolved:document.querySelector('.nest[data-pi="0"]')?.classList.contains('resolved'),badge:document.querySelector('.nest[data-pi="0"] .nest-resolution')?.textContent.trim(),state:document.querySelector('.cell:has(.nest[data-pi="0"])')?.dataset.nestState}));if(!nest.resolved||nest.badge!=='✓'||nest.state!=='resolved')throw new Error(`nest ${JSON.stringify(nest)}`);

            await page.evaluate(()=>{startLevel(2);window.LatchlingsStoryTheme?.close(false);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true)});await page.waitForTimeout(320);await page.evaluate(()=>{window.LatchlingsStoryTheme.close(false);window.LatchlingsStoryTheme.show(2,true)});await page.waitForTimeout(60);
            const card=await page.evaluate(()=>({line:document.getElementById('storyCardLine')?.textContent.replace(/\s+/g,' ').trim(),goal:document.getElementById('storyCardGoal')?.textContent.replace(/\s+/g,' ').trim(),details:document.getElementById('storyCardMore')?.tagName,open:document.getElementById('storyCardMore')?.open,legacy:document.querySelectorAll('#storyCardContext,#storyCardFlavor,#storyCardObjective').length}));if(!card.line||!card.goal||card.details!=='DETAILS'||card.open||card.legacy)throw new Error(`card ${JSON.stringify(card)}`);
            await page.screenshot({path:'/tmp/astra-gameplay-story-live/story-card.png',fullPage:true});
            await page.evaluate(()=>window.LatchlingsStoryTheme.close(false));

            await page.evaluate(()=>{progress={unlocked:255,stars:{50:3,100:3,150:3,200:3,250:3,251:3,252:3,253:3,254:3}};chapterView=6;rangeView=0;screen('levels');renderChapter()});await page.waitForTimeout(520);
            const atlas=await page.evaluate(()=>({dots:document.querySelectorAll('#chapterNav .atlas-region-dot').length,range:document.querySelector('#rangeNav .atlas-range-current')?.textContent.replace(/\s+/g,' ').trim(),current:document.querySelector('.atlas-node[data-state="current"] .atlas-state-badge')?.textContent.trim()}));if(atlas.dots||!atlas.range.includes('Levels 251–260')||atlas.current!=='◆')throw new Error(`atlas ${JSON.stringify(atlas)}`);
            await page.evaluate(()=>openStoryScreen());await page.waitForTimeout(520);const journal=await page.evaluate(()=>({tabs:[...document.querySelectorAll('#story [role="tab"]')].map(t=>t.textContent.trim()).join('|'),visible:[...document.querySelectorAll('#story [role="tabpanel"]')].filter(p=>!p.hidden).map(p=>p.id).join('|')}));if(journal.tabs!=='Now|Residents|Journey|Cinematics'||journal.visible!=='storyNowPanel')throw new Error(`journal ${JSON.stringify(journal)}`);
            await page.evaluate(()=>{progress={unlocked:251,stars:{50:3,100:3,150:3,200:3,250:3}};screen('home');updateHome(false)});await page.waitForTimeout(140);const frame=page.frames().find(f=>f.url().includes('title-island-concepts'));const home=await frame.evaluate(()=>({label:document.querySelector('#c2 .home-primary-copy strong')?.textContent,keepsakes:document.querySelectorAll('#c2 .story-keepsake.memory-unlocked').length}));if(home.label!=='Continue Old Ways'||home.keepsakes!==5)throw new Error(`home ${JSON.stringify(home)}`);
            if(errors.length)throw new Error(`console/page errors ${errors.join('; ')}`);
            out.phone={labels,linked,opened,rejected,nest,card,atlas,journal,home};await context.close();
          }

          // Concise Aurora reward copy.
          {
            const context=await browser.newContext({viewport:{width:390,height:844}}),page=await context.newPage();await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});await page.evaluate(()=>{const lev=LEVELS[399],row='<i></i><i></i><i></i>';window.LatchlingsChapterEightPass3.showReward(3,row,n=>`${n} moves`,lev)});const reward=await page.locator('.chapter-eight-reward .chapter-reward-result').textContent(),words=reward.trim().split(/\s+/).length;if(words>30)throw new Error(`reward ${words}`);out.reward={words,text:reward};await page.screenshot({path:'/tmp/astra-gameplay-story-live/aurora-reward.png',fullPage:true});await context.close();
          }
          fs.writeFileSync('/tmp/astra-gameplay-story-live/results.json',JSON.stringify(out,null,2));console.log(JSON.stringify(out,null,2));await browser.close();
          JS
          node .astra-gameplay-story-live.mjs
          kill $(cat /tmp/astra-live-http.pid) || true

      - name: Upload committed-live evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-gameplay-story-main-live-evidence
          path: /tmp/astra-gameplay-story-live
