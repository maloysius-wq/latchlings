name: Prepare Chapter 7 live wiring artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp/prepare-chapter7-live.py'
      - '.github/workflows/prepare-chapter7-live-files.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live wiring files
        run: python3 .github/tmp/prepare-chapter7-live.py
      - name: Verify output
        run: |
          grep -q 'pass3-chapter7-stormswitch.css?v=20260913-ch7pass3-1' /tmp/chapter7-live/index.html
          grep -q 'pass3-chapter7-stormswitch.js?v=20260913-ch7pass3-1' /tmp/chapter7-live/index.html
          grep -q '<div class="story-cast" id="storyCast"></div>' /tmp/chapter7-live/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: chapter7-live-wiring
          path: /tmp/chapter7-live/index.html
          if-no-files-found: error
