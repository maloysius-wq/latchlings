name: Visual Acceptance v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser tooling
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Run visual acceptance
        shell: bash
        run: node .github/audits/audit-story-board-cinematic-v2.mjs
      - name: Build contact sheets
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          def sheet(files,out,cols=5,w=156):
              if not files:return
              h=int(w*844/390);rows=math.ceil(len(files)/cols);canvas=Image.new('RGB',(cols*w,rows*(h+18)),'white');draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(files):
                  im=Image.open(f).convert('RGB');im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+18);canvas.paste(im,(x,y));draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save(out,quality=92)
          os.makedirs('audit-v2/contact-sheets',exist_ok=True)
          sheet(sorted(glob.glob('audit-v2/gameplay/level-*.png')),'audit-v2/contact-sheets/sunpetal-boundaries.jpg',5,156)
          sheet(sorted(glob.glob('audit-v2/gameplay/chapter-*.png')),'audit-v2/contact-sheets/chapter-rails.jpg',4,156)
          sheet(sorted(glob.glob('audit-v2/cinematic/opening-??.png')),'audit-v2/contact-sheets/opening.jpg',4,195)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-acceptance-v2
          path: audit-v2
      - name: Cleanup temporary audit
        if: always()
        shell: bash
        run: |
          git pull --ff-only origin main
          rm -f .github/workflows/audit-visual-acceptance-v2.yml .github/audits/audit-story-board-cinematic-v2.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-visual-acceptance-v2.yml .github/audits/audit-story-board-cinematic-v2.mjs
          if ! git diff --cached --quiet; then git commit -m "Remove temporary visual acceptance v2" && git push; fi
