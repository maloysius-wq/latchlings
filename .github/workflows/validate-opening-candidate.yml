name: Validate Opening Cinematic Candidate

on:
  push:
    branches:
      - codex/opening-cinematic-rebuild-20260915
    paths:
      - index.html
      - cinematics400.js
      - cinematic-dialogue400.js
      - opening-cinematic400.js
      - style400-opening-cinematic.css
      - package.json
      - tests/**
      - .github/workflows/validate-opening-candidate.yml

jobs:
  cinematic-browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Protect authored campaign bytes
        shell: bash
        run: |
          set -euo pipefail
          echo '8f3f99f27b3cea194cd41f8c45f1802bc080b5d423b9f03ad0d465a57433a003  campaign400-1.js' | sha256sum -c -
          echo '5c2efe317c5aa57c4a67c30dfc3dccccf1941144623d75f9884d8028706f3e96  campaign400-2.js' | sha256sum -c -
          echo 'cb6773639ef3959178c3c5336c39d5c90ca87ee7f3ddd5d0d6c2e6a139ef9324  campaign400-3.js' | sha256sum -c -
          echo '9cb48060e6f46e8755f9035fcf16239c46624b918e40e4a10750571cd02ae9e9  campaign400-4.js' | sha256sum -c -
          echo 'a4fb2c11d338cafc90266a49f751e91471b7e97e88f61879d7fd0d1f5f7545d5  campaign400-5.js' | sha256sum -c -
          echo 'eeeba272f0543ce044f027a0b2a79791198b223bebdf75a382f68f06f486b363  campaign400-6.js' | sha256sum -c -
