name: Validate home props and adult cadence
on:
  push:
    paths:
      - '.github/workflows/validate-home-props-cadence.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        shell: bash
        run: |
          sha256sum style400-game.css game400-a.js game400-b.js sfx400.js music400.js style400-ui.css style400-themes.css style400-skyway-atlas.css style400-atlas-progression.css style400-board-surfaces.css story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/home-props-protected.sha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve baseline
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-home-props-http.log 2>&1 &
      - name: Capture baseline
        shell: bash
        run: node .github/tmp/validate-home-props-cadence.mjs before
      - name: Apply carried-prop and adult-cadence fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home=Path('title-island-concepts/index.html')
          s=home.read_text()
          old="#c2 .latchling{width:34px;height:34px;scale:var(--little-home-latchling-counter-scale);z-index:16}"
          new="#c2 .latchling{width:34px;height:34px;scale:var(--little-home-latchling-counter-scale);z-index:16;overflow:visible}"
          if old not in s: raise SystemExit('Little Home latchling size rule missing')
          s=s.replace(old,new,1)
          repl={
            'const LITTLE_HOME_ADULT_IDLE_MIN=4200;':'const LITTLE_HOME_ADULT_IDLE_MIN=35000;',
            'const LITTLE_HOME_ADULT_IDLE_MAX=8800;':'const LITTLE_HOME_ADULT_IDLE_MAX=55000;',
            'const LITTLE_HOME_ADULT_LONG_IDLE_MIN=9000;':'const LITTLE_HOME_ADULT_LONG_IDLE_MIN=70000;',
            'const LITTLE_HOME_ADULT_LONG_IDLE_MAX=13000;':'const LITTLE_HOME_ADULT_LONG_IDLE_MAX=100000;',
            'const longRest=!initial&&Math.random()<.20;':'const longRest=!initial&&Math.random()<.25;',
            '? 900+index*750+littleHomeRandom(0,1700)':'? 10000+index*8000+littleHomeRandom(0,6000)'
          }
          for a,b in repl.items():
            if a not in s: raise SystemExit(f'missing expected cadence source: {a}')
            s=s.replace(a,b,1)
          home.write_text(s)

          index=Path('index.html')
          i=index.read_text()
          old='src="title-island-concepts/?c=2&amp;embed=1&amp;v=20260911-sphere3"'
          new='src="title-island-concepts/?c=2&amp;embed=1&amp;v=20260911-calmprops4"'
          if old not in i: raise SystemExit('current home iframe cache-bust missing')
          index.write_text(i.replace(old,new,1))
          PY
          git diff --check
          git diff -- title-island-concepts/index.html index.html
      - name: Browser-check props and cadence
        shell: bash
        run: |
          node .github/tmp/validate-home-props-cadence.mjs after
          grep -q 'const LITTLE_HOME_ADULT_IDLE_MIN=35000;' title-island-concepts/index.html
          grep -q 'const LITTLE_HOME_ADULT_IDLE_MAX=55000;' title-island-concepts/index.html
          grep -q 'const LITTLE_HOME_ADULT_LONG_IDLE_MIN=70000;' title-island-concepts/index.html
          grep -q 'const LITTLE_HOME_ADULT_LONG_IDLE_MAX=100000;' title-island-concepts/index.html
          grep -q 'Math.random()<.25' title-island-concepts/index.html
          grep -q '10000+index\*8000+littleHomeRandom(0,6000)' title-island-concepts/index.html
          grep -q 'v=20260911-calmprops4' index.html
          echo HOME_PROPS_CADENCE_ACCEPTED
      - name: Verify protected source unchanged
        shell: bash
        run: sha256sum -c /tmp/home-props-protected.sha
      - name: Commit accepted product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html index.html
          git commit -m 'Unclip home props and calm adult movement'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: home-props-cadence-audit
          path: home-props-cadence-audit
      - name: Self-remove validation helpers
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/validate-home-props-cadence.yml .github/tmp/validate-home-props-cadence.mjs
          git commit -m 'Remove home props cadence validator'
          git push
