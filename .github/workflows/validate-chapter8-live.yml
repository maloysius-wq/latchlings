name: Validate Chapter 8 Pass 3 live build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-chapter8-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect authored and accepted Chapters 1-7 source
        shell: bash
        run: |
          set -euo pipefail
          BASE=7c800131795b75280a7f01c2649817ff7abd7d37
          protected=(
            campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js
            campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
            game400-a.js game400-b.js style400-game.css style400-board-surfaces.css
            style400-production-slice.css style400-skyway-atlas.css title-island-concepts/index.html
            story400.js story-grounding400.js STORY_BIBLE.md cinematics400.js cinematic-dialogue400.js
            gameplay-story-rail400.js story-theme400.js music400.js sfx400.js
            pass3-chapter5-prism.css pass3-chapter5-prism.js
            pass3-chapter6-copperline.css pass3-chapter6-copperline.js
            pass3-chapter7-stormswitch.css pass3-chapter7-stormswitch.js
          )
          git diff --exit-code "$BASE" -- "${protected[@]}"

      - name: Static live acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check pass3-chapter8-aurora.js
          echo '3d47ec706859f61475255fb7966ff953e5ead916d998b032bb1bc82b05be9873  pass3-chapter8-aurora.css' | sha256sum -c -
          echo '2a0bac563a598716a31875d641478f88730120a83f79a9a624e50a94df5096bc  pass3-chapter8-aurora.js' | sha256sum -c -
          test "$(grep -c 'pass3-chapter8-aurora.css?v=20260913-ch8pass3-1' index.html)" -eq 1
          test "$(grep -c 'pass3-chapter8-aurora.js?v=20260913-ch8pass3-1' index.html)" -eq 1
          grep -q 'Recurring landmark: a pale crown-shaped convergence beacon' LEVEL_SELECT_ART_DIRECTION.md
          grep -q 'class="story-cast" id="storyCast"' index.html
          ! grep -q 'id="story-cast" id="storyCast"' index.html
          grep -q '<strong>No master switch.</strong>' index.html
          grep -q '<strong>No final map.</strong>' index.html
          grep -q '<strong>A living Skyway.</strong>' index.html
          grep -q 'Ordinary life continues. That is the victory.' index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium validation runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance against committed live build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/chapter8-live-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          node .github/tmp/validate-chapter8-pass3.mjs
          node .github/tmp/capture-chapter8-clean-evidence.mjs

      - name: Package live acceptance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/chapter8-live-acceptance
          cp pass3-chapter8-aurora.css pass3-chapter8-aurora.js /tmp/chapter8-live-acceptance/ || true
          cp /tmp/chapter8-pass3/* /tmp/chapter8-live-acceptance/ 2>/dev/null || true
          cp /tmp/chapter8-clean/* /tmp/chapter8-live-acceptance/ 2>/dev/null || true
          git status --short > /tmp/chapter8-live-acceptance/status.txt

      - name: Upload Chapter 8 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter8-pass3-live-acceptance
          path: /tmp/chapter8-live-acceptance
          if-no-files-found: error
