name: Merge Cinematic Acceptance Fix 2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge snap-demo acceptance CSS and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          target=Path('style400-cinematics-geometry.css');extra=Path('style400-cinematics-acceptance2.css');text=target.read_text();addition=extra.read_text();marker='/* Final snap-demo composition:'
          if marker not in text: target.write_text(text.rstrip()+'\n\n'+addition)
          PY
          rm -f style400-cinematics-acceptance2.css .github/workflows/merge-cinematic-acceptance-fix2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-cinematics-geometry.css style400-cinematics-acceptance2.css .github/workflows/merge-cinematic-acceptance-fix2.yml
          git commit -m "Reblock snap demo above dialogue"
          git push
