name: Apply Story Board and Cinematic Visual Refinements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refinements and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          import base64
          cin=''
          board=''
          def append_once(path, marker, encoded):
              p=Path(path); text=p.read_text(); payload=base64.b64decode(encoded).decode('utf-8')
              if marker not in text:
                  p.write_text(text.rstrip()+"\n\n"+payload)
          append_once('style400-cinematics-geometry.css','Acceptance refinement: simultaneous speakers',cin)
          append_once('style400-story-rail-board.css','Sunpetal acceptance refinement: the five movements',board)
          p=Path('cinematic-geometry400.js'); text=p.read_text(); old='if(brightGeom)layoutCargo(stage,brightGeom,time);'; new="if(brightGeom)layoutCargo(stage,brightGeom,(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?cargoEpoch+2200:time);"
          if old in text: p.write_text(text.replace(old,new,1))
          PY
          rm -f .github/workflows/apply-visual-refinement-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-cinematics-geometry.css style400-story-rail-board.css cinematic-geometry400.js .github/workflows/apply-visual-refinement-v2.yml
          git commit -m "Apply cinematic speech and board phase refinements"
          git push
