name: Start Procedural Textured Title Rebuild

on:
  push:
    paths:
      - '.github/workflows/start-procedural-title-rebuild.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          marker='## Current Work\n'
          entry='''\n### 2026-09-02 — Rebuild floating-island title concepts with procedural models + CC0 textures\n\n**Status: IN PROGRESS**\n\n**User goal:** Move away from prebuilt environmental asset sprites. Rebuild the focused floating-island title concepts around procedural browser-rendered models, using carefully selected CC0 textures as surface material only. Latchlings must match the shipping game itself, not the looser concept-gallery interpretation.\n\n**Implementation plan:** Preserve the existing three-concept selection structure and keep production `index.html` untouched. Replace Kenney isometric environment sprites with procedural HTML/CSS/SVG geometry for the floating landmass and small lived-in props. Research and locally vendor a minimal CC0 texture set for grass/soil, stone, and wood or comparable materials, with exact source/license provenance. Rebuild preview Latchlings from the shipping `style400-game.css` and `game400-a.js` design language: exact five body palettes, radial/linear body shading, 29% crown suit mark, large white eyes with game-style pupils/highlights, the shipping expression vocabulary, and asynchronous blink/idle timing.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, `title-island-concepts/index.html`, `title-island-concepts/ASSET_CREDITS.md`, a small new `title-island-concepts/textures/` directory, and temporary self-removing import/browser-validation workflows if needed. Existing isometric source assets may remain archived but must no longer be referenced by the rebuilt runtime preview. Production game runtime files remain unchanged.\n\n**Validation plan:** Verify no active isometric/environment sprite references in the focused preview; all third-party runtime raster files are texture/material maps with CC0 provenance; preview Latchling CSS/markup mirrors shipping palette/proportions/expression rules; exactly three concepts; zero emoji; no external runtime hotlinks; Chromium render at 390x844 with no console/page/request errors, broken images, horizontal overflow, or clipped primary UI; capture and visually inspect all three screenshots.\n\n**Deployment plan:** Commit the procedural/textured preview only after texture provenance and browser validation pass, deploy through existing GitHub Pages, visually inspect the validated renders, then close this same handoff entry with exact files, sources, commit/run IDs, deployment result, and remaining next action.\n\n---\n'''
          if '### 2026-09-02 — Rebuild floating-island title concepts with procedural models + CC0 textures' not in t:
              t=t.replace(marker, marker+entry, 1)
          p.write_text(t)
          PY
          rm -f .github/workflows/start-procedural-title-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-procedural-title-rebuild.yml
          git commit -m 'Record procedural textured title rebuild'
          git push origin HEAD:main