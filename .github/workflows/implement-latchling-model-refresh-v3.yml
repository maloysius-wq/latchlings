          await page.evaluate(()=>screen('home'));await page.waitForTimeout(250);const fr=page.frames().find(f=>/title-island-concepts/.test(f.url()));ok(fr,'title iframe missing');await fr.waitForSelector('#c2 .latchling');const title=await fr.evaluate(()=>[...document.querySelectorAll('#c2 .latchling')].map(x=>{const r=x.getBoundingClientRect(),e=x.querySelector('.eye'),f=x.querySelector('.face'),m=x.querySelector('.mouth'),s=x.querySelector('.suit-mark');return {role:x.dataset.role,w:r.width,h:r.height,eye:getComputedStyle(e).backgroundColor,cheek:getComputedStyle(f,'::before').content,mouthY:(m.getBoundingClientRect().top-r.top)/r.height,suitY:(s.getBoundingClientRect().top-r.top)/r.height,eyeY:(e.getBoundingClientRect().top-r.top)/r.height,blink:getComputedStyle(x.querySelector('.eyes')).animationName,dur:getComputedStyle(x.querySelector('.eyes')).animationDuration}}));const adults=title.filter(x=>x.role==='adult'),kids=title.filter(x=>x.role==='child');ok(adults.length===3&&kids.length===2,'title roster');ok(adults.every(x=>Math.abs(x.w-34)<.25&&Math.abs(x.h-34)<.25),'adult size');ok(kids.every(x=>Math.abs(x.w-25)<.25&&Math.abs(x.h-25)<.25),'kid size');ok(title.every(x=>x.eye==='rgb(23, 37, 58)'&&x.cheek!=='none'&&x.mouthY<.64&&x.suitY<x.eyeY&&x.blink==='refinedBlink'),'title face mismatch '+JSON.stringify(title));ok(new Set(title.map(x=>x.dur)).size>1,'title blinks sync');await page.screenshot({path:'latchling-model-v3-renders/title.png',fullPage:true});ok(errors.length===0,'browser errors '+errors.join(' | '));await ctx.close();
          const reduced=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});const rp=await reduced.newPage();hook(rp);await rp.goto('http://127.0.0.1:8153/',{waitUntil:'domcontentloaded'});await rp.waitForFunction(()=>typeof startLevel==='function');await rp.evaluate(()=>startLevel(1));ok(await rp.locator('#game .eyes').first().evaluate(e=>getComputedStyle(e).animationName)==='none','reduced puzzle blink');await rp.evaluate(()=>openStoryScreen());ok(await rp.locator('#story .story-character-avatar-eyes').first().evaluate(e=>getComputedStyle(e).animationName)==='none','reduced avatar blink');await reduced.close();ok(errors.length===0,'final errors '+errors.join(' | '));console.log('GLOBAL_LATCHLING_MODEL_V3_BROWSER_OK',JSON.stringify({puzzle,story,residents,title}));await browser.close();
