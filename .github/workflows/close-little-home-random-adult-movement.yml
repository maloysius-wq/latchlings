name: Close Randomized Little Home Adult Movement

on:
  push:
    paths:
      - '.github/workflows/close-little-home-random-adult-movement.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          title='### 2026-09-02 — Add randomized rest periods to Little Home adults'
          start=t.index(title)
          end=t.index('\n---\n', start)
          block=t[start:end]
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in block:
              block += '''\n\n#### Completion summary\n\n**Implementation:** Updated only selected Concept 2 / Little Home in `title-island-concepts/index.html`. The three adult route classes (`life-garden`, `life-parcel`, `life-tree`) no longer run perpetual CSS loops. They now animate only while an `adult-outing` class is present, with a small JavaScript scheduler independently starting each adult after a randomized initial stagger. Each outing lasts a randomized 4.4–6.0 seconds, then the adult returns to its resting position and idles for a randomized 4.2–8.8 seconds; 20% of rests are longer 9–13 second pauses. The adults therefore spend substantial time stationary instead of constantly circling. Their child face/eye animations (`faceFloat` / `blinkCycle`) continue during idle periods because only locomotion is gated. The two children retain their existing continuous 6.1-second play/chase animations. Reduced-motion users keep adults stationary.\n\n**Files changed:** Permanent implementation changed only `title-island-concepts/index.html`; this handoff was updated for process tracking. Temporary transformer/browser-validator/workflow files self-removed after the implementation commit. No production runtime, campaign, asset, or game files changed.\n\n**Validation:** GitHub Actions run `33680651900` passed static and Chromium validation. Static checks confirmed the five-resident 3-adult / 2-child household, removal of all legacy infinite adult route rules, one-shot `adult-outing` route rules, randomized scheduler constants/state transitions, unchanged child animations, three flowers, four clouds, zero Concept 2 deck/fence elements, and no production/campaign/game-file changes. Chromium at 390×844 observed every adult entering both `idle` and `moving` states and completing at least one scheduled outing. Sampled idle adults still reported active `faceFloat` and `blinkCycle` animations. In the validation run, initial adult waits were independently staggered around 1.9s, 1.9s, and 2.9s; later standard rests sampled around 5.3–6.6s, demonstrating that movement is no longer continuous or synchronized. No console/page/request errors or horizontal overflow occurred, and Concepts 1 and 3 passed sanity renders. Screenshot artifact `9866126448` contains three timing phases and was downloaded and visually inspected; the island reads calmer while retaining intermittent adult activity and continuous child play.\n\n**Implementation commit:** `d1f18519ecb545fcb5ce3c70fb0e29330229cca5` (`Give Little Home adults randomized rest periods`).\n\n**Deployment:** GitHub Pages run `33680749805` completed successfully for implementation commit `d1f18519ecb545fcb5ce3c70fb0e29330229cca5`. The live preview remains `title-island-concepts/?c=2`.\n\n**Remaining risk / next action:** This timing pass is complete in the design-selection preview. Production remains intentionally unchanged. Next action is user review of the calmer adult cadence; timer ranges can be tuned further if the adults should rest even longer or move less often.\n'''
          t=t[:start]+block+t[end:]
          p.write_text(t)
          PY
          rm -f .github/workflows/close-little-home-random-adult-movement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-little-home-random-adult-movement.yml
          git commit -m 'Complete randomized adult movement handoff'
          git pull --rebase origin main
          git push origin HEAD:main
