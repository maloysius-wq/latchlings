name: Start Volume Fix Handoff
on:
  push:
    paths:
      - '.github/workflows/start-volume-fix-handoff.yml'
      - '.github/scripts/start_volume_fix_handoff.py'
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add current work entry
        run: python3 .github/scripts/start_volume_fix_handoff.py
      - name: Commit handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/start-volume-fix-handoff.yml .github/scripts/start_volume_fix_handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-volume-fix-handoff.yml .github/scripts/start_volume_fix_handoff.py
          git commit -m 'Start music volume clamp fix handoff'
          git pull --rebase origin main
          git push origin HEAD:main
