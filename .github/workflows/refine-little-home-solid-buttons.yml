name: Refine Little Home Solid Buttons

on:
  push:
    paths:
      - '.github/workflows/refine-little-home-solid-buttons.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply solid #F5DEAC controls
        run: python3 .github/scripts/refine_little_home_solid_buttons.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          t=Path('title-island-concepts/index.html').read_text()
          c2block=t[t.index('/* Selected Little Home: solid warm-cream toy controls */'):t.index('.variant-note{')]
          if c2block.count('#F5DEAC') < 2:
              raise SystemExit('Solid color missing from Concept 2 controls')
          if 'repeating-linear-gradient' in c2block:
              raise SystemExit('Striped background still present in Concept 2 controls')
          if 'background-image:' in c2block:
              raise SystemExit('Pattern/gradient background-image still present in Concept 2 control block')
          if 'sage-striped toy controls' in t:
              raise SystemExit('Old striped control block still present')
          for token in ['border-radius:22px','border-radius:20px','Play','Daily Puzzle','Level Select']:
              if token not in t:
                  raise SystemExit('Missing expected token '+token)
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          if c2.count('data-role="adult"')!=3 or c2.count('data-role="child"')!=2:
              raise SystemExit('Little Home household changed unexpectedly')
          if c2.count('class="float-pebble pebble-')!=6 or c2.count('class="cloud ')!=4:
              raise SystemExit('Little Home scene elements changed unexpectedly')
          print('SOLID_BUTTON_STATIC_OK')
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js style400-game.css

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-solid-node"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and screenshot
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-solid-node"
          mkdir -p solid-button-renders
          python3 -m http.server 8137 >/tmp/little-home-solid-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cp .github/scripts/validate_little_home_solid_buttons.mjs "$TEST_NODE/validate_little_home_solid_buttons.mjs"
          node "$TEST_NODE/validate_little_home_solid_buttons.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-solid-button-render
          path: solid-button-renders/*.png
          if-no-files-found: error

      - name: Commit validated refinement and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf solid-button-renders
          rm -f .github/workflows/refine-little-home-solid-buttons.yml .github/scripts/refine_little_home_solid_buttons.py .github/scripts/validate_little_home_solid_buttons.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-solid-buttons.yml .github/scripts/refine_little_home_solid_buttons.py .github/scripts/validate_little_home_solid_buttons.mjs
          git commit -m 'Make Little Home controls solid warm cream'
          git pull --rebase origin main
          git push origin HEAD:main
