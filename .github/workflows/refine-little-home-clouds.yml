name: Refine Little Home Clouds

on:
  push:
    paths:
      - '.github/workflows/refine-little-home-clouds.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stone, platform, and cloud polish
        run: python3 .github/scripts/refine_little_home_clouds.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          if '#c2 .rock.r1{left:58px;top:159px}' not in t:
              raise SystemExit('Rock was not moved right')
          if 'class="deck' in c2 or '#c2 .deck{' in t:
              raise SystemExit('Concept 2 brown deck/platform still present')
          roles=re.findall(r'data-role="(adult|child)"',c2)
          if len(roles)!=6 or roles.count('adult')!=4 or roles.count('child')!=2:
              raise SystemExit(f'Household changed unexpectedly: {roles}')
          cloud_count=c2.count('class="cloud ')
          if cloud_count != 4:
              raise SystemExit(f'Expected four clouds, got {cloud_count}')
          for token in ['soft, asymmetric drifting cloud field','littleHomeCloudDrift','--cloud-speed','--cloud-delay','--cloud-start','--cloud-end']:
              if token not in t:
                  raise SystemExit(f'Missing cloud polish token {token}')
          if '<img' in t.lower() or 'https://' in c2 or 'http://' in c2:
              raise SystemExit('Unexpected image element/runtime hotlink')
          print('CLOUD_STATIC_OK', {'rock_left':58,'deck':0,'clouds':cloud_count,'residents':len(roles)})
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js style400-game.css

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_NODE="$RUNNER_TEMP/little-home-cloud-node"
          mkdir -p "$CLOUD_NODE"
          cd "$CLOUD_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and screenshots
        shell: bash
        run: |
          set -euo pipefail
          CLOUD_NODE="$RUNNER_TEMP/little-home-cloud-node"
          mkdir -p cloud-renders
          python3 -m http.server 8126 >/tmp/little-home-cloud-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cp .github/scripts/validate_little_home_clouds.mjs "$CLOUD_NODE/validate_little_home_clouds.mjs"
          node "$CLOUD_NODE/validate_little_home_clouds.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-cloud-renders
          path: cloud-renders/*.png
          if-no-files-found: error

      - name: Commit validated polish and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloud-renders
          rm -f .github/workflows/refine-little-home-clouds.yml .github/scripts/refine_little_home_clouds.py .github/scripts/validate_little_home_clouds.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-clouds.yml .github/scripts/refine_little_home_clouds.py .github/scripts/validate_little_home_clouds.mjs
          git commit -m 'Polish the Little Home island and clouds'
          git pull --rebase origin main
          git push origin HEAD:main
