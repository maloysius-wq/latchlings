name: Astra gameplay closure verification

on:
  push:
    branches: [astra-gameplay-story-candidate]
    paths:
      - '.github/workflows/astra-gameplay-closure-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out committed main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require accepted product head
        run: test "$(git rev-parse HEAD)" = "4f9e27b01f3a0ae158ee44c8ac36b4c11e2fa033"

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify V01 and V10 closure evidence
        run: |
          mkdir -p /tmp/astra-gameplay-closure
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/astra-closure-http.log 2>&1 &
          echo $! >/tmp/astra-closure-http.pid
          cat > .astra-gameplay-closure.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
          const closeOverlays=()=>page.evaluate(()=>{window.LatchlingsStoryTheme?.close(false);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true)});

          const dense={};
          for(const L of [201,366]){
            await page.evaluate(L=>startLevel(L),L);await page.waitForTimeout(360);await closeOverlays();
            dense[L]=await page.evaluate(()=>{
              const board=document.getElementById('board'),props=document.getElementById('levelProps'),br=board.getBoundingClientRect();
              const propRects=[...props.querySelectorAll('.level-prop')].map(x=>{const r=x.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom}});
              const overlaps=propRects.filter(r=>r.right>br.left&&r.left<br.right&&r.bottom>br.top&&r.top<br.bottom).length;
              return {boardZ:Number(getComputedStyle(board).zIndex)||0,propsZ:Number(getComputedStyle(props).zIndex)||0,pointer:getComputedStyle(props).pointerEvents,propCount:propRects.length,geometricOverlaps:overlaps};
            });
            if(!(dense[L].boardZ>dense[L].propsZ)||dense[L].pointer!=='none')throw new Error(`Level ${L} decoration is not behind rules space: ${JSON.stringify(dense[L])}`);
            await page.screenshot({path:`/tmp/astra-gameplay-closure/dense-${L}.png`,fullPage:true});
          }

          const switchLevel=await page.evaluate(()=>{for(let i=0;i<LEVELS.length;i++){const l=LEVELS[i];if((l.switches||[]).length&&(l.doors||[]).length&&(l.rails||[]).length)return i+1}for(let i=0;i<LEVELS.length;i++){const l=LEVELS[i];if((l.switches||[]).length&&(l.doors||[]).length)return i+1}return 0});
          await page.evaluate(L=>startLevel(L),switchLevel);await page.waitForTimeout(360);await closeOverlays();
          const base=await page.evaluate(()=>({switches:[...document.querySelectorAll('.switch-tile')].map(x=>({label:x.querySelector('.mechanic-link-badge')?.textContent.trim(),aria:x.getAttribute('aria-label')})),doors:[...document.querySelectorAll('.door-tile')].map(x=>({label:x.querySelector('.mechanic-link-badge')?.textContent.trim(),state:x.querySelector('.door-state-label')?.textContent.trim(),aria:x.getAttribute('aria-label')})),rails:[...document.querySelectorAll('.rail')].map(x=>x.getAttribute('aria-label')),turners:[...document.querySelectorAll('.turner')].map(x=>x.getAttribute('aria-label'))}));
          if(base.switches.some(x=>!x.label||!x.aria)||base.doors.some(x=>!x.label||!x.state||!x.aria)||base.rails.some(x=>!x)||base.turners.some(x=>!x))throw new Error(`Non-color mechanic identity missing: ${JSON.stringify(base)}`);

          const client=await context.newCDPSession(page);
          const modes=['achromatopsia','protanopia','deuteranopia','tritanopia'];
          const vision={};
          for(const type of modes){
            await client.send('Emulation.setEmulatedVisionDeficiency',{type});
            await page.waitForTimeout(80);
            vision[type]=await page.evaluate(()=>({switchText:[...document.querySelectorAll('.switch-tile .mechanic-link-badge')].map(x=>({text:x.textContent.trim(),display:getComputedStyle(x).display,opacity:getComputedStyle(x).opacity})),doorText:[...document.querySelectorAll('.door-tile')].map(x=>({link:x.querySelector('.mechanic-link-badge')?.textContent.trim(),state:x.querySelector('.door-state-label')?.textContent.trim(),display:getComputedStyle(x).display,opacity:getComputedStyle(x).opacity}))}));
            if(vision[type].switchText.some(x=>!x.text||x.display==='none'||Number(x.opacity)===0)||vision[type].doorText.some(x=>!x.link||!x.state||x.display==='none'||Number(x.opacity)===0))throw new Error(`${type} loses mechanic text/state: ${JSON.stringify(vision[type])}`);
            await page.screenshot({path:`/tmp/astra-gameplay-closure/mechanics-${type}.png`,fullPage:true});
          }
          await client.send('Emulation.setEmulatedVisionDeficiency',{type:'none'});
          fs.writeFileSync('/tmp/astra-gameplay-closure/results.json',JSON.stringify({head:'4f9e27b01f3a0ae158ee44c8ac36b4c11e2fa033',dense,switchLevel,base,vision},null,2));
          console.log(JSON.stringify({dense,switchLevel,base,modes},null,2));
          await browser.close();
          JS
          node .astra-gameplay-closure.mjs
          kill $(cat /tmp/astra-closure-http.pid) || true

      - name: Upload closure evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-gameplay-closure-evidence
          path: /tmp/astra-gameplay-closure
