name: Astra gameplay Story docs reconciliation

on:
  push:
    branches: [astra-gameplay-story-candidate]
    paths:
      - '.github/workflows/astra-gameplay-closure-verify.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out accepted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require accepted gameplay product head
        run: test "$(git rev-parse HEAD)" = "4f9e27b01f3a0ae158ee44c8ac36b4c11e2fa033"

      - name: Apply reconciliation
        run: python <(git show origin/astra-gameplay-story-candidate:.github/tmp/astra_gameplay_story_doc_reconcile.py)
        shell: bash

      - name: Verify documentation-only diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "ASTRA_AUDIT_ACCEPTANCE_MATRIX.md DEVELOPMENT_HANDOFF.md "
          grep -F '| V01 quiet board floors | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| V09 readable nests | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| V10 mechanic-state causality | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| U09 mastery copy | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| V16 story postcards | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| V17 chapter reward | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| N04 information-layer roles | PARTIAL |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F 'Next action: ending closure candidate.' DEVELOPMENT_HANDOFF.md

      - name: Commit reconciliation to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ASTRA_AUDIT_ACCEPTANCE_MATRIX.md DEVELOPMENT_HANDOFF.md
          git commit -m "Reconcile gameplay and Story audit acceptance"
          git push origin HEAD:main
