name: Close Little Home Cloud Polish

on:
  push:
    paths:
      - '.github/workflows/close-little-home-cloud-polish.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete cloud polish handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          heading='### 2026-09-02 — Polish Little Home stone, play area, and animated clouds'
          start=t.index(heading)
          end=t.index('\n---\n', start)
          section=t[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in section:
              section += '''\n\n#### Completion summary\n\n**Implementation:** Polished selected Concept 2 / Little Home only in `title-island-concepts/index.html`. Moved the left-side rock inward/right from `left:43px` to `left:58px` so it no longer sits on the island rim. Removed Concept 2's brown deck/platform beneath the tree while preserving all six moving residents and the children's chase/play routine. Rebuilt the four Little Home background clouds as softer asymmetric multi-lobed procedural CSS forms with highlight/underside shading and independent slow drift cycles (38s, 46s, 53s, and 42s with offset phases). No new third-party assets were added. Production `index.html` and campaign/game runtime files were not changed.\n\n**Repository access hardening:** Added a permanent `Repository access invariant` near the top of this handoff: GitHub-plugin/connector access is canonical for repository work; local clone/container DNS/web-fetch failure is never sufficient evidence that GitHub is unavailable. Before claiming access is unavailable, future sessions must explicitly load/discover the GitHub connector and attempt a plugin repository read.\n\n**Files changed:** Permanent implementation changed only `title-island-concepts/index.html`; `DEVELOPMENT_HANDOFF.md` was updated for process/current-work tracking. Temporary cloud transformer/browser-validator/workflow files self-removed after the implementation commit.\n\n**Validation:** GitHub Actions run `33669562379` passed static and Chromium validation after an earlier temporary workflow YAML-formatting attempt (`33669461616`) was corrected. Static checks confirmed rock `left:58px`, zero Concept 2 deck/platform elements, exactly four clouds, exactly six residents split 4 adults / 2 children, no image elements/runtime hotlinks, and no production/campaign/game-file changes. Chromium at 390×844 passed with no console/page/request errors, no horizontal overflow or clipped UI, rock bounds safely inset from the island (`rock left/right 78/112`, island left/right `38/352`), and all four cloud `translate` values changing across sampled timestamps. Concepts 1 and 3 also passed sanity renders. Screenshot artifact `9861960868` contains three animation phases and was downloaded and visually inspected; the stone is visibly inset, the brown platform is gone, and the clouds read softer/more dimensional while drifting independently.\n\n**Implementation commit:** `007210337d4acc72e027338d68e2dceb0ce6fb2b` (`Polish the Little Home island and clouds`).\n\n**Deployment:** GitHub Pages run `33669670099` completed successfully for implementation commit `007210337d4acc72e027338d68e2dceb0ce6fb2b`. The refined preview remains `title-island-concepts/?c=2`.\n\n**Remaining risk / next action:** This polish pass is complete in the design-selection preview. Production remains intentionally unchanged. Next action is user review of the live Little Home and any further requested polish or explicit promotion to production.\n'''
          t=t[:start]+section+t[end:]
          p.write_text(t)
          PY
          rm -f .github/workflows/close-little-home-cloud-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-little-home-cloud-polish.yml
          git commit -m 'Complete Little Home cloud polish handoff'
          git pull --rebase origin main
          git push origin HEAD:main
