name: Start Floating Island Title Concepts

on:
  push:
    paths:
      - '.github/workflows/start-title-island-concepts.yml'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert current work entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          handoff = Path('DEVELOPMENT_HANDOFF.md')
          plan = Path('.current_title_island_plan.md').read_text()
          text = handoff.read_text()
          marker = '## Current Work\n\n'
          if '### 2026-09-02 — Three focused floating-island title concepts' not in text:
              text = text.replace(marker, marker + plan, 1)
          handoff.write_text(text)
          PY
      - name: Commit handoff and clean helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f .current_title_island_plan.md .github/workflows/start-title-island-concepts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .current_title_island_plan.md .github/workflows/start-title-island-concepts.yml
          git commit -m 'Start floating-island title concept handoff'
          git pull --rebase origin main
          git push origin HEAD:main
