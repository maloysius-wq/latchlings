name: Start Atlas chapter blurb fit handoff
on:
  push:
    paths:
      - '.github/workflows/start-atlas-blurb-fit.yml'
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record work in handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          marker='## Current Work\n'
          entry='''\n### 2026-09-10 — Make Skyway Atlas chapter story blurbs fully readable\n\n**Status: IN PROGRESS**\n\n**User goal:** Fix the little story descriptions above the Atlas level selector because their text is visibly cut off. Preserve the strong Atlas layout while ensuring every displayed blurb is a complete thought rather than an abruptly clamped fragment.\n\n**Implementation plan:** Keep the canonical full chapter descriptions in `story400.js` unchanged. Give the Skyway Atlas a dedicated set of concise chapter blurbs written to fit its compact header, plus shorter complete variants for low-height phone layouts. Remove the CSS behavior that truncates those Atlas blurbs mid-sentence or hides them entirely on very short screens. Preserve chapter title, progress, navigation, route geometry, progression, and gameplay behavior.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, `game400-a.js`, `style400-skyway-atlas.css`, and a temporary self-removing validation workflow. `story400.js` should remain unchanged so Story & Residents retains the fuller narrative copy.\n\n**Validation plan:** Render all eight chapter headers at 390x844, 390x700, 360x640, and 320x568. Assert the visible Atlas blurb has no line clamp, hidden overflow, ellipsis, or clipped text; verify the intended normal/compact variant is selected at the correct breakpoint, the chapter header remains within the viewport, the Atlas map retains useful height, and there is no horizontal/vertical shell overflow. Recheck chapter navigation, waypoint navigation, Continue, and source hashes for story/campaign files. Manually inspect contact sheets for readability and visual balance.\n\n**Deployment plan:** Commit this IN PROGRESS handoff before product edits, implement and validate through a self-removing workflow, inspect renders, verify GitHub Pages on the accepted clean state, then close this entry as COMPLETED/PARTIAL/BLOCKED with exact commits, run/artifact details, and any remaining risk.\n\n'''
          if '### 2026-09-10 — Make Skyway Atlas chapter story blurbs fully readable' in s:
              raise SystemExit('entry already exists')
          s=s.replace(marker,marker+entry,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Record Atlas chapter blurb fit work"
          git push
      - name: Self-remove starter
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/start-atlas-blurb-fit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Atlas chapter blurb starter"
          git push
