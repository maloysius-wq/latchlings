name: Validate Early Story Progression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-early-story-progression.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Static story assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rail=Path('gameplay-story-rail400.js').read_text()
          cin=Path('cinematics400.js').read_text()
          dialogue=Path('cinematic-dialogue400.js').read_text()
          script=Path('CINEMATICS_SCRIPT.md').read_text()
          bible=Path('STORY_BIBLE.md').read_text()
          story=Path('story400.js').read_text()
          assert rail.count('report:true') == 5
          for phrase in [
              'Bread from East Sunpetal missed us by the same distance. This is a pattern.',
              'Five households sent the same kind of report. Leave the next one at Little Home.',
              'Then one repair is not enough. We need a way to keep rewriting the route.',
              'The marker stones still work. Local crews are testing new stops around them now.',
              'Sunpetal is connected again. Lanternwood is waiting, and now we know what to bring.',
          ]:
              assert phrase in rail
          assert 'story-rail-report' in rail and 'EARLY_STORY' in rail
          for text in [cin,dialogue,script]:
              assert 'routes for islands that have already moved' in text
              assert 'one strange morning or something much larger' in text
          assert "'\\\"':'&quot;'" in dialogue
          assert 'Early progression cadence, Levels 1–20' in bible
          assert 'Little Home opens a route mailbox' in story
          print('EARLY_STORY_STATIC_OK')
          PY
      - name: Install browser tooling
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-story-http.log 2>&1 &
          echo $! > /tmp/latchlings-story-http.pid
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/latchlings-story-http.log
          exit 1
      - name: Render and verify early story
        shell: bash
        run: |
          mkdir -p early-story-audit
          cat > early-story-audit/audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.addInitScript(()=>{
            localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars:{}}));
            localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1}));
          });
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.evaluate(()=>{ try{document.startViewTransition=undefined}catch(_){} });
          const reportLevels=new Set([4,8,12,16,20]);
          const railManifest=[];
          for(let level=1;level<=21;level++){
            await page.evaluate(l=>window.startLevel(l),level);
            await page.waitForTimeout(120);
            const data=await page.evaluate((l)=>{
              const host=document.getElementById('mechanicNote');
              const rail=host?.querySelector('.story-level-rail');
              const expected=l<=20?window.LatchlingsStoryRail.EARLY_STORY[l-1]:null;
              const rect=rail?.getBoundingClientRect();
              return {
                level:l,
                speaker:host?.querySelector('.story-rail-person>strong')?.textContent?.trim()||'',
                line:host?.querySelector('.story-rail-main p')?.textContent?.trim()||'',
                expectedSpeaker:expected?.speaker||null,
                expectedLine:expected?.line||null,
                reportBadge:host?.querySelector('.story-rail-report')?.textContent?.trim()||'',
                reportClass:rail?.classList.contains('story-report')||false,
                reportDataset:document.getElementById('game')?.dataset.storyReport||'',
                width:rect?.width||0,left:rect?.left||0,right:rect?.right||0,height:rect?.height||0,
                scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth,
              };
            },level);
            if(level<=20){
              if(data.speaker!==data.expectedSpeaker)throw new Error(`Level ${level} speaker mismatch: ${data.speaker} != ${data.expectedSpeaker}`);
              if(data.line!==data.expectedLine)throw new Error(`Level ${level} line mismatch: ${data.line} != ${data.expectedLine}`);
              const shouldReport=reportLevels.has(level);
              if(data.reportClass!==shouldReport)throw new Error(`Level ${level} report class mismatch`);
              if((data.reportBadge==='Route report')!==shouldReport)throw new Error(`Level ${level} report badge mismatch`);
              if((data.reportDataset==='true')!==shouldReport)throw new Error(`Level ${level} report dataset mismatch`);
            } else if(data.reportClass||data.reportBadge||data.reportDataset==='true')throw new Error('Level 21 inherited early report state');
            if(data.left < -1 || data.right > data.viewport+1)throw new Error(`Level ${level} rail overflow`);
            if(data.height < 90 || data.height > 98)throw new Error(`Level ${level} rail height changed: ${data.height}`);
            if(data.scrollWidth > data.viewport)throw new Error(`Level ${level} page horizontal overflow`);
            railManifest.push(data);
            if([1,4,8,12,16,20,21].includes(level))await page.screenshot({path:`early-story-audit/level-${String(level).padStart(2,'0')}.png`,fullPage:true});
          }
          fs.writeFileSync('early-story-audit/rails.json',JSON.stringify(railManifest,null,2));

          await page.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));
          await page.waitForTimeout(220);
          const cinManifest=[];
          for(let beat=1;beat<=7;beat++){
            const data=await page.evaluate(()=>{
              const shell=document.querySelector('.cinematic-shell');
              const overlay=document.getElementById('cinematicOverlay');
              const copy=document.querySelector('.cinematic-copy');
              const sr=shell?.getBoundingClientRect(),cr=copy?.getBoundingClientRect();
              const sourceBeat=window.LatchlingsCinematics.CINEMATICS.opening.beats[window.LatchlingsCinematics.beat];
              return {
                beat:(window.LatchlingsCinematics?.beat||0)+1,
                label:document.getElementById('cinematicBeat')?.textContent?.trim()||'',
                visibleNarration:[...document.querySelectorAll('#cinematicLines .narrator-only span')].map(x=>x.textContent.trim()).join(' '),
                sourceNarration:(sourceBeat?.lines||[]).filter(x=>x?.[0]==='Narrator').map(x=>x[1]).join(' '),
                shellTop:sr?.top||0,shellBottom:sr?.bottom||0,copyTop:cr?.top||0,copyBottom:cr?.bottom||0,
                viewportH:innerHeight,scrollWidth:document.documentElement.scrollWidth,viewportW:innerWidth,
                shown:overlay?.classList.contains('show')||false
              };
            });
            if(!data.shown)throw new Error(`Opening beat ${beat} not shown`);
            if(data.visibleNarration!==data.sourceNarration)throw new Error(`Opening beat ${beat} narration DOM/source mismatch`);
            if(data.shellTop < -1 || data.shellBottom > data.viewportH+1)throw new Error(`Opening beat ${beat} shell vertical overflow ${data.shellTop}/${data.shellBottom}/${data.viewportH}`);
            if(data.scrollWidth > data.viewportW)throw new Error(`Opening beat ${beat} horizontal overflow`);
            if(beat===4 && !data.sourceNarration.includes('routes for islands that have already moved'))throw new Error('Opening Beat 4 did not receive stronger premise');
            if(beat===7 && !data.sourceNarration.includes('one strange morning or something much larger'))throw new Error('Opening Beat 7 did not receive campaign objective');
            cinManifest.push(data);
            await page.screenshot({path:`early-story-audit/opening-beat-${beat}.png`,fullPage:true});
            if(beat<7){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(180);}
          }
          fs.writeFileSync('early-story-audit/cinematics.json',JSON.stringify(cinManifest,null,2));

          await page.setViewportSize({width:390,height:700});
          await page.waitForTimeout(150);
          const compact=await page.evaluate(()=>{
            const shell=document.querySelector('.cinematic-shell')?.getBoundingClientRect();
            return {top:shell?.top||0,bottom:shell?.bottom||0,h:innerHeight,w:innerWidth,scrollWidth:document.documentElement.scrollWidth};
          });
          if(compact.top < -1 || compact.bottom > compact.h+1)throw new Error(`Compact opening Beat 7 overflow ${JSON.stringify(compact)}`);
          if(compact.scrollWidth > compact.w)throw new Error('Compact Beat 7 horizontal overflow');
          await page.screenshot({path:'early-story-audit/opening-beat-7-compact.png',fullPage:true});
          if(errors.length)throw new Error('Page errors: '+errors.join(' | '));
          console.log('EARLY_STORY_BROWSER_OK');
          await browser.close();
          JS
          node early-story-audit/audit.mjs
      - name: Upload story visuals
        uses: actions/upload-artifact@v4
        with:
          name: early-story-progression-audit
          path: early-story-audit
          if-no-files-found: error
      - name: Self-remove
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          rm -f .github/workflows/validate-early-story-progression.yml
          git add .github/workflows/validate-early-story-progression.yml
          git commit -m "Remove early story validator"
          git push
