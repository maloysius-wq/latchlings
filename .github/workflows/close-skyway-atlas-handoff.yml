name: Close Skyway Atlas Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-skyway-atlas-handoff.yml'

permissions:
  contents: write

jobs:
  close-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record completed Atlas work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('DEVELOPMENT_HANDOFF.md')
          text = path.read_text()
          title = '### 2026-09-10 — Rebuild Level Select as the Skyway Atlas'
          start = text.index(title)
          next_section = text.index('\n\n### ', start + len(title))
          section = text[start:next_section]

          section = section.replace('**Status: IN PROGRESS**', '**Status: COMPLETED**', 1)
          if '#### Completion summary' not in section:
              section = section.rstrip() + '''\n\n#### Completion summary\n\n- **Result:** COMPLETED. The generic Level Select was replaced by the Skyway Atlas while preserving the existing campaign/progression and level-launch semantics. The accepted product implementation is commit `2557e71a97431a32741082c5038b4fe627917ecf` (`Rebuild Level Select as Skyway Atlas`).\n- **Product files:** `index.html`, `game400-a.js`, new `style400-skyway-atlas.css`, new `LEVEL_SELECT_ART_DIRECTION.md`, `ART_ASSET_CREDITS.md`, plus eight local 512×512 WebP chapter textures under `assets/level-select/` (`sunpetal`, `lanternwood`, `lodestone`, `masquerade`, `prism`, `copperline`, `stormswitch`, `aurora`). Campaign, solver, story, cinematic, and Level 400 source files were intentionally left unchanged.\n- **Atlas behavior delivered:** 8 chapter regions × 5 ten-level waypoint stretches, winding ten-stop routes, restored/current/locked visual states, milestone landmarks, chapter-specific scenery/materials, region and waypoint navigation, NEXT STOP/current-stop emphasis, resident guide, reset utility access, strong Continue CTA, future-route cloud treatment, and reduced-motion support.\n- **Acceptance:** GitHub Actions run `34525488124` (`Build Skyway Atlas V4`) completed successfully and printed `SKYWAY_ATLAS_V4_ACCEPTED`. It rendered all 8 chapters and all 40 route stretches at 390×844, hero/current-state views for every chapter, responsive matrices at 320×568, 360×640, 390×700, and 430×932, plus fresh/mid-progress/reduced-motion states. It verified 44px+ level/CTA targets, route/node containment, accessible labels, no horizontal overflow, local texture decoding, Reset confirmation, direct level launch, Continue launch, and unchanged campaign/story/cinematic source.\n- **Acceptance artifact:** `skyway-atlas-v4-final-renders`, artifact ID `10171419801`, contains 71 rendered/audit files for visual review.\n- **Repository cleanup:** The temporary v4 workflow self-removed in commit `97e1bc6796f9e928836a591c4a0e96e5f297a658` (`Remove Skyway Atlas v4 workflow`). Earlier v1-v3 workflows were iterative validation/refinement attempts and were also removed; they are superseded by the passing v4 acceptance.\n- **Deployment:** GitHub Pages run `34525671622` for clean `main` at `97e1bc6796f9e928836a591c4a0e96e5f297a658` completed successfully.\n- **Remaining risk / next action:** No known critical Atlas blocker remains. Future changes to progression, navigation, copy length, or Atlas geometry should rerun the same responsive/state matrix.\n'''

          path.write_text(text[:start] + section + text[next_section:])
          PY

      - name: Commit handoff closeout and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/close-skyway-atlas-handoff.yml
          git add DEVELOPMENT_HANDOFF.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Skyway Atlas handoff"
          git push
