name: Close Wobbly Toy Letters Logo

on:
  push:
    paths:
      - '.github/workflows/close-wobbly-logo.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        run: |
          set -euo pipefail
          python3 .github/scripts/close_wobbly_logo.py
          rm -f .github/workflows/close-wobbly-logo.yml .github/scripts/close_wobbly_logo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-wobbly-logo.yml .github/scripts/close_wobbly_logo.py
          git commit -m 'Complete Wobbly Toy Letters logo handoff'
          git pull --rebase origin main
          git push origin HEAD:main
