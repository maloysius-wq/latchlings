name: Prepare Chapter 5 live wiring artifact

on:
  push:
    paths:
      - '.github/workflows/prepare-chapter5-live-files.yml'
      - '.github/tmp/prepare-chapter5-live-files.py'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare live wiring files
        run: |
          python .github/tmp/prepare-chapter5-live-files.py
          node --check pass3-chapter5-prism.js
          test -f pass3-chapter5-prism.css
          grep -F 'pass3-chapter5-prism.css?v=20260913-ch5modular-1' index.html
          grep -F 'pass3-chapter5-prism.js?v=20260913-ch5modular-1' index.html
          grep -F 'glasshouse lookout / sighting arch' LEVEL_SELECT_ART_DIRECTION.md
      - name: Package live wiring files
        run: |
          mkdir -p /tmp/ch5-live
          cp index.html LEVEL_SELECT_ART_DIRECTION.md /tmp/ch5-live/
          sha256sum /tmp/ch5-live/index.html /tmp/ch5-live/LEVEL_SELECT_ART_DIRECTION.md > /tmp/ch5-live/sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: chapter5-live-wiring
          path: /tmp/ch5-live
          if-no-files-found: error
