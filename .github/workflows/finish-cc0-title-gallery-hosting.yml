name: Finalize CC0 Title Gallery Hosting Handoff

on:
  push:
    paths:
      - '.github/workflows/finish-cc0-title-gallery-hosting.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete development handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          handoff=Path('DEVELOPMENT_HANDOFF.md')
          completion=Path('.handoff/cc0-title-gallery-hosting-completion.md')
          text=handoff.read_text()
          heading='### 2026-09-01 — Host second CC0 asset-based title concept gallery'
          start=text.index(heading)
          end=text.index('\n---\n', start)
          section=text[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in section:
              section=section.rstrip()+"\n\n"+completion.read_text().strip()+"\n"
          text=text[:start]+section+text[end:]
          handoff.write_text(text)
          PY
      - name: Commit final handoff and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finish-cc0-title-gallery-hosting.yml
          rm -f .handoff/cc0-title-gallery-hosting-completion.md
          rmdir .handoff 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete CC0 title gallery hosting handoff'
          git pull --rebase origin main
          git push origin HEAD:main
