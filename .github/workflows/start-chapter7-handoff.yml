name: Prepare Chapter 7 Pass 3 handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp/start-chapter7-handoff.py'
      - '.github/workflows/start-chapter7-handoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build updated handoff artifact
        run: python3 .github/tmp/start-chapter7-handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: chapter7-handoff-starter
          path: /tmp/DEVELOPMENT_HANDOFF.md
          if-no-files-found: error
