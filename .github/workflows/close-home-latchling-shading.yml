name: Close home Latchling shading handoff
on:
  push:
    paths:
      - '.github/workflows/close-home-latchling-shading.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          title='### 2026-09-11 — Revert puzzle rim and smooth home Latchling shading\n'
          start=s.find(title)
          if start<0: raise SystemExit('handoff entry missing')
          end=s.find('\n### ',start+len(title))
          if end<0: end=len(s)
          section=s[start:end]
          if '**Status: IN PROGRESS**' not in section: raise SystemExit('handoff status is not IN PROGRESS')
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary='''\n#### Completion summary\n\n- **Result:** COMPLETED. The playable puzzle Latchlings are back to the slimmer outline treatment, while the separate Little Home/title-island residents now use a continuous radial sphere lighting model instead of the small-scale vertical top-to-bottom gradient that was reading as two stacked color bands.\n- **Root cause / separation:** The screenshot exposed two independent renderers. Puzzle pieces come from `style400-game.css`; the home residents are rendered inside the `title-island-concepts/index.html` iframe. The previous work only changed the puzzle renderer, so it could not correct the home-island appearance.\n- **Playable puzzle revert:** `style400-game.css` restores the prior accepted 2px opaque navy border (`#274462`) and `background-clip:padding-box`, replacing the temporary 4px structural border/border-box rim. The outer element dimensions, hit target, faces, suits, selected white/blue rings, movement, and capture behavior remain unchanged.\n- **Little Home shading fix:** `title-island-concepts/index.html` replaces the refined resident body's vertical `linear-gradient(180deg, ...)` with two radial layers: a small localized upper-left highlight plus a centered radial body gradient from `--light` through `--piece-color` to `--dark`. The lower inset shadow was also softened and the decorative border reduced to 1.5px, producing a single spherical falloff rather than a dark/light horizontal split. Resident choreography, adult/child sizing, faces, suits, and idle/blink behavior are preserved.\n- **Cache freshness:** `index.html` now references `style400-game.css?v=20260911-sphere3` and the production home iframe as `title-island-concepts/?c=2&embed=1&v=20260911-sphere3`, forcing mobile browsers to request the accepted puzzle CSS and home iframe document instead of reusing cached visual code.\n- **Changed files / commits:** Accepted product commit `9a81c603dd1a4e95feb66c1250241706d2542a36` (`Smooth home Latchling shading and slim puzzle rim`) changes only `style400-game.css`, `title-island-concepts/index.html`, and `index.html`. Temporary validator files self-removed in clean-state commit `ba376e9fb15642fc311a40dfeb55425c0746770e` (`Remove home Latchling shading validator`).\n- **Accepted validation:** GitHub Actions run `34612422494`, job `103305946548`, completed successfully and printed `HOME_LATCHLING_SHADING_ACCEPTED`. It captured the exact production home iframe and actual puzzle pieces at 390x844 with DPR 1 and DPR 3, checked all five Little Home residents, verified circular geometry, verified the home body no longer computes a linear gradient, verified puzzle borders are exactly 2px on all four sides with the expected navy color, preserved selected-ring behavior, and smoke-tested Level 1 selection/movement.\n- **Measured visual improvement:** The sampled top-vs-bottom resident luminance gap dropped from **47.58 to 6.31 at DPR 1** and from **50.68 to 7.48 at DPR 3**. The home resident screenshot changed by **25.71% of pixels at DPR 1** and **31.07% at DPR 3**, confirming a material visual change. The puzzle selected-piece render changed by **19.42% at DPR 1** and **17.04% at DPR 3** from the thick-rim version.\n- **Artifact / visual review:** Acceptance artifact `home-latchling-shading-audit`, artifact ID `10268269882`, SHA-256 `8a4e75bc2f54c4f9e2ebe4beb25df74260d73826e831c877fc980196114949a8`, contains clean before/after full-home renders, all five resident close-ups at DPR 1 and DPR 3, selected puzzle-piece before/after renders, metrics JSON, and explicit diff images. Manual review shows the home residents reading as continuous spheres rather than horizontally divided bodies.\n- **Scope protection:** Hash verification confirmed `game400-a.js`, `game400-b.js`, SFX/music, UI/theme/Atlas/board/story-rail CSS, story/cinematic sources, and all eight `campaign400-*.js` files remained unchanged. No puzzle rules, level data, Atlas behavior, audio, story logic, or navigation changed.\n- **Deployment / hygiene:** GitHub Pages run `34612495529` successfully built and deployed clean accepted state `ba376e9fb15642fc311a40dfeb55425c0746770e`. Immediately before this closeout helper was added, `.github/workflows` contained only the permanent `validate-repository-access-guard.yml`. This closeout helper self-removes after recording the completed journal entry.\n- **Remaining risk / next action:** No known code blocker remains. Real-device viewing remains the final subjective art check, but both affected delivery paths are cache-busted and the production-size screenshot metrics directly target the visual split reported from the phone screenshot.\n\n'''
          section=section.rstrip()+summary
          p.write_text(s[:start]+section+s[end:])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Complete home Latchling shading handoff'
          git push
      - name: Self-remove closeout helper
        shell: bash
        run: |
          git pull --ff-only origin main
          git rm -f .github/workflows/close-home-latchling-shading.yml
          git commit -m 'Remove home Latchling shading closeout helper'
          git push
