name: Astra Pass 5 Browser Certification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/astra-pass5-browser-cert.yml']

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Require accepted product bytes unchanged
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT=a998e095dd710028cdca6e028bc0047c71aeed3c
          git diff --exit-code "$PRODUCT" HEAD -- story400.js cinematics400.js style400-cinematics.css index.html game400-a.js game400-b.js style400-ui.css style400-game.css title-island-concepts/index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
          node --check game400-a.js
          node --check game400-b.js
          node --check story400.js
          node --check story-grounding400.js
          node --check cinematics400.js
          node --check music400.js
          node --check sfx400.js
          git diff --check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run Pass 5 browser certification
        shell: bash
        run: |
          mkdir -p /tmp/astra-pass5/screens
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/astra-pass5-http.log 2>&1 &
          cat > .astra-pass5.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const OUT='/tmp/astra-pass5';
          const base='http://127.0.0.1:8000/index.html';
          const failures=[], report={product:'a998e095dd710028cdca6e028bc0047c71aeed3c',viewports:{},boards:{},movements:{},flows:{},cinematics:{},accessibility:{},audio:{},assets:{},performance:{},failures};
          const fail=(where,msg,data={})=>{failures.push({where,msg,data});console.error('FAIL',where,msg,JSON.stringify(data))};
          const assert=(ok,where,msg,data={})=>{if(!ok)fail(where,msg,data)};
          const rectOK=(r,w,h,t=.75)=>r&&r.width>=t&&r.height>=t&&r.left>=-1&&r.top>=-1&&r.right<=w+1&&r.bottom<=h+1;
          const browser=await chromium.launch({headless:true,args:['--enable-precise-memory-info']});
          async function newPage(viewport,initAudio=false){
            const c=await browser.newContext({viewport});
            if(initAudio)await c.addInitScript(()=>{window.__mediaTest={plays:0,pauses:0};const op=HTMLMediaElement.prototype.play,opa=HTMLMediaElement.prototype.pause;HTMLMediaElement.prototype.play=function(){window.__mediaTest.plays++;try{const r=op.call(this);if(r?.catch)r.catch(()=>{});return Promise.resolve()}catch(_){return Promise.resolve()}};HTMLMediaElement.prototype.pause=function(){window.__mediaTest.pauses++;try{return opa.call(this)}catch(_){}}});
            const p=await c.newPage(), errors=[];p.on('pageerror',e=>errors.push(e.message));p.on('console',m=>{if(m.type()==='error'&&!m.text().includes('favicon'))errors.push('console: '+m.text())});
            await p.goto(base,{waitUntil:'networkidle'});return {c,p,errors};
          }
          async function setReduced(p){await p.evaluate(()=>LatchlingsPrefs.set('motion','reduced'))}
          async function directLevel(p,L){await p.evaluate(L=>{playMode='campaign';document.body.dataset.playMode='campaign';currentLevel=L;const lev=LEVELS[L-1];chapterView=Math.ceil(L/50);rangeView=Math.floor(((L-1)%50)/10);positions=lev.pieces.map(x=>x.pos.slice());doorMask=0;movesUsed=0;selected=0;hintStep=0;animating=false;lastNestArrival=null;applyTheme(chapterView);screen('game');renderGame(true)},L);await p.waitForTimeout(20)}
          async function visibleButtonRects(p,selector='button'){return p.$$eval(selector,els=>els.filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).map(e=>({id:e.id,cls:e.className,text:(e.textContent||'').trim().slice(0,50),r:e.getBoundingClientRect().toJSON()})))}
          function checkTargets(items,where){const bad=items.filter(x=>x.r.width<43.5||x.r.height<43.5);assert(!bad.length,where,'visible button target below 44px',bad.slice(0,12));return {count:items.length,bad:bad.length}}

          const sizes=[['short',320,568],['compact',360,800],['phone',390,844],['wide',430,932],['tablet',768,1024],['landscape',844,390]];
          for(const [name,w,h] of sizes){
            const {c,p,errors}=await newPage({width:w,height:h});await setReduced(p);await directLevel(p,400);
            const metrics=await p.evaluate(()=>{const g=document.getElementById('game').getBoundingClientRect(),b=document.getElementById('board').getBoundingClientRect(),ctrl=document.querySelector('#game .controls').getBoundingClientRect();return {game:g.toJSON(),board:b.toJSON(),controls:ctrl.toJSON(),sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth,sh:document.documentElement.scrollHeight,ch:document.documentElement.clientHeight,running:document.getAnimations({subtree:true}).filter(a=>a.playState==='running').length}});
            assert(metrics.sw<=w+1,name,'horizontal overflow',metrics);assert(metrics.game.bottom<=h+1&&metrics.controls.bottom<=h+1,name,'game/control viewport overflow',metrics);assert(metrics.board.width>80&&metrics.board.height>80,name,'board collapsed',metrics);assert(metrics.running===0,name,'Reduced Motion has running animations',metrics);
            const gameTargets=await visibleButtonRects(p,'#game button:not(.latchling)');const targetSummary=checkTargets(gameTargets,name+' game');
            await p.screenshot({path:`${OUT}/screens/${name}-game.png`});
            await p.evaluate(()=>{screen('home');updateHome(true)});await p.waitForTimeout(30);const hf=p.frames().find(f=>f.url().includes('title-island-concepts'));assert(!!hf,name,'Little Home frame missing');let homeTargets=[];if(hf){homeTargets=await hf.$$eval('button',els=>els.filter(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0}).map(e=>({id:e.id,cls:e.className,text:(e.textContent||'').trim().slice(0,50),r:e.getBoundingClientRect().toJSON()})));checkTargets(homeTargets,name+' home')}
            await p.evaluate(()=>openStoryScreen());await p.waitForTimeout(30);checkTargets(await visibleButtonRects(p,'#story button'),name+' journal');
            await p.evaluate(()=>{chapterView=8;rangeView=4;screen('levels');renderChapter()});await p.waitForTimeout(30);checkTargets(await visibleButtonRects(p,'#levels button'),name+' atlas');
            await p.evaluate(()=>{screen('game');pauseModal()});await p.waitForTimeout(20);checkTargets(await visibleButtonRects(p,'#modal button'),name+' pause modal');await p.evaluate(()=>closeModal());
            await p.evaluate(()=>LatchlingsCinematics.show('homeward',{markSeen:false}));await p.waitForTimeout(30);checkTargets(await visibleButtonRects(p,'#cinematicOverlay button'),name+' cinematic');await p.evaluate(()=>LatchlingsCinematics.finish(true));
            report.viewports[name]={w,h,metrics,gameTargets:targetSummary,homeTargets:homeTargets.length,errors};assert(!errors.length,name,'runtime errors',errors);await c.close();
          }

          {const {c,p,errors}=await newPage({width:390,height:844});await setReduced(p);const t0=Date.now(),boardData=[];for(let L=1;L<=400;L++){await directLevel(p,L);const d=await p.evaluate(L=>{const lev=LEVELS[L-1],board=document.getElementById('board').getBoundingClientRect(),cells=[...document.querySelectorAll('#board .cell')],pieces=[...document.querySelectorAll('#pieceLayer .latchling')];const inside=el=>{const r=el.getBoundingClientRect();return r.left>=board.left-1&&r.top>=board.top-1&&r.right<=board.right+1&&r.bottom<=board.bottom+1};const mech=['rocks','anchors','suitGates','colorGates','rails','turners','switches','doors'].reduce((n,k)=>n+(lev[k]?.length||0),0);return {L,size:lev.size,cells:cells.length,pieces:pieces.length,inside:cells.every(inside)&&pieces.every(inside),range:boardRangeForLevel(L),chapter:Math.ceil(L/50),mech,sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}},L);if(d.cells!==d.size*d.size||!d.inside||d.sw>d.cw+1)fail('board-'+L,'geometry regression',d);boardData.push(d)}
            const topDense=[...boardData].sort((a,b)=>b.mech-a.mech).slice(0,12),variants=new Set(boardData.filter(x=>(x.L-1)%10===0).map(x=>`${x.chapter}-${x.range}`));assert(variants.size===40,'boards','did not cover 40 chapter/range material variants',{size:variants.size});report.boards={rendered:boardData.length,materialVariants:variants.size,elapsedMs:Date.now()-t0,densest:topDense};assert(!errors.length,'boards','runtime errors',errors);await c.close()}

          {const {c,p,errors}=await newPage({width:390,height:844});const data=await p.evaluate(()=>{const out=[];for(let ch=1;ch<=8;ch++)for(let i=0;i<5;i++){const start=(ch-1)*50+i*10+1,result=(ch-1)*50+(i+1)*10,m=STORY.movementForLevel(start),beat=STORY.beatForLevel(result),fixture=STORY.movementFixtureFor(result);out.push({ch,i,start,result,title:m?.title,setup:m?.setup,question:m?.question,stakes:m?.stakes,resultTitle:beat?.movementTitle,resolved:beat?.questionResolved,fixture})}const boundaries=[];for(let ch=1;ch<8;ch++){const before={unlocked:ch*50,stars:{[ch*50]:0}},after={unlocked:ch*50+1,stars:{[ch*50]:3}},b1=STORY.campaignBriefing(before),b2=STORY.campaignBriefing(after);boundaries.push({ch,before:b1,after:b2})}return {out,boundaries}});for(const x of data.out)assert(!!(x.title&&x.setup&&x.question&&x.stakes&&x.resultTitle&&x.resolved&&x.fixture),'movement-'+x.result,'missing start/result authorship',x);assert(data.out.length===40,'movements','movement count mismatch',{count:data.out.length});for(const x of data.out)assert(x.resultTitle===x.title&&x.resolved===x.question,'movement-'+x.result,'result does not resolve authored movement',x);for(const b of data.boundaries)assert(JSON.stringify(b.before)!==JSON.stringify(b.after),'boundary-'+b.ch,'earned briefing did not change',b);report.movements={count:data.out.length,boundaries:data.boundaries};assert(!errors.length,'movements','runtime errors',errors);await c.close()}

          {const {c,p,errors}=await newPage({width:390,height:844});await p.evaluate(()=>localStorage.clear());await p.reload({waitUntil:'networkidle'});await p.waitForTimeout(100);let hf=p.frames().find(f=>f.url().includes('title-island-concepts'));const fresh=hf?await hf.$eval('.home-primary-copy strong',e=>e.textContent.trim()):'';assert(/Begin/i.test(fresh),'onboarding','fresh primary action is not Begin',{fresh});if(hf)await hf.click('.play');await p.waitForFunction(()=>LatchlingsCinematics.active==='opening',{timeout:2500});assert(await p.evaluate(()=>LatchlingsCinematics.active)==='opening','onboarding','opening cinematic not reached');await p.click('#cinematicSkip');await p.waitForFunction(()=>!LatchlingsCinematics.active,{timeout:1500});assert(await p.evaluate(()=>document.getElementById('game').classList.contains('active')),'onboarding','skip did not return to game');
            await p.evaluate(()=>{localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:137,stars:{136:3}}));localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify(['opening']))});await p.reload({waitUntil:'networkidle'});await p.waitForTimeout(100);hf=p.frames().find(f=>f.url().includes('title-island-concepts'));const returning=hf?await hf.$eval('.home-primary-copy',e=>e.textContent.replace(/\s+/g,' ').trim()):'';assert(/Continue/i.test(returning)&&/137/.test(returning),'returning','returning primary state incorrect',{returning});
            const isolation=await p.evaluate(()=>{const campaignBefore=localStorage.getItem('latchlings_campaign400_progress_v1');startDailyPuzzle();movesUsed=LEVELS[currentLevel-1].optimal;winLevel();const campaignAfterDaily=localStorage.getItem('latchlings_campaign400_progress_v1'),daily=localStorage.getItem('latchlings_daily400_progress_v1');closeModal();leaveDailyForHome();const beforeReplay=localStorage.getItem('latchlings_campaign400_progress_v1');LatchlingsCinematics.show('opening',{markSeen:false});LatchlingsCinematics.finish(true);const afterReplay=localStorage.getItem('latchlings_campaign400_progress_v1');progress={unlocked:1,stars:{}};saveProgress();currentLevel=1;playMode='campaign';movesUsed=LEVELS[0].optimal;winLevel();const campaignWin=JSON.parse(localStorage.getItem('latchlings_campaign400_progress_v1'));closeModal();return {campaignBefore,campaignAfterDaily,daily,beforeReplay,afterReplay,campaignWin}});assert(isolation.campaignBefore===isolation.campaignAfterDaily,'daily','Daily mutated campaign progress',isolation);assert(!!isolation.daily,'daily','Daily completion not stored');assert(isolation.beforeReplay===isolation.afterReplay,'replay','cinematic replay mutated campaign progress');assert(isolation.campaignWin.unlocked===2&&isolation.campaignWin.stars['1']>0,'campaign','campaign win did not advance independently',isolation.campaignWin);report.flows={fresh,returning,isolation:{dailyStored:!!isolation.daily,dailyIsolated:isolation.campaignBefore===isolation.campaignAfterDaily,replayIsolated:isolation.beforeReplay===isolation.afterReplay,campaignWin:isolation.campaignWin}};assert(!errors.length,'flows','runtime errors',errors);await c.close()}

          {const {c,p,errors}=await newPage({width:320,height:568});await setReduced(p);const meta=await p.evaluate(()=>{const cs=LatchlingsCinematics.CINEMATICS;return {ids:Object.keys(cs),beats:Object.values(cs).reduce((n,x)=>n+x.beats.length,0),turns:Object.values(cs).reduce((n,x)=>n+x.beats.reduce((m,b)=>m+(b.lines?.length||0),0),0)}});let turns=0;for(const id of meta.ids){await p.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id);while(await p.evaluate(()=>!!LatchlingsCinematics.active)){await p.waitForFunction(()=>{const canonical=LatchlingsCinematics.CINEMATICS[LatchlingsCinematics.active]?.beats?.[LatchlingsCinematics.beat]?.lines?.[LatchlingsCinematics.line];if(!canonical)return false;const ns=[...document.querySelectorAll('#cinematicLines>p.narrator-only')],rs=[...document.querySelectorAll('.cin-opening-dialogue-dock .cin-opening-dialogue-row')],v=[...ns,...rs].map(x=>x.textContent?.replace(/\s+/g,' ').trim()||'');return ns.length+rs.length===1&&v[0]?.includes(canonical[1])},null,{timeout:1500});const st=await p.evaluate(()=>{const next=document.getElementById('cinematicNext')?.getBoundingClientRect(),skip=document.getElementById('cinematicSkip')?.getBoundingClientRect(),shell=document.querySelector('.cinematic-shell')?.getBoundingClientRect();return {next:next?.toJSON(),skip:skip?.toJSON(),shell:shell?.toJSON(),sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}});assert(rectOK(st.next,320,568,43.5)&&rectOK(st.skip,320,568,43.5)&&st.shell.bottom<=568.5&&st.sw<=st.cw+1,'cinematic-'+id,'turn containment/control failure',st);turns++;await p.evaluate(()=>LatchlingsCinematics.next())}}assert(meta.beats===25&&turns===meta.turns,'cinematics','canonical count mismatch',{meta,turns});report.cinematics={...meta,walked:turns};assert(!errors.length,'cinematics','runtime errors',errors);await c.close()}

          {const {c,p,errors}=await newPage({width:390,height:844});await setReduced(p);await directLevel(p,351);const nonColor=await p.evaluate(()=>{const latch=[...document.querySelectorAll('.latchling')].map(x=>({aria:x.getAttribute('aria-label'),suits:x.querySelectorAll('svg').length,cls:x.className})),nest=[...document.querySelectorAll('.nest')].map(x=>({aria:x.getAttribute('aria-label'),suits:x.querySelectorAll('svg').length,txt:x.textContent.trim()})),doors=[...document.querySelectorAll('[aria-label^="Door "]')].map(x=>x.getAttribute('aria-label')),switches=[...document.querySelectorAll('[aria-label^="Switch "]')].map(x=>x.getAttribute('aria-label'));return {latch,nest,doors,switches}});assert(nonColor.latch.length>0&&nonColor.latch.every(x=>x.suits>0),'non-color','Latchling identity lacks suit shape',nonColor.latch);assert(nonColor.nest.length>0&&nonColor.nest.every(x=>x.suits>0),'non-color','nest identity lacks suit shape',nonColor.nest);assert(nonColor.doors.length>0&&nonColor.switches.length>0,'non-color','switch/door text linkage absent',nonColor);
            await p.evaluate(()=>pauseModal());await p.waitForTimeout(30);const pause=document.getElementById;const focusOpen=await p.evaluate(()=>({active:document.activeElement?.id,role:document.getElementById('modal').getAttribute('role'),modal:document.getElementById('modal').getAttribute('aria-modal')}));assert(focusOpen.active==='resumeBtn'&&focusOpen.role==='dialog'&&focusOpen.modal==='true','focus','pause modal focus/semantics incorrect',focusOpen);await p.keyboard.press('Tab');await p.keyboard.press('Shift+Tab');await p.keyboard.press('Escape');assert((await p.evaluate(()=>document.activeElement?.id))==='pauseBtn','focus','Escape did not restore Pause');await p.evaluate(()=>openStoryScreen());await p.waitForTimeout(20);await p.focus('#storyTabNow');await p.keyboard.press('ArrowRight');assert((await p.evaluate(()=>({id:document.activeElement?.id,sel:document.activeElement?.getAttribute('aria-selected')}))).id==='storyTabResidents','focus','journal arrow-key navigation failed');const fontBefore=await p.$eval('#storyNowPanel',e=>parseFloat(getComputedStyle(e).fontSize));await p.evaluate(()=>LatchlingsPrefs.set('textSize','large'));const fontAfter=await p.$eval('#storyNowPanel',e=>parseFloat(getComputedStyle(e).fontSize));assert(fontAfter>fontBefore,'text-scale','Large Text did not increase journal text',{fontBefore,fontAfter});const semantics=await p.evaluate(()=>({tabs:[...document.querySelectorAll('.story-section-tab')].every(x=>x.getAttribute('role')==='tab'&&!!x.getAttribute('aria-controls')),panels:[...document.querySelectorAll('.story-section-panel')].every(x=>x.getAttribute('role')==='tabpanel'&&!!x.getAttribute('aria-labelledby')),ending:document.querySelector('.ending-homecoming')?.getAttribute('aria-label'),viewport:document.querySelector('meta[name="viewport"]')?.content}));assert(semantics.tabs&&semantics.panels&&!!semantics.ending&&!/user-scalable\s*=\s*no/i.test(semantics.viewport||''),'semantics','reading-order/zoom semantics regression',semantics);report.accessibility={nonColor:{latchlings:nonColor.latch.length,nests:nonColor.nest.length,doors:nonColor.doors.length,switches:nonColor.switches.length},focusOpen,fontBefore,fontAfter,semantics};assert(!errors.length,'accessibility','runtime errors',errors);await c.close()}

          {const {c,p,errors}=await newPage({width:390,height:844},true);await p.evaluate(()=>localStorage.clear());await p.reload({waitUntil:'networkidle'});let hf=p.frames().find(f=>f.url().includes('title-island-concepts'));if(hf)await hf.click('.settings');await p.waitForTimeout(30);let toggles=await visibleButtonRects(p,'#musicToggleBtn,#sfxToggleBtn');checkTargets(toggles,'audio home settings');assert(toggles.length===2,'audio','home settings missing audio toggles',toggles);await p.evaluate(()=>{LatchlingsMusic.setEnabled(false);LatchlingsSFX.setEnabled(false)});const disabled=await p.evaluate(()=>({music:LatchlingsMusic.isEnabled(),sfx:LatchlingsSFX.isEnabled(),m:localStorage.getItem('latchlings_music_enabled_v1'),s:localStorage.getItem('latchlings_sfx_enabled_v1'),plays:__mediaTest.plays}));await p.reload({waitUntil:'networkidle'});const persisted=await p.evaluate(()=>({music:LatchlingsMusic.isEnabled(),sfx:LatchlingsSFX.isEnabled()}));assert(!persisted.music&&!persisted.sfx,'audio','audio preferences did not persist',{disabled,persisted});const beforeDisabledPlay=await p.evaluate(()=>__mediaTest.plays);await p.evaluate(()=>{LatchlingsSFX.uiTap();LatchlingsCinematics.show('opening',{markSeen:false})});await p.waitForTimeout(30);const afterDisabledPlay=await p.evaluate(()=>__mediaTest.plays);assert(afterDisabledPlay===beforeDisabledPlay,'audio','disabled audio attempted playback',{beforeDisabledPlay,afterDisabledPlay});await p.evaluate(()=>{LatchlingsCinematics.finish(true);LatchlingsMusic.setEnabled(true);LatchlingsSFX.setEnabled(true);currentLevel=51;playMode='campaign';screen('game');document.getElementById('levelTitle').textContent='Level 51';LatchlingsMusic.sync()});await p.waitForTimeout(30);const routing=await p.evaluate(()=>({requested:LatchlingsMusic.requested(),enabledM:LatchlingsMusic.isEnabled(),enabledS:LatchlingsSFX.isEnabled()}));assert(routing.requested==='2','audio','gameplay did not request chapter 2 music',routing);await p.evaluate(()=>{pau