name: Start Chapter 2 Pass 3 handoff

on:
  push:
    paths:
      - '.github/workflows/start-chapter2-pass3.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Chapter 2 Pass 3 work entry
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-12 — Pass 3 Chapter 2 Lanternwood campaign application'
          if heading in s:
              raise SystemExit('Chapter 2 Pass 3 entry already exists')
          marker='## Current Work\n'
          if marker not in s:
              raise SystemExit('Current Work marker missing')
          entry=dedent('''

          ### 2026-09-12 — Pass 3 Chapter 2 Lanternwood campaign application

          **Status: IN PROGRESS**

          **User goal:** Continue directly from the completed Chapter 1 production rollout, using `LATCHLINGS_VISUAL_STORY_AUDIT.md` as the development roadmap and current `main` as source of truth. This is the next contained unit of audit Pass 3 (`campaign application`): apply the approved production grammar to Lanternwood while also advancing the audit's continuity and chapter-payoff recommendations.

          **Audit/current-source recheck:** The audit's Pass 3 calls for the approved material system across all eight chapter families and five movement variants, evolving movement content, stronger Atlas arrival/payoff states, and visible keepsake actions at Little Home. Its Lanternwood-specific art direction is desaturated timber cells, a deeper forest silhouette, and warm lanterns at destinations; its story-continuity note asks for Tansy's Lanternwood friend to gain a recognizable name, porch silhouette, or object before the later telescope scene. Current `main` has only Chapter 1 in `VISUAL_CHAPTER_MODES`; Chapter 2 still uses the older board surfaces. The Chapter 2 story establishes Pip and Tansy making friends but gives the friend/place no recurring identifier. Level 100 still uses the generic win surface, while Little Home already has the canonical Chapter 2 visitor pennant prop but no dedicated reward/focus treatment.

          **Implementation plan:** (1) Extend the reusable chapter visual-mode map so campaign Levels 51–100 use a new `lanternwood` production mode while Daily stays neutral, Chapter 1 stays Sunpetal, Level 101 stays outside this rollout, and Level 366 keeps its Aurora override. (2) Build five quiet Lanternwood waypoint surfaces using desaturated timber/forest materials, deep perimeter silhouettes, and warm lantern accents outside rule space; keep the shared selected-piece/matching-nest hierarchy and mechanic grammar unchanged. (3) Give the Chapter 2 relationship a recurring visual identifier without expanding the core cast: a porch with **twin amber lanterns**. Introduce that motif in Chapter 2 story copy/Atlas landmarking, carry the same motif into the existing Across the Drift familiar-porch production scene, and update the durable Story Bible accordingly. (4) Replace Level 100's generic chapter-end result with a dedicated Lanternwood reward that visibly reconnects the twin-lantern porch, makes stars secondary, offers `Visit Little Home` and `Continue to Lodestone`, and focuses the existing canonical visitor pennant on Little Home with reduced-motion-safe behavior. (5) Improve the Chapter 2 Atlas movement-3 landmark so the relationship is visually foreshadowed rather than existing only as prose. (6) Bump only the cache keys needed for changed production surfaces.

          **Expected product files/systems:** `game400-a.js`, `game400-b.js`, `style400-production-slice.css`, `style400-skyway-atlas.css`, `story400.js`, `story-grounding400.js`, `STORY_BIBLE.md`, `cinematics400.js`, `title-island-concepts/index.html`, and `index.html`; plus temporary self-removing validation helpers. Campaign definitions `campaign400-1.js` through `campaign400-8.js`, authored solutions, movement simulation/rules, audio, and chapters outside the small continuity references above are protected from behavioral change.

          **Validation plan:** Hash-protect all eight campaign definition files and unrelated gameplay/story systems before candidate application. Run syntax/static assertions and a Chromium matrix covering Chapter 2 Levels 51/60/61/70/71/80/81/90/91/100 at 390x844, Levels 51/100 at 320x568, Daily isolation on a Chapter 2 board, Chapter 1 boundary Level 50, untouched Level 101, and Aurora Level 366. Assert all Chapter 2 campaign levels map to `lanternwood`; each of five board ranges has a distinct quiet linear material; pseudo-decoration cannot masquerade as mechanics; selected piece/matching nest remains explicit; controls/viewport remain contained and >=44px; no browser errors occur; and protected hashes remain unchanged. Verify Chapter 2 and later Prism story copy share the twin-amber-lantern motif, the Chapter 2 Atlas movement-3 view exposes the recognizable porch landmark, the Across the Drift porch renders the same paired lights, and solving the real authored Level 100 route produces the dedicated reward. `Visit Little Home` must reveal/focus the canonical visitor pennant and reduced-motion mode must land on the same informative state. Capture phone screenshots for all five Lanternwood ranges, Level 100 reward, Little Home pennant payoff, the Atlas porch landmark, and the later porch continuity proof, then manually inspect the evidence before promotion/closeout.

          **Deployment plan:** This IN PROGRESS entry must be committed before any product edit. Implement through a validation-only candidate first, promote only after source hashes, browser assertions, and manual screenshots are accepted, remove all temporary helpers, confirm GitHub Pages on a clean product head, then close this same entry as COMPLETED/PARTIAL/BLOCKED with exact commits/runs/artifacts and the next Pass 3 action.
          ''')
          s=s.replace(marker,marker+entry,1)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Begin Pass 3 Chapter 2 Lanternwood application"
          git push
      - name: Self-remove starter
        run: |
          git pull --rebase
          git rm .github/workflows/start-chapter2-pass3.yml
          git commit -m "Remove Chapter 2 Pass 3 starter"
          git push