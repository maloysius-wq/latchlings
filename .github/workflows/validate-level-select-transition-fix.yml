name: Validate Level Select transition cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.head_commit.message == 'Validate Level Select transition cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        shell: bash
        run: |
          sha256sum game400-b.js sfx400.js music400.js index.html style400-ui.css style400-game.css style400-themes.css style400-skyway-atlas.css style400-atlas-progression.css style400-board-surfaces.css story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/level-select-protected.sha
      - name: Apply candidate fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/tmp/apply-level-select-transition-fix.py
          node --check game400-a.js
          git diff --check
          git diff -- game400-a.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve candidate
        shell: bash
        run: python3 -m http.server 4173 >/tmp/latchlings-level-select-fix-http.log 2>&1 &
      - name: Browser-check Level Select reuse
        shell: bash
        run: |
          mkdir -p level-select-fix-audit
          node .github/tmp/validate-level-select-fix.mjs
      - name: Verify protected source unchanged
        shell: bash
        run: sha256sum -c /tmp/level-select-protected.sha
      - name: Commit accepted fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game400-a.js
          git commit -m 'Clear completed screen transition effects'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: level-select-transition-fix-audit
          path: level-select-fix-audit
          if-no-files-found: warn
      - name: Self-remove validation helpers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --ff-only origin main
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-level-select-transition-fix.yml .github/tmp/apply-level-select-transition-fix.py .github/tmp/validate-level-select-fix.mjs
          git commit -m 'Remove Level Select fix validation helpers'
          git push
