name: Apply Story Card And Chapter Art Overhaul

on:
  push:
    paths:
      - '.github/workflows/apply-story-theme-overhaul.yml'
      - '.github/scripts/apply_story_theme_overhaul.py'
      - '.github/scripts/fix_story_theme_overhaul.py'
      - '.github/scripts/validate_story_theme_overhaul.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply product integration
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_story_theme_overhaul.py
          python3 .github/scripts/fix_story_theme_overhaul.py

      - name: Vendor and optimize CC0 texture pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/textures /tmp/latchlings-textures
          cp title-island-concepts/textures/grass.jpg /tmp/latchlings-textures/grass.jpg
          cp title-island-concepts/textures/earth.jpg /tmp/latchlings-textures/earth.jpg
          cp title-island-concepts/textures/wood.jpg /tmp/latchlings-textures/wood.jpg
          fetch_texture(){
            local one="$1" four="$2" out="$3"
            if ! curl -fL --retry 3 --retry-delay 2 "$one" -o "$out"; then
              curl -fL --retry 3 --retry-delay 2 "$four" -o "$out"
            fi
          }
          fetch_texture \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/fabric_pattern_07/fabric_pattern_07_col_1_1k.jpg' \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/fabric_pattern_07/fabric_pattern_07_col_1_4k.jpg' \
            /tmp/latchlings-textures/fabric-market.jpg
          fetch_texture \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/cobblestone_color/cobblestone_color_diff_1k.jpg' \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/cobblestone_color/cobblestone_color_diff_4k.jpg' \
            /tmp/latchlings-textures/cobblestone.jpg
          fetch_texture \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/book_pattern/book_pattern_col1_1k.jpg' \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/book_pattern/book_pattern_col1_4k.jpg' \
            /tmp/latchlings-textures/bookcloth.jpg
          fetch_texture \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/metal_plate/metal_plate_diff_1k.jpg' \
            'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/4k/metal_plate/metal_plate_diff_4k.jpg' \
            /tmp/latchlings-textures/metal-plate.jpg
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageEnhance
          from pathlib import Path
          src=Path('/tmp/latchlings-textures');out=Path('assets/textures')
          jobs=[
            ('grass.jpg','grass.webp',.92,1.00),('earth.jpg','earth.webp',.92,1.00),('wood.jpg','wood.webp',.94,.98),
            ('fabric-market.jpg','fabric-market.webp',.86,.96),('cobblestone.jpg','cobblestone.webp',.88,.92),
            ('bookcloth.jpg','bookcloth.webp',.90,.92),('metal-plate.jpg','metal-plate.webp',.84,.88)
          ]
          for inp,name,sat,contrast in jobs:
              im=Image.open(src/inp).convert('RGB').resize((512,512),Image.Resampling.LANCZOS)
              im=ImageEnhance.Color(im).enhance(sat)
              im=ImageEnhance.Contrast(im).enhance(contrast)
              im.save(out/name,'WEBP',quality=72,method=6)
              print(name,(out/name).stat().st_size)
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check story400.js
          node --check game400-a.js
          node --check game400-b.js
          node --check story-theme400.js
          node - <<'NODE'
          global.window=global;
          require('./story400.js');
          const s=global.LATCHLINGS_STORY;
          const rows=Array.from({length:400},(_,i)=>s.levelMeta(i+1));
          if(rows.length!==400||rows.some(x=>!x.title||!x.context||!x.mechanic||!x.location))throw new Error('Story metadata incomplete');
          if(new Set(rows.map(x=>x.chapter+':'+x.title)).size!==400)throw new Error('Story titles not unique');
          if(s.chapters.length!==8)throw new Error('Story chapter count changed');
          console.log('STORY_400_OK');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          index=Path('index.html').read_text();ga=Path('game400-a.js').read_text();css=Path('style400-story-theme.css').read_text();js=Path('story-theme400.js').read_text();credits=Path('ART_ASSET_CREDITS.md').read_text()
          for token in ['style400-story-theme.css','id="storyCardBtn"','id="levelProps"','id="storyCardOverlay"','story-theme400.js','chapterMaterialBackdrop']:
              assert token in index, token
          for token in ['mechanic-chip-label','LatchlingsStoryTheme.decorateLevel','LatchlingsStoryTheme.enterLevel']:
              assert token in ga, token
          assert 'storyMeta.title}</strong><span>${storyMeta.context}' not in ga
          for token in ['latchlings_story_cards_seen_v1','function decorateLevel','function enterLevel','storyCardOverlay','decorFor','ICONS']:
              assert token in js, token
          for token in ['assets/textures/grass.webp','assets/textures/fabric-market.webp','assets/textures/cobblestone.webp','assets/textures/bookcloth.webp','assets/textures/metal-plate.webp']:
              assert token in css, token
          assert 'http://' not in css and 'https://' not in css and 'http://' not in js and 'https://' not in js
          names=['grass.webp','earth.webp','wood.webp','fabric-market.webp','cobblestone.webp','bookcloth.webp','metal-plate.webp']
          for name in names:
              p=Path('assets/textures')/name
              assert p.exists(),name
              im=Image.open(p);assert im.size==(512,512),(name,im.size)
              assert p.stat().st_size<300000,(name,p.stat().st_size)
          for token in ['Grass005','Ground085','Wood093','Fabric Pattern 07','Cobblestone Color','Book Pattern','Metal Plate','CC0']:
              assert token in credits,token
          print('STORY_THEME_STATIC_OK')
          PY
          git diff --exit-code -- campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js

      - name: Install Chromium validation outside repository
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/story-theme-node"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and rendered chapter review
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/story-theme-node"
          mkdir -p story-theme-renders
          python3 -m http.server 8138 >/tmp/story-theme-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cp .github/scripts/validate_story_theme_overhaul.mjs "$TEST_NODE/validate_story_theme_overhaul.mjs"
          timeout 150s node "$TEST_NODE/validate_story_theme_overhaul.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: story-theme-overhaul-renders
          path: story-theme-renders/*.png
          if-no-files-found: error

      - name: Commit validated implementation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf story-theme-renders
          rm -f .github/workflows/apply-story-theme-overhaul.yml .github/scripts/apply_story_theme_overhaul.py .github/scripts/fix_story_theme_overhaul.py .github/scripts/validate_story_theme_overhaul.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game400-a.js story-theme400.js style400-story-theme.css ART_ASSET_CREDITS.md assets/textures .github/workflows/apply-story-theme-overhaul.yml .github/scripts/apply_story_theme_overhaul.py .github/scripts/fix_story_theme_overhaul.py .github/scripts/validate_story_theme_overhaul.mjs
          git commit -m 'Add story cards and textured chapter art'
          git pull --rebase origin main
          git push origin HEAD:main
