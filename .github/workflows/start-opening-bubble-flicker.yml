name: Start opening bubble flicker handoff
on:
  push:
    paths:
      - '.github/workflows/start-opening-bubble-flicker.yml'
permissions:
  contents: write
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add IN PROGRESS handoff entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          marker='## Current Work\n'
          entry='''\n### 2026-09-11 — Remove opening-scene dialogue bubble flicker\n\n**Status: IN PROGRESS**\n\n**User goal:** Fix weird flickering affecting some speech/chat bubbles in the opening scene while preserving the intended dialogue and cinematic pacing.\n\n**Diagnosis / implementation plan:** Audit the interaction between `cinematics400.js` beat rendering, `cinematic-dialogue400.js` mutation-driven dialogue injection, and the cinematic dialogue/geometry CSS. Reproduce the flicker in Chromium and instrument bubble DOM lifecycle, opacity, geometry, and computed animation/transition state across every opening beat. Make stable speech bubbles idempotent so they are not repeatedly recreated, hidden, or composition-jittered during one beat. Preserve dialogue content, beat timing, advance/skip behavior, character presentation, and reduced-motion handling.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, likely `cinematic-dialogue400.js` and/or cinematic dialogue/geometry CSS, optionally `index.html` only for cache freshness, plus temporary self-removing browser-validation helpers. Gameplay, audio, Little Home choreography, Atlas, board surfaces, and campaign data are out of scope.\n\n**Validation plan:** Run the exact opening cinematic at 390×844 at DPR 1 and DPR 3; observe every speech bubble through stable display windows and fail on duplicate visible bubbles, repeated node replacement during a beat, transient opacity drops, geometry jumps, or page errors. Capture timing/geometry telemetry and frame-strip screenshots around dialogue-heavy beats. Smoke-test Continue, Skip, and reduced-motion behavior, and verify protected non-cinematic sources remain byte-identical.\n\n**Deployment plan:** Commit this IN PROGRESS entry before product edits, validate the candidate through a temporary self-removing GitHub Actions browser workflow, deploy the accepted clean state to GitHub Pages, then close this entry with exact commits/runs/artifacts and verify only the permanent repository-access guard remains.\n\n'''
          if '### 2026-09-11 — Remove opening-scene dialogue bubble flicker' not in s:
              s=s.replace(marker,marker+entry,1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Start opening bubble flicker handoff'
          git push
      - name: Self-remove starter
        shell: bash
        run: |
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/start-opening-bubble-flicker.yml
          git commit -m 'Remove opening bubble flicker starter'
          git push