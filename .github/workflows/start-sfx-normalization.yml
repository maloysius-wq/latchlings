name: Start SFX Normalization Handoff

on:
  push:
    paths:
      - '.github/workflows/start-sfx-normalization.yml'

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record IN PROGRESS handoff and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          text=p.read_text()
          title='### 2026-09-05 — Nest and victory SFX loudness normalization'
          if title not in text:
              entry='''### 2026-09-05 — Nest and victory SFX loudness normalization\n\n**Status: IN PROGRESS**\n\n**User goal:** Normalize the successful-nest and level-win sound effects because they are extremely loud and piercing relative to the rest of the game mix.\n\n**Implementation plan:** Tune only the event-specific playback for the nest-capture and ordinary level-clear cues in `sfx400.js`, preserving the master Sound Effects setting and every unrelated cue. Account for the fact that the final nest currently triggers `capture.wav` and then `level-clear.wav` shortly afterward, so the win moment can stack two bright confirmation sounds. Reduce their event gains to sit near the restrained movement/UI mix and increase the level-clear delay enough to avoid piling its main transient directly on top of the nest-capture transient. Do not alter source WAV files, pitch, playback rate, campaign rules, or gameplay timing.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md` and `sfx400.js`; a temporary self-removing GitHub Actions validation workflow if needed. No campaign, story, visual, music, or source-audio asset changes are expected.\n\n**Validation plan:** Verify the exact runtime definitions and call sequence, statically assert the reduced capture/clear gains and non-overlapping clear delay, run a browser smoke test that loads production scripts without console/page errors and exercises the exposed `LatchlingsSFX` methods, and confirm no unrelated SFX definitions changed. Because headless CI cannot make a trustworthy psychoacoustic judgment, use the existing mix levels and the known 324 ms capture duration as the engineering reference, with conservative gain reductions rather than muting either cue.\n\n**Deployment plan:** Deploy the accepted product commit through GitHub Pages, verify the deployment succeeds, remove every temporary workflow, confirm `validate-repository-access-guard.yml` is the only durable workflow, then close this same handoff entry as COMPLETED/PARTIAL/BLOCKED with exact values, commits, validation, deployment run, remaining risk, and next action.\n\n---\n\n'''
              marker='## Current Work\n\n'
              if marker not in text:
                  raise SystemExit('Current Work marker missing')
              text=text.replace(marker, marker+entry, 1)
              p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "Record SFX normalization handoff"
            git push
          fi
          git pull --ff-only origin main
          rm -f .github/workflows/start-sfx-normalization.yml
          git add .github/workflows/start-sfx-normalization.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove SFX handoff helper"
            git push
          fi
