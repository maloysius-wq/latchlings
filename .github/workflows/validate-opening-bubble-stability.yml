name: Validate opening bubble stability
on:
  push:
    paths:
      - '.github/workflows/validate-opening-bubble-stability.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        shell: bash
        run: |
          sha256sum style400-game.css game400-a.js game400-b.js sfx400.js music400.js style400-ui.css style400-themes.css style400-skyway-atlas.css style400-atlas-progression.css style400-board-surfaces.css style400-cinematics.css style400-cinematics-polish.css style400-cinematics-refine.css style400-cinematics-refine2.css style400-cinematics-dialogue.css style400-cinematics-geometry.css cinematics400.js story400.js story-grounding400.js campaign400-*.js title-island-concepts/index.html > /tmp/opening-bubble-protected.sha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Apply stability candidate
        shell: bash
        run: |
          python3 .github/tmp/apply-opening-bubble-stability.py
          git diff --check
          grep -q "overlay.dataset.visual!==beat.visual" cinematic-dialogue400.js
          grep -q "LatchingCinematicGeometry" cinematic-dialogue400.js && exit 1 || true
          grep -q "LatchlingsCinematicGeometry?.normalizeDialogue(stage)" cinematic-dialogue400.js
          if grep -q "lastDialoguePass" cinematic-geometry400.js; then exit 1; fi
          if grep -q "removeProperty('--cin-bubble-height')" cinematic-geometry400.js; then exit 1; fi
          if grep -q "time-lastDialoguePass" cinematic-geometry400.js; then exit 1; fi
          grep -q "lastDialogueLayer" cinematic-geometry400.js
          grep -q "bubblestable1" index.html
      - name: Serve candidate
        shell: bash
        run: python3 -m http.server 4173 >/tmp/opening-bubble-stability-http.log 2>&1 &
      - name: Browser-check all opening dialogue
        shell: bash
        run: |
          node .github/tmp/validate-opening-bubble-stability.mjs
          echo OPENING_BUBBLE_STABILITY_ACCEPTED
      - name: Verify protected source unchanged
        shell: bash
        run: sha256sum -c /tmp/opening-bubble-protected.sha
      - name: Commit accepted product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cinematic-dialogue400.js cinematic-geometry400.js index.html
          git commit -m 'Stabilize opening dialogue bubbles'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: opening-bubble-stability-audit
          path: opening-bubble-stability-audit
      - name: Self-remove validation helpers
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/validate-opening-bubble-stability.yml .github/tmp/apply-opening-bubble-stability.py .github/tmp/validate-opening-bubble-stability.mjs
          git commit -m 'Remove opening bubble stability validator'
          git push