name: Correct Cinematic Audit Timing
on:
  push:
    paths:
      - '.github/workflows/fix-cinematic-audit.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct settled-state waits
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/audit-campaign-cinematics.yml')
          s=p.read_text()
          needle='''            await page.waitForSelector('#cinematicOverlay.show[data-cinematic="opening"]');\n            const first='''
          repl='''            await page.waitForSelector('#cinematicOverlay.show[data-cinematic="opening"]');\n            await page.waitForFunction(()=>document.body.dataset.screen==='game');\n            const first='''
          if s.count(needle)!=1:
              raise SystemExit(f'opening settle insertion count {s.count(needle)}')
          s=s.replace(needle,repl)
          old="await page.waitForSelector('#cinematicOverlay:not(.show)');"
          count=s.count(old)
          if count!=3:
              raise SystemExit(f'hidden-overlay wait replacement count {count}')
          s=s.replace(old,"await page.waitForFunction(()=>!document.getElementById('cinematicOverlay').classList.contains('show'));" )
          p.write_text(s)
          PY
          grep -q "document.body.dataset.screen==='game'" .github/workflows/audit-campaign-cinematics.yml
          test "$(grep -o "waitForFunction(()=>!document.getElementById('cinematicOverlay').classList.contains('show'))" .github/workflows/audit-campaign-cinematics.yml | wc -l)" -eq 3
      - name: Commit audit correction and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-cinematic-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/audit-campaign-cinematics.yml .github/workflows/fix-cinematic-audit.yml
          git commit -m 'Correct cinematic audit settled-state waits'
          git pull --rebase origin main
          git push origin HEAD:main
