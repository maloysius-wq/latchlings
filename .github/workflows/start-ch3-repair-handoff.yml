name: Start Chapter 3 Repair Handoff

on:
  push:
    paths:
      - '.github/workflows/start-ch3-repair-handoff.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record critical repair before implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          text=p.read_text()
          text=text.replace('Last updated: 2026-08-31','Last updated: 2026-09-02',1)
          marker='## Current Work\n\n'
          entry='''### 2026-09-02 — Repair missing Chapter 3 campaign data\n\n**Status: IN PROGRESS**\n\n**User goal:** Continue Latchlings from the current repository, but fix critical handoff issues before feature work. The highest-severity issue is the live runtime reference to missing `campaign400-3.js`, which leaves Levels 101–150 absent.\n\n**Implementation plan:** Rebuild Chapter 3 as 50 frozen, deterministic Lodestone Caverns boards using the shipping movement semantics. Chapter 3 will focus on anchors while retaining rocks and movable-Latchling stopper logic, with a brief introduction followed by sustained medium/hard play and an expert tail. Every generated board must have a stored shortest solution, use at least one anchor on that shortest route, keep all starts/nests/rocks/anchors exclusive, and avoid later-chapter mechanics.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, new `campaign400-3.js`, and a temporary self-removing repository validator. Production title-screen concept files remain unchanged until this critical repair is complete.\n\n**Validation plan:** Validate Chapter 3 IDs 101–150, compact-data schema, unique/exclusive cells, no nest/object overlap, stored solution replay, move limits, anchor use on shortest solutions, solver-confirmed optimality, difficulty progression, JavaScript loading, and then validate the full 400-level campaign references so `index.html` has no missing campaign script.\n\n**Deployment plan:** Commit `campaign400-3.js`, run the repository-backed validator, confirm the Pages build for the repaired head, then mark this entry COMPLETED with commit/run details before resuming title-screen feature work.\n\n---\n\n'''
          if '### 2026-09-02 — Repair missing Chapter 3 campaign data' not in text:
              text=text.replace(marker,marker+entry,1)
          p.write_text(text)
          PY
          rm -f .github/workflows/start-ch3-repair-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-ch3-repair-handoff.yml
          git commit -m 'Record Chapter 3 critical repair in handoff'
          git pull --rebase origin main
          git push origin HEAD:main
