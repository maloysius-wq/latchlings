name: Validate single Atlas traveler
on:
  push:
    paths:
      - '.github/workflows/remove-static-atlas-guide.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        run: sha256sum story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/protected-before.sha
      - name: Remove static Atlas guide injection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game400-a.js')
          s=p.read_text()
          old="pennant=current?`<span class=\"atlas-pennant\">${rewardSource?'Route restored':done?'Latest stop':'Next stop'}</span>${atlasGuideHtml(chapterView)}`:'';"
          new="pennant=current?`<span class=\"atlas-pennant\">${rewardSource?'Route restored':done?'Latest stop':'Next stop'}</span>`:'';"
          if old not in s:
              raise SystemExit('static Atlas guide injection not found')
          s=s.replace(old,new,1)
          if s.count('atlasGuideHtml(') != 2:
              raise SystemExit(f'unexpected atlasGuideHtml call count after patch: {s.count("atlasGuideHtml(")}')
          p.write_text(s)
          PY
          node --check game400-a.js
          node --check game400-b.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve candidate
        run: python3 -m http.server 4173 >/tmp/latchlings-single-traveler-http.log 2>&1 &
      - name: Validate single-traveler behavior
        shell: bash
        run: |
          mkdir -p single-traveler-audit
          cat > single-traveler-check.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const failures=[];
          const check=(ok,msg)=>{if(!ok){console.error('FAIL',msg);failures.push(msg)}};
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.evaluate(()=>{progress={unlocked:2,stars:{1:3}};saveProgress();chapterView=1;rangeView=0;screen('levels');renderChapter()});
          check(await page.locator('#levelGrid .atlas-guide').count()===0,'normal Atlas still renders a static guide');
          await page.screenshot({path:'single-traveler-audit/normal-atlas.png',fullPage:true});

          await page.evaluate(()=>{currentLevel=1;progress={unlocked:2,stars:{1:3}};saveProgress();queueAtlasReward(1,2,3);playQueuedAtlasReward(false)});
          await page.waitForTimeout(720);
          let guides=await page.locator('#levelGrid .atlas-guide').count();
          let travelerGuides=await page.locator('#levelGrid .atlas-travel-token > .atlas-guide').count();
          check(guides===1,`1→2 expected exactly one guide during travel, found ${guides}`);
          check(travelerGuides===1,'1→2 visible guide is not the animated traveler');
          check(await page.locator('#levelGrid .atlas-node .atlas-guide').count()===0,'1→2 contains a static node guide');
          await page.screenshot({path:'single-traveler-audit/1-to-2-moving.png',fullPage:true});
          await page.waitForTimeout(1700);
          check(await page.locator('#levelGrid .atlas-guide').count()===0,'Level Select reward leaves a static guide behind after arrival');

          await page.evaluate(()=>{currentLevel=10;progress={unlocked:11,stars:{10:3}};saveProgress();queueAtlasReward(10,11,3);playQueuedAtlasReward(false)});
          await page.waitForTimeout(1450);
          guides=await page.locator('#levelGrid .atlas-guide').count();
          travelerGuides=await page.locator('#levelGrid .atlas-travel-token > .atlas-guide').count();
          check(guides===1,`10→11 expected exactly one guide during destination travel, found ${guides}`);
          check(travelerGuides===1,'10→11 visible guide is not the animated traveler');
          check(await page.locator('#levelGrid .atlas-node .atlas-guide').count()===0,'10→11 contains a static node guide');
          await page.screenshot({path:'single-traveler-audit/10-to-11-moving.png',fullPage:true});
          await page.waitForTimeout(1750);
          check(await page.locator('#levelGrid .atlas-guide').count()===0,'10→11 leaves a static guide behind after arrival');

          await page.evaluate(()=>{currentLevel=1;progress={unlocked:2,stars:{1:3}};saveProgress();queueAtlasReward(1,2,3);playQueuedAtlasReward(true)});
          await page.waitForTimeout(2450);
          check(await page.evaluate(()=>document.body.dataset.screen)==='game','Next Level no longer auto-continues after reward');
          check(await page.evaluate(()=>currentLevel)===2,'Next Level did not advance to Level 2');

          const reduced=await browser.newPage({viewport:{width:320,height:568}});
          await reduced.emulateMedia({reducedMotion:'reduce'});
          await reduced.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await reduced.evaluate(()=>{currentLevel=1;progress={unlocked:2,stars:{1:3}};saveProgress();queueAtlasReward(1,2,3);playQueuedAtlasReward(false)});
          await reduced.waitForTimeout(220);
          check(await reduced.locator('#levelGrid .atlas-node .atlas-guide').count()===0,'reduced-motion path renders a static node guide');
          await reduced.screenshot({path:'single-traveler-audit/reduced-motion.png',fullPage:true});

          fs.writeFileSync('single-traveler-audit/report.json',JSON.stringify({failures,accepted:failures.length===0},null,2));
          await browser.close();
          if(failures.length)throw new Error(`single traveler validation failed: ${failures.length}`);
          console.log('SINGLE_ATLAS_TRAVELER_ACCEPTED');
          JS
          node single-traveler-check.mjs
      - name: Verify protected source unchanged
        run: sha256sum -c /tmp/protected-before.sha
      - name: Commit accepted product
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json single-traveler-check.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game400-a.js
          git commit -m 'Keep only animated Atlas traveler'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-atlas-traveler-renders
          path: single-traveler-audit
          if-no-files-found: warn
      - name: Self-remove validator
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --ff-only origin main
          git rm .github/workflows/remove-static-atlas-guide.yml
          git commit -m 'Remove single Atlas traveler validator'
          git push
