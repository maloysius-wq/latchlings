name: Build Skyway Atlas V3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-skyway-atlas-v3.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recreate V2 candidate from recorded build recipe
        shell: bash
        run: |
          set -euo pipefail
          git show c1d9da2e983c794c40f1fd69f9be1a156fadd978:.github/workflows/build-skyway-atlas-v2.yml > /tmp/v2.yml
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml,subprocess
          d=yaml.safe_load(open('/tmp/v2.yml'))
          wanted=['Recreate accepted design candidate from V1 source','Refine atlas composition and chapter scenery']
          by={s.get('name'):s.get('run') for s in d['jobs']['build']['steps'] if isinstance(s,dict) and s.get('run')}
          for name in wanted:
              script=by.get(name)
              if not script: raise SystemExit(f'missing historical V2 step {name}')
              print(f'--- running {name} ---',flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Refine world-first composition and compact layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('style400-skyway-atlas.css');s=p.read_text()
          # V2 fixed the normal six-row shell, but its <=720px override still had the old five-row bug.
          s=s.replace('.atlas-shell{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom));gap:4px;grid-template-rows:auto auto auto minmax(0,1fr) auto}', '.atlas-shell{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom));gap:4px;grid-template-rows:auto auto auto auto minmax(0,1fr) auto}',1)
          # The route itself should read as the world, not another rounded dashboard card.
          s += r'''

          /* V3 world-first refinement: the playable route field bleeds through the center instead of living in another card. */
          .atlas-map{margin-left:-12px;margin-right:-12px;border:0;border-radius:0;box-shadow:none;background:transparent;overflow:hidden}
          .atlas-map:after{background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 16%,transparent 88%,rgba(255,255,255,.04))}
          .atlas-scene{border-radius:0}
          .atlas-route-caption{left:18px;top:10px;border-radius:10px;background:rgba(18,43,64,.38);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 3px 8px rgba(16,38,55,.08)}
          .atlas-waypoint-tab{background:rgba(255,255,255,.16);box-shadow:inset 0 -1px rgba(255,255,255,.15);border-radius:12px}
          .atlas-waypoint-tab:not(.active){backdrop-filter:blur(2px)}
          .atlas-waypoint-tab.active{border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.82),var(--atlas-accent-soft,#dff1ae));box-shadow:0 4px 10px rgba(25,48,68,.12),inset 0 0 0 1px rgba(255,255,255,.68)}
          @media(max-height:720px){.atlas-map{margin-left:-12px;margin-right:-12px}.atlas-route-caption{left:14px}}
          @media(max-width:340px){.atlas-map{margin-left:-7px;margin-right:-7px}}
          '''
          p.write_text(s)
          PY
          sha256sum campaign400-*.js > /tmp/campaign-v3.sha
          git show 14ca47db00b40ceb4d73c3a9e188de51b655a695:campaign400-1.js | sha256sum >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve
        shell: bash
        run: python3 -m http.server 4173 >/tmp/atlas-http.log 2>&1 &
      - name: Deep functional visual and accessibility audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atlas-audit/hero atlas-audit/standard atlas-audit/responsive atlas-audit/states
          cat > atlas-check.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'fs';
          const browser=await chromium.launch({headless:true});const failures=[],report=[];const fail=m=>{failures.push(m);console.error('FAIL',m)};
          async function setProgress(page,unlocked,stars={}){await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.evaluate(x=>localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify(x)),{unlocked,stars});await page.reload({waitUntil:'networkidle'});await page.waitForFunction(()=>window.LatchlingsHomeAction);await page.evaluate(()=>window.LatchlingsHomeAction('levels'));await page.waitForTimeout(720)}
          async function inspect(page,label){const m=await page.evaluate(()=>{const screen=document.getElementById('levels'),map=document.getElementById('levelGrid').getBoundingClientRect(),c=document.getElementById('continueBtn').getBoundingClientRect(),v={w:innerWidth,h:innerHeight},nodes=[...document.querySelectorAll('.atlas-node')].map(n=>{const r=n.getBoundingClientRect();return{level:+n.dataset.level,w:r.width,h:r.height,l:r.left,r:r.right,t:r.top,b:r.bottom,locked:n.disabled,current:n.classList.contains('current'),label:n.getAttribute('aria-label')}});return{map:{l:map.left,r:map.right,t:map.top,b:map.bottom,w:map.width,h:map.height},c:{l:c.left,r:c.right,t:c.top,b:c.bottom,w:c.width,h:c.height,text:document.getElementById('continueBtn').textContent},v,nodes,routes:document.querySelectorAll('.atlas-route').length,shadows:document.querySelectorAll('.atlas-route-shadow').length,chapters:document.querySelectorAll('.atlas-region-dot').length,waypoints:document.querySelectorAll('.atlas-waypoint-tab').length,scene:document.querySelectorAll('.atlas-scene').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth||document.body.scrollWidth>document.body.clientWidth,texture:getComputedStyle(screen).getPropertyValue('--atlas-texture'),header:document.querySelector('.atlas-chapter-head')?.textContent||'',mapLabel:document.getElementById('levelGrid').getAttribute('aria-label')}});if(m.routes!==9||m.shadows!==9)fail(`${label} route construction ${m.routes}/${m.shadows}`);if(m.chapters!==8||m.waypoints!==5||m.scene!==1)fail(`${label} navigation/scenery structure`);if(m.overflow)fail(`${label} horizontal overflow`);if(!m.texture.includes('assets/level-select/'))fail(`${label} texture missing`);if(m.c.h<44||m.c.l<-1||m.c.r>m.v.w+1||m.c.b>m.v.h+1||m.c.t<0)fail(`${label} Continue bounds ${JSON.stringify(m.c)}`);if(m.map.h<235)fail(`${label} map too short ${m.map.h}`);for(const n of m.nodes){if(n.w<44||n.h<44)fail(`${label} level ${n.level} target too small ${n.w}x${n.h}`);if(!n.label)fail(`${label} level ${n.level} lacks accessible label`);if(n.l<m.map.l-24||n.r>m.map.r+24||n.t<m.map.t-25||n.b>m.map.b+25)fail(`${label} level ${n.level} outside map ${JSON.stringify(n)}`)}report.push({label,...m});return m}
          const allStars={};for(let i=1;i<=400;i++)allStars[i]=3;
          // Every chapter and every 10-level stretch at the primary phone viewport.
          const standard=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'no-preference'});await setProgress(standard,400,allStars);for(let ch=1;ch<=8;ch++){await standard.locator(`.atlas-region-dot[data-ch="${ch}"]`).click();await standard.waitForTimeout(100);for(let r=0;r<5;r++){await standard.locator(`.atlas-waypoint-tab[data-range="${r}"]`).click();await standard.waitForTimeout(100);await inspect(standard,`390x844 ch${ch} r${r+1}`);await standard.screenshot({path:`atlas-audit/standard/ch${ch}-r${r+1}.png`,fullPage:true})}}
          // Current-route hero state for every chapter, so restored/current/future/cloud states are all visible.
          for(let ch=1;ch<=8;ch++){const hero=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'no-preference'}),start=(ch-1)*50+1,current=start+6,stars={};for(let i=1;i<current;i++)stars[i]=(i%3)+1;await setProgress(hero,current,stars);await hero.locator(`.atlas-region-dot[data-ch="${ch}"]`).click();await hero.locator('.atlas-waypoint-tab[data-range="0"]').click();await hero.waitForTimeout(150);const m=await inspect(hero,`hero ch${ch}`);if(!m.nodes.find(n=>n.level===current)?.current)fail(`hero ch${ch} missing current level`);if(m.nodes.filter(n=>n.locked).length!==4)fail(`hero ch${ch} wrong future cloud count`);await hero.screenshot({path:`atlas-audit/hero/ch${ch}.png`,fullPage:true});await hero.close()}
          // Responsive matrix, including the short 700px screen that exposed the V2 media-query row bug.
          for(const [w,h] of [[320,568],[360,640],[390,700],[430,932]]){const p=await browser.newPage({viewport:{width:w,height:h},reducedMotion:'no-preference'});await setProgress(p,47,Object.fromEntries(Array.from({length:46},(_,i)=>[i+1,(i%3)+1])));for(let r=0;r<5;r++){await p.locator(`.atlas-waypoint-tab[data-range="${r}"]`).click();await p.waitForTimeout(110);const m=await inspect(p,`${w}x${h} ch1 r${r+1}`);if(h>=640&&m.map.t>260)fail(`${w}x${h} map starts too low at ${m.map.t}`);await p.screenshot({path:`atlas-audit/responsive/${w}x${h}-r${r+1}.png`,fullPage:true})}await p.close()}
          // Fresh state semantics.
          const state=await browser.newPage({viewport:{width:390,height:700},reducedMotion:'reduce'});await setProgress(state,1,{});let m=await inspect(state,'fresh');if(!m.nodes.find(n=>n.level===1)?.current||m.nodes.filter(n=>n.locked).length!==9)fail('fresh current/locked state incorrect');await state.screenshot({path:'atlas-audit/states/fresh.png',fullPage:true});
          // Mid state, reset utility, unlocked node launch, Continue launch.
          const midStars={};for(let i=1;i<=16;i++)midStars[i]=(i%3)+1;await setProgress(state,17,midStars);await state.locator('.atlas-waypoint-tab[data-range="1"]').click();await state.waitForTimeout(120);m=await inspect(state,'mid17');if(!m.nodes.find(n=>n.level===17)?.current)fail('level17 current marker missing');if(!m.c.text.includes('17'))fail('Continue copy missing level17');await state.screenshot({path:'atlas-audit/states/mid17.png',fullPage:true});await state.locator('#resetProgressBtn').click();await state.waitForTimeout(80);if(!(await state.locator('#overlay.show #confirmReset').count()))fail('Reset confirmation unreachable');await state.locator('#cancelReset').click();await state.evaluate(()=>document.querySelector('.atlas-node[data-level="16"]').click());await state.waitForTimeout(160);if(!(await state.locator('#game.active').count())||(await state.locator('#levelTitle').textContent()).trim()!=='Level 16')fail('Level 16 launch failed');await state.evaluate(()=>{screen('levels');chapterView=1;rangeView=1;renderChapter()});await state.waitForTimeout(650);await state.evaluate(()=>document.getElementById('continueBtn').click());await state.waitForTimeout(160);if(!(await state.locator('#game.active').count())||(await state.locator('#levelTitle').textContent()).trim()!=='Level 17')fail('Continue launch failed');
          // Reduced motion.
          await state.evaluate(()=>{screen('levels');chapterView=1;rangeView=1;renderChapter()});await state.waitForTimeout(650);const anim=await state.evaluate(()=>({node:getComputedStyle(document.querySelector('.atlas-node')).animationName,route:getComputedStyle(document.querySelector('.atlas-route')).animationName,cloud:getComputedStyle(document.querySelector('.atlas-shell'),'::before').animationName,guide:getComputedStyle(document.querySelector('.atlas-guide')).animationName}));if(Object.values(anim).some(v=>v!=='none'))fail(`reduced motion active ${JSON.stringify(anim)}`);
          // Validate the decoded image, not an arbitrary compressed byte threshold. Blue Metal Plate is highly compressible.
          for(const a of ['sunpetal','lanternwood','lodestone','masquerade','prism','copperline','stormswitch','aurora']){const ok=await state.evaluate(a=>new Promise(resolve=>{const img=new Image();img.onload=()=>resolve(img.naturalWidth===512&&img.naturalHeight===512);img.onerror=()=>resolve(false);img.src=`assets/level-select/${a}.webp?v=${Date.now()}`}),a);if(!ok)fail(`texture ${a} failed 512x512 decode`)}
          fs.writeFileSync('atlas-audit/report.json',JSON.stringify({failures,report},null,2));await browser.close();if(failures.length)throw new Error(`Skyway Atlas V3 failed ${failures.length} checks`);console.log('SKYWAY_ATLAS_V3_ACCEPTED');
          JS
          node atlas-check.mjs
      - name: Verify campaign source is untouched
        shell: bash
        run: |
          set -euo pipefail
          for f in campaign400-*.js; do git diff --quiet HEAD -- "$f" || { echo "Campaign file changed: $f"; exit 1; }; done
      - name: Commit accepted product
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json atlas-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game400-a.js style400-skyway-atlas.css LEVEL_SELECT_ART_DIRECTION.md ART_ASSET_CREDITS.md assets/level-select/*.webp
          git commit -m "Rebuild Level Select as Skyway Atlas"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyway-atlas-v3-renders
          path: atlas-audit
          if-no-files-found: warn
      - name: Self-remove
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --ff-only origin main
          rm -f package.json package-lock.json atlas-check.mjs
          git rm .github/workflows/build-skyway-atlas-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Skyway Atlas v3 workflow"
          git push
