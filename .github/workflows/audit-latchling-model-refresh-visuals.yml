name: Audit Latchling Model Refresh Visuals
on:
  push:
    paths:
      - '.github/workflows/audit-latchling-model-refresh-visuals.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chromium
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/latchling-visual-audit"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Render clean production screens
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/latchling-visual-audit"
          cp tools/visual_audit_latchling_refresh.mjs "$TEST_NODE/audit.mjs"
          python3 -m http.server 8155 >/tmp/latchling-visual-audit-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cd "$TEST_NODE"
          mkdir -p clean-latchling-renders
          node audit.mjs
          cd "$GITHUB_WORKSPACE"
          mkdir -p clean-latchling-renders
          cp "$TEST_NODE"/clean-latchling-renders/*.png clean-latchling-renders/
      - uses: actions/upload-artifact@v4
        with:
          name: clean-latchling-model-refresh-renders
          path: clean-latchling-renders/*.png
          if-no-files-found: error
      - name: Self-remove audit tooling
        run: |
          set -euo pipefail
          rm -rf clean-latchling-renders
          rm -f tools/visual_audit_latchling_refresh.mjs .github/workflows/audit-latchling-model-refresh-visuals.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/visual_audit_latchling_refresh.mjs .github/workflows/audit-latchling-model-refresh-visuals.yml
          git commit -m 'Complete clean Latchling visual audit'
          git pull --rebase origin main
          git push origin HEAD:main
