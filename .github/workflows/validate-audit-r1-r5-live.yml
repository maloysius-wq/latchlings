name: Validate committed Astra audit R1-R5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-audit-r1-r5-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact accepted product and protected sources
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED=f241d816242f245c0ea41ad3c33dd9d496d7c849
          product=(
            style400-story-rail-board.css style400-story-theme.css style400-game.css
            gameplay-story-rail400.js game400-a.js game400-b.js
            title-island-concepts/index.html cinematics400.js style400-cinematics.css
            style400-cinematics-dialogue.css index.html
          )
          git diff --exit-code "$ACCEPTED" -- "${product[@]}"
          BASE=d6e39c0866505795c2aa6a26777896072e16e7df
          protected=(
            campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js
            campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
            story400.js story-grounding400.js STORY_BIBLE.md
            pass3-chapter5-prism.css pass3-chapter5-prism.js
            pass3-chapter6-copperline.css pass3-chapter6-copperline.js
            pass3-chapter7-stormswitch.css pass3-chapter7-stormswitch.js
            pass3-chapter8-aurora.css pass3-chapter8-aurora.js
          )
          git diff --exit-code "$BASE" -- "${protected[@]}"
          node --check game400-a.js
          node --check game400-b.js
          node --check gameplay-story-rail400.js
          node --check cinematics400.js
          grep -q 'html\[data-text-size="large"\] .modal p{font-size:18px' style400-game.css
          grep -q 'cinematic-footer' cinematics400.js
          grep -q 'littleHomeEffectiveReducedMotion' title-island-concepts/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium validation runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser committed-live R1-R5 acceptance
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME=.github/tmp/validate-audit-r1-r5-live-runtime.mjs
          cp .github/tmp/validate-audit-r1-r5.mjs "$RUNTIME"
          sed -i 's/window.__dummy=0;//' "$RUNTIME"
          sed -i 's/updateStoryScreen?\.()/window.updateStoryScreen?.()/g' "$RUNTIME"
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/tmp/validate-audit-r1-r5-live-runtime.mjs')
          t=p.read_text(encoding='utf-8')
          old="await settleGame(page,201);await page.click('#hintBtn');"
          new="await settleGame(page,201);await page.waitForTimeout(320);await page.evaluate(()=>window.LatchlingsStoryTheme?.close(false));await page.waitForTimeout(20);await page.click('#hintBtn');"
          if t.count(old)!=1: raise SystemExit(f'hint setup patch expected once, found {t.count(old)}')
          t=t.replace(old,new,1)
          if t.count("#pauseResume")!=1: raise SystemExit(f'pause selector expected once, found {t.count("#pauseResume")}')
          t=t.replace("#pauseResume","#resumeBtn",1)
          old="await p.evaluate(()=>window.LatchlingsCinematics.show('across-drift',{markSeen:false}));await p.waitForTimeout(160);const cin=await p.evaluate(()=>{const b=document.querySelector('.cin-ordered-dialogue-dock .cin-opening-bubble'),n=document.querySelector('.cinematic-lines .narrator-only');return {bubble:b?parseFloat(getComputedStyle(b).fontSize):0,narrator:n?parseFloat(getComputedStyle(n).fontSize):0}});"
          new="await p.evaluate(()=>window.LatchlingsCinematics.show('across-drift',{markSeen:false}));await p.waitForTimeout(160);const narrator=await p.evaluate(()=>{const n=document.querySelector('.cinematic-lines .narrator-only');return n?parseFloat(getComputedStyle(n).fontSize):0});await p.click('#cinematicNext');await p.waitForTimeout(180);const bubble=await p.evaluate(()=>{const b=document.querySelector('.cin-ordered-dialogue-dock .cin-opening-bubble')||document.querySelector('.cinematic-lines p.dialogue span');return b?parseFloat(getComputedStyle(b).fontSize):0});const cin={bubble,narrator};"
          if t.count(old)!=1: raise SystemExit(f'cinematic font probe expected once, found {t.count(old)}')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
          rm -rf /tmp/audit-r1-r5-evidence
          mkdir -p /tmp/audit-r1-r5-evidence
          python3 -m http.server 4173 -d . >/tmp/r1r5-live-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..40}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          node "$RUNTIME"
      - name: Package live evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/audit-r1-r5-evidence
          cp /tmp/r1r5-live-http.log /tmp/audit-r1-r5-evidence/http.log 2>/dev/null || true
          git rev-parse HEAD > /tmp/audit-r1-r5-evidence/head.txt
          git status --short > /tmp/audit-r1-r5-evidence/status.txt
      - name: Upload committed-live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-r1-r5-live-evidence
          path: /tmp/audit-r1-r5-evidence
          if-no-files-found: error
