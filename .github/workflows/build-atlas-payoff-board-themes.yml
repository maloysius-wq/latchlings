name: Build Atlas payoff and board surface system
on:
  push:
    paths:
      - '.github/workflows/build-atlas-payoff-board-themes.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        run: sha256sum story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/protected-before.sha
      - name: Apply candidate
        run: |
          python3 .github/tmp/atlas_payoff_apply.py
          python3 .github/tmp/atlas_payoff_refine.py
          node --check game400-a.js
          node --check game400-b.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve candidate
        run: python3 -m http.server 4173 >/tmp/latchlings-payoff-http.log 2>&1 &
      - name: Validate candidate
        run: |
          mkdir -p payoff-board-audit/boards payoff-board-audit/progression
          sed -i '0,/await p.waitForTimeout(600);/s//await p.waitForTimeout(760);/' .github/tmp/payoff_board_check.mjs
          node .github/tmp/payoff_board_check.mjs
      - name: Verify protected source unchanged
        run: sha256sum -c /tmp/protected-before.sha
      - name: Commit accepted product
        run: |
          rm -f package.json package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html game400-a.js game400-b.js style400-atlas-progression.css style400-board-surfaces.css
          git commit -m 'Restore Atlas journey payoff and theme board surfaces'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-payoff-board-theme-renders
          path: payoff-board-audit
          if-no-files-found: warn
      - name: Self-remove temporary validation files
        if: success()
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git rm .github/workflows/build-atlas-payoff-board-themes.yml .github/tmp/atlas_payoff_apply.py .github/tmp/atlas_payoff_refine.py .github/tmp/payoff_board_check.mjs
          git commit -m 'Remove Atlas payoff validation helpers'
          git push
