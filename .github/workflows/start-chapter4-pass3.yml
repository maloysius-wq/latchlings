name: Start Chapter 4 Pass 3 handoff

on:
  push:
    paths:
      - '.github/workflows/start-chapter4-pass3.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Chapter 4 Pass 3 work entry
        run: |
          python .github/tmp/start-chapter4-handoff.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Begin Chapter 4 Pass 3 rollout"
          git push
      - name: Self-remove starter
        run: |
          git pull --rebase
          git rm .github/workflows/start-chapter4-pass3.yml .github/tmp/start-chapter4-handoff.py
          git commit -m "Remove Chapter 4 Pass 3 starter"
          git push
