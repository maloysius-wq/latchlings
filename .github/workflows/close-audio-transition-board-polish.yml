name: Close audio transition board polish handoff
on:
  push:
    paths:
      - '.github/workflows/close-audio-transition-board-polish.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          title='### 2026-09-10 — Quieter SFX, slower screen transitions, and stronger puzzle-square identity'
          start=s.index(title)
          nxt=s.find('\n### ',start+len(title))
          if nxt<0: nxt=len(s)
          block=s[start:nxt]
          if '**Status: IN PROGRESS**' not in block:
              raise SystemExit('target handoff is not IN PROGRESS')
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary='''\n#### Completion summary\n\n- **Result:** COMPLETED. All non-music effects now play at 60% of their previous authored levels, giving the requested 40% reduction without changing the music mix. The screen/window swipe transition now lasts 420ms instead of 210ms, exactly twice as long, while the existing easing/direction and reduced-motion bypass remain intact. Puzzle squares were rebuilt into visibly colored, patterned chapter materials with much stronger ten-level structural variation instead of the prior barely tinted cream/white surfaces.\n- **SFX implementation:** `sfx400.js` now defines one `SFX_OUTPUT_SCALE = 0.60` and applies it in the shared `makeAudio()` path. That single point covers UI taps, navigation, movement loops, route events, captures, invalid moves, hints, level clear/lose, campaign completion, and soft stops. `music400.js` was protected by hash and is unchanged.\n- **Transition implementation:** `style400-ui.css` changes the root View Transition group and outgoing swipe animation from 210ms to 420ms. The original cubic-bezier timing curve, right-swipe behavior, and `prefers-reduced-motion` no-animation override are preserved.\n- **Board implementation:** `style400-board-surfaces.css` now uses stronger chapter material palettes and an ID-specific `#board[data-board-range] .cell` surface layer so the intended material actually outranks the older generic `.cell` cream background. Chapters now read clearly as meadow/green, dark timber, crystal blue, purple-gold keep, prismatic garden, copper, storm-tech, and aurora/crystal. The five ten-level stretches remain visibly distinct through rounded stitched grids, diagonal routework, circular waypoint stamps, squared engineered intersection plates, and faceted finale tiles. Per-cell offsets/brightness/saturation add controlled local variation, while nests and mechanic fixtures retain high-contrast treatments.\n- **Files changed:** Product commit `43eaa2a0decd02f31b41cafee5f62279bbd6dac3` (`Tune SFX transitions and puzzle surfaces`) changed only `sfx400.js`, `style400-ui.css`, and `style400-board-surfaces.css`. Temporary validation/helper files self-removed in commit `841c41f9f3505b3ca9d2bbe090dcc29e4f6f0abc` (`Remove audio transition board polish helpers`).\n- **Acceptance:** GitHub Actions run `34554684717` completed successfully. It syntax-checked the relevant JS, browser-rendered all 40 chapter × range board identities at 390×844, verified 40 unique computed cell signatures, five distinct range geometries per chapter, eight distinct chapter materials per range, no legacy cream cell background winning the cascade, no horizontal board overflow, visible Latchlings, and decorative layers that do not intercept pointer input. It also asserted the centralized 0.60 SFX scale, both 420ms View Transition timings, removal of the old 210ms timing from that block, and preserved reduced-motion handling.\n- **Pixel / visual review:** Artifact `audio-transition-board-polish-renders`, artifact ID `10182102226`, SHA-256 `135bd6d1f8e3dd5d6d79371d0b5e20c4965f16292405ae0a95768c3c5f268263`, contains all 40 board renders, eight full-screen chapter samples, the 8×5 contact sheet, `report.json`, and pixel ratios. Automated pixel checks rejected boards above 38% near-white pixels; the accepted renders ranged from roughly 0.38% to 3.61%. Manual review of the 40-board contact sheet confirmed that both chapter material and ten-level construction changes are immediately visible on the actual playable squares while pieces, nests, gates, anchors, rails, switches, and doors remain readable.\n- **Scope protection:** Hash verification confirmed `music400.js`, `game400-a.js`, `game400-b.js`, `index.html`, story/cinematic sources, all eight `campaign400-*.js` files, and `style400-atlas-progression.css` were unchanged by the accepted product pass.\n- **Diagnostics / iteration:** The first visual validation run `34554346091` was rejected before product commit. Its renders exposed that an older generic `.cell` background still won the CSS cascade and kept the board mostly cream-white; the corrected pass fixed selector specificity and strengthened the material colors. A separate rerun-trigger helper `34554641742` failed because an Actions token may not edit another workflow without workflow permission; it made no product changes, and the GitHub connector updated the validator directly instead.\n- **Deployment / hygiene:** GitHub Pages run `34554738905` successfully built and deployed clean accepted state `841c41f9f3505b3ca9d2bbe090dcc29e4f6f0abc`. Before this closeout helper was created, `.github/workflows` had returned to only `validate-repository-access-guard.yml`; this closeout workflow self-removes after committing the journal update.\n- **Remaining risk / next action:** No known blocker remains. The square treatment is intentionally much stronger than the previous pass; future feedback can fine-tune individual chapter saturation or pattern density without changing the underlying 40-identity system.\n'''
          block=block.rstrip()+summary+'\n\n'
          s=s[:start]+block+s[nxt:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Close audio transition board polish handoff'
          git push
      - name: Self-remove closeout workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/close-audio-transition-board-polish.yml
          git commit -m 'Remove audio transition board polish closeout helper'
          git push
