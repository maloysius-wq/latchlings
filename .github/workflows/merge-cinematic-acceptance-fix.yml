name: Merge Cinematic Acceptance Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge focused acceptance CSS and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          target=Path('style400-cinematics-geometry.css')
          extra=Path('style400-cinematics-acceptance.css')
          text=target.read_text()
          addition=extra.read_text()
          marker='/* Final opening-cinematic acceptance adjustments.'
          if marker not in text:
              target.write_text(text.rstrip()+'\n\n'+addition)
          PY
          rm -f style400-cinematics-acceptance.css .github/workflows/merge-cinematic-acceptance-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-cinematics-geometry.css style400-cinematics-acceptance.css .github/workflows/merge-cinematic-acceptance-fix.yml
          git commit -m "Reblock helper crew cinematic above dialogue"
          git push
