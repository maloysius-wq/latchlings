name: Build Skyway Atlas V1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-skyway-atlas-v1.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve campaign hashes
        shell: bash
        run: sha256sum campaign400-*.js > /tmp/campaign.before
      - name: Vendor referenced CC0 materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/level-select /tmp/atlas-src
          python3 -m pip install --quiet pillow
          curl -fL --retry 3 -o /tmp/atlas-src/sunpetal.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/leafy_grass/leafy_grass_diff_1k.jpg
          curl -fL --retry 3 -o /tmp/atlas-src/lanternwood.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/bark_brown_01/bark_brown_01_diff_1k.jpg
          curl -fL --retry 3 -o /tmp/atlas-src/lodestone.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rock_surface/rock_surface_diff_1k.jpg
          curl -fL --retry 3 -o /tmp/atlas-src/masquerade.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/plaster_stone_wall_01/plaster_stone_wall_01_diff_1k.jpg
          curl -fL --retry 3 -o /tmp/atlas-src/prism.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/marble_01/marble_01_diff_1k.jpg
          curl -fL --retry 3 -o /tmp/atlas-src/copperline.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/rusty_metal_02/rusty_metal_02_diff_1k.jpg
          curl -fL --retry 3 -o /tmp/atlas-src/stormswitch.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/blue_metal_plate/blue_metal_plate_diff_1k.jpg
          curl -fL --retry 3 -o /tmp/atlas-src/aurora.jpg https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/snow_02/snow_02_diff_1k.jpg
          python3 - <<'PY'
          from PIL import Image,ImageOps
          from pathlib import Path
          names=['sunpetal','lanternwood','lodestone','masquerade','prism','copperline','stormswitch','aurora']
          out=Path('assets/level-select')
          for n in names:
              im=Image.open(f'/tmp/atlas-src/{n}.jpg').convert('RGB')
              im=ImageOps.fit(im,(512,512),method=Image.Resampling.LANCZOS)
              im.save(out/f'{n}.webp','WEBP',quality=72,method=6)
          PY
      - name: Create Skyway Atlas art direction
        shell: bash
        run: |
          cat > LEVEL_SELECT_ART_DIRECTION.md <<'MD'
          # Skyway Atlas Art Direction

          The Level Select screen is treated as a navigable place in the Latchlands, not as a dashboard. All third-party runtime textures are local CC0 derivatives. All shapes, landmarks, route geometry, clouds, residents, lighting, and interface ornament are original HTML/CSS/SVG constructions for Latchlings.

          ## Progression-map references

          - **Two Dots saga maps / 2026 visual refresh**: environmental grouping, memorable travel through distinct regions, and a map that makes progression feel like a journey rather than a list. Reference: https://www.zynga.com/corporate/a-fresh-coat-of-joy-two-dots-reimagines-its-world-for-a-new-era/
          - **Monument Valley chapter select**: chapter selection presented as part of the game's visual world rather than generic application chrome. Reference screenshot index: https://www.mobygames.com/game/69816/monument-valley/screenshots/
          - **Level-select polishing case study**: emphasize the next destination, make unlocked/locked states part of the fiction, connect stages visually, and use unlock animation to explain progression. Reference: https://www.gamedeveloper.com/art/polishing-a-level-select-screen-process-and-implementation

          These are interaction/composition references only. No third-party game art is copied or shipped.

          ## Chapter material and object references

          ### 1. Sunpetal Meadows
          - Material: **Leafy Grass**, Poly Haven CC0, Charlotte Baglioni. https://polyhaven.com/a/leafy_grass
          - Object vocabulary: low meadow islands, flower clumps, fence posts, garden gates, small field structures and warm morning light.
          - Shape source: the existing Latchlings floating-island silhouette and Little Home pastoral language.

          ### 2. Lanternwood Grove
          - Material: **Bark Brown 01**, Poly Haven CC0, Rob Tuytel. https://polyhaven.com/a/bark_brown_01
          - Object vocabulary: rooted trunks, rounded tree crowns, hanging lanterns, dark woodland platforms and amber pools of light.
          - Shape source: the canonical multi-crown Latchlings tree construction used in cinematic/Little Home work.

          ### 3. Lodestone Caverns
          - Material: **Rock Surface**, Poly Haven CC0, Amal Kumar. https://polyhaven.com/a/rock_surface
          - Object vocabulary: faceted stone shelves, crystal spires, anchor rings, cyan mineral glow and cavern silhouettes.
          - Shape source: real fractured rock/crystal facets simplified into readable phone-scale polygons.

          ### 4. Masquerade Keep
          - Material: **Plaster Stone Wall 01**, Poly Haven CC0, Charlotte Baglioni. https://polyhaven.com/a/plaster_stone_wall_01
          - Object vocabulary: gate arches, keep towers, market banners, stone parapets and moonlit civic architecture.
          - Shape source: simple masonry arches, battlements and cloth pennants translated into the game's rounded storybook proportions.

          ### 5. Prism Gardens
          - Material: **Marble 01**, Poly Haven CC0, Rob Tuytel. https://polyhaven.com/a/marble_01
          - Object vocabulary: glasshouse ribs, translucent petals, crystal planters, prismatic highlights and soft botanical geometry.
          - Shape source: greenhouse arches and radial flower forms, stylized rather than photo-real.

          ### 6. Copperline Junction
          - Material: **Rusty Metal 02**, Poly Haven CC0, Rob Tuytel. https://polyhaven.com/a/rusty_metal_02
          - Object vocabulary: rails, switch stands, station canopies, signal posts, turntables and riveted route hardware.
          - Shape source: railway signaling/track geometry reduced to chunky toy-like silhouettes.

          ### 7. Stormswitch Foundry
          - Material: **Blue Metal Plate**, Poly Haven CC0, Rob Tuytel. https://polyhaven.com/a/blue_metal_plate
          - Object vocabulary: factory stacks, relay towers, switch banks, insulated conduits, lightning masts and storm-lit steel.
          - Shape source: industrial electrical hardware abstracted into friendly readable machinery.

          ### 8. Aurora Crown
          - Material: **Snow 02**, Poly Haven CC0, Rob Tuytel. https://polyhaven.com/a/snow_02
          - Object vocabulary: pale crystalline ledges, crown-like beacons, star fields, aurora ribbons and luminous route bridges.
          - Shape source: ice/crystal facets and atmospheric aurora bands translated into the established Latchlings celestial palette.

          ## State language

          - **Restored route**: bright continuous Skyway light with small traveling glints.
          - **Current route**: a warmer pulsing segment ending at the enlarged current island and NEXT STOP pennant.
          - **Future route**: faint dashed/ghosted light disappearing into cloud cover.
          - **Completed level**: full-color island plus earned star-lights around the island rim.
          - **Current level**: larger island, guide resident, pennant and focused route glow.
          - **Locked level**: desaturated island partially occluded by soft clouds, while its number remains legible enough to communicate future progression.
          - **Milestone (10/20/30/40/50)**: physically larger island with a chapter-specific landmark, making each ten-level stretch a destination rather than an arbitrary page.

          ## Motion language

          Ambient motion is intentionally restrained: islands bob asynchronously by a few pixels, clouds drift slowly, route glints travel only on restored lines, and the current route breathes gently. Motion reinforces a living drifting world and progression state; it is disabled under `prefers-reduced-motion: reduce`.
          MD
      - name: Build atlas stylesheet
        shell: bash
        run: |
          cat > style400-skyway-atlas.css <<'CSS'
          /* Skyway Atlas: Level Select is a place in the Latchlands, not a card grid. */
          body[data-screen="levels"]{overflow:hidden}
          body[data-screen="levels"] #app{overflow:hidden}
          #levels.atlas-screen{width:100%;max-width:none;height:100svh;min-height:100svh;padding:0;margin:0;overflow:hidden;isolation:isolate;color:var(--atlas-ink,#17334d)}
          #levels.atlas-screen:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-3;background:radial-gradient(circle at 18% 13%,rgba(255,255,255,.54),transparent 23%),radial-gradient(circle at 81% 30%,rgba(255,255,255,.22),transparent 18%),linear-gradient(180deg,var(--atlas-sky-a,#a7daf7),var(--atlas-sky-b,#dceffa) 66%,var(--atlas-haze,#edf6f6));transition:background .35s ease}
          #levels.atlas-screen:after{content:"";position:absolute;inset:-12%;z-index:-2;pointer-events:none;background-image:var(--atlas-texture);background-size:430px 430px;opacity:.105;mix-blend-mode:soft-light;filter:saturate(.72) contrast(.9);transform:rotate(-3deg)}
          .atlas-shell{width:min(100%,540px);height:100%;margin:0 auto;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;position:relative;overflow:hidden;padding:calc(8px + env(safe-area-inset-top)) 12px calc(9px + env(safe-area-inset-bottom));gap:7px}
          .atlas-shell:before,.atlas-shell:after{content:"";position:absolute;z-index:-1;pointer-events:none;border-radius:50%;background:rgba(255,255,255,.26);filter:blur(1px);animation:atlasCloudDrift 18s ease-in-out infinite alternate}
          .atlas-shell:before{width:190px;height:58px;left:-86px;top:25%;box-shadow:70px 12px 0 -17px rgba(255,255,255,.22),132px -6px 0 -27px rgba(255,255,255,.24)}
          .atlas-shell:after{width:170px;height:52px;right:-88px;top:63%;box-shadow:-58px 9px 0 -18px rgba(255,255,255,.22),-120px -9px 0 -29px rgba(255,255,255,.20);animation-delay:-8s}

          .atlas-top{height:54px;display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;position:relative;z-index:20}
          #levels .atlas-round-btn{width:44px;height:44px;min-width:44px;border:1px solid rgba(255,255,255,.58);border-radius:50%;background:linear-gradient(155deg,rgba(255,255,255,.78),rgba(244,235,214,.64));box-shadow:0 7px 18px rgba(23,50,75,.14),inset 0 1px rgba(255,255,255,.75);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer}
          #levels .atlas-round-btn .icon{width:22px;height:22px}
          .atlas-tools{font-family:Georgia,serif;font-weight:900;font-size:24px;line-height:1;padding-bottom:9px;justify-self:end;letter-spacing:1px}
          .atlas-title-lockup{text-align:center;line-height:1;filter:drop-shadow(0 2px 0 rgba(255,255,255,.45))}
          .atlas-kicker{display:block;font-size:8px;font-weight:1000;letter-spacing:.19em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
          .atlas-title-lockup strong{display:block;font-family:Georgia,"Times New Roman",serif;font-size:25px;letter-spacing:-.7px}

          .atlas-chapter-head{min-height:77px;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid rgba(255,255,255,.45);border-radius:23px;background:linear-gradient(145deg,rgba(255,255,255,.64),rgba(255,246,224,.35));box-shadow:0 8px 22px rgba(20,46,72,.12),inset 0 1px rgba(255,255,255,.66);backdrop-filter:blur(9px);position:relative;z-index:18;overflow:hidden}
          .atlas-chapter-head:after{content:"";position:absolute;inset:0;background-image:var(--atlas-texture);background-size:280px;opacity:.075;mix-blend-mode:multiply;pointer-events:none}
          .atlas-chapter-medallion{width:48px;height:48px;border-radius:18px;display:grid;place-items:center;position:relative;z-index:1;background:linear-gradient(145deg,var(--atlas-accent-soft,#dff1ae),rgba(255,255,255,.78));border:1px solid rgba(43,67,74,.18);box-shadow:0 5px 11px rgba(29,53,67,.13),inset 0 1px rgba(255,255,255,.78);font-family:Georgia,serif;font-size:22px;font-weight:900}
          .atlas-chapter-copy{position:relative;z-index:1;min-width:0}
          .atlas-chapter-copy .theme-kicker{font-size:8px;letter-spacing:.12em;margin:0 0 2px;opacity:.74}
          .atlas-chapter-copy h2{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.02;margin:0 0 3px;letter-spacing:-.35px}
          .atlas-chapter-copy p{margin:0;font-size:10.5px;line-height:1.2;opacity:.79;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          .atlas-chapter-progress{position:relative;z-index:1;min-width:47px;text-align:right;font-size:9px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;opacity:.72}
          .atlas-chapter-progress b{display:block;font-family:Georgia,serif;font-size:18px;line-height:1;color:var(--atlas-accent-deep,#426a45)}

          .atlas-chapter-nav{min-height:34px;display:grid;grid-template-columns:38px 1fr 38px;align-items:center;gap:6px;position:relative;z-index:17}
          .atlas-chapter-arrow{height:32px;border:0;border-radius:15px;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.38);font-size:20px;font-weight:900;cursor:pointer;backdrop-filter:blur(5px)}
          .atlas-chapter-arrow:disabled{opacity:.22;cursor:default}
          .atlas-region-dots{display:flex;align-items:center;justify-content:center;gap:7px}
          .atlas-region-dot{width:13px;height:13px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.66);background:rgba(28,55,78,.27);box-shadow:0 2px 6px rgba(16,37,56,.12);cursor:pointer;transition:width .2s,border-radius .2s,background .2s}
          .atlas-region-dot.active{width:31px;border-radius:9px;background:var(--atlas-accent,#79b95b);border-color:rgba(255,255,255,.84);box-shadow:0 0 0 2px rgba(31,55,70,.08),0 3px 8px rgba(16,37,56,.18)}

          .atlas-waypoint-nav{min-height:43px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;position:relative;z-index:17}
          .atlas-waypoint-tab{min-width:0;height:41px;border:0;border-radius:15px;background:rgba(255,255,255,.30);box-shadow:inset 0 0 0 1px rgba(255,255,255,.34);padding:4px 3px 3px;cursor:pointer;backdrop-filter:blur(5px);overflow:hidden}
          .atlas-waypoint-tab span{display:block;font-size:8px;font-weight:1000;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.7}
          .atlas-waypoint-tab b{display:block;font-family:Georgia,serif;font-size:11px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .atlas-waypoint-tab.active{background:linear-gradient(145deg,rgba(255,255,255,.78),var(--atlas-accent-soft,#dff1ae));box-shadow:0 5px 12px rgba(25,48,68,.13),inset 0 0 0 1px rgba(255,255,255,.72);transform:translateY(-1px)}
          .atlas-waypoint-tab.future{opacity:.58}

          .atlas-map{position:relative;min-height:310px;overflow:hidden;border:1px solid rgba(255,255,255,.28);border-radius:28px;background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.12),transparent 46%),linear-gradient(180deg,rgba(255,255,255,.08),rgba(20,43,61,.04));box-shadow:inset 0 1px rgba(255,255,255,.28),0 10px 28px rgba(16,36,54,.10);isolation:isolate}
          .atlas-map:before{content:"";position:absolute;inset:0;z-index:-2;background-image:var(--atlas-map-decor);background-size:cover;opacity:.9;pointer-events:none}
          .atlas-map:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 22%,transparent 82%,rgba(255,255,255,.06))}
          .atlas-route-caption{position:absolute;left:14px;top:9px;z-index:12;padding:5px 9px;border-radius:11px;background:rgba(18,43,64,.45);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.28);backdrop-filter:blur(5px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
          .atlas-route-caption b{display:block;font-family:Georgia,serif;font-size:13px;line-height:1}.atlas-route-caption span{display:block;font-size:7.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:2px}
          .atlas-route-svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;overflow:visible;pointer-events:none;filter:drop-shadow(0 0 5px rgba(161,228,255,.22))}
          .atlas-route-shadow{fill:none;stroke:rgba(20,50,71,.22);stroke-width:2.7;stroke-linecap:round}
          .atlas-route{fill:none;stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
          .atlas-route.restored{stroke:rgba(198,246,255,.96);stroke-dasharray:1 5;filter:drop-shadow(0 0 3px rgba(117,220,255,.85));animation:atlasRouteTravel 2.7s linear infinite}
          .atlas-route.active{stroke:#fff1a6;stroke-width:2.7;stroke-dasharray:3 4;filter:drop-shadow(0 0 4px rgba(255,226,92,.95));animation:atlasActiveRoute 1.65s ease-in-out infinite}
          .atlas-route.future{stroke:rgba(228,246,255,.29);stroke-width:1.25;stroke-dasharray:2.5 5.5}

          #levels .level-node.atlas-node{position:absolute;left:var(--x);top:var(--y);width:54px;height:54px;min-width:54px;min-height:54px;aspect-ratio:auto;translate:-50% -50%;padding:0;border:0;border-radius:50%;background:transparent;color:var(--atlas-ink,#17334d);box-shadow:none;outline:none;z-index:5;overflow:visible;cursor:pointer;animation:atlasIslandFloat var(--float-time,4.8s) ease-in-out infinite;animation-delay:var(--float-delay,0s)}
          #levels .atlas-node.milestone{width:64px;height:64px;min-width:64px;min-height:64px;z-index:6}
          #levels .atlas-node.current{width:72px;height:72px;min-width:72px;min-height:72px;z-index:9;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--atlas-accent) 62%,transparent))}
          #levels .atlas-node:focus-visible{outline:3px solid #fff;outline-offset:3px;filter:drop-shadow(0 0 5px #183a67)}
          #levels .atlas-node:active{transform:scale(.96)}
          .atlas-island{position:absolute;inset:4px 3px 4px;display:block;filter:drop-shadow(0 8px 6px rgba(20,35,45,.24))}
          .atlas-island-side{position:absolute;left:4%;right:4%;top:23%;height:72%;clip-path:polygon(2% 0,98% 0,86% 48%,65% 80%,50% 100%,33% 81%,13% 50%);background-image:linear-gradient(155deg,rgba(255,255,255,.16),transparent 33%),linear-gradient(180deg,var(--atlas-side-a,#966d4c),var(--atlas-side-b,#5f4639)),var(--atlas-texture);background-blend-mode:screen,normal,multiply;background-size:auto,auto,110px;box-shadow:inset 0 2px rgba(255,255,255,.14)}
          .atlas-island-side:after{content:"";position:absolute;inset:17% 18% 20%;background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 45%);clip-path:polygon(0 0,18% 28%,28% 6%,44% 49%,62% 18%,77% 63%,100% 40%,79% 100%,21% 90%);opacity:.55}
          .atlas-island-top{position:absolute;left:0;right:0;top:7%;height:43%;border-radius:50%;background-image:radial-gradient(circle at 28% 25%,rgba(255,255,255,.38),transparent 25%),linear-gradient(rgba(255,255,255,.05),rgba(0,0,0,.07)),var(--atlas-texture);background-size:auto,auto,118px;background-blend-mode:screen,soft-light,multiply;border:1px solid color-mix(in srgb,var(--atlas-top,#87c66c) 58%,#34525d);box-shadow:inset 0 2px rgba(255,255,255,.38),inset 0 -5px color-mix(in srgb,var(--atlas-top,#87c66c) 75%,#314f3e)}
          .atlas-node.done .atlas-island-top{box-shadow:inset 0 2px rgba(255,255,255,.44),inset 0 -5px color-mix(in srgb,var(--atlas-top) 75%,#314f3e),0 0 7px color-mix(in srgb,var(--atlas-accent) 42%,transparent)}
          .atlas-node.current .atlas-island{inset:5px 4px 3px}.atlas-node.current .atlas-island-top{border-width:2px;box-shadow:inset 0 2px rgba(255,255,255,.48),inset 0 -6px color-mix(in srgb,var(--atlas-top) 74%,#314f3e),0 0 0 3px rgba(255,255,255,.2),0 0 12px var(--atlas-accent)}
          .atlas-level-number{position:absolute;left:50%;top:16px;translate:-50% -50%;z-index:9;min-width:28px;height:25px;padding:0 5px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(#fffef8,#f5e7cb);border:1px solid rgba(84,68,45,.23);box-shadow:0 3px 7px rgba(31,43,50,.22),inset 0 1px #fff;font-family:Georgia,serif;font-weight:900;font-size:12px;line-height:1;color:#19344c}
          .atlas-node.milestone .atlas-level-number{top:17px;font-size:12px}.atlas-node.current .atlas-level-number{top:17px;min-width:33px;height:29px;border-radius:14px;font-size:13px}
          .atlas-stars{position:absolute;left:50%;bottom:-3px;translate:-50% 0;z-index:9;width:40px;height:14px;display:flex;justify-content:center;align-items:center;gap:2px;padding:2px 4px;border-radius:9px;background:rgba(19,43,61,.48);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
          .atlas-stars i{width:8px;height:8px;clip-path:polygon(50% 0,61% 34%,98% 38%,69% 59%,78% 96%,50% 75%,22% 96%,31% 59%,2% 38%,39% 34%);background:rgba(255,255,255,.24)}
          .atlas-stars i.on{background:#ffe279;filter:drop-shadow(0 0 3px rgba(255,225,105,.85))}
          .atlas-node.locked{opacity:1;filter:none;cursor:default}
          .atlas-node.locked .atlas-island{filter:grayscale(.7) saturate(.25) drop-shadow(0 7px 5px rgba(20,35,45,.13));opacity:.54}
          .atlas-node.locked .atlas-level-number{opacity:.68;filter:saturate(.45)}
          .atlas-cloud-cover{display:none;position:absolute;z-index:12;left:50%;top:45%;translate:-50% -50%;width:63px;height:27px;border-radius:50%;background:rgba(241,248,252,.87);box-shadow:-20px 4px 0 -6px rgba(246,251,253,.9),20px 5px 0 -7px rgba(239,247,251,.91),0 5px 10px rgba(37,63,78,.08);filter:blur(.15px)}
          .atlas-node.locked .atlas-cloud-cover{display:block}
          .atlas-node.current .atlas-cloud-cover{display:none}
          .atlas-pennant{position:absolute;left:50%;top:-17px;translate:-50% 0;z-index:15;padding:4px 7px 4px 9px;border-radius:8px 8px 8px 3px;background:#fff1a6;color:#3e4528;border:1px solid rgba(92,82,37,.22);box-shadow:0 4px 8px rgba(34,47,55,.16);font-size:7px;font-weight:1000;letter-spacing:.08em;white-space:nowrap;text-transform:uppercase;animation:atlasPennant 2.2s ease-in-out infinite}
          .atlas-pennant:after{content:"";position:absolute;left:7px;bottom:-8px;width:2px;height:9px;background:#6a573c;border-radius:2px}
          .atlas-guide{position:absolute;right:-16px;bottom:1px;width:25px;height:25px;border-radius:50%;z-index:15;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.44) 0 7%,transparent 8%),linear-gradient(180deg,var(--guide-light),var(--guide-color) 58%,var(--guide-dark));border:1.5px solid rgba(24,52,76,.38);box-shadow:0 4px 7px rgba(22,39,58,.22),inset 0 1px rgba(255,255,255,.26);animation:atlasGuideBob 2.6s ease-in-out infinite}
          .atlas-guide-suit{position:absolute;top:2px;left:50%;translate:-50% 0;width:7px;height:7px}.atlas-guide-suit svg{width:100%;height:100%;display:block;fill:#27496f}
          .atlas-guide-eyes{position:absolute;left:5px;right:5px;top:9px;height:6px;display:flex;justify-content:center;gap:5px;animation:atlasGuideBlink 4.8s infinite}
