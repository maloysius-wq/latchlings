          /* Sunpetal: meadow fence/flowers, milestone windmill/garden structures. */
          .theme-ch1 #levels{--atlas-ink:#183d42;--atlas-sky-a:#92d2f6;--atlas-sky-b:#c9e9d2;--atlas-haze:#eff3c9;--atlas-accent:#77b958;--atlas-accent-soft:#dff0a8;--atlas-accent-deep:#46793d;--atlas-top:#85c966;--atlas-side-a:#9a714f;--atlas-side-b:#614537;--atlas-texture:url('assets/level-select/sunpetal.webp');--atlas-map-decor:radial-gradient(circle at 86% 16%,rgba(255,244,153,.7) 0 5%,transparent 13%),radial-gradient(circle at 12% 78%,rgba(255,255,255,.26),transparent 17%),linear-gradient(165deg,transparent 0 72%,rgba(111,176,82,.18) 73% 100%)}
          .theme-ch1 .atlas-prop:before{left:4px;bottom:3px;width:24px;height:3px;background:#7a583b;box-shadow:0 -7px 0 #7a583b;rotate:-4deg}.theme-ch1 .atlas-prop:after{left:8px;bottom:0;width:3px;height:18px;background:#8f6743;box-shadow:14px 1px 0 #8f6743}.theme-ch1 .atlas-prop i{width:9px;height:9px;border-radius:50%;background:#ffd35e;left:3px;top:1px;box-shadow:17px 4px 0 #ef8892,8px -2px 0 -2px #fff6bd}.theme-ch1 .atlas-node.milestone .atlas-prop b{left:18px;top:-3px;width:3px;height:24px;background:#704b34}.theme-ch1 .atlas-node.milestone .atlas-prop b:before{content:"";position:absolute;left:-8px;top:1px;width:19px;height:19px;background:conic-gradient(from 45deg,#fff3c0 0 24%,transparent 25% 49%,#fff3c0 50% 74%,transparent 75%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

          /* Lanternwood: tree trunks and lanterns. */
          .theme-ch2 #levels{--atlas-ink:#eff2d3;--atlas-sky-a:#17363a;--atlas-sky-b:#315546;--atlas-haze:#1e3733;--atlas-accent:#f2b74f;--atlas-accent-soft:#765f3e;--atlas-accent-deep:#ffc968;--atlas-top:#506f45;--atlas-side-a:#715a41;--atlas-side-b:#2f2c27;--atlas-texture:url('assets/level-select/lanternwood.webp');--atlas-map-decor:radial-gradient(circle at 16% 24%,rgba(255,191,76,.18),transparent 13%),radial-gradient(circle at 84% 54%,rgba(255,191,76,.14),transparent 14%),linear-gradient(90deg,rgba(12,29,28,.42) 0 6%,transparent 7% 88%,rgba(12,29,28,.35) 89% 100%)}
