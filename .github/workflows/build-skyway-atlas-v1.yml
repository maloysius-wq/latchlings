          .theme-ch8 .atlas-chapter-head,.theme-ch8 .atlas-waypoint-tab,.theme-ch8 .atlas-chapter-arrow,.theme-ch8 #levels .atlas-round-btn{color:#f0fdff;background-color:rgba(28,42,76,.56)}
          .theme-ch8 .atlas-prop:before{left:2px;bottom:2px;width:11px;height:25px;background:linear-gradient(#d7fbff,#78b9d6);clip-path:polygon(50% 0,100% 63%,69% 100%,0 80%,18% 24%);box-shadow:17px 4px 0 -1px #9a7dd0}.theme-ch8 .atlas-prop:after{left:12px;bottom:1px;width:12px;height:29px;background:linear-gradient(#f4ffff,#84d5ca);clip-path:polygon(50% 0,100% 70%,62% 100%,0 87%,12% 31%)}.theme-ch8 .atlas-node.milestone .atlas-prop i{left:9px;top:-8px;width:23px;height:16px;border:2px solid #a6f4e7;border-bottom:0;border-radius:13px 13px 0 0;box-shadow:0 0 8px #6addcc}.theme-ch8 .atlas-node.milestone .atlas-prop i:after{content:"";position:absolute;left:50%;top:-4px;translate:-50% 0;width:5px;height:5px;border-radius:50%;background:#f9ffd2;box-shadow:0 0 8px #d8fff5}

          .atlas-footer{min-height:61px;margin:0;display:block;position:relative;z-index:20;padding-top:2px}
          #levels .atlas-continue{width:100%;height:58px;border:1px solid rgba(255,255,255,.72);border-radius:23px;background:linear-gradient(145deg,#fffbed,#f5dfab 58%,#edc86d);box-shadow:0 7px 0 color-mix(in srgb,var(--atlas-accent-deep,#826b3a) 55%,#6f5637),0 12px 20px rgba(21,40,55,.18),inset 0 1px #fff;cursor:pointer;color:#17334d;text-align:left;padding:7px 20px 8px;position:relative;overflow:hidden}
          #levels .atlas-continue:before{content:"";position:absolute;left:-15%;top:-110%;width:35%;height:300%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.57),transparent);rotate:18deg;animation:atlasContinueShine 4.8s ease-in-out infinite}
          #levels .atlas-continue:after{content:'›';position:absolute;right:18px;top:50%;translate:0 -53%;font-family:Georgia,serif;font-size:35px;font-weight:900;opacity:.65}
          .atlas-continue span{display:block;font-size:8px;font-weight:1000;letter-spacing:.15em;text-transform:uppercase;opacity:.66}.atlas-continue b{display:block;font-family:Georgia,serif;font-size:21px;line-height:1.05}
          #levels .atlas-continue:active{transform:translateY(4px);box-shadow:0 3px 0 color-mix(in srgb,var(--atlas-accent-deep,#826b3a) 55%,#6f5637),0 7px 13px rgba(21,40,55,.14)}

          @keyframes atlasIslandFloat{0%,100%{translate:-50% -50%}50%{translate:-50% calc(-50% - 3px)}}
