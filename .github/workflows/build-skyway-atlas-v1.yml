          .theme-ch5 .atlas-prop:before{left:7px;top:2px;width:20px;height:25px;background:conic-gradient(from 18deg,#ef879d,#ffd570,#8cdd9a,#77cfe8,#b79bea,#ef879d);clip-path:polygon(50% 0,61% 35%,93% 19%,72% 50%,100% 59%,66% 64%,72% 100%,50% 71%,28% 100%,34% 64%,0 59%,28% 50%,7% 19%,39% 35%);opacity:.82}.theme-ch5 .atlas-prop:after{left:15px;top:10px;width:5px;height:19px;background:rgba(61,119,105,.75);border-radius:50%}.theme-ch5 .atlas-node.milestone .atlas-prop i{inset:1px;border:2px solid rgba(235,255,255,.65);border-radius:15px 15px 4px 4px;box-shadow:inset 0 0 10px rgba(255,255,255,.36),0 0 8px rgba(119,214,221,.45)}

          /* Copperline: toy railway signals and canopy/turntable language. */
          .theme-ch6 #levels{--atlas-ink:#fff0dc;--atlas-sky-a:#60463c;--atlas-sky-b:#8e674e;--atlas-haze:#4b3b37;--atlas-accent:#e08b4e;--atlas-accent-soft:#7c5a43;--atlas-accent-deep:#ffc07b;--atlas-top:#8e765f;--atlas-side-a:#92684a;--atlas-side-b:#4d352e;--atlas-texture:url('assets/level-select/copperline.webp');--atlas-map-decor:repeating-linear-gradient(92deg,transparent 0 47px,rgba(41,28,24,.08) 48px 50px),linear-gradient(168deg,transparent 0 72%,rgba(44,29,24,.16) 73% 75%,transparent 76%)}
          .theme-ch6 .atlas-chapter-head,.theme-ch6 .atlas-waypoint-tab,.theme-ch6 .atlas-chapter-arrow,.theme-ch6 #levels .atlas-round-btn{color:#fff0dc;background-color:rgba(83,56,45,.54)}
          .theme-ch6 .atlas-prop:before{left:2px;bottom:4px;width:29px;height:4px;background:#3f332e;box-shadow:0 5px 0 #3f332e;rotate:-8deg}.theme-ch6 .atlas-prop:after{left:8px;bottom:1px;width:3px;height:22px;background:#d58b53;box-shadow:15px 2px 0 #b97449}.theme-ch6 .atlas-prop i{left:4px;top:1px;width:12px;height:9px;border-radius:6px;background:#413732;border:2px solid #c88550}.theme-ch6 .atlas-prop i:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:#ffd46a;left:2px;top:1px;box-shadow:0 0 6px #f5b34f}.theme-ch6 .atlas-node.milestone .atlas-prop b{right:0;top:3px;width:14px;height:14px;border:3px dotted #e3a76b;border-radius:50%}

          /* Stormswitch: steel stacks, relay lamps and lightning mast. */
          .theme-ch7 #levels{--atlas-ink:#e8f7ff;--atlas-sky-a:#101e2a;--atlas-sky-b:#263949;--atlas-haze:#142633;--atlas-accent:#5fc3e9;--atlas-accent-soft:#405c6b;--atlas-accent-deep:#8fe4ff;--atlas-top:#65737a;--atlas-side-a:#5b6570;--atlas-side-b:#29323a;--atlas-texture:url('assets/level-select/stormswitch.webp');--atlas-map-decor:linear-gradient(118deg,transparent 0 22%,rgba(124,220,255,.12) 22.5% 23.5%,transparent 24% 69%,rgba(201,242,255,.09) 69.5% 70.5%,transparent 71%),radial-gradient(circle at 73% 22%,rgba(95,196,238,.12),transparent 20%)}
          .theme-ch7 .atlas-chapter-head,.theme-ch7 .atlas-waypoint-tab,.theme-ch7 .atlas-chapter-arrow,.theme-ch7 #levels .atlas-round-btn{color:#e9f8ff;background-color:rgba(33,52,66,.58)}
          .theme-ch7 .atlas-prop:before{left:5px;bottom:1px;width:8px;height:25px;background-image:var(--atlas-texture);background-size:48px;border:1px solid #263c49;box-shadow:15px 4px 0 -1px #647984}.theme-ch7 .atlas-prop:after{left:3px;top:0;width:12px;height:5px;border-radius:3px;background:#91dff7;box-shadow:15px 7px 0 -1px #5fbcde,0 0 7px #66c8ea}.theme-ch7 .atlas-prop i{right:3px;top:-3px;width:3px;height:23px;background:#9bc5d4}.theme-ch7 .atlas-prop i:after{content:"";position:absolute;left:-6px;top:0;width:13px;height:18px;background:linear-gradient(145deg,transparent 0 36%,#c8f3ff 37% 46%,transparent 47% 58%,#73d7fa 59% 67%,transparent 68%);filter:drop-shadow(0 0 4px #63c8ed)}

