            .atlas-top{height:44px}.atlas-title-lockup strong{font-size:21px}.atlas-kicker{font-size:7px}.atlas-chapter-head{min-height:59px;padding:5px 8px;border-radius:19px}.atlas-chapter-medallion{width:40px;height:40px;border-radius:14px;font-size:18px}.atlas-chapter-copy h2{font-size:16px}.atlas-chapter-copy p{font-size:9px;-webkit-line-clamp:1}.atlas-chapter-progress b{font-size:15px}.atlas-chapter-nav{min-height:28px}.atlas-chapter-arrow{height:27px}.atlas-region-dot{width:11px;height:11px}.atlas-region-dot.active{width:26px}.atlas-waypoint-nav{min-height:36px}.atlas-waypoint-tab{height:34px;border-radius:12px;padding-top:3px}.atlas-waypoint-tab span{font-size:6.8px}.atlas-waypoint-tab b{font-size:9.5px}.atlas-map{min-height:268px;border-radius:23px}.atlas-route-caption{top:6px;left:9px;padding:4px 7px}.atlas-route-caption b{font-size:11px}.atlas-route-caption span{font-size:6.6px}#levels .level-node.atlas-node{width:48px;height:48px;min-width:48px;min-height:48px}#levels .atlas-node.milestone{width:56px;height:56px;min-width:56px;min-height:56px}#levels .atlas-node.current{width:62px;height:62px;min-width:62px;min-height:62px}.atlas-level-number{top:14px;height:22px;min-width:25px;font-size:10.5px}.atlas-node.current .atlas-level-number{top:15px;height:25px;font-size:11px}.atlas-stars{bottom:-2px;scale:.88}.atlas-prop{scale:.85}.atlas-node:not(.milestone) .atlas-prop{scale:.64}.atlas-pennant{top:-14px;font-size:6px;padding:3px 5px}.atlas-guide{width:22px;height:22px;right:-12px}.atlas-guide-suit{width:6px;height:6px}.atlas-guide-eyes{left:4px;right:4px;top:8px}.atlas-guide-mouth{top:14px}.atlas-footer{min-height:53px}#levels .atlas-continue{height:50px;border-radius:20px;padding:5px 17px 6px}.atlas-continue b{font-size:18px}
          }
          @media(max-height:600px){
