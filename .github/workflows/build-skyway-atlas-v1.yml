          .theme-ch2 .atlas-prop:before{left:13px;top:7px;width:7px;height:22px;border-radius:4px;background-image:var(--atlas-texture);background-size:58px}.theme-ch2 .atlas-prop:after{left:3px;top:0;width:26px;height:18px;border-radius:50%;background:#3d6a48;box-shadow:6px -5px 0 -2px #557f4d,-5px 4px 0 -3px #315c42}.theme-ch2 .atlas-prop i{right:0;top:12px;width:8px;height:10px;border-radius:3px;background:#ffd375;border:1px solid #8c6836;box-shadow:0 0 8px #f4b64f}.theme-ch2 .atlas-node.milestone .atlas-prop i{width:10px;height:13px;right:-3px;box-shadow:0 0 13px #f5b84a}

          /* Lodestone: fractured rock and cyan crystals/anchor ring. */
          .theme-ch3 #levels{--atlas-ink:#e7f5ff;--atlas-sky-a:#101d2b;--atlas-sky-b:#20354a;--atlas-haze:#162436;--atlas-accent:#6ed4e8;--atlas-accent-soft:#405a6c;--atlas-accent-deep:#8cecff;--atlas-top:#65737d;--atlas-side-a:#555f69;--atlas-side-b:#242c38;--atlas-texture:url('assets/level-select/lodestone.webp');--atlas-map-decor:linear-gradient(125deg,transparent 0 13%,rgba(87,206,224,.09) 14% 16%,transparent 17% 82%,rgba(143,104,220,.09) 83% 86%,transparent 87%),radial-gradient(ellipse at 50% 42%,rgba(84,181,216,.12),transparent 44%)}
          .theme-ch3 .atlas-chapter-head,.theme-ch3 .atlas-waypoint-tab,.theme-ch3 .atlas-chapter-arrow,.theme-ch3 #levels .atlas-round-btn{color:#eaf8ff;background-color:rgba(31,48,64,.54)}
          .theme-ch3 .atlas-prop:before{left:3px;bottom:2px;width:10px;height:25px;background:linear-gradient(#a3f2f4,#43aabb);clip-path:polygon(50% 0,100% 67%,72% 100%,18% 92%,0 43%);box-shadow:14px 7px 0 -2px #7f69bd}.theme-ch3 .atlas-prop:after{right:1px;bottom:2px;width:12px;height:20px;background:linear-gradient(#c9f6ff,#5b9fca);clip-path:polygon(50% 0,100% 50%,69% 100%,16% 90%,0 40%)}.theme-ch3 .atlas-node.milestone .atlas-prop i{left:11px;top:3px;width:19px;height:19px;border:3px solid #9ceaf2;border-radius:50%;box-shadow:0 0 8px rgba(107,225,239,.6)}.theme-ch3 .atlas-node.milestone .atlas-prop i:after{content:"";position:absolute;width:3px;height:16px;background:#9ceaf2;left:5px;top:13px;rotate:20deg}

