      - name: Install Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve product
        shell: bash
        run: python3 -m http.server 4173 >/tmp/atlas-http.log 2>&1 &
      - name: Deep functional and visual audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atlas-audit/chapters atlas-audit/compact atlas-audit/states
          cat > atlas-check.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const failures=[],report={screens:[],states:[]};const fail=m=>{failures.push(m);console.error('FAIL',m)};
          async function setProgress(page,unlocked,stars={}){await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.evaluate(({unlocked,stars})=>localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked,stars})),{unlocked,stars});await page.reload({waitUntil:'networkidle'});await page.waitForFunction(()=>window.LatchlingsHomeAction);await page.evaluate(()=>window.LatchlingsHomeAction('levels'));await page.waitForTimeout(220)}
          async function inspect(page,label){const m=await page.evaluate(()=>{const screen=document.getElementById('levels'),map=document.getElementById('levelGrid'),cont=document.getElementById('continueBtn'),nodes=[...document.querySelectorAll('#levelGrid .atlas-node')],vis=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0},styles=nodes.map(n=>{const r=n.getBoundingClientRect();return{level:+n.dataset.level,w:r.width,h:r.height,left:r.left,right:r.right,top:r.top,bottom:r.bottom,locked:n.disabled,current:n.classList.contains('current'),milestone:n.classList.contains('milestone')}}),routes=[...document.querySelectorAll('.atlas-route')].map(r=>r.getAttribute('class')),texture=getComputedStyle(screen).getPropertyValue('--atlas-texture'),mr=map.getBoundingClientRect(),cr=cont.getBoundingClientRect();return{screen:screen.className,map:{w:mr.width,h:mr.height,left:mr.left,right:mr.right,top:mr.top,bottom:mr.bottom},continue:{w:cr.width,h:cr.height,left:cr.left,right:cr.right,top:cr.top,bottom:cr.bottom,text:cont.textContent.trim()},nodes:styles,routes,texture,docOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth,bodyOverflow:document.body.scrollWidth>document.body.clientWidth,screenVisible:vis(screen),viewport:{w:innerWidth,h:innerHeight},chapterDots:document.querySelectorAll('.atlas-region-dot').length,waypoints:document.querySelectorAll('.atlas-waypoint-tab').length}});if(!m.screenVisible)fail(`${label} Level Select not visible`);if(m.docOverflow||m.bodyOverflow)fail(`${label} horizontal overflow`);if(m.chapterDots!==8)fail(`${label} missing chapter dots`);if(m.waypoints!==5)fail(`${label} missing waypoint tabs`);if(m.nodes.length!==10)fail(`${label} expected 10 nodes`);if(m.routes.length!==18)fail(`${label} expected 18 route paths got ${m.routes.length}`);if(!m.texture.includes('assets/level-select/'))fail(`${label} chapter texture missing`);if(m.continue.h<44||m.continue.left<-1||m.continue.right>m.viewport.w+1||m.continue.bottom>m.viewport.h+1)fail(`${label} Continue clipped or too small ${JSON.stringify(m.continue)}`);for(const n of m.nodes){if(n.w<44||n.h<44)fail(`${label} Level ${n.level} target ${n.w}x${n.h}`);if(n.left<-18||n.right>m.viewport.w+18||n.top<m.map.top-18||n.bottom>m.map.bottom+18)fail(`${label} node ${n.level} badly outside map`)}return m}
          // Full atlas: all 8 chapters x all 5 route stretches at production phone size.
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'no-preference'});const allStars={};for(let i=1;i<=399;i++)allStars[i]=3;await setProgress(page,400,allStars);
          for(let ch=1;ch<=8;ch++){await page.locator(`.atlas-region-dot[data-ch="${ch}"]`).click();await page.waitForTimeout(90);for(let r=0;r<5;r++){await page.locator(`.atlas-waypoint-tab[data-range="${r}"]`).click();await page.waitForTimeout(90);const label=`390x844 ch${ch} range${r+1}`;report.screens.push({label,...await inspect(page,label)});await page.screenshot({path:`atlas-audit/chapters/ch${ch}-r${r+1}.png`,fullPage:true})}}
          // Compact chapter hero coverage.
          const compact=await browser.newPage({viewport:{width:320,height:568},reducedMotion:'no-preference'});await setProgress(compact,400,allStars);for(let ch=1;ch<=8;ch++){await compact.locator(`.atlas-region-dot[data-ch="${ch}"]`).click();await compact.waitForTimeout(70);await compact.locator('.atlas-waypoint-tab[data-range="4"]').click();await compact.waitForTimeout(70);const label=`320x568 ch${ch}`;report.screens.push({label,...await inspect(compact,label)});await compact.screenshot({path:`atlas-audit/compact/ch${ch}.png`,fullPage:true})}
          // Fresh state, current state, locked states and utility/reset confirmation.
          const states=await browser.newPage({viewport:{width:390,height:700},reducedMotion:'no-preference'});await setProgress(states,1,{});let m=await inspect(states,'fresh level1');if(!m.nodes[0].current||m.nodes.filter(n=>n.locked).length!==9)fail('fresh state current/locked semantics wrong');await states.screenshot({path:'atlas-audit/states/fresh.png',fullPage:true});
          const midStars={};for(let i=1;i<=16;i++)midStars[i]=(i%3)+1;await setProgress(states,17,midStars);await states.locator('.atlas-waypoint-tab[data-range="1"]').click();await states.waitForTimeout(100);m=await inspect(states,'mid level17');const current=m.nodes.find(n=>n.level===17);if(!current?.current)fail('level17 not marked current');if(!m.continue.text.includes('17'))fail('Continue does not name level17');await states.screenshot({path:'atlas-audit/states/mid.png',fullPage:true});
          await states.locator('#resetProgressBtn').click();await states.waitForTimeout(70);if(!(await states.locator('#overlay.show #confirmReset').count()))fail('Reset utility does not reach confirmation');await states.locator('#cancelReset').click();
          // Verify an unlocked map node launches its real level.
          await states.locator('.atlas-node[data-level="16"]').click();await states.waitForTimeout(130);if(!(await states.locator('#game.active').count()))fail('unlocked atlas node did not launch game');if((await states.locator('#levelTitle').textContent())?.trim()!=='Level 16')fail('atlas node launched wrong level');
          // Verify Continue launches actual unlocked level.
          await states.evaluate(()=>{screen('levels');chapterView=1;rangeView=1;renderChapter()});await states.waitForTimeout(70);await states.locator('#continueBtn').click();await states.waitForTimeout(120);if(!(await states.locator('#game.active').count()))fail('Continue did not launch game');if((await states.locator('#levelTitle').textContent())?.trim()!=='Level 17')fail('Continue launched wrong level');
          // Reduced motion should disable ambient animation.
          const reduced=await browser.newPage({viewport:{width:430,height:932},reducedMotion:'reduce'});await setProgress(reduced,251,Object.fromEntries(Array.from({length:250},(_,i)=>[i+1,3])));await reduced.locator('.atlas-region-dot[data-ch="6"]').click();await reduced.locator('.atlas-waypoint-tab[data-range="0"]').click();await reduced.waitForTimeout(80);await inspect(reduced,'430x932 reduced ch6');const anim=await reduced.evaluate(()=>({node:getComputedStyle(document.querySelector('.atlas-node')).animationName,route:getComputedStyle(document.querySelector('.atlas-route')).animationName,cloud:getComputedStyle(document.querySelector('.atlas-shell'),'::before').animationName}));if(anim.node!=='none'||anim.route!=='none'||anim.cloud!=='none')fail(`reduced motion still animated ${JSON.stringify(anim)}`);await reduced.screenshot({path:'atlas-audit/states/reduced.png',fullPage:true});
          // All eight local texture assets must actually load from runtime path.
          const assets=['sunpetal','lanternwood','lodestone','masquerade','prism','copperline','stormswitch','aurora'];for(const a of assets){const ok=await reduced.evaluate(async a=>{const r=await fetch(`assets/level-select/${a}.webp`);return r.ok&&(await r.blob()).size>5000},a);if(!ok)fail(`texture ${a} failed runtime load`)}
          fs.writeFileSync('atlas-audit/report.json',JSON.stringify({...report,failures},null,2));await browser.close();if(failures.length)throw new Error(`Skyway Atlas audit failed with ${failures.length} issue(s)`);console.log('SKYWAY_ATLAS_V1_ACCEPTED');
          JS
          node atlas-check.mjs
      - name: Commit accepted product
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json atlas-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game400-a.js style400-skyway-atlas.css LEVEL_SELECT_ART_DIRECTION.md ART_ASSET_CREDITS.md assets/level-select/*.webp
          git commit -m "Rebuild Level Select as Skyway Atlas"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyway-atlas-v1-renders
          path: atlas-audit
          if-no-files-found: warn
      - name: Self-remove
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --ff-only origin main
          rm -f package.json package-lock.json atlas-check.mjs
          git rm .github/workflows/build-skyway-atlas-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Skyway Atlas v1 workflow"
          git push
