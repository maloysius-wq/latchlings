          }
          @media(max-width:340px){.atlas-shell{padding-left:7px;padding-right:7px}.atlas-region-dots{gap:5px}.atlas-waypoint-nav{gap:3px}.atlas-waypoint-tab span{letter-spacing:0}.atlas-chapter-copy .theme-kicker{font-size:7px}.atlas-chapter-copy h2{font-size:15px}}
          @media(prefers-reduced-motion:reduce){.atlas-shell:before,.atlas-shell:after,#levels .atlas-node,.atlas-route,.atlas-pennant,.atlas-guide,.atlas-guide-eyes,#levels .atlas-continue:before{animation:none!important}}
          CSS
      - name: Patch Level Select markup, renderer, and credits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='<link rel="stylesheet" href="style400-themes.css">'
          new=old+'\n<link rel="stylesheet" href="style400-skyway-atlas.css">'
          if 'style400-skyway-atlas.css' not in s:s=s.replace(old,new,1)
          old_block='''  <main id="levels" class="screen">\n    <div class="topbar card"><button class="iconbtn" id="levelsBack" aria-label="Back"></button><div class="game-title" style="font-size:23px">Level Select</div><div class="spacer"></div></div>\n    <div id="chapterHead" class="chapter-head card"></div>\n    <div id="chapterNav" class="chapter-nav"></div>\n    <div id="rangeNav" class="range-nav"></div>\n    <div id="levelGrid" class="level-grid card"></div>\n    <div class="level-footer"><button class="secondary-btn" id="resetProgressBtn">Reset Progress</button><button class="secondary-btn" id="continueBtn">Continue</button></div>\n  </main>'''
          new_block='''  <main id="levels" class="screen atlas-screen" aria-label="Skyway Atlas level select">\n    <section class="atlas-shell">\n      <header class="atlas-top">\n        <button class="atlas-round-btn" id="levelsBack" aria-label="Return to Little Home"></button>\n        <div class="atlas-title-lockup"><span class="atlas-kicker">Waykeeper's</span><strong>Skyway Atlas</strong></div>\n        <button class="atlas-round-btn atlas-tools" id="resetProgressBtn" aria-label="Reset campaign progress" title="Reset progress">•••</button>\n      </header>\n      <div id="chapterHead" class="atlas-chapter-head"></div>\n      <div id="chapterNav" class="atlas-chapter-nav" aria-label="Chapter navigation"></div>\n      <div id="rangeNav" class="atlas-waypoint-nav" aria-label="Chapter waypoints"></div>\n      <div id="levelGrid" class="atlas-map" aria-label="Current Skyway route"></div>\n      <div class="level-footer atlas-footer"><button class="atlas-continue" id="continueBtn"><span>Continue journey</span><b>Level 1</b></button></div>\n    </section>\n  </main>'''
          if old_block not in s: raise SystemExit('Level Select markup anchor missing')
          s=s.replace(old_block,new_block,1);p.write_text(s)

          p=Path('game400-a.js'); s=p.read_text(); start=s.index('function renderChapter(){'); end=s.index('function startLevel(L){',start)
          block=r'''const ATLAS_WAYPOINTS=[
           ['Morning Path','Meadow Detour','Open Fields','Routeworks','Sunset Return'],
