          @keyframes atlasRouteTravel{to{stroke-dashoffset:-18}}
          @keyframes atlasActiveRoute{0%,100%{opacity:.68;stroke-dashoffset:0}50%{opacity:1;stroke-dashoffset:-7}}
          @keyframes atlasPennant{0%,100%{translate:-50% 0}50%{translate:-50% -2px}}
          @keyframes atlasGuideBob{0%,100%{translate:0 0}50%{translate:0 -2px}}
          @keyframes atlasGuideBlink{0%,46%,50%,100%{scale:1 1}48%{scale:1 .08}}
          @keyframes atlasContinueShine{0%,72%{translate:-120% 0}100%{translate:420% 0}}

          @media(max-height:720px){
