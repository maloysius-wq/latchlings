name: Close Story Residents Opening Deep Audit Handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-story-residents-opening-deep-audit.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff entry
        env:
          SUMMARY_B64: 
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-10 — Deep audit Story/Residents Latchling faces and opening cinematic clipping'
          start=s.index(heading)
          end=s.find('\n### ',start+len(heading))
          if end<0:end=len(s)
          block=s[start:end]
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary=base64.b64decode(os.environ['SUMMARY_B64']).decode()
          if '#### Completion summary' not in block:block=block.rstrip()+'\n\n'+summary+'\n'
          p.write_text(s[:start]+block+s[end:])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Close Story Residents opening deep audit handoff"
          git push
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/close-story-residents-opening-deep-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Story Residents handoff closeout workflow"
          git push
