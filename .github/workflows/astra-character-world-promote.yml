name: Astra Character World Promote

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/astra-character-world-promote.yml

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify promotion base
        shell: bash
        run: |
          git merge-base --is-ancestor e913ba53681bbf16ae0b2c6f9a8ca0a49abf8665 HEAD
          test "$(git diff --name-only e913ba53681bbf16ae0b2c6f9a8ca0a49abf8665..HEAD | sort -u)" = ".github/workflows/astra-character-world-promote.yml"
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js > /tmp/campaign-before.sha256
          sha256sum cinematics400.js cinematic-dialogue400.js style400-cinematics.css style400-cinematics-dialogue.css style400-ui.css pass3-chapter5-prism.js pass3-chapter5-prism.css pass3-chapter6-copperline.js pass3-chapter6-copperline.css pass3-chapter7-stormswitch.js pass3-chapter7-stormswitch.css pass3-chapter8-aurora.js pass3-chapter8-aurora.css > /tmp/accepted-before.sha256
      - name: Promote exact accepted candidate bytes
        shell: bash
        run: |
          git fetch origin astra-character-world-coherence
          git cat-file -e c4cab777dceb1b2162efa42fbd2fa126ef57b84a^{commit}
          git checkout c4cab777dceb1b2162efa42fbd2fa126ef57b84a -- \
            story-grounding400.js \
            gameplay-story-rail400.js \
            story-theme400.js \
            game400-a.js \
            game400-b.js \
            title-island-concepts/index.html \
            style400-story-theme.css \
            style400-skyway-atlas.css \
            index.html
          sha256sum -c /tmp/campaign-before.sha256
          sha256sum -c /tmp/accepted-before.sha256
          git diff --exit-code -- campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js cinematics400.js cinematic-dialogue400.js style400-cinematics.css style400-cinematics-dialogue.css style400-ui.css pass3-chapter5-prism.js pass3-chapter5-prism.css pass3-chapter6-copperline.js pass3-chapter6-copperline.css pass3-chapter7-stormswitch.js pass3-chapter7-stormswitch.css pass3-chapter8-aurora.js pass3-chapter8-aurora.css
          printf '%s\n' \
            game400-a.js \
            game400-b.js \
            gameplay-story-rail400.js \
            index.html \
            story-grounding400.js \
            story-theme400.js \
            style400-skyway-atlas.css \
            style400-story-theme.css \
            title-island-concepts/index.html \
            | sort > /tmp/expected-product-files.txt
          git diff --name-only | sort > /tmp/actual-product-files.txt
          diff -u /tmp/expected-product-files.txt /tmp/actual-product-files.txt
          node --check story-grounding400.js
          node --check gameplay-story-rail400.js
          node --check story-theme400.js
          node --check game400-a.js
          node --check game400-b.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          h=Path('title-island-concepts/index.html').read_text()
          for n,script in enumerate(re.findall(r'<script>(.*?)</script>',h,re.S)):
              p=Path(f'/tmp/home-{n}.js')
              p.write_text(script)
              subprocess.run(['node','--check',str(p)],check=True)
          assert 'data-story-role="motive"' in Path('gameplay-story-rail400.js').read_text()
          assert 'movementFixtureFor' in Path('story-grounding400.js').read_text()
          assert 'expressionForLine' in Path('story-theme400.js').read_text()
          assert 'atlasLandmarkFor' in Path('game400-a.js').read_text()
          assert 'data-resident="Pip"' in h and 'data-resident="Tansy"' in h
          PY
      - name: Commit promoted product
        shell: bash
        run: |
          git config user.name "maloysius-wq"
          git config user.email "maloysius@gmail.com"
          git add story-grounding400.js gameplay-story-rail400.js story-theme400.js game400-a.js game400-b.js title-island-concepts/index.html style400-story-theme.css style400-skyway-atlas.css index.html
          git diff --cached --check
          git commit -m "Promote accepted character world coherence"
          git push origin HEAD:main
          git rev-parse HEAD
