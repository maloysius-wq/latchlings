name: Remove Stray Cinematic Island Caps
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-opening-island-caps.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove legacy island cap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('style400-cinematics-polish.css')
          s=p.read_text()
          anchor='.cin-island{width:92px!important;height:82px!important;border-radius:0!important;background:none!important;clip-path:none!important;box-shadow:none!important;filter:drop-shadow(0 9px 8px rgba(40,63,77,.18));overflow:visible!important;isolation:isolate}\n'
          rule='/* The textured island primitive replaces the legacy floating green cap from the original prototype. */\n.cin-island:after{display:none!important;content:none!important}\n'
          if rule not in s:
              if anchor not in s: raise SystemExit('cin-island polish anchor missing')
              s=s.replace(anchor,anchor+rule,1)
              p.write_text(s)
          PY
          grep -Fq '.cin-island:after{display:none!important;content:none!important}' style400-cinematics-polish.css
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-http.log 2>&1 &
      - name: Render and verify opening islands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p island-cap-audit
          cat > audit-island-cap.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForFunction(()=>window.LatchlingsCinematics?.show);
          const assert=(v,msg)=>{if(!v)throw new Error(msg)};
          const metrics={};
          async function inspectBeat(index,name){
            await page.evaluate((target)=>{
              const c=window.LatchlingsCinematics;
              while(c.beat<target)c.next();
            },index);
            await page.waitForTimeout(250);
            const m=await page.evaluate(()=>{
              const islands=[...document.querySelectorAll('#cinematicStage .cin-island')];
              const first=islands[0];
              const top=first?.querySelector('.cin-island-top');
              const after=first?getComputedStyle(first,'::after'):null;
              return {
                cinematic:document.querySelector('#cinematicOverlay')?.dataset.cinematic,
                visual:document.querySelector('#cinematicOverlay')?.dataset.visual,
                islands:islands.length,
                routes:document.querySelectorAll('#cinematicStage .cin-route').length,
                props:document.querySelectorAll('#cinematicStage .cin-island-prop').length,
                legacyAfterDisplay:after?.display,
                legacyAfterContent:after?.content,
                texturedTopDisplay:top?getComputedStyle(top).display:null,
                texturedTopBackground:top?getComputedStyle(top).backgroundImage:null
              };
            });
            assert(m.cinematic==='opening',`${name}: not opening cinematic`);
            assert(m.islands===5,`${name}: expected 5 islands, got ${m.islands}`);
            assert(m.routes===4,`${name}: expected 4 routes, got ${m.routes}`);
            assert(m.props===5,`${name}: expected 5 island props, got ${m.props}`);
            assert(m.legacyAfterDisplay==='none' || m.legacyAfterContent==='none',`${name}: legacy green cap still renders`);
            assert(m.texturedTopDisplay!=='none',`${name}: textured grass top was removed`);
            assert((m.texturedTopBackground||'').includes('grass.jpg'),`${name}: textured grass top lost its material`);
            metrics[name]=m;
            await page.locator('.cinematic-shell').screenshot({path:`island-cap-audit/${name}.png`});
          }
          await page.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));
          await page.waitForTimeout(250);
          await inspectBeat(0,'opening-beat-1');
          await inspectBeat(2,'opening-beat-3');
          await inspectBeat(3,'opening-beat-4');
          await page.evaluate(()=>window.LatchlingsCinematics.finish(true));
          await page.waitForTimeout(100);
          await page.evaluate(()=>window.LatchlingsCinematics.show('across-drift',{markSeen:false}));
          await page.waitForTimeout(250);
          const later=await page.evaluate(()=>{
            const islands=[...document.querySelectorAll('#cinematicStage .cin-island')];
            const after=islands[0]?getComputedStyle(islands[0],'::after'):null;
            return {islands:islands.length,legacyAfterDisplay:after?.display,legacyAfterContent:after?.content,topDisplay:islands[0]?.querySelector('.cin-island-top')?getComputedStyle(islands[0].querySelector('.cin-island-top')).display:null};
          });
          assert(later.islands===5,'later cinematic island count changed');
          assert(later.legacyAfterDisplay==='none' || later.legacyAfterContent==='none','legacy cap survived later cinematic');
          assert(later.topDisplay!=='none','later cinematic textured island top missing');
          metrics['later-regression']=later;
          await page.locator('.cinematic-shell').screenshot({path:'island-cap-audit/later-prism-regression.png'});
          fs.writeFileSync('island-cap-audit/metrics.json',JSON.stringify(metrics,null,2));
          await browser.close();
          JS
          node audit-island-cap.mjs
      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-cinematics-polish.css
          git commit -m "Remove stray cinematic island caps"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: cinematic-island-cap-audit
          path: island-cap-audit
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm -f .github/workflows/remove-opening-island-caps.yml audit-island-cap.mjs package.json package-lock.json
          git add .github/workflows/remove-opening-island-caps.yml
          git commit -m "Remove island cap cleanup workflow"
          git push
