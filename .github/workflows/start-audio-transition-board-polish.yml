name: Start audio transition board polish handoff
on:
  push:
    paths:
      - '.github/workflows/start-audio-transition-board-polish.yml'
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record IN PROGRESS handoff
        shell: bash
        env:
          ENTRY_B64: 
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          marker='## Current Work\n\n'
          if marker not in s:
              raise SystemExit('Current Work marker missing')
          entry=base64.b64decode(os.environ['ENTRY_B64']).decode()
          title=entry.splitlines()[0]
          if title in s:
              raise SystemExit('handoff entry already exists')
          p.write_text(s.replace(marker,marker+entry,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Start audio transition board polish handoff'
          git push
      - name: Self-remove starter
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/start-audio-transition-board-polish.yml
          git commit -m 'Remove audio transition board polish starter'
          git push
