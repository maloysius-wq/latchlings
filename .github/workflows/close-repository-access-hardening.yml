name: Close Repository Access Hardening

on:
  push:
    paths:
      - '.github/workflows/close-repository-access-hardening.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete hardening handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          title='### 2026-09-02 — Harden GitHub-plugin-first repository access preflight'
          start=t.index(title)
          end=t.index('\n---\n', start)
          section=t[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in section:
              section += '''\n\n#### Completion summary\n\n**What was fixed:** Replaced the earlier single prose invariant with a three-layer durable repository preflight. Added root `AGENTS.md` with a FIRST ACTION RULE requiring GitHub plugin discovery/loading before any local/container/web route. Added `.github/REPOSITORY_ACCESS_PREFLIGHT.md` with the explicit decision tree, invalid-evidence list, strict two-part failure criterion for ever saying GitHub is unavailable, immediate recovery rule, and tool-classification rule preventing repository UI work from being misrouted to unrelated tools. Strengthened the top of this handoff into `REPOSITORY ACCESS PRE-FLIGHT — HARD GATE`, explicitly requiring connector discovery as the first tool action when GitHub functions are not loaded and `GitHub.fetch_file` of this handoff as the first repository read. Added `.github/workflows/validate-repository-access-guard.yml` so removal or weakening of the required sentinel instructions causes CI failure.\n\n**Why this is stronger than the previous fix:** The prior fix existed only as prose inside this handoff and could still be bypassed by making the wrong tool choice before reading the file. The new rule is duplicated at the root agent-instruction layer (`AGENTS.md`), the dedicated repository preflight layer, and the handoff layer, with CI protecting those surfaces from accidental removal. The recovery contract also explicitly says that local clone/DNS/web failure is not GitHub failure and that an agent must recover through the plugin without asking the user to repeat the instruction.\n\n**Files changed:** `AGENTS.md`, `.github/REPOSITORY_ACCESS_PREFLIGHT.md`, `.github/workflows/validate-repository-access-guard.yml`, and `DEVELOPMENT_HANDOFF.md`. Temporary self-removing workflow files used for atomic edits were removed. No production title, design concept, campaign, game runtime, texture, or other product files changed.\n\n**Validation:** Repository access guard run `33682109007` completed successfully and verified all required GitHub-first sentinels across the three durable instruction surfaces. An earlier guard run `33682014157` failed only because one sentinel grep did not account for Markdown bold markup in the preflight text; the guard expression was corrected and rerun successfully. A GitHub compare from pre-task commit `fba3f18e0f0a9c8d2a2aa0cf3b6800025a2e3810` through hardened commit `76d2b76bd905bcc60280d4f07759e7747aa67bed` confirmed only the four intended process/instruction files differ. The GitHub plugin itself successfully read the hardened `DEVELOPMENT_HANDOFF.md`, `AGENTS.md`, and preflight file after implementation.\n\n**Key commits:** `b740a1083326021f26df59ebf638be8c57c33bc1` added `AGENTS.md`; `c49d07966fe188590cb254b650409b2255823e0c` added the dedicated preflight contract; `aefd0d2` strengthened the handoff hard gate; `76d2b76bd905bcc60280d4f07759e7747aa67bed` finalized the passing CI guard checks.\n\n**Deployment:** No product deployment was required because this task changed repository/agent-process files only.\n\n**Remaining limitation:** This repository hardening cannot modify ChatGPT's base model weights or the platform's underlying tool-selection router. Therefore it is not a mathematical guarantee that a future model instance can never choose the wrong first tool. What is now fixed is the strongest durable layer available from this chat: multiple agent/repository instruction surfaces, an explicit failure criterion and recovery path, and CI protection against regression. Within this repository workflow, the user should not need to repeat “use the GitHub plugin.”\n\n**Next action:** Resume normal Latchlings development. For the next repository request, GitHub plugin discovery/loading is the mandatory first tool action if GitHub functions are not already loaded.\n'''
          t=t[:start]+section+t[end:]
          p.write_text(t)
          PY
          rm -f .github/workflows/close-repository-access-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-repository-access-hardening.yml
          git commit -m 'Complete repository access hardening handoff'
          git pull --rebase origin main
          git push origin HEAD:main
