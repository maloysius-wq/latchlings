name: Validate Early Story Final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-early-story-final.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Final static assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          rail=Path('gameplay-story-rail400.js').read_text()
          bible=Path('STORY_BIBLE.md').read_text()
          cin=Path('cinematics400.js').read_text()
          dialog=Path('cinematic-dialogue400.js').read_text()
          assert 'I checked three more old markers. Every one points to where an island used to be, never where it is now.' in rail
          assert 'We have our answer: the Skyway is not broken. Its map is old. Now we can rebuild Sunpetal around where everyone is today.' in rail
          assert 'stabilize Sunpetal using routes based on where the islands are now' in bible
          for text in [cin,dialog]:
              assert 'routes for islands that have already moved' in text
              assert 'one strange morning or something much larger' in text
          assert rail.count('report:true') == 5
          print('EARLY_STORY_FINAL_STATIC_OK')
          PY
          if git diff --name-only 4054bf95a337b888be11e9af92e81e100771a03d HEAD | grep -Eq '^campaign400-[1-8]\.js$'; then
            echo 'Campaign data changed unexpectedly'; exit 1
          fi
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Final browser acceptance
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/final-story-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          mkdir -p early-story-final
          cat > early-story-final/final.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
          await page.addInitScript(()=>{
            localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars:{}}));
            localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1}));
          });
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.evaluate(()=>{try{document.startViewTransition=undefined}catch(_){}});
          const expected={
            19:'I checked three more old markers. Every one points to where an island used to be, never where it is now.',
            20:'We have our answer: the Skyway is not broken. Its map is old. Now we can rebuild Sunpetal around where everyone is today.'
          };
          for(const level of [19,20,21]){
            await page.evaluate(l=>window.startLevel(l),level);await page.waitForTimeout(140);
            const d=await page.evaluate((l)=>{
              const host=document.getElementById('mechanicNote'),rail=host?.querySelector('.story-level-rail'),r=rail?.getBoundingClientRect();
              return {line:host?.querySelector('.story-rail-main p')?.textContent?.trim()||'',report:!!host?.querySelector('.story-rail-report'),left:r?.left||0,right:r?.right||0,height:r?.height||0,w:innerWidth,scroll:document.documentElement.scrollWidth};
            },level);
            if(expected[level]&&d.line!==expected[level])throw new Error(`Level ${level} final copy mismatch`);
            if(d.report!==(level===20))throw new Error(`Level ${level} report state mismatch`);
            if(d.left < -1 || d.right > d.w+1 || d.scroll>d.w || d.height<90 || d.height>98)throw new Error(`Level ${level} rail geometry regression ${JSON.stringify(d)}`);
            await page.evaluate(()=>{const o=document.getElementById('storyCardOverlay');if(o){o.classList.remove('show');o.setAttribute('aria-hidden','true');o.style.display='none'}});
            await page.locator('#mechanicNote').screenshot({path:`early-story-final/rail-${level}.png`});
          }
          await page.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));await page.waitForTimeout(180);
          for(let i=1;i<=7;i++){
            if(i===4||i===7){
              const d=await page.evaluate(()=>({src:window.LatchlingsCinematics.CINEMATICS.opening.beats[window.LatchlingsCinematics.beat].lines.filter(x=>x[0]==='Narrator').map(x=>x[1]).join(' '),vis:[...document.querySelectorAll('#cinematicLines .narrator-only span')].map(x=>x.textContent.trim()).join(' '),scroll:document.documentElement.scrollWidth,w:innerWidth}));
              if(d.src!==d.vis||d.scroll>d.w)throw new Error(`Opening beat ${i} runtime mismatch`);
              if(i===4&&!d.src.includes('routes for islands that have already moved'))throw new Error('Beat 4 premise missing');
              if(i===7&&!d.src.includes('one strange morning or something much larger'))throw new Error('Beat 7 objective missing');
              await page.screenshot({path:`early-story-final/opening-beat-${i}.png`,fullPage:true});
            }
            if(i<7){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(140)}
          }
          if(pageErrors.length)throw new Error('Page errors: '+pageErrors.join(' | '));
          console.log('EARLY_STORY_FINAL_BROWSER_OK');await browser.close();
          JS
          node early-story-final/final.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: early-story-final-acceptance
          path: early-story-final/*.png
          if-no-files-found: error
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          rm -f .github/workflows/validate-early-story-final.yml
          git add .github/workflows/validate-early-story-final.yml
          git commit -m "Remove final early story validator"
          git push
