name: Fix Little Home Cottage Roof
on:
  push:
    paths:
      - '.github/workflows/fix-little-home-cottage-roof.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply roof seam fix
        run: |
          set -euo pipefail
          grep -q 'Fix Little Home cottage roof seam' DEVELOPMENT_HANDOFF.md
          python3 - <<'PY'
          from pathlib import Path
          p=Path('title-island-concepts/index.html')
          t=p.read_text()
          old='.roof-b{left:70px;width:40px;clip-path:polygon(0 69%,21% 0,100% 64%,100% 90%,0 86%);filter:brightness(.78)}'
          new='.roof-b{left:64px;width:46px;clip-path:polygon(0 69%,30% 0,100% 64%,100% 90%,0 86%);filter:brightness(.78)}'
          if old not in t:
              raise SystemExit('Expected roof-b rule not found')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Static validation
        run: |
          set -euo pipefail
          grep -q '.roof-b{left:64px;width:46px;clip-path:polygon(0 69%,30% 0,100% 64%,100% 90%,0 86%);filter:brightness(.78)}' title-island-concepts/index.html
          git diff --exit-code -- index.html style400-game.css style400-story-theme.css story-theme400.js game400-a.js game400-b.js story400.js music400.js sfx400.js campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
      - name: Install Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/roof-audit"
          cd "$RUNNER_TEMP/roof-audit"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Validate and render production title composition
        run: |
          set -euo pipefail
          python3 -m http.server 8154 >/tmp/little-home-roof-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cat > "$RUNNER_TEMP/roof-audit/audit.mjs" <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8154/title-island-concepts/?c=2&embed=1',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('#c2 .cottage .roof-b');
          const data=await page.evaluate(()=>{
            const cottage=document.querySelector('#c2 .cottage');
            const a=cottage.querySelector('.roof-a'),b=cottage.querySelector('.roof-b');
            const cr=cottage.getBoundingClientRect(),ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
            const residents=[...document.querySelectorAll('#c2 .latchling')].map(x=>({role:x.dataset.role,w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height}));
            return {
              cottage:{w:cr.width,h:cr.height},
              roofA:{x:ar.x,y:ar.y,w:ar.width,h:ar.height,right:ar.right},
              roofB:{x:br.x,y:br.y,w:br.width,h:br.height,right:br.right},
              overlap:ar.right-br.x,
              residents,
              horizontalOverflow:document.documentElement.scrollWidth>innerWidth+1
            };
          });
          if(Math.abs(data.cottage.w-122.1)>.5 || Math.abs(data.cottage.h-110)>.5) throw new Error('Scaled cottage footprint changed '+JSON.stringify(data));
          if(data.overlap<8) throw new Error('Roof planes do not overlap enough '+JSON.stringify(data));
          const adults=data.residents.filter(x=>x.role==='adult'), kids=data.residents.filter(x=>x.role==='child');
          if(adults.length!==3||kids.length!==2) throw new Error('Resident roster changed '+JSON.stringify(data));
          if(!adults.every(x=>Math.abs(x.w-34)<.3&&Math.abs(x.h-34)<.3)) throw new Error('Adult resident size changed '+JSON.stringify(data));
          if(!kids.every(x=>Math.abs(x.w-25)<.3&&Math.abs(x.h-25)<.3)) throw new Error('Child resident size changed '+JSON.stringify(data));
          if(data.horizontalOverflow) throw new Error('Horizontal overflow '+JSON.stringify(data));
          if(errors.length) throw new Error(errors.join(' | '));
          await page.screenshot({path:'little-home-cottage-roof-fixed.png',fullPage:true});
          console.log('LITTLE_HOME_COTTAGE_ROOF_OK',JSON.stringify(data));
          await browser.close();
          JS
          cd "$RUNNER_TEMP/roof-audit"
          node audit.mjs
          cp little-home-cottage-roof-fixed.png "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: little-home-cottage-roof-fixed
          path: little-home-cottage-roof-fixed.png
          if-no-files-found: error
      - name: Commit validated product and self-remove
        run: |
          set -euo pipefail
          rm -f little-home-cottage-roof-fixed.png
          rm -f .github/workflows/fix-little-home-cottage-roof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/fix-little-home-cottage-roof.yml
          git commit -m 'Join Little Home cottage roof planes'
          git pull --rebase origin main
          git push origin HEAD:main
