name: Revalidate Chapter 1 production evidence

on:
  push:
    paths:
      - '.github/workflows/validate-chapter1-production-evidence.yml'
      - '.github/tmp/validate-chapter1-production-evidence.mjs'

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect accepted product and authored sources
        run: sha256sum game400-a.js game400-b.js index.html style400-production-slice.css campaign400-{1,2,3,4,5,6,7,8}.js story400.js story-grounding400.js cinematics400.js title-island-concepts/index.html > /tmp/evidence-protected.sha256

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture settled Chapter 1 evidence
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-ch1-evidence-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 180s node .github/tmp/validate-chapter1-production-evidence.mjs
          sha256sum -c /tmp/evidence-protected.sha256

      - name: Upload corrected visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: chapter1-production-evidence
          path: /tmp/chapter1-production-evidence

      - name: Self-remove evidence helpers
        run: |
          rm -rf node_modules
          git reset --hard HEAD
          git clean -fd
          git pull --rebase
          git rm .github/workflows/validate-chapter1-production-evidence.yml .github/tmp/validate-chapter1-production-evidence.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove Chapter 1 evidence validator"
          git push
