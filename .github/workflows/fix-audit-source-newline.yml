name: Fix audit source newline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-audit-source-newline.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore exact uploaded file ending
        shell: bash
        run: |
          test "$(git hash-object LATCHLINGS_IMPLEMENTATION_REVIEW.md)" = "cd6e752b0feadff593681abb4aab59d8e84adc71"
          printf '\n' >> LATCHLINGS_IMPLEMENTATION_REVIEW.md
          test "$(git hash-object LATCHLINGS_IMPLEMENTATION_REVIEW.md)" = "9b7413371d8833d7e1fc5c26b89373244ac3dc86"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add LATCHLINGS_IMPLEMENTATION_REVIEW.md
          git commit -m "Match uploaded implementation review exactly"
          git push origin HEAD:main
