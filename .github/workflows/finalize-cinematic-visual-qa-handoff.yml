name: Finalize Cinematic Visual QA Handoff
on:
  push:
    paths:
      - '.github/workflows/finalize-cinematic-visual-qa-handoff.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close completed visual QA journal entry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('DEVELOPMENT_HANDOFF.md')
          text = path.read_text()
          heading = '### 2026-09-04 — Professional visual QA and title-parity cinematic rebuild'
          next_heading = '\n---\n\n### 2026-09-04 — Add animated campaign cinematics and durable cinematic script'
          start = text.index(heading)
          end = text.index(next_heading, start)
          block = text[start:end]
          if '**Status: IN PROGRESS**' not in block:
              raise SystemExit('Expected IN PROGRESS status not found in cinematic visual QA entry')
          if '#### Completion summary' in block:
              raise SystemExit('Completion summary already exists in cinematic visual QA entry')

          block = block.replace('**Status: IN PROGRESS**', '**Status: COMPLETED**', 1).rstrip()
          block += r'''

#### Completion summary

**Baseline findings:** GitHub Actions run `33917746826` rendered every one of the 24 authored cinematic beats at the production phone viewport and produced artifact `9953815251` (`baseline-all-24-cinematic-beats`). Manual inspection confirmed the user-reported quality gap: the original cinematics were functionally correct but several beats read as flat diagram/presentation language rather than finished Latchlings-world scenes. The weakest surfaces were the simplified Little Home imitation, repeated flat half-islands, the porch/telescope beat, keepsake grid, floating route-drafting graphic, Copperline automation panel, and the final Homeward network composition.

**Title-parity decision / implementation:** The key fix was to stop maintaining a second hand-copied Little Home. The production-selected `#c2` scene in `title-island-concepts/index.html` now supports a non-default scene-only cinematic mode, and cinematic Little Home beats embed that canonical scene directly. As a result the cutscenes use the same locally vendored CC0 `grass.jpg`, `earth.jpg`, and `wood.jpg` materials; layered earth side/rim/grass top; cottage; detailed rooted tree; path; rocks; flowers; floating debris; and five-resident choreography as the title page. Normal title behavior remains unchanged outside the explicit cinematic query mode.

**World-wide visual rebuild:** The rest of the cinematic presentation was raised to the same material/depth language instead of merely decorating the old placeholders. Generic islands gained textured volumetric earth/grass construction and stronger regional variation; map beats gained physical wood/paper staging; Prism Gardens gained a clearer crystal-garden identity; the familiar-porch scene gained a modeled foreground and proper three-leg telescope mount; keepsakes became centered physical regional tokens; route drafting and Copperline automation were rebuilt to read as world objects/equipment rather than floating infographic symbols; and Homeward was recomposed so the canonical transparent Little Home scene sits inside the surrounding living regional network instead of covering it with an iframe/document rectangle. The final detail pass also removed the visible Homeward vignette boundary.

**Product files changed:** Relative to the committed task-start state `18657af189e506b6d9883079dd9287fe45724342`, the durable product changes are limited to `cinematics400.js`, `index.html`, new `style400-cinematics-polish.css`, new `style400-cinematics-refine.css`, new `style400-cinematics-refine2.css`, and `title-island-concepts/index.html`. `DEVELOPMENT_HANDOFF.md` is the only journal file changed. Campaign definitions, solver data, gameplay rules, Story Card canon, audio, and the Level 400 ending were not changed by this visual-QA task.

**Visual validation:** The first rebuilt all-24 pass, run `33918496593`, succeeded and produced artifact `9954085759` (`polished-all-24-cinematic-beats`). Manual inspection drove additional refinements instead of accepting the first green render. Final all-beat acceptance run `33918955969` then succeeded with artifact `9954266731` (`final-all-24-cinematic-beats-v2`), covering all 24 beats plus representative wide/reduced-motion behavior and material/compositing assertions. A final focused detail audit, run `33919269110`, succeeded with artifact `9954377276` (`final-cinematic-detail-renders`) and re-rendered the last manually rejected surfaces: Prism Gardens, A Familiar Porch, Homeward, and the untouched normal title screen. Those final full-resolution frames were manually inspected and accepted; the normal title remained outside cinematic mode with its play control and five residents intact.

**Accepted product state / deployment:** Audit cleanup commit `291c7ab5f43651ec8205e9f741b64e17d3b63be2` (`Complete final cinematic detail audit`) is the accepted audit-clean product state. GitHub Pages run `33919324380` completed successfully for that exact SHA, so the accepted visual build is deployed.

**Repository hygiene / remaining risk:** All temporary cinematic audit workflows self-removed; after this documentation-only finalizer removes itself, `.github/workflows/validate-repository-access-guard.yml` should again be the only durable workflow. No blocking visual defect remains from this task. The visual QA intentionally rendered cinematic beats directly rather than replaying the entire 400-level campaign; cinematic trigger/progression behavior was already covered by the prior completed cinematic-system task. Future feature work should start from current `main` with a new `IN PROGRESS` handoff entry rather than reopening this completed visual pass.
'''
          path.write_text(text[:start] + block + text[end:])
          PY
          rm -f .github/workflows/finalize-cinematic-visual-qa-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/finalize-cinematic-visual-qa-handoff.yml
          git commit -m 'Close cinematic visual QA handoff'
          git pull --rebase origin main
          git push origin HEAD:main
