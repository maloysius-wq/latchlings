name: Finalize Title Concepts

on:
  push:
    paths:
      - '.github/workflows/finalize-title-concepts.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify final Nursery viewport fit
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          python3 -m http.server 8000 >/tmp/title-final-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            p.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            p.on('pageerror',e=>errors.push(String(e)));
            await p.goto('http://127.0.0.1:8000/title-concepts/concept.html?c=2&clean=1',{waitUntil:'networkidle'});
            const m=await p.evaluate(()=>({sw:document.documentElement.scrollWidth,sh:document.documentElement.scrollHeight,iw:innerWidth,ih:innerHeight}));
            console.log(m);
            if(m.sw>m.iw+2 || m.sh>m.ih+2) throw new Error(`Nursery overflow remains: ${JSON.stringify(m)}`);
            if(errors.length) throw new Error(errors.join(' | '));
            await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Complete development handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          text=p.read_text()
          title='### 2026-08-31 — Ten browser-rendered title-page concepts'
          start=text.index(title)
          end=text.index('\n---\n',start)
          section=text[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          completion=base64.b64decode('').decode('utf-8')
          if '#### Completion summary' not in section:
              section += completion
          text=text[:start]+section+text[end:]
          p.write_text(text)
          PY
      - name: Commit handoff and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-title-concepts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/finalize-title-concepts.yml
          git commit -m 'Complete title page concept handoff'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
