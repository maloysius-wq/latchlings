name: Validate Atlas reward pacing
on:
  push:
    paths:
      - '.github/workflows/validate-atlas-reward-pacing.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        run: |
          sha256sum game400-b.js sfx400.js style400-ui.css style400-game.css style400-themes.css style400-skyway-atlas.css style400-atlas-progression.css style400-board-surfaces.css style400-cinematics*.css cinematics400.js cinematic-dialogue400.js cinematic-geometry400.js story400.js story-grounding400.js campaign400-*.js title-island-concepts/index.html > /tmp/atlas-pacing-protected.sha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Apply Atlas pacing candidate
        run: |
          python3 .github/tmp/apply-atlas-reward-pacing.py
          python3 .github/tmp/refine-atlas-reward-pacing.py
          node --check game400-a.js
          node --check music400.js
          git diff --check
          grep -q 'const ATLAS_REWARD_TIME_SCALE=1.7' game400-a.js
          grep -q 'atlasRewardMs(2080)' game400-a.js
          grep -q 'atlasRewardMs(2920)' game400-a.js
          grep -q 'atlasRewardMs(970)' game400-a.js
          grep -q "atlas-music-hold" game400-a.js
          grep -q 'const ATLAS_FADE_MS = Math.round(FADE_MS \* 1.7)' music400.js
          grep -q 'atlasRewardScreenActive' music400.js
          grep -q 'game400-a.js?v=20260911-atlaspace1' index.html
          grep -q 'music400.js?v=20260911-atlaspace1' index.html
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/atlas-pacing-http.log 2>&1 &
      - name: Browser-check Atlas timing and music continuity
        run: |
          node .github/tmp/validate-atlas-reward-pacing.mjs
          echo ATLAS_REWARD_PACING_ACCEPTED
      - name: Verify protected source unchanged
        run: sha256sum -c /tmp/atlas-pacing-protected.sha
      - name: Commit accepted product change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game400-a.js music400.js index.html
          git commit -m 'Slow Atlas reward and smooth music handoff'
          git push
      - name: Upload pacing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reward-pacing-audit
          path: atlas-reward-pacing-audit
          if-no-files-found: warn
      - name: Self-remove validation helpers
        if: always()
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/validate-atlas-reward-pacing.yml .github/tmp/apply-atlas-reward-pacing.py .github/tmp/refine-atlas-reward-pacing.py .github/tmp/validate-atlas-reward-pacing.mjs
          git commit -m 'Remove Atlas reward pacing validator'
          git push
