name: Reconcile Character World Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-character-world-docs.yml'
      - '.github/tmp/astra_character_world_docs.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply accepted evidence to durable docs
        run: |
          python .github/tmp/astra_character_world_docs.py
          git diff --check
          grep -F '| N04 information-layer roles | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| V06 discoverable keepsakes | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| N05 characterization through behavior | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| V07 depth hierarchy | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F '| V12 meaningful Atlas landmarks | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -F 'Accepted Character/world coherence checkpoint' DEVELOPMENT_HANDOFF.md
          grep -F 'Next action: Presentation/accessibility consolidation candidate.' DEVELOPMENT_HANDOFF.md
      - name: Commit reconciled docs
        run: |
          git config user.name "maloysius-wq"
          git config user.email "maloysius@gmail.com"
          git add DEVELOPMENT_HANDOFF.md ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          git commit -m "Accept character world coherence slice"
          git push origin HEAD:main
