name: Validate Final Cinematic Little Home
on:
  push:
    paths:
      - '.github/workflows/audit-final-cinematic-home.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static scenery assertions
        run: |
          set -euo pipefail
          grep -q '.cin-home-island:before' style400-cinematics.css
          grep -q '.cin-cottage.*z-index:3' style400-cinematics.css
          grep -q '.cin-tree.*z-index:2' style400-cinematics.css
          ! grep -q '.cin-home-island{[^}]*clip-path' style400-cinematics.css
      - name: Install Chromium
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/latchlings-final-home-audit"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Render final Little Home scenes
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/latchlings-final-home-audit"
          cat > "$TEST_NODE/audit.mjs" <<'MJS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const ok=(c,m)=>{if(!c)throw new Error(m)},out=process.env.GITHUB_WORKSPACE+'/final-cinematic-home-renders';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          async function fresh(unlocked,seen){const ctx=await browser.newContext({viewport:{width:390,height:844}});await ctx.addInitScript(({unlocked,seen})=>{localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked,stars:{}}));localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify(seen));},{unlocked,seen});const page=await ctx.newPage(),errors=[];page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});await page.goto('http://127.0.0.1:8158/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>typeof startLevel==='function'&&window.LatchlingsCinematics);return{ctx,page,errors}}
          async function start(page,l,id){await page.evaluate(L=>startLevel(L),l);await page.waitForSelector(`#cinematicOverlay.show[data-cinematic="${id}"]`);await page.waitForFunction(()=>activeScreenTransition===null);await page.waitForTimeout(150)}
          async function advance(page,n){for(let i=0;i<n;i++){await page.click('#cinematicNext');await page.waitForTimeout(120)}}
          const errors=[];
          {
            const {ctx,page,errors:e}=await fresh(1,{});await start(page,1,'opening');await advance(page,1);
            const g=await page.evaluate(()=>{const stage=document.getElementById('cinematicStage').getBoundingClientRect(),home=document.querySelector('.cin-home-island').getBoundingClientRect(),c=document.querySelector('.cin-cottage').getBoundingClientRect(),t=document.querySelector('.cin-tree').getBoundingClientRect();return{stage:{top:stage.top,bottom:stage.bottom},home:{top:home.top,left:home.left,right:home.right},c:{top:c.top,bottom:c.bottom,w:c.width},t:{top:t.top,bottom:t.bottom,w:t.width},clip:getComputedStyle(document.querySelector('.cin-home-island')).clipPath,before:getComputedStyle(document.querySelector('.cin-home-island'),'::before').clipPath}});
            ok(g.clip==='none'&&g.before!=='none'&&g.c.w>65&&g.t.w>10&&g.c.top<g.home.top&&g.t.top<g.home.top&&g.c.top>=g.stage.top&&g.t.top>=g.stage.top,'opening home scenery geometry bad '+JSON.stringify(g));
            await page.screenshot({path:out+'/little-home-final.png',fullPage:true});errors.push(...e);await ctx.close();
          }
          {
            const {ctx,page,errors:e}=await fresh(351,{opening:1,'across-drift':1,'old-maps':1});await start(page,351,'homeward');await advance(page,5);
            const g=await page.evaluate(()=>{const stage=document.getElementById('cinematicStage').getBoundingClientRect(),home=document.querySelector('.cin-home-island').getBoundingClientRect(),c=document.querySelector('.cin-cottage').getBoundingClientRect(),t=document.querySelector('.cin-tree').getBoundingClientRect();return{stage:{top:stage.top,bottom:stage.bottom},home:{top:home.top,left:home.left,right:home.right,c:home.left+home.width/2},c:{top:c.top,bottom:c.bottom},t:{top:t.top,bottom:t.bottom},center:stage.left+stage.width/2,chars:document.querySelectorAll('.cin-home-cast .cin-character').length}});
            ok(g.c.top<g.home.top&&g.t.top<g.home.top&&Math.abs(g.home.c-g.center)<12&&g.chars===5,'Homeward scenery geometry bad '+JSON.stringify(g));
            await page.screenshot({path:out+'/homeward-final.png',fullPage:true});errors.push(...e);await ctx.close();
          }
          ok(errors.length===0,'browser errors '+errors.join(' | '));await browser.close();console.log('FINAL_CINEMATIC_HOME_OK');
          MJS
          python3 -m http.server 8158 >/tmp/latchlings-final-home-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cd "$TEST_NODE"
          node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-cinematic-home-renders
          path: final-cinematic-home-renders/*.png
          if-no-files-found: error
      - name: Self-remove successful audit workflow
        run: |
          set -euo pipefail
          rm -rf final-cinematic-home-renders
          rm -f .github/workflows/audit-final-cinematic-home.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete final cinematic home audit'
          git pull --rebase origin main
          git push origin HEAD:main
