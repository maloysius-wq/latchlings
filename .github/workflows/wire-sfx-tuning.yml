name: Wire SFX Tuning

on:
  push:
    paths:
      - '.github/workflows/wire-sfx-tuning.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update SFX controller and credits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('sfx400.js')
          s=p.read_text()
          s=s.replace("    uiConfirm: ['ui-confirm.wav', 0.28, 2],\n", "    uiConfirm: ['ui-confirm.wav', 0.28, 2],\n    nextLevel: ['next-level.wav', 0.16, 2],\n", 1)
          s=s.replace("    levelClear: ['level-clear.wav', 0.38, 2],", "    levelClear: ['level-clear.wav', 0.24, 2],", 1)
          s=s.replace("    stopSoft: ['stop-soft.wav', 0.26, 3],\n    stopRock: ['stop-rock.wav', 0.30, 3],\n    stopAnchor: ['stop-anchor.wav', 0.28, 3],\n    stopBlocked: ['stop-blocked.wav', 0.27, 3]\n", "    stopSoft: ['stop-soft.wav', 0.26, 3]\n", 1)
          old="""    if (reason === 'rock') play('stopRock');\n    else if (reason === 'anchor') play('stopAnchor');\n    else if (reason === 'door' || reason === 'suitGate' || reason === 'colorGate' || reason === 'rail') play('stopBlocked');\n    else play('stopSoft');"""
          s=s.replace(old, "    play('stopSoft');", 1)
          old="""    if (id === 'nextLevelBtn' && button.textContent.trim() === 'Finish') return null;\n    if (['confirmReset', 'nextLevelBtn'].includes(id)) return 'uiConfirm';"""
          new="""    if (id === 'nextLevelBtn' && button.textContent.trim() === 'Finish') return null;\n    if (id === 'nextLevelBtn') return 'nextLevel';\n    if (id === 'confirmReset') return 'uiConfirm';"""
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('SFX_CREDITS.md')
          s=p.read_text()
          s=s.replace('| `assets/sfx/level-clear.wav` | `confirmation_004.wav` | Level clear/results |', '| `assets/sfx/level-clear.wav` | `confirmation_002.wav` | Softer level-clear/results cue |', 1)
          needle='| `assets/sfx/level-clear.wav` | `confirmation_002.wav` | Softer level-clear/results cue |\n'
          s=s.replace(needle, needle+'| `assets/sfx/next-level.wav` | `pluck_001.wav` | Soft cute Continue / Next Level cue |\n', 1)
          s=s.replace('| `assets/sfx/stop-soft.wav` | `impact_soft_medium_001.ogg` | Soft edge / Latchling endpoint |', '| `assets/sfx/stop-soft.wav` | `impact_soft_medium_001.ogg` | All ordinary non-capture movement endpoints |', 1)
          s=s.replace('| `assets/sfx/stop-rock.wav` | `impact_mining_001.ogg` | Rock/stone endpoint |', '| `assets/sfx/stop-rock.wav` | `impact_mining_001.ogg` | Retained legacy source; inactive after unified-stop tuning |', 1)
          s=s.replace('| `assets/sfx/stop-anchor.wav` | `impact_metal_light_001.ogg` | Magnetic anchor endpoint |', '| `assets/sfx/stop-anchor.wav` | `impact_metal_light_001.ogg` | Retained legacy source; inactive after unified-stop tuning |', 1)
          s=s.replace('| `assets/sfx/stop-blocked.wav` | `impact_generic_light_001.ogg` | Door/gate/rail blocked endpoint |', '| `assets/sfx/stop-blocked.wav` | `impact_generic_light_001.ogg` | Retained legacy source; inactive after unified-stop tuning |', 1)
          s=s.replace('| `assets/sfx/move-short.wav` | `woosh2.ogg` | Short magnetic snap travel |', '| `assets/sfx/move-short.wav` | `woosh2.ogg` | Short magnetic snap travel; 215 ms low-level lead-in trimmed |', 1)
          s=s.replace('| `assets/sfx/move-medium.wav` | `woosh5.ogg` | Medium magnetic snap travel |', '| `assets/sfx/move-medium.wav` | `woosh5.ogg` | Medium magnetic snap travel; 107 ms low-level lead-in trimmed |', 1)
          s=s.replace('| `assets/sfx/move-long.wav` | `woosh8.ogg` | Long magnetic snap travel |', '| `assets/sfx/move-long.wav` | `woosh8.ogg` | Long magnetic snap travel; 76 ms low-level lead-in trimmed |', 1)
          runtime='- Magnetic movement is represented by one continuous recorded travel sound per snap, never a sound on each grid cell.\n'
          replacement=runtime+'- The movement recordings have only their measured leading low-level padding trimmed; no playback speed, pitch, or time-stretch processing is used. Their strong attack now begins about 10 ms after playback starts.\n- Every ordinary non-capture movement endpoint uses `stop-soft.wav`, regardless of whether the blocker is an edge, another Latchling, rock, anchor, door, gate, or rail.\n'
          s=s.replace(runtime,replacement,1)
          p.write_text(s)
          PY
      - name: Validate tuned runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check sfx400.js
          test -s assets/sfx/next-level.wav
          grep -q "nextLevel: \['next-level.wav', 0.16, 2\]" sfx400.js
          grep -q "levelClear: \['level-clear.wav', 0.24, 2\]" sfx400.js
          grep -q "if (id === 'nextLevelBtn') return 'nextLevel';" sfx400.js
          grep -q "    play('stopSoft');" sfx400.js
          ! grep -q "play('stopRock')" sfx400.js
          ! grep -q "play('stopAnchor')" sfx400.js
          ! grep -q "play('stopBlocked')" sfx400.js
          ! grep -Eq 'AudioContext|webkitAudioContext|createOscillator|OscillatorNode|playbackRate|detune|Math\.random' sfx400.js
          python3 - <<'PY'
          import wave, pathlib
          for name in ['move-short.wav','move-medium.wav','move-long.wav','level-clear.wav','next-level.wav','stop-soft.wav']:
              p=pathlib.Path('assets/sfx')/name
              with wave.open(str(p),'rb') as w:
                  assert w.getnchannels()==1, name
                  assert w.getsampwidth()==2, name
                  assert w.getframerate()==44100, name
                  assert w.getnframes()>0, name
          for name in ['move-short.wav','move-medium.wav','move-long.wav']:
              p=pathlib.Path('assets/sfx')/name
              with wave.open(str(p),'rb') as w:
                  rate=w.getframerate(); raw=w.readframes(w.getnframes())
              threshold=32767*(10**(-40/20))
              first=next(i/rate for i in range(len(raw)//2) if abs(int.from_bytes(raw[i*2:i*2+2],'little',signed=True))>=threshold)
              assert first <= 0.012, (name, first)
          print('Tuned SFX validation passed')
          PY
      - name: Commit tuned controller and provenance
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/wire-sfx-tuning.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sfx400.js SFX_CREDITS.md .github/workflows/wire-sfx-tuning.yml
          git commit -m 'Soften level flow and unify movement impacts'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
