name: Start Little Home Tree Refinement

on:
  push:
    paths:
      - '.github/workflows/start-little-home-tree-refinement.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record tree refinement before implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          marker='## Current Work\n'
          entry='''\n### 2026-09-02 — Refine Little Home procedural tree\n\n**Status: IN PROGRESS**\n\n**User goal:** Improve only Concept 2 / Little Home's tree. The current three-circle canopy looks too simplistic. Replace it with a more convincing procedural tree and texture it while preserving the selected island, six-resident household choreography, and production runtime.\n\n**Implementation plan:** Keep Concepts 1 and 3 unchanged. Rebuild Concept 2's tree with a tapered locally textured trunk, visible forked branches, root flare/contact shadow, and an asymmetrical layered canopy made from several irregular procedural leaf masses rather than three circles. Reuse the already-vendored CC0 `textures/wood.jpg` for bark and `textures/grass.jpg` as subtle foliage grain so no new third-party dependency is needed. Add layered highlights/underside shading and a cleaner organic silhouette sized to the existing island. Do not modify production `index.html`.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, `title-island-concepts/index.html`, plus temporary self-removing transformer/browser-validation workflow files if needed. Existing local CC0 textures are reused; no campaign/game runtime files should change.\n\n**Validation plan:** Static checks require Concept 2 to use the new dedicated tree markup/classes, at least seven irregular foliage clusters, visible branch/root elements, local wood/grass texture references, and no new image elements/hotlinks. Chromium at 390x844 must show no console/page/request errors, overflow, clipped UI, or tree overlap with the title/cottage/primary controls. Capture the tree at multiple household animation phases and visually inspect silhouette, texture readability, resident clearance, and overall island balance. Sanity-check Concepts 1 and 3 remain unchanged.\n\n**Deployment plan:** Commit the validated Concept 2 tree refinement to `main`, deploy through existing GitHub Pages, visually inspect screenshots, then close this same handoff entry with implementation SHA, validation/deployment runs, remaining risks, and exact next action.\n\n---\n'''
          if '### 2026-09-02 — Refine Little Home procedural tree' not in t:
              t=t.replace(marker, marker+entry, 1)
              p.write_text(t)
          PY
          rm -f .github/workflows/start-little-home-tree-refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-little-home-tree-refinement.yml
          git commit -m 'Record Little Home tree refinement in handoff'
          git push origin HEAD:main
