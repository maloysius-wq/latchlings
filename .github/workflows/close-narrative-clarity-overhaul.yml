name: Close campaign narrative clarity overhaul

on:
  push:
    paths:
      - '.github/workflows/close-narrative-clarity-overhaul.yml'
      - '.github/tmp/close-narrative-clarity.py'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        run: python .github/tmp/close-narrative-clarity.py
      - name: Commit handoff closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git diff --cached --quiet || git commit -m "Complete campaign narrative clarity handoff"
          git push
      - name: Self-remove closeout helpers
        run: |
          git pull --rebase
          git rm .github/workflows/close-narrative-clarity-overhaul.yml .github/tmp/close-narrative-clarity.py
          git commit -m "Remove narrative clarity closeout helpers"
          git push
