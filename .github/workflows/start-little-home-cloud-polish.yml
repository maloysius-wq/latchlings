name: Start Little Home Cloud Polish

on:
  push:
    paths:
      - '.github/workflows/start-little-home-cloud-polish.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record access invariant and current work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          access='''\n### Repository access invariant\n\nFor **all repository work in this project**, use the connected **GitHub plugin/connector as the canonical repository path**. A failed local clone, missing local checkout, container DNS failure, or failed ordinary web/raw-GitHub fetch is **not evidence that GitHub access is unavailable**. Before ever claiming repository access is unavailable, explicitly discover/load the GitHub connector and attempt a repository read through the GitHub plugin (`GitHub.fetch_file`, `GitHub.get_repo`, or equivalent). Local/container/web access is secondary and optional; the GitHub plugin is the first-line path for inspection, edits, commits, Actions, and deployment checks.\n'''
          anchor='Always inspect current `main`, `index.html`, and this handoff before changing anything.\n'
          if '### Repository access invariant' not in t:
              t=t.replace(anchor, anchor+access, 1)
          entry='''### 2026-09-02 — Polish Little Home stone, play area, and animated clouds\n\n**Status: IN PROGRESS**\n\n**User goal:** Continue polishing selected Concept 2 / Little Home. Move the stone right so it no longer overlaps the island edge, remove the brown platform beneath the tree where the children are playing, and replace the simplistic background clouds with better-looking animated procedural clouds.\n\n**Implementation plan:** Keep the improved organic tree, cottage, six-resident household choreography, CC0 materials, and title controls. Nudge Concept 2's rock inward/right. Remove only Concept 2's brown deck/platform while preserving the children and their play/chase routine. Rebuild Concept 2's four existing cloud shapes with softer asymmetric multi-lobed CSS forms, layered highlight/shadow, varied scale/opacity, and independent slow drift cycles using CSS individual `translate` so existing scale placement is preserved. Leave production `index.html` and campaign/game runtime untouched.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, `title-island-concepts/index.html`, plus temporary self-removing transform/Chromium-validation workflow files. No new third-party assets are required.\n\n**Validation plan:** Static checks require Concept 2's rock position to move right, zero Concept 2 deck/platform elements, exactly six residents with 4 adults / 2 children intact, four cloud elements with dedicated Little Home cloud styling/animation, no image elements or runtime hotlinks, and no production/campaign/game-file changes. Chromium at 390x844 must show no console/page/request errors, overflow, clipped UI, stone edge overlap, or cloud/title/island/control collisions. Sample cloud transforms at multiple timestamps to prove animation and capture screenshots for visual inspection. Sanity-check Concepts 1 and 3 remain functional.\n\n**Deployment plan:** Commit the validated Concept 2 polish to `main`, deploy through existing GitHub Pages, visually inspect captured renders, then close this entry with implementation SHA, validation/deployment runs, and next action.\n\n---\n\n'''
          marker='## Current Work\n\n'
          if '### 2026-09-02 — Polish Little Home stone, play area, and animated clouds' not in t:
              t=t.replace(marker, marker+entry, 1)
          p.write_text(t)
          PY
          rm -f .github/workflows/start-little-home-cloud-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-little-home-cloud-polish.yml
          git commit -m 'Record Little Home cloud polish and GitHub access rule'
          git pull --rebase origin main
          git push origin HEAD:main
