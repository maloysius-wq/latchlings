name: Clean Obsolete Latchlings Action Artifacts
on:
  push:
    branches:
      - maintenance/storage-audit-20261016
    paths:
      - .github/workflows/account-artifact-storage-audit.yml
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Preserve final review evidence and remove superseded pre-release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          if(process.env.REPOSITORY!=='maloysius-wq/latchlings')throw Error('Unexpected repository');
          if(process.env.GITHUB_REF_NAME!=='maintenance/storage-audit-20261016')throw Error('Unexpected branch');
          const base='https://api.github.com/repos/'+process.env.REPOSITORY+'/actions/artifacts';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'latchlings-artifact-cleanup'};
          const all=[];
          for(let page=1;page<=100;page++){
            const r=await fetch(base+'?per_page=100&page='+page,{headers});
            if(!r.ok)throw Error('Artifact listing failed HTTP '+r.status+' '+(await r.text()).slice(0,200));
            const d=await r.json();all.push(...d.artifacts);
            if(d.artifacts.length<100)break;
            if(page===100)throw Error('Incomplete inventory');
          }
          const live=all.filter(a=>!a.expired);
          const latestByName=new Map();
          for(const a of live){
            const old=latestByName.get(a.name);
            if(!old||a.created_at>old.created_at)latestByName.set(a.name,a);
          }
          const cutoff='2026-09-14T00:00:00Z';
          // Always retain September 14 onward. Preserve one latest final/approved exemplar
          // for every historic acceptance, release, settled, or production review series.
          const milestone=/final|accepted|acceptance|settled|release|production|opening-world|skyway-atlas-v4|atlas-payoff-board-theme|audio-transition-board-polish|narrative-clarity|live-acceptance|sunpetal-acceptance|visual-journey/i;
          const protect=a=>a.created_at>=cutoff||(milestone.test(a.name)&&latestByName.get(a.name)?.id===a.id);
          const keep=live.filter(protect);
          const candidates=live.filter(a=>!protect(a));
          const sum=xs=>xs.reduce((n,a)=>n+a.size_in_bytes,0);
          console.log('REVIEWED_CLEANUP_PLAN '+JSON.stringify({repo:process.env.REPOSITORY,beforeCount:live.length,beforeBytes:sum(live),protectCount:keep.length,protectBytes:sum(keep),deleteCount:candidates.length,deleteBytes:sum(candidates),cutoff,protectedMilestoneExamples:keep.filter(a=>a.created_at<cutoff).map(a=>a.name).slice(0,75)}));
          if(candidates.length>300)throw Error('Unexpectedly many candidates; aborting');
          let deleted=0,freed=0;
          for(const a of candidates.sort((a,b)=>a.created_at.localeCompare(b.created_at))){
            const r=await fetch(base+'/'+a.id,{method:'DELETE',headers});
            if(r.status===204){deleted++;freed+=a.size_in_bytes;console.log('DELETED_ARTIFACT '+JSON.stringify({id:a.id,name:a.name,bytes:a.size_in_bytes,created_at:a.created_at}));}
            else if(r.status===404)console.log('ALREADY_REMOVED '+a.id);
            else throw Error('Delete failed '+a.id+' HTTP '+r.status+' '+(await r.text()).slice(0,100));
          }
          const results={deleted,freedBytes:freed,protectedCount:keep.length,protectedBytes:sum(keep),beforeBytes:sum(live)};
          console.log('CLEANUP_RESULT '+JSON.stringify(results));
          NODE
