name: Close opening bubble flicker handoff
on:
  push:
    paths:
      - '.github/workflows/close-opening-bubble-flicker.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-11 — Remove opening-scene dialogue bubble flicker'
          start=s.index(heading)
          next_heading=s.find('\n### ',start+len(heading))
          if next_heading<0: next_heading=len(s)
          section=s[start:next_heading]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary='''\n#### Completion summary\n\n- **Result:** COMPLETED. Opening-scene character speech bubbles no longer flash, collapse, jump, or get briefly recreated while a beat is already visible. Dialogue text, cinematic pacing, Continue/Skip behavior, portraits, scene art, and reduced-motion behavior are preserved.\n- **Baseline root cause 1 — premature ghost bubbles:** `cinematics400.js` advances `API.beat` immediately but intentionally waits 35 ms before rendering the next stage. The dialogue MutationObserver was reacting during that gap, reading the new beat while the old visual was still mounted, injecting the next beat's bubbles into the old stage, then losing them when `render()` replaced the stage. The baseline audit caught Beat 2 bubbles being added, removed about 43 ms later, then re-added, and Beat 4 doing the same after about 38.5 ms.\n- **Baseline root cause 2 — periodic geometry resets:** `cinematic-geometry400.js` was clearing `--cin-bubble-height` and `--cin-bubble-shift` every 500 ms, then remeasuring/reapplying them on later animation frames. That made already-visible bubbles collapse and re-expand. Baseline measurements included approximately **9.81 px** height movement on Tansy's Beat 2 bubble and up to **19.94 px** on Pip's Beat 7 bubble, with roughly **10.08 px** jumps on Pippa/Tansy in Beat 7. Opacity remained 1, confirming this was layout instability rather than a fade animation.\n- **Fix:** `cinematic-dialogue400.js` now gates post-processing against the overlay's actually rendered `data-cinematic` and `data-visual`, preventing dialogue injection during the 35 ms pre-render gap. Once the correct dialogue DOM is present, it asks the geometry layer to normalize it immediately. `cinematic-geometry400.js` now uses synchronous, idempotent normalization: it measures and writes only materially changed height/shift/tail values, never clears stable values first, normalizes when a new dialogue-layer node appears, and re-normalizes on a real viewport resize. The old 500 ms periodic reset/reflow loop is removed.\n- **Cache freshness:** `index.html` now loads `cinematic-dialogue400.js?v=20260911-bubblestable1` and `cinematic-geometry400.js?v=20260911-bubblestable1`, forcing mobile clients to request the accepted scripts.\n- **Changed files / commits:** Accepted product commit `927000dc58cbbad192ca4d90917c96c9caff1d86` (`Stabilize opening dialogue bubbles`) changes only `cinematic-dialogue400.js`, `cinematic-geometry400.js`, and `index.html`. Temporary validator helpers self-removed in `d9d98bab3a7fe454869d2d6e2c875e127de447c8` (`Remove opening bubble stability validator`).\n- **Baseline audit:** GitHub Actions run `34617193558` captured all seven opening beats at 390×844 / DPR 3. Artifact `opening-bubble-flicker-baseline`, artifact ID `10271002549`, SHA-256 `0a08edec81fedf850ccbddc308ba8962c2f89c6d20d71c38725a364ea67ce2de`, contains screenshots and detailed mutation/geometry telemetry proving both the transient duplicate lifecycle and the repeated 10–20 px geometry jumps.\n- **Accepted validation:** GitHub Actions run `34617579596`, job `103323241954`, completed successfully and printed `OPENING_BUBBLE_STABILITY_ACCEPTED`. It tested the full seven-beat opening at 390×844 under DPR 1 normal motion, DPR 3 normal motion, and DPR 3 reduced motion. Every speech bubble remained the same DOM node for all **90 consecutive rAF samples** in its stable beat window with **xRange=0, yRange=0, wRange=0, hRange=0, opacityMin=1**. Each expected bubble was added exactly once per beat; the old add/remove/re-add ghost cycle is gone. Continue through all beats and Skip both passed with no page errors.\n- **Acceptance artifact:** `opening-bubble-stability-audit`, artifact ID `10270853409`, SHA-256 `72d6ee3015546d3616c3ea444bd397840b14f0cdadbd24cacddae9cd017fdafa`, contains the acceptance report and Beat 2 / 4 / 7 screenshots for normal and reduced-motion coverage.\n- **Scope protection:** Hash verification confirmed gameplay, puzzle styling, SFX/music, UI/theme/Atlas/board CSS, all cinematic CSS, `cinematics400.js`, story sources, all eight campaign files, and the Little Home iframe source remained byte-identical. Only the two cinematic support scripts plus the cache-busting script URLs changed.\n- **Deployment / hygiene:** GitHub Pages run `34617740380` successfully built and deployed clean accepted state `d9d98bab3a7fe454869d2d6e2c875e127de447c8`. Before this closeout helper was added, `.github/workflows` contained only the permanent `validate-repository-access-guard.yml`. This closeout helper self-removes after recording the journal.\n- **Remaining risk / next action:** No known code blocker remains. Real-device viewing is the final subjective confirmation, but the acceptance gate directly reproduces and eliminates both measurable flicker mechanisms that existed in the old build.\n\n'''
          if '#### Completion summary' not in section:
              section=section.rstrip()+"\n"+summary
          s=s[:start]+section+s[next_heading:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Complete opening bubble flicker handoff'
          git push
      - name: Self-remove closeout helper
        shell: bash
        run: |
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/close-opening-bubble-flicker.yml
          git commit -m 'Remove opening bubble flicker closeout helper'
          git push