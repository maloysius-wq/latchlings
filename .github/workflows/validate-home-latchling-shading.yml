name: Validate home Latchling shading and puzzle rim
on:
  push:
    paths:
      - '.github/workflows/validate-home-latchling-shading.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        shell: bash
        run: |
          sha256sum game400-a.js game400-b.js sfx400.js music400.js style400-ui.css style400-themes.css style400-skyway-atlas.css style400-atlas-progression.css style400-board-surfaces.css style400-story-rail-board.css story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/home-shading-protected.sha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0 pixelmatch@7.1.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve baseline
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-home-shading-http.log 2>&1 &
      - name: Capture baseline
        shell: bash
        run: node .github/tmp/validate-home-latchling-shading.mjs before
      - name: Apply puzzle rim revert and home shading fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          game=Path('style400-game.css')
          s=game.read_text()
          old=".latchling{padding:0;appearance:none;-webkit-appearance:none;border-radius:50%;border:4px solid transparent;background:radial-gradient(circle at 34% 23%,rgba(255,255,255,.42) 0 6%,transparent 7%) padding-box,linear-gradient(180deg,var(--light) 0%,var(--piece-color) 56%,var(--dark) 100%) padding-box,linear-gradient(#17324d,#17324d) border-box;box-shadow:0 5px 9px rgba(22,39,58,.24),inset 0 -4px 7px rgba(30,32,40,.10),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}"
          new=".latchling{padding:0;appearance:none;-webkit-appearance:none;border-radius:50%;background:radial-gradient(circle at 34% 23%,rgba(255,255,255,.42) 0 6%,transparent 7%),linear-gradient(180deg,var(--light) 0%,var(--piece-color) 56%,var(--dark) 100%);border:2px solid #274462;background-clip:padding-box;box-shadow:0 5px 9px rgba(22,39,58,.24),inset 0 -4px 7px rgba(30,32,40,.10),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}"
          if old not in s: raise SystemExit('current 4px puzzle rim rule not found')
          game.write_text(s.replace(old,new,1))

          home=Path('title-island-concepts/index.html')
          h=home.read_text()
          oldh=".latchling{padding:0;appearance:none;-webkit-appearance:none;border-radius:50%;background:radial-gradient(circle at 34% 23%,rgba(255,255,255,.42) 0 6%,transparent 7%),linear-gradient(180deg,var(--light) 0%,var(--piece-color) 56%,var(--dark) 100%);border:2px solid rgba(39,68,98,.42);box-shadow:0 5px 9px rgba(22,39,58,.24),inset 0 -4px 7px rgba(30,32,40,.10),inset 0 1px 0 rgba(255,255,255,.25);overflow:hidden}"
          newh=".latchling{padding:0;appearance:none;-webkit-appearance:none;border-radius:50%;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.30) 0 6%,rgba(255,255,255,.10) 7% 12%,transparent 22%),radial-gradient(circle at 50% 50%,var(--light) 0%,var(--piece-color) 58%,var(--dark) 100%);border:1.5px solid rgba(39,68,98,.46);box-shadow:0 4px 8px rgba(22,39,58,.22),inset 0 -2px 4px rgba(30,32,40,.08),inset 0 1px 0 rgba(255,255,255,.22);overflow:hidden}"
          if oldh not in h: raise SystemExit('current Little Home refined body rule not found')
          home.write_text(h.replace(oldh,newh,1))

          index=Path('index.html')
          i=index.read_text()
          old_style='<link rel="stylesheet" href="style400-game.css?v=20260911-rim2">'
          new_style='<link rel="stylesheet" href="style400-game.css?v=20260911-sphere3">'
          old_frame='src="title-island-concepts/?c=2&amp;embed=1"'
          new_frame='src="title-island-concepts/?c=2&amp;embed=1&amp;v=20260911-sphere3"'
          if old_style not in i: raise SystemExit('current game css cache-bust link missing')
          if old_frame not in i: raise SystemExit('current home iframe src missing')
          i=i.replace(old_style,new_style,1).replace(old_frame,new_frame,1)
          index.write_text(i)
          PY
          git diff --check
          git diff -- style400-game.css title-island-concepts/index.html index.html
      - name: Browser-check home shading and puzzle rim
        shell: bash
        run: node .github/tmp/validate-home-latchling-shading.mjs after
      - name: Verify protected source unchanged
        shell: bash
        run: sha256sum -c /tmp/home-shading-protected.sha
      - name: Commit accepted product change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style400-game.css title-island-concepts/index.html index.html
          git commit -m 'Smooth home Latchling shading and slim puzzle rim'
          git push
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-latchling-shading-audit
          path: home-latchling-shading-audit
          if-no-files-found: warn
      - name: Self-remove validation helpers
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/validate-home-latchling-shading.yml .github/tmp/validate-home-latchling-shading.mjs
          git commit -m 'Remove home Latchling shading validator'
          git push
