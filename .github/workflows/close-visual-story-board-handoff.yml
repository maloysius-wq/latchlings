name: Close Visual Story Board Handoff
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          text=p.read_text()
          heading='### 2026-09-05 — Opening cinematic geometry, player-facing story rail, and board-first visual variety'
          start=text.find(heading)
          if start < 0: raise SystemExit('handoff heading not found')
          end=text.find('\n---', start)
          if end < 0: raise SystemExit('handoff separator not found')
          section=text[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in section:
              section += '''\n\n#### Completion summary\n\n**Gameplay presentation replacement:** The rejected Chapter 1 scenery/medallion prototype is no longer loaded in production. `gameplay-story-rail400.js` and `style400-story-rail-board.css` replace the old Route Tip strip with a fixed-height player-facing story rail that shows the named resident, a level-specific in-world line, the current ten-level movement, and 1–50 chapter progress. The rail works across all eight chapters and is resilient to View Transition timing after commit `89c173c177e8695bb1b856b06d4e5c33b99fac68` added screen-state observation. The board itself now carries the visual journey through five movement treatments, ten deterministic motif accents, milestone states, chapter-specific material/frame language, and cell/corner variation. Sunpetal's five movements received an additional perceptual-strength pass so the differences read at phone scale instead of existing only in metadata. Interactive semantics, level geometry, move limits, solver data, campaign definitions, and the Level 400 ending were not changed.\n\n**Opening cinematic geometry and copy:** `cinematic-geometry400.js` and `style400-cinematics-geometry.css` now calculate visible Skyway routes from the actual island positions and reuse those exact route geometries for moving cargo; generic cinematic trees use locally vendored wood/grass textures with modeled trunks, branches, and three-crown silhouettes; simultaneous speech bubbles share a deliberate horizontal band; bubble tails point to their speaker portraits; and beat-specific blocking keeps Little Home, the Waykeeper compass, helper-crew explainer, snap demonstration, and final morning scene clear of dialogue. Player-facing development commentary was removed from story/error copy while durable developer documentation remains intact. The final visual acceptance refinements were `23c0e9716147ff2f1cedbf70450bd6f39ccd5d22` (Little Home cast bubble bounds), `738fa74df86de12aba856ba0612b08ead3cc8d35` (helper-crew scene reblock), and `1eef6590fbbd76e6b0a3374d915d5cedad2bdfca` (snap-demo reblock).\n\n**Product files changed:** Durable product work for this task is concentrated in `index.html`, `story-grounding400.js`, `game400-a.js`, `cinematic-dialogue400.js`, new `cinematic-geometry400.js`, new `gameplay-story-rail400.js`, new `style400-cinematics-geometry.css`, and new `style400-story-rail-board.css`, plus the already-existing cinematic/story presentation files where loader/copy integration was required. The superseded `level-variation400.js` / `style400-level-variation.css` presentation is not loaded by production. Campaign files `campaign400-1.js` through `campaign400-8.js`, solver data, progression rules, audio behavior, canonical Little Home source, and Level 400 **Skyway Restored** ending remained unchanged.\n\n**Gameplay validation and manual acceptance:** Browser audit run `34000528069` passed its gameplay job across all 50 Sunpetal levels and representative later-chapter levels, producing artifact `9979352985` (`story-board-gameplay-audit`). A later full gameplay rerun in run `34003535323` again completed the entire gameplay section before a separate cinematic audit-helper scoping defect stopped that job; artifact `9980213546` contains the resulting Sunpetal boundary and chapter-representative contact sheets. Manual inspection confirmed a stable 90px story rail, visible named-speaker/story progression, five perceptibly different Sunpetal movement looks, distinct later-chapter rail identities, no rejected medallions/background layer, no horizontal overflow, and preserved puzzle/control readability.\n\n**Cinematic validation and refinement:** Two late audit failures were harness defects rather than product defects: run `34003485253` placed its Playwright script outside Node's module-resolution path, and run `34003535323` referenced a Node-scope helper inside `page.evaluate`. After correcting the harness, visual acceptance intentionally rejected three real composition defects instead of treating near-passes as done: run `34003675392` caught the Beat 2 Tansy bubble extending beyond the stage; run `34003768345` caught dialogue overlapping the Beat 5 helper-crew explainer; and run `34003896996` caught dialogue overlapping the Beat 6 snap-demo board. Each was fixed and rerendered. Final acceptance run `34004025480` completed successfully and printed `OPENING_CINEMATIC_ACCEPTED`; artifact `9980374438` (`opening-cinematic-accepted-rerun`) contains all seven production-phone opening frames, the 390×700 reduced-motion Beat 7 frame, manifest, and contact sheet. Automated assertions cover route endpoint attachment, cargo staying on and moving along the exact route geometry, textured three-crown trees, aligned speech bands, tails aimed at speakers, focal-art separation, stage bounds, overflow, reduced-motion compact behavior, and player-facing copy.\n\n**Manual cinematic acceptance:** The final artifact was manually inspected after the green run. Beats 1–4 show connected textured islands, clearly traveling Skyway cargo, the full Little Home household identification, and a clean Waykeeper composition. Beat 5 keeps the helper-crew explainer fully above Bramble's dialogue. Beat 6 keeps the instructional snap board above Rowan's dialogue while retaining readable rock/helper/nest staging. Beat 7 and its compact reduced-motion render keep all four resident bubbles inside the stage with Little Home still visible as the focal scene. No remaining composition was judged too subtle, clipped, or obscured to accept.\n\n**Repository hygiene and deployment:** Every temporary implementation/audit workflow self-removed. After final acceptance, `.github/workflows/validate-repository-access-guard.yml` is again the only durable workflow. The audit-clean accepted tree is present on clean main commit `fca1f0f9951160742cbc390325b5a6c366de8573`; GitHub Pages run `34004066775` completed successfully for that exact SHA. The product state is therefore deployed. Remaining risk is limited to device/browser rendering differences outside the audited production phone, compact reduced-motion, and representative wide behavior already covered by the surrounding cinematic system; no known blocking visual or gameplay defect remains from this task.\n'''
          text=text[:start]+section+text[end:]
          p.write_text(text)
          PY
          rm -f .github/workflows/close-visual-story-board-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-visual-story-board-handoff.yml
          git commit -m "Close visual story board handoff"
          git push
