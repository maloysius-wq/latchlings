name: Update handoff audit source commit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-handoff-audit-source-commit.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Point handoff at exact source commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          old='- Canonical implementation-review source: [`LATCHLINGS_IMPLEMENTATION_REVIEW.md`](LATCHLINGS_IMPLEMENTATION_REVIEW.md), committed to `main` on 2026-09-14 as `85f2b597de1ec3ee3daf12f0a84ade26e6cf1502`; reviewed-head baseline `d6e39c0866505795c2aa6a26777896072e16e7df`.'
          new='- Canonical implementation-review source: [`LATCHLINGS_IMPLEMENTATION_REVIEW.md`](LATCHLINGS_IMPLEMENTATION_REVIEW.md), exact uploaded bytes finalized on `main` as `307abc8854c5f69eab288c1f2cef4b7dca20b241` (Git blob `9b7413371d8833d7e1fc5c26b89373244ac3dc86`); reviewed-head baseline `d6e39c0866505795c2aa6a26777896072e16e7df`.'
          assert old in s
          p.write_text(s.replace(old,new), newline='')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Reference exact Astra review source commit"
          git push origin HEAD:main
