name: Trigger corrected audio transition board validation
on:
  push:
    paths:
      - '.github/workflows/bump-audio-transition-board-polish.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump validation workflow
        shell: bash
        run: |
          set -euo pipefail
          printf '\n# validation pass 2: specificity and material checks corrected\n' >> .github/workflows/validate-audio-transition-board-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-audio-transition-board-polish.yml
          git commit -m 'Rerun corrected audio transition board validation'
          git push
      - name: Self-remove trigger
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/bump-audio-transition-board-polish.yml
          git commit -m 'Remove polish validation trigger'
          git push
