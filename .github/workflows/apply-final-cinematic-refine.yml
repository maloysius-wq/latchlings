name: Apply Final Cinematic Visual Refinements
on:
  push:
    paths:
      - '.github/workflows/apply-final-cinematic-refine.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final refinements
        run: |
          python3 .github/final_cinematic_refine.py
          grep -q 'html.cinematic-mode,body.cinematic-mode' title-island-concepts/index.html
          grep -q "document.documentElement.classList.add('cinematic-mode')" title-island-concepts/index.html
          grep -q 'style400-cinematics-refine.css' index.html
      - name: Commit refinements and cleanup
        run: |
          rm -f .github/final_cinematic_refine.py .github/workflows/apply-final-cinematic-refine.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html index.html style400-cinematics-refine.css .github/final_cinematic_refine.py .github/workflows/apply-final-cinematic-refine.yml
          git commit -m 'Polish cinematic compositing and regional detail'
          git pull --rebase origin main
          git push origin HEAD:main
