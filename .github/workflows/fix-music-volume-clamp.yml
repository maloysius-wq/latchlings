name: Fix Music Volume Clamp
on:
  push:
    paths:
      - '.github/workflows/fix-music-volume-clamp.yml'
      - '.github/scripts/fix_music_volume_clamp.py'
      - '.github/scripts/validate_music_volume_clamp.mjs'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply volume clamp fix
        run: python3 .github/scripts/fix_music_volume_clamp.py
      - name: Static validation
        run: |
          set -euo pipefail
          node --check music400.js
          grep -q 'function clampVolume(value)' music400.js
          grep -q 'const t = Math.max(0, Math.min(1,' music400.js
          grep -q 'audio.volume = clampVolume(' music400.js
          git diff --exit-code -- campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js story400.js story-theme400.js title-island-concepts/index.html
          echo MUSIC_VOLUME_CLAMP_STATIC_OK
      - name: Install Chromium outside repository
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/music-volume-node"
          mkdir -p "$TEST_NODE" && cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Browser regression validation
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/music-volume-node"
          python3 -m http.server 8141 >/tmp/music-volume-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cp .github/scripts/validate_music_volume_clamp.mjs "$TEST_NODE/validate_music_volume_clamp.mjs"
          timeout 100s node "$TEST_NODE/validate_music_volume_clamp.mjs"
      - name: Commit validated fix and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-music-volume-clamp.yml .github/scripts/fix_music_volume_clamp.py .github/scripts/validate_music_volume_clamp.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music400.js .github/workflows/fix-music-volume-clamp.yml .github/scripts/fix_music_volume_clamp.py .github/scripts/validate_music_volume_clamp.mjs
          git commit -m 'Clamp music fade volume assignments'
          git pull --rebase origin main
          git push origin HEAD:main
