name: Start Story Cadence Home Transition Work

on:
  push:
    paths:
      - '.github/workflows/start-story-cadence-home-transition.yml'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add current work entry
        run: python3 .github/scripts/start_story_cadence_home_transition.py
      - name: Validate current work entry
        run: |
          grep -q 'Reduce story interruptions, unify Little Home background, and add screen whoosh transitions' DEVELOPMENT_HANDOFF.md
          grep -A8 'Reduce story interruptions, unify Little Home background, and add screen whoosh transitions' DEVELOPMENT_HANDOFF.md | grep -q 'Status: IN PROGRESS'
      - name: Commit handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/start-story-cadence-home-transition.yml .github/scripts/start_story_cadence_home_transition.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-story-cadence-home-transition.yml .github/scripts/start_story_cadence_home_transition.py
          git commit -m 'Start story cadence and transition refinement'
          git pull --rebase origin main
          git push origin HEAD:main
