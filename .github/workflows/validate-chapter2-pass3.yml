name: Validate Chapter 2 Pass 3 campaign application

on:
  push:
    paths:
      - '.github/workflows/validate-chapter2-pass3.yml'
      - '.github/tmp/apply-chapter2-pass3.py'
      - '.github/tmp/refine-chapter2-pass3.py'
      - '.github/tmp/validate-chapter2-pass3.mjs'
      - '.github/tmp/validate-chapter2-pass3-final-evidence.mjs'

permissions:
  contents: write

env:
  PROMOTE: 'true'
  PRODUCT_FILES: >-
    game400-a.js game400-b.js style400-production-slice.css style400-skyway-atlas.css story400.js story-grounding400.js STORY_BIBLE.md cinematics400.js title-island-concepts/index.html index.html

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect puzzle data and unrelated runtime systems
        run: |
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js cinematic-dialogue400.js gameplay-story-rail400.js story-theme400.js music400.js sfx400.js style400-game.css > /tmp/protected-before.sha256

      - name: Apply Chapter 2 Pass 3 candidate
        run: |
          python .github/tmp/apply-chapter2-pass3.py
          python .github/tmp/refine-chapter2-pass3.py

      - name: Static validation
        run: |
          node --check game400-a.js
          node --check game400-b.js
          node --check story400.js
          node --check story-grounding400.js
          node --check cinematics400.js
          sha256sum -c /tmp/protected-before.sha256
          python - <<'PY'
          from pathlib import Path
          import subprocess
          expected=set('game400-a.js game400-b.js style400-production-slice.css style400-skyway-atlas.css story400.js story-grounding400.js STORY_BIBLE.md cinematics400.js title-island-concepts/index.html index.html'.split())
          changed=set()
          for line in subprocess.check_output(['git','status','--porcelain'],text=True).splitlines():
              path=line[3:]
              if path.startswith('.github/tmp/') or path=='.github/workflows/validate-chapter2-pass3.yml':
                  continue
              changed.add(path)
          if changed != expected:
              raise SystemExit(f'Chapter 2 Pass 3 product diff mismatch: expected {sorted(expected)}, got {sorted(changed)}')
          a=Path('game400-a.js').read_text(); b=Path('game400-b.js').read_text(); css=Path('style400-production-slice.css').read_text(); atlas=Path('style400-skyway-atlas.css').read_text(); s=Path('story400.js').read_text(); sg=Path('story-grounding400.js').read_text(); bible=Path('STORY_BIBLE.md').read_text(); cin=Path('cinematics400.js').read_text(); home=Path('title-island-concepts/index.html').read_text(); html=Path('index.html').read_text()
          assert "VISUAL_CHAPTER_MODES={1:'sunpetal',2:'lanternwood'}" in a
          assert '#game[data-visual-slice="lanternwood"]' in css and 'data-board-range="5"' in css
          assert '.chapter-two-reward' in css and '.lanternwood-reward-lantern' in css
          assert '.theme-ch2 .atlas-map.atlas-range-3 .atlas-scene em' in atlas
          assert s.lower().count('twin amber lanterns') >= 2
          assert sg.lower().count('twin amber lanterns') >= 2
          assert 'twin amber lanterns' in bible.lower()
          assert 'showChapterTwoReward' in b and "focusHomeReward('pennant')" in b and 'currentLevel===100' in b
          assert 'porch-friend-lantern l1' in cin and 'porch-friend-lantern l2' in cin
          assert 'story-focus-pennant' in home and "e.data.focus==='pennant'" in home
          assert '#c2 .story-pennant{left:238px;top:146px' in home
          assert '20260912-ch2pass3-1' in html
          print('CHAPTER2_PASS3_STATIC_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance and screenshot matrix
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-ch2-pass3-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 300s node .github/tmp/validate-chapter2-pass3.mjs
          timeout 120s node .github/tmp/validate-chapter2-pass3-final-evidence.mjs
          sha256sum -c /tmp/protected-before.sha256

      - name: Upload Chapter 2 Pass 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-pass3-campaign-application
          path: |
            /tmp/chapter2-pass3
            /tmp/chapter2-pass3-final
          if-no-files-found: warn

      - name: Commit accepted Chapter 2 product files
        if: env.PROMOTE == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add $PRODUCT_FILES
          git commit -m "Apply Pass 3 production treatment to Lanternwood"
          git push

      - name: Self-remove Chapter 2 validation helpers
        if: env.PROMOTE == 'true'
        run: |
          rm -rf node_modules
          git reset --hard HEAD
          git clean -fd
          git pull --rebase
          git rm .github/workflows/validate-chapter2-pass3.yml .github/tmp/apply-chapter2-pass3.py .github/tmp/refine-chapter2-pass3.py .github/tmp/validate-chapter2-pass3.mjs .github/tmp/validate-chapter2-pass3-final-evidence.mjs
          git commit -m "Remove Chapter 2 Pass 3 validator"
          git push
