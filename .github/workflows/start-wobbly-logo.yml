name: Start Wobbly Toy Letters Logo

on:
  push:
    paths:
      - '.github/workflows/start-wobbly-logo.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current work
        run: |
          set -euo pipefail
          python3 .github/scripts/start_wobbly_logo.py
          rm -f .github/workflows/start-wobbly-logo.yml .github/scripts/start_wobbly_logo.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-wobbly-logo.yml .github/scripts/start_wobbly_logo.py
          git commit -m 'Record Wobbly Toy Letters logo work'
          git pull --rebase origin main
          git push origin HEAD:main
