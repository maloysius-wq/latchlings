name: Start Skyway Atlas Level Select Redesign
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-skyway-atlas-level-select.yml'
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record IN PROGRESS handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-10 — Rebuild Level Select as the Skyway Atlas'
          if heading not in s:
              entry=r'''

### 2026-09-10 — Rebuild Level Select as the Skyway Atlas

**Status: IN PROGRESS**

**User goal:** Replace the generic, AI-template-feeling Level Select with a deeply authored Latchlings progression world. Build the approved **Skyway Atlas** concept: a chapter world map made of drifting textured islands, restored/broken Skyway routes, distinct regional landmarks, cloud-hidden locked destinations, an unmistakable current/next stop, milestone waypoints every ten levels, and chapter-to-chapter art direction that feels like traveling through the Latchlands rather than recoloring one UI grid.

**Design/research basis:** Use the progression-map lessons from Candy Crush Saga's journey map, Two Dots' environment-driven saga maps and 2026 visual refresh, and Monument Valley's chapter-select-as-world-object philosophy without copying their assets or layouts. The Latchlings-specific fiction is the organizing system: floating islands drift, the Skyway connects them, the Waykeeper restores routes, and every chapter already has a distinct place/material identity. Preserve fast access to old levels and keep the next goal obvious. Avoid rows of generic chips/cards wherever the world itself can carry the navigation.

**Material/reference basis:** Vendor lightweight local CC0 material textures from Poly Haven and document them in credits. Planned chapter references are Leafy Grass for Sunpetal, Bark Brown 01 for Lanternwood, Rock Surface for Lodestone, Plaster Stone Wall 01 for Masquerade, Marble 01 for Prism, Rusty Metal 02 for Copperline, Blue Metal Plate for Stormswitch, and Snow 02 for Aurora. Use those as subtle stylized surface grain/tint sources rather than photo-real tiles. Retain the game's established authored cottage/island/Latchling shape language, and use CSS/SVG geometry for chapter landmarks, Skyway light, clouds, flora, rails, crystals, towers, machinery, and aurora details.

**Implementation plan:** Replace the current Level Select topbar/card/chapter-chip/range-chip/5x2 grid presentation with a dedicated full-height atlas surface. Keep the underlying chapter/range/progress data and level launching behavior, but render each 10-level range as a winding ten-stop Skyway route over a themed regional scene. Level nodes become floating island waystations with large safe hit targets, local level numbers, star-route lights, completion/current/locked states, and chapter-specific landmark dressing. Levels 10/20/30/40/50 become larger named waypoint islands. Completed route segments glow; the segment to the current level flickers/repairs; future segments fade into cloud cover. The current level gets a larger island, a NEXT STOP pennant, and a small resident guide. Simplify navigation to a compact chapter header with previous/next chapter buttons plus five waypoint tabs for 1–10 through 41–50. Move Reset Progress out of the permanent footer into an unobtrusive atlas utility menu/settings affordance, and make Continue a single strong bottom CTA tied to the current level. Add restrained independent island/cloud/route motion with reduced-motion support.

**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, `index.html`, `game400-a.js`, `game400-b.js` only if reset/settings wiring needs adjustment, new `style400-skyway-atlas.css`, possibly a focused `skyway-atlas400.js` helper if cleaner than expanding the existing renderer, `ART_ASSET_CREDITS.md`, and new `assets/level-select/*.jpg` CC0 texture files. Existing campaign definitions, puzzle solver data, progression semantics, story canon, title screen, cinematics, music/SFX, gameplay board, and Level 400 ending are out of scope.

**Validation plan:** Run a self-removing GitHub Actions visual/functional audit using Chromium. Exercise fresh progress, mid-Chapter 1 progress, completed Chapter 1, representative mid-progress states in Chapters 2–8, and Level 400 completion at 320x568, 360x640, 390x700, 390x844, and 430x932. Assert all visible level hit targets meet at least 44px, level numbers/state are accessible, unlocked levels remain launchable, locked levels remain disabled, chapter and five-waypoint navigation work, Continue launches the actual unlocked level, Reset remains reachable behind a secondary utility action with confirmation, no horizontal overflow or clipped CTA occurs, reduced-motion disables ambient motion, local texture assets load successfully, and campaign files are unchanged. Generate full-screen screenshots/contact sheets for all eight chapters and manually inspect composition, uniqueness, hierarchy, texture restraint, landmark readability, state clarity, and 'not a generic UI template' quality. Reject/refine any chapter that looks like a palette swap or any mobile size that feels cramped.

**Deployment plan:** This IN PROGRESS handoff commit must exist before product edits. Implement through isolated/self-cleaning workflow(s), render and manually review the actual production screen, refine until accepted, verify the final clean main contains only the durable repository-access guard workflow, confirm GitHub Pages deploys the exact accepted clean state, then close this same entry as COMPLETED/PARTIAL/BLOCKED with exact files, asset sources, commits, Actions runs/artifacts, visual findings, deployment SHA/run, remaining risks, and next action if incomplete.
'''
              marker='## Current Work\n'
              idx=s.index(marker)+len(marker)
              s=s[:idx]+entry+s[idx:]
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Record Skyway Atlas level select work"
          git push
      - name: Self-remove starter
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/start-skyway-atlas-level-select.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Skyway Atlas starter workflow"
          git push
