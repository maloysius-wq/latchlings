name: Astra gameplay story RED

on:
  push:
    branches: [astra-gameplay-story-candidate]
    paths:
      - '.github/workflows/astra-gameplay-story-red.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-gameplay-story-candidate
          fetch-depth: 0
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Expected gameplay and Story-card behavior
        shell: bash
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/astra-gameplay-story-red-http.log 2>&1 &
          echo $! >/tmp/astra-gameplay-story-red-http.pid
          cat > .astra-gameplay-story-red.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});

          await page.evaluate(()=>{startLevel(1);window.LatchlingsStoryTheme?.close(false)});
          await page.waitForTimeout(80);
          const mastery=await page.evaluate(()=>({text:document.querySelector('#masteryGuide')?.textContent?.replace(/\s+/g,' ').trim()||'',visible:!!document.querySelector('#masteryGuide')&&getComputedStyle(document.querySelector('#masteryGuide')).display!=='none'}));
          if(!mastery.visible||!mastery.text.includes('3★')||!mastery.text.includes('2★')||!mastery.text.includes('1★'))throw new Error(`Expected visible pre-evaluation star criteria: ${JSON.stringify(mastery)}`);

          const stacking=await page.evaluate(()=>({board:Number(getComputedStyle(document.getElementById('board')).zIndex)||0,props:Number(getComputedStyle(document.getElementById('levelProps')).zIndex)||0,pointer:getComputedStyle(document.getElementById('levelProps')).pointerEvents}));
          if(!(stacking.board>stacking.props)||stacking.pointer!=='none')throw new Error(`Expected scenery behind playable board: ${JSON.stringify(stacking)}`);

          const switchLevel=await page.evaluate(()=>{for(let i=0;i<LEVELS.length;i++){const l=LEVELS[i];if((l.switches||[]).length&&(l.doors||[]).length)return i+1}return 0});
          if(!switchLevel)throw new Error('No switch/door level found');
          await page.evaluate(L=>{startLevel(L);window.LatchlingsStoryTheme?.close(false)},switchLevel);
          await page.waitForTimeout(60);
          const linked=await page.evaluate(()=>({switches:[...document.querySelectorAll('.switch-tile')].map(x=>({link:x.dataset.link,label:x.querySelector('.mechanic-link-badge')?.textContent?.trim()||'',aria:x.getAttribute('aria-label')||''})),doors:[...document.querySelectorAll('.door-tile')].map(x=>({link:x.dataset.link,label:x.querySelector('.mechanic-link-badge')?.textContent?.trim()||'',state:x.querySelector('.door-state-label')?.textContent?.trim()||'',aria:x.getAttribute('aria-label')||''}))}));
          if(!linked.switches.length||!linked.doors.length||linked.switches.some(x=>!x.link||!x.label||!x.aria)||linked.doors.some(x=>!x.link||!x.label||x.state!=='CLOSED'||!x.aria))throw new Error(`Expected explicit switch/door linkage: ${JSON.stringify(linked)}`);
          const firstDoor=linked.doors[0];
          await page.evaluate(link=>{const lev=LEVELS[currentLevel-1],d=(lev.doors||[]).find(x=>String(x[2])===String(link));doorMask|=(1<<d[2]);renderGame(true)},firstDoor.link);
          const opened=await page.evaluate(link=>{const d=[...document.querySelectorAll('.door-tile')].find(x=>x.dataset.link===String(link));return {open:d?.classList.contains('open'),state:d?.querySelector('.door-state-label')?.textContent?.trim(),aria:d?.getAttribute('aria-label')}},firstDoor.link);
          if(!opened.open||opened.state!=='OPEN'||!opened.aria?.toLowerCase().includes('open'))throw new Error(`Expected explicit open-door state: ${JSON.stringify(opened)}`);

          const blocker=await page.evaluate(()=>{
            const dirs={U:[-1,0],D:[1,0],L:[0,-1],R:[0,1]};
            for(let L=151;L<=400;L++){
              const lev=LEVELS[L-1];
              for(let pi=0;pi<lev.pieces.length;pi++)for(const [dir,[dr,dc]] of Object.entries(dirs)){
                const p=lev.pieces[pi],r=p.pos[0]+dr,c=p.pos[1]+dc;if(r<0||c<0||r>=lev.size||c>=lev.size)continue;
                const door=(lev.doors||[]).find(x=>x[0]===r&&x[1]===c);if(door)return {L,pi,dir,type:'door',r,c};
                const sg=(lev.suitGates||[]).find(x=>x[0]===r&&x[1]===c);if(sg&&sg[2]!==p.suit)return {L,pi,dir,type:'suitGate',r,c};
                const cg=(lev.colorGates||[]).find(x=>x[0]===r&&x[1]===c);if(cg&&cg[2]!==p.color)return {L,pi,dir,type:'colorGate',r,c};
                const rail=(lev.rails||[]).find(x=>x[0]===r&&x[1]===c);if(rail&&rail[2]!==dir)return {L,pi,dir,type:'rail',r,c};
              }
            }
            return null;
          });
          if(!blocker)throw new Error('No immediate mechanic blocker found');
          await page.evaluate(b=>{startLevel(b.L);window.LatchlingsStoryTheme?.close(false);selected=b.pi;renderPieces(LEVELS[currentLevel-1]);moveSelected(b.dir)},blocker);
          await page.waitForTimeout(80);
          const rejected=await page.evaluate(b=>({feedback:document.getElementById('mechanicNote')?.dataset.feedback||'',blocker:document.querySelector(`.cell[data-r="${b.r}"][data-c="${b.c}"]`)?.dataset.blockerFeedback||'',text:document.getElementById('mechanicNote')?.textContent?.replace(/\s+/g,' ').trim()||''}),blocker);
          if(rejected.feedback!=='blocked'||rejected.blocker!==blocker.type||rejected.text.length<12)throw new Error(`Expected blocker-specific rejected-move feedback: ${JSON.stringify({blocker,rejected})}`);

          await page.evaluate(()=>{startLevel(1);window.LatchlingsStoryTheme?.close(false);lastNestArrival=0;positions[0]=null;renderGame(true)});
          const nest=await page.evaluate(()=>({resolved:document.querySelector('.nest[data-pi="0"]')?.classList.contains('resolved'),arrived:document.querySelector('.nest[data-pi="0"]')?.classList.contains('just-arrived'),badge:document.querySelector('.nest[data-pi="0"] .nest-resolution')?.textContent?.trim()||'',state:document.querySelector('.cell:has(.nest[data-pi="0"])')?.dataset.nestState||''}));
          if(!nest.resolved||!nest.arrived||nest.badge!=='✓'||nest.state!=='resolved')throw new Error(`Expected resolved destination acknowledgement: ${JSON.stringify(nest)}`);

          await page.evaluate(()=>window.LatchlingsStoryTheme.show(1,true));
          const card=await page.evaluate(()=>({line:document.querySelector('#storyCardLine')?.textContent?.replace(/\s+/g,' ').trim()||'',goal:document.querySelector('#storyCardGoal')?.textContent?.replace(/\s+/g,' ').trim()||'',details:document.querySelector('#storyCardMore')?.tagName||'',open:document.querySelector('#storyCardMore')?.open,legacyVisible:[...document.querySelectorAll('#storyCardContext,#storyCardFlavor')].filter(x=>getComputedStyle(x).display!=='none').length,sceneProps:document.querySelectorAll('#storyCardScene .story-scene-prop').length}));
          if(!card.line||!card.goal||card.details!=='DETAILS'||card.open||card.legacyVisible||card.sceneProps<1)throw new Error(`Expected concise postcard card structure: ${JSON.stringify(card)}`);

          await page.evaluate(()=>{window.LatchlingsStoryTheme.close(false);const lev=LEVELS[399],row='<i></i><i></i><i></i>';window.LatchlingsChapterEightPass3.showReward(3,row,n=>`${n} moves`,lev)});
          const reward=await page.locator('.chapter-eight-reward .chapter-reward-result').textContent();
          const words=reward.trim().split(/\s+/).length;
          if(words>30)throw new Error(`Expected concise Aurora reward <=30 words, got ${words}: ${reward}`);

          await browser.close();
          JS
          node .astra-gameplay-story-red.mjs
          rm -f .astra-gameplay-story-red.mjs
          kill $(cat /tmp/astra-gameplay-story-red-http.pid) || true
