name: Repair Latchling Refresh Handoff
on:
  push:
    paths:
      - '.github/workflows/repair-latchling-refresh-handoff.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile stale handoff and temporary workflows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          marker='### 2026-09-04 — Refresh all Latchlings with refined spherical face model\n\n**Status: IN PROGRESS**\n'
          if marker not in t:
              raise SystemExit('Current Latchling refresh handoff entry not found')
          note='''\n**Continuation audit note (2026-09-04):** The product refresh reached `ec21a9fa2a11b4c9377827b67d2cb51290f0aa0f`, and validation run `33897067802` passed its programmatic assertions, but artifact `9946166689` does not provide trustworthy settled-state proof for every requested surface: the puzzle/title/residents captures include transition or completion overlays. The task therefore remains **IN PROGRESS** while a corrected settled-state visual audit is run. Repository cleanup also found temporary model-refresh workflows that failed to self-remove; they are removed as part of this handoff repair before any new feature work.\n'''
          if 'Continuation audit note (2026-09-04)' not in t:
              t=t.replace(marker,marker+note,1)
          p.write_text(t)
          PY
          rm -f .github/workflows/fix-latchling-model-refresh-validator.yml
          rm -f .github/workflows/implement-latchling-model-refresh.yml
          rm -f .github/workflows/implement-latchling-model-refresh-v2.yml
          rm -f .github/workflows/implement-latchling-model-refresh-v3.yml
          rm -f .github/workflows/implement-latchling-model-refresh-v4.yml
          rm -f .github/workflows/repair-latchling-refresh-handoff.yml
      - name: Commit handoff repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair stale Latchling refresh handoff state'
          git pull --rebase origin main
          git push origin HEAD:main
