name: Apply Wobbly Toy Letters Logo

on:
  push:
    paths:
      - '.github/workflows/apply-wobbly-logo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply selected logo treatment
        run: python3 .github/scripts/apply_wobbly_logo.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          if 'aria-label="Latchlings"' not in c2:
              raise SystemExit('Concept 2 toy logo missing')
          if c2.count('aria-hidden="true"') < 10:
              raise SystemExit('Expected individually wrapped toy letters')
          if 'Small friends. Smart puzzles.' not in c2:
              raise SystemExit('Selected tagline missing')
          if 'Home is where you latch' in c2:
              raise SystemExit('Old Concept 2 tagline still present')
          for token in ['Selected Little Home: Wobbly Toy Letters brand','#c2 .toy-logo span:nth-child(odd)','#c2 .toy-logo span:nth-child(even)','#fff0c9','-webkit-text-stroke:6px var(--navy)']:
              if token not in t:
                  raise SystemExit(f'Missing selected brand token: {token}')
          if 'background:#F5DEAC' not in t:
              raise SystemExit('Current cream button treatment missing')
          print('WOBBLY_LOGO_STATIC_OK')
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js style400-game.css

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          NODE_DIR="$RUNNER_TEMP/wobbly-logo-node"
          mkdir -p "$NODE_DIR"
          cd "$NODE_DIR"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and screenshot
        shell: bash
        run: |
          set -euo pipefail
          NODE_DIR="$RUNNER_TEMP/wobbly-logo-node"
          mkdir -p wobbly-logo-render
          python3 -m http.server 8132 >/tmp/wobbly-logo-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cp .github/scripts/validate_wobbly_logo.mjs "$NODE_DIR/validate_wobbly_logo.mjs"
          node "$NODE_DIR/validate_wobbly_logo.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-wobbly-logo-render
          path: wobbly-logo-render/little-home-wobbly-logo.png
          if-no-files-found: error

      - name: Commit validated implementation and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wobbly-logo-render
          rm -f .github/workflows/apply-wobbly-logo.yml .github/scripts/apply_wobbly_logo.py .github/scripts/validate_wobbly_logo.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/apply-wobbly-logo.yml .github/scripts/apply_wobbly_logo.py .github/scripts/validate_wobbly_logo.mjs
          git commit -m 'Apply Wobbly Toy Letters to Little Home'
          git pull --rebase origin main
          git push origin HEAD:main
