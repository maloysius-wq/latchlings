name: Restore pre-Astra D-pad sizing

on:
  push:
    branches:
      - restore-pre-astra-dpad-sizing

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify committed-main restoration cascade contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9015bdb6b2f60e30b98afddc677e990ba8b1bff4"
          grep -Fq '.dpad{width:min(224px,53vw);height:min(224px,53vw)' style400-game.css
          grep -Fq '.dpad{width:min(190px,45vw);height:min(190px,45vw)' style400-game.css
          grep -Fq "@import url('style400-control-restoration.css?v=20260915-pre-astra-controls1');" style400-whimsy-font.css
          grep -Fq '#game.screen .controls .dpad{width:min(224px,53vw)!important;height:min(224px,53vw)!important}' style400-control-restoration.css
          grep -Fq '#game.screen .controls .dpad{width:min(190px,45vw)!important;height:min(190px,45vw)!important}' style400-control-restoration.css
          grep -Fq '#game.screen .dpad-hit.up{left:34%!important;width:32%!important}' style400-control-restoration.css
          grep -Fq '#game.screen .dpad-hit.down{left:34%!important;width:32%!important}' style400-control-restoration.css
          grep -Fq '#game.screen .dpad-hit.left{top:34%!important;height:32%!important}' style400-control-restoration.css
          grep -Fq '#game.screen .dpad-hit.right{top:34%!important;height:32%!important}' style400-control-restoration.css
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          order = [
              html.index('style400-story-theme.css'),
              html.index('style400-story-rail-board.css'),
              html.index('style400-whimsy-font.css'),
          ]
          assert order == sorted(order), 'restoration host stylesheet must load after Astra gameplay overrides'
          print('COMMITTED_MAIN_RESTORATION_CASCADE_OK')
          PY
      - name: Install browser validation runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify committed-main computed D-pad geometry in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/latchlings-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          const cases = [
            { width: 320, height: 568, expected: 144 },
            { width: 390, height: 568, expected: 175.5 },
            { width: 430, height: 568, expected: 190 },
            { width: 390, height: 844, expected: 206.7 },
          ];
          (async () => {
            const browser = await chromium.launch({headless:true});
            for (const c of cases) {
              const page = await browser.newPage({ viewport: { width: c.width, height: c.height } });
              await page.goto('http://127.0.0.1:8000/index.html', {waitUntil:'networkidle'});
              await page.evaluate(() => {
                document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
                document.querySelector('#game').classList.add('active');
                document.body.dataset.screen = 'game';
              });
              const result = await page.evaluate(() => {
                const dpad = document.querySelector('#game .dpad');
                const up = document.querySelector('#game .dpad-hit.up');
                const left = document.querySelector('#game .dpad-hit.left');
                const ds = getComputedStyle(dpad);
                const us = getComputedStyle(up);
                const ls = getComputedStyle(left);
                return {
                  width: parseFloat(ds.width),
                  height: parseFloat(ds.height),
                  upLeft: parseFloat(us.left),
                  upWidth: parseFloat(us.width),
                  leftTop: parseFloat(ls.top),
                  leftHeight: parseFloat(ls.height),
                };
              });
              const tol = 1.1;
              if (Math.abs(result.width - c.expected) > tol || Math.abs(result.height - c.expected) > tol) {
                throw new Error(`${c.width}x${c.height}: D-pad ${result.width}x${result.height}, expected ${c.expected}`);
              }
              const expectedUpLeft = c.expected * .34;
              const expectedUpWidth = c.expected * .32;
              if (Math.abs(result.upLeft - expectedUpLeft) > tol || Math.abs(result.upWidth - expectedUpWidth) > tol ||
                  Math.abs(result.leftTop - expectedUpLeft) > tol || Math.abs(result.leftHeight - expectedUpWidth) > tol) {
                throw new Error(`${c.width}x${c.height}: direction hit geometry is not the pre-Astra 34%/32% layout: ${JSON.stringify(result)}`);
              }
              console.log(`${c.width}x${c.height}: D-pad ${result.width.toFixed(1)}px OK`);
              await page.close();
            }
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
