name: Validate Floating Island Title Concepts

on:
  push:
    paths:
      - '.github/workflows/validate-title-island-concepts.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('title-island-concepts/index.html')
          text = p.read_text()
          if text.count('data-concept=') != 3:
              raise SystemExit(f'Expected exactly 3 concepts, found {text.count("data-concept=")}')
          forbidden = ['beak','feather','tail','wing']
          low = text.lower()
          for word in forbidden:
              if re.search(r'\b'+re.escape(word)+r'\b', low):
                  raise SystemExit(f'Bird-anatomy term found in runtime markup: {word}')
          if 'preview.png' in low or 'sample.png' in low or 'spritesheet' in low or 'tilesheet' in low:
              raise SystemExit('Preview/sheet asset reference found in runtime')
          emoji = re.compile('[\U0001F000-\U0001FAFF\U00002600-\U000027BF]')
          if emoji.search(text):
              raise SystemExit('Emoji/symbol-pictograph character found in runtime HTML')
          refs = re.findall(r'(?:src)="([^"]+)"', text)
          for ref in refs:
              if ref.startswith(('http:','https:','data:')):
                  raise SystemExit(f'External/runtime-inline image reference found: {ref}')
              target = Path('title-island-concepts') / ref
              if not target.exists():
                  raise SystemExit(f'Missing referenced file: {ref}')
          print('Static validation passed:', len(refs), 'local image references')
          PY
      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser validation and screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p title-island-renders
          python3 -m http.server 8123 >/tmp/title-island-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > .validate-title-island.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (let i=1;i<=3;i++) {
            const page = await browser.newPage({viewport:{width:390,height:844}, deviceScaleFactor:1});
            const errors=[];
            page.on('console',msg=>{ if(msg.type()==='error') errors.push('console: '+msg.text()); });
            page.on('pageerror',err=>errors.push('pageerror: '+err.message));
            page.on('requestfailed',req=>errors.push('requestfailed: '+req.url()));
            const res=await page.goto(`http://127.0.0.1:8123/title-island-concepts/?c=${i}`,{waitUntil:'networkidle'});
            if(!res || !res.ok()) throw new Error(`Concept ${i}: page response failed`);
            await page.waitForTimeout(700);
            const state=await page.evaluate(()=>{
              const active=document.querySelector('.concept.active');
              const phone=active?.querySelector('.phone');
              const imgs=[...active.querySelectorAll('img')];
              return {
                activeId:active?.id,
                conceptCount:document.querySelectorAll('.concept').length,
                broken:imgs.filter(img=>!img.complete || img.naturalWidth===0).map(img=>img.getAttribute('src')),
                bodyScrollWidth:document.body.scrollWidth,
                viewport:innerWidth,
                phoneRect:phone?.getBoundingClientRect().toJSON(),
                playRect:active?.querySelector('.play')?.getBoundingClientRect().toJSON(),
                secondaryRect:active?.querySelector('.secondary')?.getBoundingClientRect().toJSON(),
                latchlings:active?.querySelectorAll('.latchling').length,
                suitSvgs:active?.querySelectorAll('.suit').length
              };
            });
            if(state.activeId!==`c${i}`) throw new Error(`Concept ${i}: wrong active concept ${state.activeId}`);
            if(state.conceptCount!==3) throw new Error(`Concept ${i}: expected 3 concepts`);
            if(state.broken.length) throw new Error(`Concept ${i}: broken images ${state.broken.join(', ')}`);
            if(state.bodyScrollWidth>state.viewport+1) throw new Error(`Concept ${i}: horizontal overflow ${state.bodyScrollWidth}/${state.viewport}`);
            if(!state.phoneRect || state.phoneRect.left < -1 || state.phoneRect.right > state.viewport+1) throw new Error(`Concept ${i}: phone frame out of viewport`);
            if(!state.playRect || !state.secondaryRect) throw new Error(`Concept ${i}: primary UI missing`);
            if(state.latchlings < 6 || state.suitSvgs !== state.latchlings) throw new Error(`Concept ${i}: character/suit render mismatch`);
            if(errors.length) throw new Error(`Concept ${i}: browser errors: ${errors.join(' | ')}`);
            await page.screenshot({path:`title-island-renders/concept-${i}.png`,fullPage:true});
            console.log('Concept',i,state);
            await page.close();
          }
          await browser.close();
          JS
          node .validate-title-island.mjs
          test "$(find title-island-renders -name 'concept-*.png' | wc -l)" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: floating-island-title-renders
          path: title-island-renders/*.png
          if-no-files-found: error
      - name: Remove validator and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-title-island-concepts.yml .validate-title-island.mjs
          rm -rf package.json package-lock.json node_modules
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-title-island-concepts.yml
          git commit -m 'Complete floating-island title concept browser validation'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
