name: Audit Campaign Cinematics
on:
  push:
    paths:
      - '.github/workflows/audit-campaign-cinematics.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static cinematic assertions
        run: |
          set -euo pipefail
          node --check cinematics400.js
          node --check game400-a.js
          node --check game400-b.js
          grep -q "const TRIGGERS={1:'opening',251:'across-drift',301:'old-maps',351:'homeward'}" cinematics400.js
          for title in "The Skyway" "Across the Drift" "Old Maps, New Routes" "Homeward"; do grep -q "$title" cinematics400.js; done
          grep -q 'The Latchlings on your board are the helper crew' cinematics400.js
          grep -q 'They snap along that route until something stops them' cinematics400.js
          grep -q 'A nest is a safe arrival point' cinematics400.js
          grep -q 'style400-cinematics.css' index.html
          grep -q 'cinematics400.js' index.html
          grep -q 'id="storyCinematics"' index.html
          grep -q 'maybeShowBeforeLevel(currentLevel,progress.unlocked,enterStory)' game400-a.js
          grep -q 'renderLibrary(cinematics,progress.unlocked)' game400-b.js
          grep -q 'LatchlingsCinematics.reset()' game400-b.js
          for heading in '# Cinematic 1: The Skyway' '# Cinematic 2: Across the Drift' '# Cinematic 3: Old Maps, New Routes' '# Cinematic 4: Homeward'; do grep -q "$heading" CINEMATICS_SCRIPT.md; done
          CHANGED="$(git diff --name-only 7dad0e558d0524f2db64838b94972f429127dabd..HEAD)"
          ! printf '%s\n' "$CHANGED" | grep -Eq '^(campaign400-|story400\.js$|story-theme400\.js$|title-island-concepts/)'
          echo CINEMATIC_STATIC_OK
      - name: Install Chromium
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/latchlings-cinematic-audit"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Browser audit and renders
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/latchlings-cinematic-audit"
          cat > "$TEST_NODE/audit.mjs" <<'MJS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          const root='http://127.0.0.1:8156/';
          const out=process.env.GITHUB_WORKSPACE+'/cinematic-renders';
          fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});
          const allErrors=[];
          async function fresh({viewport={width:390,height:844},unlocked=1,seen={},reducedMotion='no-preference'}={}){
            const ctx=await browser.newContext({viewport,reducedMotion});
            await ctx.addInitScript(({unlocked,seen})=>{
              localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked,stars:{}}));
              localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify(seen));
              localStorage.removeItem('latchlings_story_cards_seen_v1');
            },{unlocked,seen});
            const page=await ctx.newPage(),errors=[];
            page.on('pageerror',e=>errors.push('page:'+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
            page.on('requestfailed',r=>{const u=r.url(),e=r.failure()?.errorText||'';if(/\.(mp3|wav|ogg|m4a)($|\?)/.test(u)&&/ERR_ABORTED/.test(e))return;errors.push('request:'+u+':'+e)});
            await page.goto(root,{waitUntil:'domcontentloaded'});
            await page.waitForFunction(()=>typeof startLevel==='function'&&window.LatchlingsCinematics&&window.LatchlingsStoryTheme);
            return {ctx,page,errors};
          }
          async function start(page,level,id){await page.evaluate(L=>startLevel(L),level);await page.waitForSelector(`#cinematicOverlay.show[data-cinematic="${id}"]`);await page.waitForFunction(()=>document.body.dataset.screen==='game')}
          async function hidden(page){await page.waitForFunction(()=>!document.getElementById('cinematicOverlay').classList.contains('show'))}
          async function advance(page,n){for(let i=0;i<n;i++){await page.click('#cinematicNext');await page.waitForTimeout(70)}}
          async function noOverflow(page,label){ok(!(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1)),label+' horizontal overflow')}

          // Opening gates Level 1 and teaches the universal route language.
          {
            const {ctx,page,errors}=await fresh();
            await start(page,1,'opening');
            const first=await page.evaluate(()=>({screen:document.body.dataset.screen,active:LatchlingsCinematics.active,beat:LatchlingsCinematics.beat,title:document.getElementById('cinematicTitle').textContent,story:document.getElementById('storyCardOverlay').classList.contains('show'),counter:document.getElementById('cinematicCounter').textContent,islands:document.querySelectorAll('#cinematicStage .cin-island').length}));
            ok(first.screen==='game'&&first.active==='opening'&&first.beat===0&&first.title==='The Skyway'&&!first.story&&first.counter==='1 / 7'&&first.islands>=5,'opening gate failed '+JSON.stringify(first));
            await noOverflow(page,'opening phone');
            await page.screenshot({path:out+'/opening-world.png',fullPage:true});
            await advance(page,5);
            const demo=await page.evaluate(()=>({beat:LatchlingsCinematics.beat,visual:document.getElementById('cinematicOverlay').dataset.visual,rock:!!document.querySelector('.demo-rock'),blocker:!!document.querySelector('.demo-blocker .cin-character'),nest:!!document.querySelector('.demo-nest svg'),copy:document.getElementById('cinematicLines').innerText}));
            ok(demo.beat===5&&demo.visual==='snap-demo'&&demo.rock&&demo.blocker&&demo.nest&&/snap along that route/i.test(demo.copy)&&/safe arrival point/i.test(demo.copy),'route demo incomplete '+JSON.stringify(demo));
            await page.screenshot({path:out+'/opening-route-demo.png',fullPage:true});
            await advance(page,1);ok(await page.locator('#cinematicBeat').textContent()==='This Morning','opening final beat missing');
            await page.click('#cinematicNext');await hidden(page);await page.waitForSelector('#storyCardOverlay.show',{timeout:1600});
            ok(await page.evaluate(()=>LatchlingsCinematics.hasSeen('opening')),'opening not marked seen');
            await page.click('#storyCardContinue');await page.waitForTimeout(100);await page.evaluate(()=>startLevel(1));await page.waitForTimeout(430);
            ok(await page.evaluate(()=>LatchlingsCinematics.active)===null,'seen opening replayed automatically');
            allErrors.push(...errors);await ctx.close();
          }

          // Daily-style direct jumps cannot reveal locked milestone films.
          {
            const {ctx,page,errors}=await fresh({unlocked:1,seen:{opening:1}});await page.evaluate(()=>startLevel(251));await page.waitForTimeout(430);
            ok(await page.evaluate(()=>LatchlingsCinematics.active)===null,'milestone cinematic leaked to low-progress direct jump');allErrors.push(...errors);await ctx.close();
          }

          // Across the Drift triggers at normal Level 251 progression and skip counts as seen.
          {
            const {ctx,page,errors}=await fresh({unlocked:251,seen:{opening:1}});await start(page,251,'across-drift');ok(await page.locator('#cinematicTitle').textContent()==='Across the Drift','Level 251 cinematic mismatch');await page.click('#cinematicSkip');await hidden(page);ok(await page.evaluate(()=>LatchlingsCinematics.hasSeen('across-drift')),'skipped milestone not marked seen');allErrors.push(...errors);await ctx.close();
          }

          // Copperline revelation.
          {
            const {ctx,page,errors}=await fresh({unlocked:301,seen:{opening:1,'across-drift':1}});await start(page,301,'old-maps');await advance(page,2);
            const x=await page.evaluate(()=>({beat:document.getElementById('cinematicBeat').textContent,maps:document.querySelectorAll('.cin-map-sheet').length,copy:document.getElementById('cinematicLines').innerText}));
            ok(x.beat==='They Were All Correct'&&x.maps===3&&/never protected one perfect map/i.test(x.copy),'Copperline reveal mismatch '+JSON.stringify(x));await noOverflow(page,'old maps phone');await page.screenshot({path:out+'/old-maps-revelation.png',fullPage:true});allErrors.push(...errors);await ctx.close();
          }

          // Homeward establishes the living network.
          {
            const {ctx,page,errors}=await fresh({unlocked:351,seen:{opening:1,'across-drift':1,'old-maps':1}});await start(page,351,'homeward');await advance(page,5);
            const x=await page.evaluate(()=>({beat:document.getElementById('cinematicBeat').textContent,chars:document.querySelectorAll('#cinematicStage .cin-character').length,network:document.querySelectorAll('#cinematicStage .cin-network .node').length,copy:document.getElementById('cinematicLines').innerText}));
            ok(x.beat==='Homeward'&&x.chars===5&&x.network===8&&/keep finding a way back/i.test(x.copy),'Homeward finale mismatch '+JSON.stringify(x));await page.screenshot({path:out+'/homeward-network.png',fullPage:true});allErrors.push(...errors);await ctx.close();
          }

          // Replay library respects campaign unlocks.
          {
            const {ctx,page,errors}=await fresh({unlocked:301,seen:{opening:1,'across-drift':1,'old-maps':1}});await page.evaluate(()=>openStoryScreen());await page.waitForSelector('#story.active #storyCinematics .cinematic-library-card');
            const lib=await page.evaluate(()=>[...document.querySelectorAll('#storyCinematics .cinematic-library-card')].map(b=>({id:b.dataset.cinematicId,locked:b.classList.contains('locked'),disabled:b.disabled})));
            ok(lib.length===4&&!lib[0].locked&&!lib[1].locked&&!lib[2].locked&&lib[3].locked,'library unlock states wrong '+JSON.stringify(lib));
            await page.click('[data-cinematic-id="old-maps"]');await page.waitForSelector('#cinematicOverlay.show[data-cinematic="old-maps"]');await page.keyboard.press('Escape');await hidden(page);ok(await page.locator('#story').evaluate(e=>e.classList.contains('active')),'replay did not return to Story screen');allErrors.push(...errors);await ctx.close();
          }

          // Reset Progress clears cinematic history.
          {
            const {ctx,page,errors}=await fresh({unlocked:40,seen:{opening:1}});await page.evaluate(()=>{screen('levels');renderChapter();resetProgress()});await page.waitForSelector('#confirmReset');await page.click('#confirmReset');ok(await page.evaluate(()=>localStorage.getItem('latchlings_cinematics_seen_v1'))===null,'reset did not clear cinematic state');await start(page,1,'opening');allErrors.push(...errors);await ctx.close();
          }

          // Wide and reduced-motion behavior.
          {
            const {ctx,page,errors}=await fresh({viewport:{width:900,height:844}});await start(page,1,'opening');await noOverflow(page,'opening wide');const shell=await page.locator('.cinematic-shell').boundingBox();ok(shell&&shell.width<=522&&shell.height<=826,'wide shell geometry bad '+JSON.stringify(shell));allErrors.push(...errors);await ctx.close();
          }
          {
            const {ctx,page,errors}=await fresh({reducedMotion:'reduce'});await start(page,1,'opening');const motion=await page.evaluate(()=>({island:getComputedStyle(document.querySelector('.cin-island')).animationName,route:getComputedStyle(document.querySelector('.cin-route')).animationName,visible:getComputedStyle(document.querySelector('.cin-island')).opacity,title:document.getElementById('cinematicTitle').textContent}));ok(motion.island==='none'&&motion.route==='none'&&motion.visible!=='0'&&motion.title==='The Skyway','reduced motion failed '+JSON.stringify(motion));allErrors.push(...errors);await ctx.close();
          }

          ok(allErrors.length===0,'browser errors '+allErrors.join(' | '));
          await browser.close();console.log('CINEMATIC_BROWSER_OK');
          MJS
          python3 -m http.server 8156 >/tmp/latchlings-cinematic-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cd "$TEST_NODE"
          node audit.mjs
          test "$(find "$GITHUB_WORKSPACE/cinematic-renders" -name '*.png' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: campaign-cinematic-renders
          path: cinematic-renders/*.png
          if-no-files-found: error
      - name: Self-remove successful audit workflow
        run: |
          set -euo pipefail
          rm -rf cinematic-renders
          rm -f .github/workflows/audit-campaign-cinematics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete campaign cinematic audit'
          git pull --rebase origin main
          git push origin HEAD:main
