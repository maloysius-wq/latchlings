name: Reconcile player feedback refinements

on:
  push:
    branches:
      - opening-story-balance
    paths:
      - '.github/workflows/opening-story-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile handoff and Astra matrix on main
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=caa55b27ebdb6902e0ff018fee4ca80744828171
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED"
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path

          handoff = Path('DEVELOPMENT_HANDOFF.md')
          h = handoff.read_text()
          marker = '## Current work\n\n'
          heading = '### User playtest: controls and opening story balance\n'
          if heading not in h:
              lines = [
                  '### User playtest: controls and opening story balance',
                  '**Status: COMPLETED / ACCEPTED**',
                  '',
                  'Player-feedback follow-up on 2026-09-15 intentionally supersedes two Astra-era presentation choices while preserving the accepted underlying systems.',
                  '',
                  '- **Gameplay controls:** the Astra short/tall-phone D-pad shrink overrides were reverted to the original pre-Astra responsive geometry. Main `9015bdb6b2f60e30b98afddc677e990ba8b1bff4` adds only `style400-control-restoration.css` plus its late import. Committed-main Chromium run `34978632258` verified 144px at 320x568, 175.5px at 390x568, 190px at 430x568, and 206.7px at 390x844, including the original short-screen directional hit geometry. Pages run `34978567074` succeeded. This is now the protected control baseline unless new player testing requests another change.',
                  '- **First-run Opening:** the earlier five-advance compact Opening was too terse in live playtesting. The accepted first-run flow now uses ten existing canonical utterances at `[[0,0],[1,0],[1,1],[1,2],[1,3],[2,2],[3,0],[4,0],[6,0],[7,1]]`, restoring the moving-world hook, all five Little Home voices, the stale-route diagnosis, what the Skyway does, the Waykeeper call, the movement rule, and Pip\'s breakfast beat. No canonical dialogue was rewritten. The complete 8-beat / 18-utterance Opening remains available in replay, and the later three cinematics are unchanged.',
                  '',
                  'Opening acceptance evidence: TDD RED run `34980347527` failed on the old five-step selection; accepted candidate product `a710738756472142c906f71d956652ceb1a5f749`; candidate browser run `34981082617` passed 320x568 / 390x844 / 430x932, full 18-utterance Opening replay, all 56 cinematic utterances, Reduced Motion, control containment, and restored D-pad protection. Candidate artifact `10401806417`, SHA-256 `4c8d9bff12ccc50e42adeb15bf25ee205ac9802d3da78a327cb201859f8b51d8`, was manually reviewed and accepted. Exact accepted `cinematics400.js` bytes were promoted to main as `caa55b27ebdb6902e0ff018fee4ca80744828171`; committed-main run `34981606218` independently revalidated exact provenance and the same runtime contract. Live artifact `10402101217`, SHA-256 `67878195e4dd4ac2ae6327c9215fd7822d02dcd7dcfda85d938cb62b6dd426f0`.',
                  '',
                  'The historical Astra second-review section below remains as evidence of the earlier five-step decision, but its first-run pacing choice is superseded by this player-tested ten-step flow. Preserve the full replay, cinematic presentation architecture, later cinematics, Reduced Motion, authored campaign definitions/solutions, and the restored pre-Astra control geometry.',
                  '',
                  '',
              ]
              section = '\n'.join(lines)
              if marker not in h:
                  raise SystemExit('Current work marker missing')
              h = h.replace(marker, marker + section, 1)
              handoff.write_text(h)

          matrix = Path('ASTRA_AUDIT_ACCEPTANCE_MATRIX.md')
          m = matrix.read_text()
          m = m.replace('Last reconciled: 2026-09-14', 'Last reconciled: 2026-09-15', 1)
          section_heading = '## Post-audit player-feedback refinements\n'
          if section_heading not in m:
              before = '## Item-by-item reconciliation\n'
              lines = [
                  '## Post-audit player-feedback refinements',
                  '',
                  '### 2026-09-15 controls and first-run Opening',
                  'Live player feedback superseded two previously accepted presentation choices without reopening the audit\'s underlying functional closure.',
                  '',
                  '- The Astra-era compact D-pad shrink is no longer the accepted product behavior. Main `9015bdb6b2f60e30b98afddc677e990ba8b1bff4` restores the original responsive pre-Astra D-pad sizing/hit geometry, browser-verified in committed-main run `34978632258` across 320x568, 390x568, 430x568, and 390x844.',
                  '- The second-review five-advance first-run Opening proved too sparse in actual play. Accepted candidate `a710738756472142c906f71d956652ceb1a5f749` replaces only `OPENING_FIRST_RUN_STEPS` with ten canonical turns: `[[0,0],[1,0],[1,1],[1,2],[1,3],[2,2],[3,0],[4,0],[6,0],[7,1]]`. Candidate run `34981082617` and committed-main run `34981606218` verify the richer first-run flow at three phone sizes while retaining the full 18-utterance Opening replay, all 56 canonical cinematic utterances, Reduced Motion, and the restored D-pad. Exact product bytes are live in main `caa55b27ebdb6902e0ff018fee4ca80744828171`.',
                  '',
                  'These are user-directed refinements after the audit. Historical evidence for the earlier compact-control and five-step-opening decisions remains below for provenance, but those two presentation choices are not the current product baseline.',
                  '',
                  '',
              ]
              section = '\n'.join(lines)
              if before not in m:
                  raise SystemExit('matrix insertion marker missing')
              m = m.replace(before, section + before, 1)
          old = '| U06 control dominance | COMPLETED | Compact controls are accepted. Swipe and Undo are optional design experiments and intentionally NON-BLOCKING because they change interaction/difficulty economics. |'
          new = '| U06 control dominance | COMPLETED | The interaction model remains accepted, but live player feedback superseded the Astra-era D-pad shrink: main `9015bdb6b2f60e30b98afddc677e990ba8b1bff4` restores the original pre-Astra responsive D-pad size and directional hit geometry, verified in committed-main run `34978632258`. Swipe and Undo remain optional design experiments and intentionally NON-BLOCKING because they change interaction/difficulty economics. |'
          if old in m:
              m = m.replace(old, new, 1)
          elif new not in m:
              raise SystemExit('U06 matrix row did not match expected baseline')
          matrix.write_text(m)
          PY
          git diff --check
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "ASTRA_AUDIT_ACCEPTANCE_MATRIX.md DEVELOPMENT_HANDOFF.md "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          git commit -m "Reconcile player-tested controls and opening"
          git push origin HEAD:main
