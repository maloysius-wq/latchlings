name: Close Opening World Rebuild

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-opening-world.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout closeout commit
        uses: actions/checkout@v4

      - name: Mark handoff completed
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('DEVELOPMENT_HANDOFF.md')
          text = path.read_text()
          old = '**Status: IN PROGRESS / USER-APPROVED REBUILD**'
          new = '**Status: COMPLETED / MERGED AND COMMITTED-MAIN VERIFIED**'
          closeout = "Closeout (2026-09-16): PR #4, `Rebuild Opening around canonical Little Home`, was squash-merged to `main` as `8ac932e073b2fb72fd014fbbe3f885781af3ce41`. Candidate GitHub Actions run `35131002359` passed the full shipped six-suite `npm test`, including canonical-world coherence, the dedicated route-model header regression at Normal/Large Text, physical-phone geometry, continuous Opening behavior, first-run/replay/skip safety, and all 38 later-cinematic utterances. The exact merged-main commit was independently revalidated by browser run `35131483783`, which passed the same complete suite; repository access guard run `35131483828` passed; and GitHub Pages deployment run `35131482355` succeeded. Manual review of fresh candidate screenshots confirmed the three semantic misses, Rowan comparison, relocated Waykeeper call, final route-model header separation, and 360x800 Large Text presentation. The temporary Opening validation workflow is removed by this closeout commit; reusable regression tests remain in `tests/`."
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Opening world status marker not found')
          if closeout not in text:
              marker = new + '\n'
              if marker not in text:
                  raise SystemExit('Completed status marker not found for closeout insertion')
              text = text.replace(marker, marker + '\n' + closeout + '\n', 1)
          path.write_text(text)
          PY

      - name: Remove temporary validator
        run: rm .github/workflows/validate-opening-world.yml

      - name: Commit closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/validate-opening-world.yml
          git diff --cached --quiet && exit 0
          git commit -m '[opening-world-action] Complete verified canonical-world rebuild'
          git push
