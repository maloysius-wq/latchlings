name: Start campaign narrative clarity overhaul

on:
  push:
    paths:
      - '.github/workflows/start-narrative-clarity-overhaul.yml'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add IN PROGRESS handoff entry
        run: python .github/tmp/start-narrative-clarity-handoff.py
      - name: Commit handoff start
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git diff --cached --quiet || git commit -m "Start campaign narrative clarity overhaul"
          git push
      - name: Self-remove starter
        run: |
          git pull --rebase
          git rm .github/workflows/start-narrative-clarity-overhaul.yml .github/tmp/start-narrative-clarity-handoff.py
          git commit -m "Remove narrative clarity start helper"
          git push
