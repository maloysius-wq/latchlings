name: Audit Refined Sunpetal Acceptance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static integrity checks
        run: |
          set -euo pipefail
          node --check level-variation400.js
          node --check story-grounding400.js
          node --check cinematic-dialogue400.js
          node --check cinematics400.js
          test "$(git diff --name-only eb3fb94a20befb81cb2e178d186bd08e5e16ba49..HEAD -- 'campaign400-*.js' | wc -l)" -eq 0
          grep -q "style400-level-variation-refine.css" style400-level-variation-reactive.css
          grep -q "coordination point, not a command center" STORY_BIBLE.md
          grep -q "## Ending" STORY_BIBLE.md
          grep -q "## Core theme" STORY_BIBLE.md
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/latchlings-server.log 2>&1 &
          sleep 2
      - name: Create browser audit harness
        run: |
          cat > audit-acceptance.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const OUT='acceptance-renders';
          for(const d of [OUT,path.join(OUT,'levels'),path.join(OUT,'cinematics')])fs.mkdirSync(d,{recursive:true});
          const fail=m=>{throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const makePage=async(viewport={width:390,height:844},reducedMotion='no-preference')=>{
            const context=await browser.newContext({viewport,reducedMotion});
            const page=await context.newPage();
            page.setDefaultTimeout(6000);page.setDefaultNavigationTimeout(12000);
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/ERR_ABORTED|favicon/i.test(m.text()))errors.push('console: '+m.text())});
            return {context,page};
          };
          const seed=page=>page.addInitScript(()=>{
            const stars={};for(let i=1;i<=400;i++)stars[i]=0;
            localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars}));
            const story={};for(let i=1;i<=400;i++)story[i]=1;
            localStorage.setItem('latchlings_story_cards_seen_v1',JSON.stringify(story));
            localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1,'across-drift':1,'old-maps':1,homeward:1}));
          });
          const settle=async(page,L)=>{
            await page.evaluate(n=>startLevel(n),L);await page.waitForTimeout(90);
            await page.evaluate(()=>{window.LatchlingsStoryTheme?.close(false);if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(false);document.getElementById('overlay')?.classList.remove('show');document.getElementById('board')?.scrollIntoView({block:'center'});});
            await page.waitForTimeout(40);
          };
          const phaseKeys=['home-morning','meadow-detours','open-fields','reroute-work','golden-return'];
          const subjects=['breakfast','watering','kite','bread','mail','tea','gate','picnic','cart','scarf'];
          const landmarks=['.lv-cottage','.lv-signpost','.lv-windmill','.lv-route-stake','.lv-lantern'];
          const captures=new Set([1,5,10,11,15,20,21,25,30,31,35,40,41,45,50]);
          const {context,page}=await makePage();await seed(page);await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.startLevel&&window.LatchlingsLevelVariation);
          const manifest=[];
          for(let L=1;L<=50;L++){
            await settle(page,L);
            const data=await page.evaluate(({L,landmarks})=>{
              const app=document.getElementById('app'),game=document.getElementById('game'),env=document.getElementById('levelEnvironment'),board=document.getElementById('board');
              const phase=Math.floor((L-1)/10),land=document.querySelector(landmarks[phase]),br=board.getBoundingClientRect(),center=document.elementFromPoint(br.left+br.width/2,br.top+br.height/2);
              const props=[...document.querySelectorAll('#levelProps .level-prop')].map(el=>{const r=el.getBoundingClientRect();return {l:r.left,r:r.right,t:r.top,b:r.bottom}});
              const inner={l:br.left+br.width*.12,r:br.right-br.width*.12,t:br.top+br.height*.12,b:br.bottom-br.height*.12};
              const propIntrudes=props.some(r=>r.r>inner.l&&r.l<inner.r&&r.b>inner.t&&r.t<inner.b);
              const badge=env.querySelector('.lv-milestone-badge')?.getBoundingClientRect();
              return {phase:app.dataset.sunpetalPhase,envPhase:env?.dataset.phase,ambient:env?.dataset.ambient,subject:game.dataset.levelSubject,milestone:env?.classList.contains('milestone'),landVisible:!!land&&getComputedStyle(land).display!=='none'&&land.getBoundingClientRect().width>0,overflow:document.documentElement.scrollWidth-window.innerWidth,boardInside:!!center&&board.contains(center),propIntrudes,badgeVisible:!!badge&&badge.bottom<br.top,font:getComputedStyle(document.querySelector('.game-title')).fontFamily,logoFont:getComputedStyle(document.querySelector('#game .logo')).fontFamily};
            },{L,landmarks});
            const phase=Math.floor((L-1)/10),slot=(L-1)%10;
            if(data.phase!==String(phase+1)||data.envPhase!==phaseKeys[phase])fail(`Level ${L}: wrong phase`);
            if(data.subject!==subjects[slot]||data.ambient!==((slot<5)?'a':'b'))fail(`Level ${L}: wrong motif/ambient`);
            if(data.milestone!==(L%10===0)||!data.landVisible)fail(`Level ${L}: milestone/landmark mismatch`);
            if(data.overflow>1||!data.boardInside||data.propIntrudes)fail(`Level ${L}: presentation collision`);
            if(!data.badgeVisible)fail(`Level ${L}: phase label is not visibly above board`);
            if(!/Rounded|Trebuchet|ui-rounded/i.test(data.font)||!/Georgia/i.test(data.logoFont))fail(`Level ${L}: typography regression`);
            if(captures.has(L)){const file=path.join(OUT,'levels',`level-${String(L).padStart(2,'0')}.png`);await page.screenshot({path:file,fullPage:true,animations:'disabled'});data.file=file;}
            manifest.push({level:L,...data});
          }
          await settle(page,19);
          const total=await page.locator('#pieceLayer .latchling').count();if(total<2)fail('Reactive test needs 2+ helpers');
          await page.evaluate(()=>document.querySelector('#pieceLayer .latchling')?.remove());await page.waitForTimeout(50);
          if(await page.locator('#game').getAttribute('data-route-progress')!=='working')fail('Reactive scenery working state missing');
          await page.evaluate(()=>document.querySelectorAll('#pieceLayer .latchling').forEach(x=>x.remove()));await page.waitForTimeout(50);
          if(await page.locator('#game').getAttribute('data-route-progress')!=='complete')fail('Reactive scenery complete state missing');
          const story=await page.evaluate(()=>({m:LATCHLINGS_STORY.helperCrewMotto,e:LATCHLINGS_STORY.helperCrewExplanation,p:LATCHLINGS_STORY.premise}));
          if(!/Every island knows its own paths/i.test(story.m)||!/not a command center/i.test(story.e)||!/first household/i.test(story.p))fail('Community rationale missing');
          await context.close();

          const {context:cc,page:cp}=await makePage();await cp.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});await cp.waitForFunction(()=>window.LatchlingsCinematics&&window.LatchlingsCinematicDialogue);
          const cinManifest=[];const ids=['opening','across-drift','old-maps','homeward'];
          for(const id of ids){
            if(!await cp.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id))fail(`Cannot show ${id}`);await cp.waitForTimeout(130);
            const count=await cp.evaluate(()=>LatchlingsCinematics.CINEMATICS[LatchlingsCinematics.active].beats.length);
            for(let i=0;i<count;i++){
              if(i){await cp.evaluate(()=>LatchlingsCinematics.next());await cp.waitForTimeout(80)}
              const d=await cp.evaluate(()=>{const a=LatchlingsCinematics,b=a.CINEMATICS[a.active].beats[a.beat],g=LatchlingsCinematicDialogue.dialogueGroups(b),n=LatchlingsCinematicDialogue.narratorLines(b),s=document.getElementById('cinematicStage'),l=document.getElementById('cinematicLines'),sr=s.getBoundingClientRect(),bs=[...s.querySelectorAll('.cin-speech-bubble')].map(x=>x.getBoundingClientRect());return {id:a.active,index:a.beat,expected:g.length,narrExpected:n.length,bubbles:bs.length,narr:l.querySelectorAll('.narrator-only').length,old:l.querySelectorAll('.dialogue').length,narrLabel:/Narrator/i.test(l.textContent||''),within:bs.every(r=>r.left>=sr.left-1&&r.right<=sr.right+1&&r.top>=sr.top-1&&r.bottom<=sr.bottom+1),intro:s.querySelectorAll('.cin-intro-person').length,names:[...s.querySelectorAll('.cin-intro-person .cin-speaker-name')].map(x=>x.textContent),overflow:document.documentElement.scrollWidth-window.innerWidth};});
              if(d.bubbles!==d.expected||d.narr!==d.narrExpected||d.old||d.narrLabel||!d.within||d.overflow>1)fail(`${id} beat ${i+1}: dialogue presentation failed`);
              if(id==='opening'&&i===1){if(d.intro!==5)fail('Opening cast count');for(const n of ['Pippa','Bramble','Rowan','Pip','Tansy'])if(!d.names.includes(n))fail(`Missing ${n}`)}
              const capture=id==='opening'||i===0||i===count-1;if(capture){const file=path.join(OUT,'cinematics',`${id}-${String(i+1).padStart(2,'0')}.png`);await cp.screenshot({path:file,fullPage:true,animations:'disabled'});d.file=file;}
              cinManifest.push(d);
            }
            await cp.evaluate(()=>LatchlingsCinematics.finish(false));await cp.waitForTimeout(40);
          }
          await cc.close();

          const {context:wc,page:wp}=await makePage({width:900,height:844},'reduce');await wp.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});await wp.waitForFunction(()=>window.LatchlingsCinematics);await wp.evaluate(()=>LatchlingsCinematics.show('opening',{markSeen:false}));await wp.waitForTimeout(80);await wp.evaluate(()=>LatchlingsCinematics.next());await wp.waitForTimeout(80);
          const wide=await wp.evaluate(()=>({overflow:document.documentElement.scrollWidth-window.innerWidth,people:document.querySelectorAll('.cin-intro-person').length,animations:[...document.querySelectorAll('.cin-dialogue-layer *')].map(x=>getComputedStyle(x).animationName).filter(x=>x&&x!=='none')}));
          if(wide.overflow>1||wide.people!==5||wide.animations.length)fail('Wide/reduced-motion regression');
          const title=await wp.evaluate(()=>{const d=document.getElementById('homeTitleFrame').contentDocument;return {titleFont:getComputedStyle(d.querySelector('#c2 .toy-logo')).fontFamily,tagFont:getComputedStyle(d.querySelector('#c2 .toy-tagline')).fontFamily}});
          if(!/Arial Rounded|Trebuchet/i.test(title.titleFont)||!/Inter|Avenir Next|system-ui/i.test(title.tagFont))fail('Title/tagline typography changed');
          await wc.close();
          if(errors.length)fail(errors.join('\n'));
          fs.writeFileSync(path.join(OUT,'manifest.json'),JSON.stringify({levels:manifest,cinematics:cinManifest,title},null,2));
          await browser.close();
          EOF
      - name: Run browser acceptance audit
        run: node audit-acceptance.mjs
      - name: Build visual sheets
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          os.makedirs('acceptance-renders/contact-sheets',exist_ok=True)
          def sheet(items,out,cols=5,w=195):
            if not items:return
            ims=[Image.open(x).convert('RGB') for x in items];h=int(w*ims[0].height/ims[0].width);rows=math.ceil(len(items)/cols);can=Image.new('RGB',(cols*w,rows*(h+18)),'white');dr=ImageDraw.Draw(can)
            for i,(im,f) in enumerate(zip(ims,items)):
              im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+18);can.paste(im,(x,y));dr.text((x+4,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
            can.save(out,quality=92)
          sheet(sorted(glob.glob('acceptance-renders/levels/*.png')),'acceptance-renders/contact-sheets/levels.jpg')
          sheet(sorted(glob.glob('acceptance-renders/cinematics/*.png')),'acceptance-renders/contact-sheets/cinematics.jpg',4,195)
          PY
      - name: Upload acceptance renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refined-sunpetal-acceptance
          path: acceptance-renders
          if-no-files-found: warn
      - name: Remove temporary acceptance workflow
        if: always()
        run: |
          rm -f .github/workflows/audit-sunpetal-acceptance-v4.yml audit-acceptance.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-sunpetal-acceptance-v4.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Sunpetal acceptance audit"
            git push
          fi
