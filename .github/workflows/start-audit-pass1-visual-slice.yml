name: Start audit Pass 1 and visual slice handoff

on:
  push:
    paths:
      - '.github/workflows/start-audit-pass1-visual-slice.yml'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add IN PROGRESS handoff entry
        shell: python
        run: |
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          marker='## Current Work\n'
          heading='### 2026-09-12 — Audit Pass 1 clarity/correctness and approved visual slice'
          entry='''\n\n### 2026-09-12 — Audit Pass 1 clarity/correctness and approved visual slice\n\n**Status: IN PROGRESS**\n\n**User goal:** Use the approved `LATCHLINGS_VISUAL_STORY_AUDIT.md` and its gameplay/cutscene/chapter-reward studies as the implementation roadmap. Re-check every audit observation against current `main`, complete **Pass 1: clarity and correctness**, then build the proposed **production-quality visual slice** before rolling that visual language through the rest of the campaign. Do not assume the audit snapshot is still correct when current source disagrees.\n\n**Current-source recheck:** `main` is currently `a5048dd25804fdd261639e5a22332a0cfd506682`, the same commit the audit inspected, so the audited P1 findings remain directly relevant unless a runtime check proves otherwise. Source inspection confirms: later cinematic dialogue is regrouped by speaker in `cinematic-dialogue400.js`; the home gear still routes to Story & Residents while the actual Settings modal owns Music/SFX toggles; Daily starts an arbitrary campaign level through the normal `startLevel()`/`winLevel()` path; `campaignBriefing()` returns the full end-state campaign goal/rigidity language at fresh progress; the story rail replaces the mechanic note and remains fixed at 94px with very small labels; failure/win/hint copy still exposes solver jargon; and the viewport meta still disables user scaling.\n\n**Pass 1 implementation plan:** (1) Preserve chronological cinematic line order and move non-opening films to the same protected dialogue-dock model rather than regrouping speaker lines in the scenic stage. (2) Make Story & Residents strictly earned-knowledge-aware at fresh/early/mid/late progress. (3) Make the home gear open real Settings; keep Story & Residents behind an explicit book/story entry; expose Music, SFX, motion/readability preferences and controls from Settings and Pause. (4) Introduce an explicit Daily mode with isolated completion state, spoiler-safe/neutral presentation, no campaign unlock/star mutation, and an obvious return path. (5) Separate mechanic teaching from the story rail so story never destroys the playable mechanic cue; replace A/S/I-O shorthand with real mechanic art where feasible and keep essential cues available even if cinematics are skipped. (6) Replace player-facing solver jargon in hints/failure/win with plain, encouraging language and accurate move pluralization. (7) Raise effective tap targets and useful text sizes, remove `user-scalable=no`, and make the complete gameplay control region reachable at 320x568 through 768x844.\n\n**Visual-slice implementation plan:** After Pass 1 is functionally green, implement one coherent miniature/storybook production slice using the attached studies as composition and hierarchy direction, not literal replacement assets: (a) Sunpetal gameplay with a quiet matte floor, strong mechanic hierarchy, readable matching nest/piece, one concise story line, separate mechanic cue, and compact controls; (b) one dense Aurora board using the same playable-object grammar; (c) the Across the Drift familiar-porch cinematic with layered depth and an unobstructed chronological dialogue dock; and (d) Chapter 1 reward with a visible mailbox/Little Home payoff, concise result copy, stars secondary, and clear `Visit Little Home` / continue choices. The slice must reuse canonical cast/world identity and establish reusable tokens/components instead of adding another broad override layer. No campaign-wide material rollout is authorized in this entry.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`; `cinematic-dialogue400.js`, `cinematics400.js`, cinematic CSS; `story-grounding400.js`, `gameplay-story-rail400.js`, story/settings UI; `game400-a.js`, `game400-b.js`; `music400.js`, `sfx400.js` only as needed for direct settings controls; `index.html`; game/UI/Atlas/story/board CSS; chapter reward presentation; temporary self-removing browser-validation helpers. Puzzle rules/solutions and all 400 level definitions must remain unchanged.\n\n**Validation plan:** Use Chromium acceptance runs at 320x568, 360x800, 390x844, 430x932, and 768x844, plus DPR 1/3 where visual precision matters. Verify late-film utterances remain in source order; fresh Story & Residents does not reveal later conclusions; Settings and Pause expose persistent Music/SFX/readability/motion controls; Daily uses isolated state and cannot advance campaign progress; mechanic cues survive story rendering; hints/failure/win contain no solver jargon and pluralize correctly; targets/readability/viewport containment meet the audit goals; and reduced motion/keyboard/focus remain usable. For the visual slice, capture current/proposed Sunpetal, dense Aurora, porch, and Chapter 1 reward at phone size, assert no floor decoration resembles mechanics, focal objects remain readable, the porch meaning survives with text hidden, and the reward visibly shows the mailbox change. Run board-rule/source hashes and representative movement tests to prove gameplay data is untouched.\n\n**Deployment plan:** Commit this IN PROGRESS journal entry before any product edits. Implement and validate Pass 1 first; then implement/validate the visual slice as a second accepted product commit. Deploy only clean accepted states to GitHub Pages, inspect the visual artifact manually, then close this entry as `COMPLETED`, `PARTIAL`, or `BLOCKED` with exact commits/runs/artifacts/remaining risks. Remove all temporary helpers and verify `.github/workflows` contains only the durable repository-access guard.\n\n'''
          if heading not in s:
              s=s.replace(marker,marker+entry,1)
              p.write_text(s)
      - name: Commit handoff start
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git diff --cached --quiet || git commit -m "Start audit Pass 1 and visual slice handoff"
          git push
      - name: Self-remove helper
        run: |
          git pull --rebase
          git rm .github/workflows/start-audit-pass1-visual-slice.yml
          git commit -m "Remove audit Pass 1 start helper"
          git push
