name: Fix Story Residents And Opening Deep Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-story-residents-opening-deep-audit.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply face and cinematic geometry repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          story=Path('style400-story-theme.css')
          s=story.read_text()
          marker='/* Deep audit: Story & Residents face anatomy repair. */'
          patch=r'''

          /* Deep audit: Story & Residents face anatomy repair. */
          .story-person-portrait>.story-character-avatar .story-character-avatar-face{left:11%!important;right:11%!important;top:27%!important;height:61%!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes{left:0!important;right:0!important;top:5%!important;height:38%!important;gap:20%!important;justify-content:center!important;align-items:center!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes i{display:block!important;width:24%!important;height:100%!important;min-width:6px!important;max-width:8px!important;border-radius:50%!important;background:#17253a!important;box-shadow:inset 0 -1px rgba(5,16,29,.18)!important;opacity:1!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes i:before{content:""!important;display:block!important;position:absolute!important;width:36%!important;height:36%!important;border-radius:50%!important;background:#fff!important;left:12%!important;top:9%!important;opacity:1!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes i:after{content:""!important;display:block!important;position:absolute!important;width:15%!important;height:15%!important;border-radius:50%!important;background:rgba(255,255,255,.78)!important;right:16%!important;bottom:17%!important;opacity:1!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-mouth{left:50%!important;top:48%!important;translate:-50% 0!important;margin:0!important;border:0!important;background:transparent!important;rotate:0deg!important;box-sizing:border-box!important}
          .story-person-portrait>.story-character-avatar.expr-happy .story-character-avatar-mouth{width:28%!important;height:20%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 55% 55%!important}
          .story-person-portrait>.story-character-avatar.expr-smug .story-character-avatar-mouth{width:29%!important;height:18%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 72% 30%!important;rotate:-5deg!important}
          .story-person-portrait>.story-character-avatar.expr-curious .story-character-avatar-mouth{width:23%!important;height:19%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 58% 45%!important;rotate:5deg!important}
          .story-person-portrait>.story-character-avatar.expr-determined .story-character-avatar-mouth{width:25%!important;height:16%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 38% 38%!important}
          .story-person-portrait>.story-character-avatar.expr-surprised .story-character-avatar-mouth{width:19%!important;height:22%!important;border:1.4px solid #17253a!important;border-radius:50%!important;background:#29415f!important}
          '''
          if marker not in s:
              story.write_text(s+patch)

          geo=Path('style400-cinematics-geometry.css')
          g=geo.read_text()
          marker2='/* Deep audit: content-safe opening dialogue and tutorial geometry. */'
          patch2=r'''

          /* Deep audit: content-safe opening dialogue and tutorial geometry. */
          .cin-dialogue-layer[data-dialogue-count] .cin-speech-bubble{height:auto!important;min-height:var(--cin-bubble-height,0px)!important;overflow:visible!important;box-sizing:border-box!important;left:calc(50% + var(--cin-bubble-shift,0px))!important;white-space:normal!important;overflow-wrap:anywhere!important}
          .cin-dialogue-layer[data-dialogue-count] .cin-speech-bubble span{overflow:visible!important}
          .cinematic-copy{scroll-padding-top:8px;overscroll-behavior:contain}

          /* The snap tutorial is laid out as two compact rows instead of translating a full-size board above the stage. */
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-board{inset:8px 16px auto!important;height:150px!important;transform:none!important;transform-origin:50% 0!important;display:grid!important;grid-template-rows:12px 52px 12px 52px!important;gap:3px!important;padding:7px 14px!important;overflow:hidden!important;box-sizing:border-box!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-label{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;align-self:end!important;line-height:1!important;z-index:3!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;height:52px!important;box-sizing:border-box!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-arrow{display:none!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track .cin-character{width:30px!important;height:30px!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-mover{top:8px!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-rock{width:32px!important;height:30px!important;top:8px!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-blocker{top:7px!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-nest{width:34px!important;height:34px!important;top:6px!important}

          @media(max-height:720px){
            .cinematic-shell{grid-template-rows:auto clamp(230px,38vh,260px) minmax(0,1fr)!important}
            .cinematic-stage{min-height:0!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-board{inset:6px 14px auto!important;height:118px!important;grid-template-rows:8px 40px 8px 40px!important;gap:3px!important;padding:5px 12px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-label{font-size:7px!important;letter-spacing:.08em!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track{height:40px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track .cin-character{width:26px!important;height:26px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-mover{top:5px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-rock{width:28px!important;height:26px!important;top:5px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-blocker{top:4px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-nest{width:29px!important;height:29px!important;top:3px!important;border-width:2px!important}
          }
          @media(max-height:600px){
            .cinematic-shell{grid-template-rows:auto 230px minmax(0,1fr)!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-board{inset:5px 12px auto!important;height:106px!important;grid-template-rows:7px 36px 7px 36px!important;gap:2px!important;padding:4px 10px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-label{font-size:6.5px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track{height:36px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track .cin-character{width:24px!important;height:24px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-mover{top:4px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-rock{width:26px!important;height:24px!important;top:4px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-blocker{top:3px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-nest{width:27px!important;height:27px!important;top:2px!important}
          }
          '''
          if marker2 not in g:
              geo.write_text(g+patch2)

          js=Path('cinematic-geometry400.js')
          j=js.read_text()
          old="""function normalizeDialogue(stage){\n const layers=[...stage.querySelectorAll(':scope > .cin-dialogue-layer')];\n layers.forEach(layer=>{\n  const bubbles=[...layer.querySelectorAll('.cin-speech-bubble')];if(!bubbles.length)return;\n  layer.style.removeProperty('--cin-bubble-height');\n  let target=Math.max(...bubbles.map(b=>Math.ceil(b.scrollHeight)));const compact=stage.getBoundingClientRect().height<280;target=clamp(target,compact?46:50,compact?70:82);layer.style.setProperty('--cin-bubble-height',`${target}px`);\n  requestAnimationFrame(()=>bubbles.forEach(b=>{\n   const speaker=b.closest('[data-speaker]'),portrait=speaker?.querySelector('.dialogue-portrait'),br=b.getBoundingClientRect(),pr=portrait?.getBoundingClientRect();if(!pr||!br.width)return;const px=pr.left+pr.width/2,tail=clamp((px-br.left)/br.width*100,12,88);b.style.setProperty('--cin-tail-x',`${tail.toFixed(2)}%`);\n  }));\n });\n}\n"""
          new="""function normalizeDialogue(stage){\n const layers=[...stage.querySelectorAll(':scope > .cin-dialogue-layer')];\n layers.forEach(layer=>{\n  const bubbles=[...layer.querySelectorAll('.cin-speech-bubble')];if(!bubbles.length)return;\n  layer.style.removeProperty('--cin-bubble-height');\n  bubbles.forEach(b=>b.style.removeProperty('--cin-bubble-shift'));\n  const target=Math.max(...bubbles.map(b=>Math.ceil(b.scrollHeight)));\n  layer.style.setProperty('--cin-bubble-height',`${target}px`);\n  requestAnimationFrame(()=>{\n   const sr=stage.getBoundingClientRect(),pad=5;\n   bubbles.forEach(b=>{\n    b.style.removeProperty('--cin-bubble-shift');\n    const br=b.getBoundingClientRect();let shift=0;\n    if(br.left<sr.left+pad)shift+=(sr.left+pad-br.left);\n    if(br.right>sr.right-pad)shift-=(br.right-(sr.right-pad));\n    if(Math.abs(shift)>.25)b.style.setProperty('--cin-bubble-shift',`${shift.toFixed(2)}px`);\n   });\n   requestAnimationFrame(()=>bubbles.forEach(b=>{\n    const speaker=b.closest('[data-speaker]'),portrait=speaker?.querySelector('.dialogue-portrait'),br=b.getBoundingClientRect(),pr=portrait?.getBoundingClientRect();if(!pr||!br.width)return;const px=pr.left+pr.width/2,tail=clamp((px-br.left)/br.width*100,12,88);b.style.setProperty('--cin-tail-x',`${tail.toFixed(2)}%`);\n   }));\n  });\n });\n}\n"""
          if old not in j:
              raise SystemExit('normalizeDialogue source anchor missing')
          js.write_text(j.replace(old,new,1))

          cin=Path('cinematics400.js')
          c=cin.read_text()
          old_focus="setTimeout(()=>document.getElementById('cinematicNext')?.focus(),50);return true"
          new_focus="setTimeout(()=>{const b=document.getElementById('cinematicNext');if(b)try{b.focus({preventScroll:true})}catch(_){b.focus()}const copy=document.querySelector('.cinematic-copy');if(copy)copy.scrollTop=0},50);return true"
          if old_focus not in c:
              raise SystemExit('cinematic focus anchor missing')
          c=c.replace(old_focus,new_focus,1)
          old_render="nextBtn.textContent=activeIndex===c.beats.length-1?c.finalLabel:'Continue';requestAnimationFrame(()=>o.classList.add('beat-ready'))"
          new_render="nextBtn.textContent=activeIndex===c.beats.length-1?c.finalLabel:'Continue';const copy=document.querySelector('.cinematic-copy');if(copy)copy.scrollTop=0;requestAnimationFrame(()=>o.classList.add('beat-ready'))"
          if old_render not in c:
              raise SystemExit('cinematic render anchor missing')
          cin.write_text(c.replace(old_render,new_render,1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-http.log 2>&1 &
      - name: Validate all resident faces and opening cinematic sizes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deep-fix-audit/story deep-fix-audit/opening deep-fix-audit/later
          cat > validate-deep-fix.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const sizes=[[320,568],[360,640],[390,700],[390,844],[430,932]];
          const report={story:{},opening:{},later:[]};
          const assert=(v,msg)=>{if(!v)throw new Error(msg)};
          const R=e=>{if(!e)return null;const r=e.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom}};
          for(const [width,height] of sizes){
            const key=`${width}x${height}`;
            const page=await browser.newPage({viewport:{width,height},reducedMotion:'reduce'});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.waitForFunction(()=>window.LatchlingsStoryTheme&&window.LatchlingsCinematics);
            await page.evaluate(()=>{localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars:{}}));openStoryScreen();});
            await page.waitForTimeout(160);
            const faces=await page.evaluate(()=>[...document.querySelectorAll('#storyCast .story-person-portrait')].map(card=>{
              const avatar=card.querySelector('.story-character-avatar'),eyes=[...card.querySelectorAll('.story-character-avatar-eyes i')],mouth=card.querySelector('.story-character-avatar-mouth');
              const ac=getComputedStyle(avatar),mc=getComputedStyle(mouth),mr=mouth.getBoundingClientRect();
              return{name:card.dataset.character,eyes:eyes.map(e=>{const r=e.getBoundingClientRect(),cs=getComputedStyle(e),hi=getComputedStyle(e,'::before');return{w:r.width,h:r.height,opacity:+cs.opacity,bg:cs.backgroundColor,highlight:hi.backgroundColor,highlightContent:hi.content}}),mouth:{w:mr.width,h:mr.height,borderTop:mc.borderTopWidth,borderBottom:mc.borderBottomWidth,bg:mc.backgroundColor},avatarOverflow:ac.overflow};
            }));
            assert(faces.length===5,`${key}: expected five residents`);
            for(const f of faces){
              assert(f.eyes.length===2,`${key} ${f.name}: missing eye elements`);
              for(const e of f.eyes){assert(e.w>=5&&e.h>=6,`${key} ${f.name}: eye too small ${e.w}x${e.h}`);assert(e.opacity>.9,`${key} ${f.name}: eye hidden`);assert(e.highlightContent!=='none',`${key} ${f.name}: catchlight missing`)}
              assert(f.mouth.w>=5&&f.mouth.h>=3,`${key} ${f.name}: mouth geometry collapsed`);
              if(f.name!=='Tansy')assert(parseFloat(f.mouth.borderBottom)>0,`${key} ${f.name}: expected clean lower mouth curve`);
            }
            report.story[key]=faces;
            await page.screenshot({path:`deep-fix-audit/story/story-${key}.png`,fullPage:true});
            await page.evaluate(()=>storyModal());await page.waitForTimeout(80);
            const modalEyes=await page.evaluate(()=>[...document.querySelectorAll('#modal .story-person-portrait')].flatMap(c=>[...c.querySelectorAll('.story-character-avatar-eyes i')].map(e=>{const r=e.getBoundingClientRect();return[r.width,r.height]})));
            assert(modalEyes.length===10&&modalEyes.every(([w,h])=>w>=5&&h>=6),`${key}: Story modal resident eye regression`);
            await page.locator('#modal').screenshot({path:`deep-fix-audit/story/story-modal-${key}.png`});
            await page.evaluate(()=>{closeModal();window.LatchlingsCinematics.show('opening',{markSeen:false})});await page.waitForTimeout(260);
            report.opening[key]=[];
            for(let beat=0;beat<7;beat++){
              if(beat>0){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(220)}
              const m=await page.evaluate(()=>{
                const stage=document.getElementById('cinematicStage'),sr=stage.getBoundingClientRect(),copy=document.querySelector('.cinematic-copy'),cr=copy.getBoundingClientRect(),title=document.getElementById('cinematicTitle'),tr=title.getBoundingClientRect(),next=document.getElementById('cinematicNext'),nr=next.getBoundingClientRect();
                const within=(r,pad=0)=>r.left>=sr.left-pad&&r.right<=sr.right+pad&&r.top>=sr.top-pad&&r.bottom<=sr.bottom+pad;
                const bubbles=[...stage.querySelectorAll('.cin-speech-bubble')].map(b=>{const r=b.getBoundingClientRect(),speaker=b.closest('[data-speaker]'),p=speaker?.querySelector('.dialogue-portrait'),pr=p?.getBoundingClientRect();const tail=parseFloat(getComputedStyle(b).getPropertyValue('--cin-tail-x'))||50,tailX=r.left+r.width*tail/100,portraitX=pr?pr.left+pr.width/2:tailX;return{speaker:speaker?.dataset.speaker||'',rect:R(b),scrollHeight:b.scrollHeight,clientHeight:b.clientHeight,scrollWidth:b.scrollWidth,clientWidth:b.clientWidth,inside:within(r,2),tailError:Math.abs(tailX-portraitX)}});
                const demo=stage.querySelector('.cin-demo-board'),dr=demo?.getBoundingClientRect();
                const demoKids=demo?[...demo.querySelectorAll('.cin-demo-label,.cin-demo-track,.demo-mover,.demo-rock,.demo-blocker,.demo-nest')].map(e=>{const r=e.getBoundingClientRect();return{cls:e.className||'',rect:R(e),inside:r.left>=dr.left-2&&r.right<=dr.right+2&&r.top>=dr.top-2&&r.bottom<=dr.bottom+2}}):[];
                return{beat:window.LatchlingsCinematics.beat+1,stage:R(stage),copyScrollTop:copy.scrollTop,title:R(title),titleVisible:tr.top>=cr.top-1&&tr.bottom<=cr.bottom+1,nextVisible:nr.top>=cr.top-1&&nr.bottom<=cr.bottom+1,bubbles,demo:demo?{rect:R(demo),inside:within(dr,2),kids:demoKids}:null,docOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth};
              });
              assert(m.copyScrollTop<=1,`${key} beat ${beat+1}: copy auto-scrolled and clipped heading (${m.copyScrollTop})`);
              assert(m.titleVisible,`${key} beat ${beat+1}: cinematic title not fully visible`);
              assert(m.nextVisible,`${key} beat ${beat+1}: Continue button not visible`);
              assert(!m.docOverflow,`${key} beat ${beat+1}: horizontal document overflow`);
              for(const b of m.bubbles){assert(b.scrollHeight<=b.clientHeight+1,`${key} beat ${beat+1} ${b.speaker}: bubble text clipped vertically ${b.scrollHeight}/${b.clientHeight}`);assert(b.scrollWidth<=b.clientWidth+1,`${key} beat ${beat+1} ${b.speaker}: bubble text clipped horizontally`);assert(b.inside,`${key} beat ${beat+1} ${b.speaker}: bubble outside stage`);assert(b.tailError<=Math.max(18,b.rect.width*.28),`${key} beat ${beat+1} ${b.speaker}: tail misses portrait by ${b.tailError}`)}
              if(m.demo){assert(m.demo.inside,`${key} beat ${beat+1}: snap demo outside stage`);for(const k of m.demo.kids)assert(k.inside,`${key} beat ${beat+1}: snap-demo child outside board ${k.cls}`)}
              report.opening[key].push(m);
              await page.locator('.cinematic-shell').screenshot({path:`deep-fix-audit/opening/opening-${key}-beat-${beat+1}.png`});
            }
            await page.close();
          }
          const page=await browser.newPage({viewport:{width:390,height:700},reducedMotion:'reduce'});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.waitForFunction(()=>window.LatchlingsCinematics);
          for(const id of ['across-drift','old-maps','homeward']){
            await page.evaluate(id=>window.LatchlingsCinematics.show(id,{markSeen:false}),id);await page.waitForTimeout(180);
            const total=await page.evaluate(id=>window.LatchlingsCinematics.CINEMATICS[id].beats.length,id);
            for(let i=0;i<total;i++){
              if(i){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(150)}
              const m=await page.evaluate(()=>{const stage=document.getElementById('cinematicStage'),sr=stage.getBoundingClientRect();return[...stage.querySelectorAll('.cin-speech-bubble')].map(b=>{const r=b.getBoundingClientRect();return{speaker:b.closest('[data-speaker]')?.dataset.speaker||'',clip:b.scrollHeight>b.clientHeight+1||b.scrollWidth>b.clientWidth+1,out:r.left<sr.left-2||r.right>sr.right+2||r.top<sr.top-2||r.bottom>sr.bottom+2}})});
              assert(m.every(x=>!x.clip&&!x.out),`${id} beat ${i+1}: shared bubble regression ${JSON.stringify(m)}`);report.later.push({id,beat:i+1,bubbles:m});
            }
            await page.evaluate(()=>window.LatchlingsCinematics.finish(true));
          }
          fs.writeFileSync('deep-fix-audit/report.json',JSON.stringify(report,null,2));
          console.log('DEEP_STORY_RESIDENTS_OPENING_ACCEPTED');
          await browser.close();
          JS
          node validate-deep-fix.mjs
      - name: Commit accepted product fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-story-theme.css style400-cinematics-geometry.css cinematic-geometry400.js cinematics400.js
          git diff --cached --quiet && { echo 'No product diff'; exit 1; }
          git commit -m "Repair Story resident faces and cinematic clipping"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-residents-opening-deep-fix-audit
          path: deep-fix-audit
      - name: Self-remove
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --ff-only origin main
          rm -f validate-deep-fix.mjs package.json package-lock.json
          git rm .github/workflows/fix-story-residents-opening-deep-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Story Residents opening fix workflow"
          git push
