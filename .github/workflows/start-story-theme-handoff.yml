name: Start Story Theme Handoff

on:
  push:
    paths:
      - '.github/workflows/start-story-theme-handoff.yml'

permissions:
  contents: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add current work entry
        run: python3 .github/scripts/start_story_theme_handoff.py
      - name: Validate current work entry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('DEVELOPMENT_HANDOFF.md').read_text()
          h='### 2026-09-03 — Rebuild exposition delivery and theme every campaign chapter'
          s=t.index(h); e=t.index('\n---',s); section=t[s:e]
          assert '**Status: IN PROGRESS**' in section
          assert 'Story Card' in section
          assert 'ART_ASSET_CREDITS.md' in section
          print('START_HANDOFF_OK')
          PY
      - name: Commit handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/start-story-theme-handoff.yml .github/scripts/start_story_theme_handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-story-theme-handoff.yml .github/scripts/start_story_theme_handoff.py
          git commit -m 'Start story card and chapter art pass'
          git pull --rebase origin main
          git push origin HEAD:main
