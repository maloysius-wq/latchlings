name: Inspect CC0 Swishes

on:
  push:
    paths:
      - '.github/workflows/inspect-cc0-swishes.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download CC0 swish pack
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip >/dev/null
          curl -fL --retry 3 --retry-delay 2 'https://opengameart.org/sites/default/files/swishes.zip' -o /tmp/swishes.zip
          mkdir -p /tmp/swishes
          unzip -q /tmp/swishes.zip -d /tmp/swishes
          echo '--- FILES ---'
          find /tmp/swishes -type f -printf '%P\n' | sort
      - name: Analyze WAVs
        run: |
          python3 - <<'PY'
          import subprocess, pathlib, re, json, os
          root=pathlib.Path('/tmp/swishes')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.suffix.lower()!='.wav': continue
              dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(p)],text=True).strip())
              proc=subprocess.run(['ffmpeg','-hide_banner','-nostats','-i',str(p),'-af','silencedetect=noise=-45dB:d=0.005,astats=metadata=1:reset=0','-f','null','-'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True)
              txt=proc.stderr
              se=[float(x) for x in re.findall(r'silence_end: ([0-9.]+)',txt)]
              # leading silence if first silence starts at 0 and has an end
              ss=re.findall(r'silence_start: ([0-9.]+)',txt)
              lead=se[0] if ss and abs(float(ss[0]))<0.001 and se else 0.0
              peak=re.findall(r'Peak level dB: ([\-0-9.]+)',txt)
              rms=re.findall(r'RMS level dB: ([\-0-9.]+)',txt)
              rows.append({'file':p.name,'duration':round(dur,4),'leading_silence':round(lead,4),'peak_db':float(peak[-1]) if peak else None,'rms_db':float(rms[-1]) if rms else None})
          print('SWISH_ANALYSIS='+json.dumps(rows,indent=2))
          PY
      - name: Self-remove inspection workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspect-cc0-swishes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/inspect-cc0-swishes.yml
          git commit -m 'Remove temporary CC0 swish inspection workflow'
          git pull --rebase origin main
          git push origin HEAD:main
