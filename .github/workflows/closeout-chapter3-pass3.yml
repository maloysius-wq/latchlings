name: Close Chapter 3 Pass 3 handoff

on:
  push:
    paths:
      - '.github/workflows/closeout-chapter3-pass3.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete Chapter 3 Pass 3 handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-12 — Pass 3 Chapter 3 Lodestone campaign application'
          next_heading='### 2026-09-12 — Pass 3 Chapter 2 Lanternwood campaign application'
          start=s.find(heading)
          end=s.find(next_heading,start)
          if start<0 or end<0:
              raise SystemExit('Chapter 3 handoff boundaries not found')
          block=s[start:end]
          if '**Status: IN PROGRESS**' not in block:
              raise SystemExit('Chapter 3 entry is not IN PROGRESS')
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary='''\n#### Completion summary\n\n- **Result:** COMPLETED. Audit Pass 3 now covers Chapter 3 / Lodestone Caverns (campaign Levels 101–150) with the approved geological production grammar, an old-Waykeeper-marker Atlas landmark, a dedicated Level 150 anchor payoff, and a visible restored-anchor action at Little Home. Daily remains visually neutral; Chapters 1–2 keep their accepted production modes; Level 151 remains outside this rollout; the Level 366 Aurora override is unchanged. All eight authored campaign definition files plus protected story, cinematic, audio, and legacy board/runtime systems remained byte-for-byte unchanged.\n- **Roadmap hygiene:** The older handoff references a standalone `LATCHLINGS_VISUAL_STORY_AUDIT.md`, but current `main` contains no such file and GitHub reports no commit history under that exact path. No unverifiable audit file was fabricated. This slice used the durable Chapter 2 closeout together with current `LEVEL_SELECT_ART_DIRECTION.md` and `STORY_BIBLE.md`, which agree on Lodestone's fractured-rock, crystal-spire, anchor-ring, old-Waykeeper-marking, and restored-anchor direction.\n- **Product commit:** `49b4a8fcae073053ce690ddc971ea9362e035e62` (`Apply Pass 3 production treatment to Lodestone`). Product files changed exactly `game400-a.js`, `game400-b.js`, `style400-production-slice.css`, `style400-skyway-atlas.css`, `title-island-concepts/index.html`, `LEVEL_SELECT_ART_DIRECTION.md`, and `index.html`.\n- **Lodestone production family:** `VISUAL_CHAPTER_MODES` now maps Chapter 3 to `lodestone`. Five ten-level movement ranges use progressively deeper slate/geological linear materials while keeping cell rule space non-symbolic and suppressing decorative pseudo-elements. Cyan/violet crystal clusters, cavern silhouettes, a marker slab, and mineral light stay outside the playable rule layer. Anchor fixtures receive a heavier cyan-metal treatment so the chapter mechanic reads immediately without changing anchor behavior.\n- **Old Waykeeper marker:** Chapter 3 movement 2 (Levels 111–120) now exposes a weathered marker slab on the Skyway Atlas with an offset cyan anchor-ring glyph and three chalk revision ticks. The same visual vocabulary is recorded in `LEVEL_SELECT_ART_DIRECTION.md` and reused in the Chapter 3 reward postcard, tying the 'anchors were meant to be repositioned' evidence to one recognizable piece of old infrastructure.\n- **Chapter 3 reward / Little Home:** Completing the real authored Level 150 route now opens a dedicated Lodestone reward showing the stabilized anchor line, crystal shelf, restored anchor, and old marker. Stars remain secondary; actions are `Visit Little Home` and `Continue to Masquerade`. Visiting home focuses the existing canonical stage-3 restored anchor hanging beneath Little Home, with a cyan reveal that remains informative under reduced motion.\n- **Candidate validation:** Actions run `34739201990`, job `103675888098`, passed protected-source/static checks and the complete Chromium matrix before any product promotion. It checked Levels 101/110/111/120/121/130/131/140/141/150 at 390x844; Levels 101/150 at 320x568; Daily isolation; Level 100 Lanternwood boundary; untouched Level 151; Level 366 Aurora; five distinct quiet movement surfaces; selected/matching-nest hierarchy; readable weighted anchors; the movement-2 Atlas marker; the real authored Level 150 solution; dedicated reward; Little Home anchor focus; reduced motion; and zero browser errors. Candidate artifact `chapter3-pass3-campaign-application` is ID `10312167103`, SHA-256 `86b6fbfdcf3cbf34a8e78f0a923df09513281cd801f35874cfc4d2400a880976`.\n- **Manual evidence review:** The candidate artifact's five Lodestone range captures, movement-2 Atlas marker, 320px endpoints, Level 150 board/reward, and Little Home anchor focus were manually inspected. The material progression stayed quiet and readable; the Atlas marker clearly showed the ring/ticks; the reward postcard had a coherent crystal-anchor-marker silhouette; and the canonical home anchor read clearly beneath the island. No screenshot-timing, overlap, or visual-regression correction was required.\n- **Small-phone acceptance:** At 320x568, both Level 101 and Level 150 controls ended at 565.6875px inside a 568px viewport, with the smallest active target at 44.796875px. No horizontal overflow was reported.\n- **Promotion / deployment:** Promotion run `34739319189`, job `103676193417`, reran the same protected-source, static, full Chromium, real-Level-150, reward/home, and reduced-motion gates before committing. Promotion artifact ID `10311952729`, SHA-256 `82e08fa38e90b0bac40edac43ad7d766a5d772c5890c6c876bc541dc1e308a79`. Validator cleanup commit `f2a68186f0eae767c6298a027b9d271b2723c3af` removed every Chapter 3 temporary helper. GitHub Pages run `34739368343` (run 1019) succeeded on that clean head. Before this closeout helper was added, `.github/workflows` again contained only permanent `validate-repository-access-guard.yml`.\n- **Remaining scope / exact next action:** Continue Pass 3 with Chapter 4, **Masquerade Keep / Market Day (Levels 151–200)**, as a separate protected slice. Recheck current source, then establish the approved plaster-stone / gate-arch / market-banner / moonlit-civic material family across five movement ranges and evaluate the Chapter 4 Atlas/reward/market-bunting payoff with the same candidate-first, source-hash, real-chapter-end-solution, small-phone, and manual screenshot gates. Do not automatically inherit Lodestone styling into Chapter 4.\n\n'''
          block=block.rstrip()+summary
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Complete Pass 3 Chapter 3 Lodestone handoff"
          git push
      - name: Self-remove closeout helper
        run: |
          git pull --rebase
          git rm .github/workflows/closeout-chapter3-pass3.yml
          git commit -m "Remove Chapter 3 Pass 3 closeout helper"
          git push
