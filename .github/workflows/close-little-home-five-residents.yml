name: Close Little Home Five Resident Polish

on:
  push:
    paths:
      - '.github/workflows/close-little-home-five-residents.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          heading='### 2026-09-02 — Reduce Little Home household to five residents and add blue flower'
          start=t.index(heading)
          next_sep=t.index('\n---\n', start)
          block=t[start:next_sep]
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          completion='''\n\n#### Completion summary\n\n**Implementation:** Refined only Concept 2 / Little Home in `title-island-concepts/index.html`. Removed the gold `life-home` / `l4` adult whose broad center-circuit route contributed most to the crowded feel. The household is now exactly five residents: three adults (gardener, parcel runner, and tree tender) plus the same two smaller children. Added a third procedural flower in the newly opened back-center yard space at `left:148px; top:84px`, reusing the existing flower geometry with a Concept 2-only blue petal treatment (`#72aef5`) and warm yellow center. Updated the Concept 2 label/variant copy from six residents / four adults to five residents / three adults. The improved tree, stone placement, removed brown platform, animated clouds, children's play behavior, cottage, and title controls remain intact. Concepts 1 and 3 and production `index.html` were not changed.\n\n**Files changed:** Permanent implementation changed only `title-island-concepts/index.html`; this handoff was updated for process tracking. Temporary transformer/browser-validator/workflow files self-removed after the implementation commit.\n\n**Validation:** GitHub Actions run `33677356975` passed static and Chromium validation. Static checks confirmed exactly five Concept 2 residents split 3 adults / 2 children, zero `life-home` resident, all three remaining adult routine classes intact, exactly three flowers including `flower blue f3`, blue-petal styling/placement present, four clouds retained, zero Concept 2 deck/fence elements, zero runtime image/hotlink regressions, truthful five-resident copy, and no production/campaign/game-file changes. Chromium at 390x844 passed with no console/page/request errors or overflow, confirmed the 3/2 resident split, three flowers, and blue flower bounds of `168..190 x 356..378`, safely between the tree and cottage and on the island top. Concepts 1 and 3 passed sanity renders. Screenshot artifact `9864873514` contains three animation phases and was downloaded and visually inspected; the island reads noticeably less crowded, the remaining household still feels active, and the blue flower sits cleanly in the opened space.\n\n**Implementation commit:** `9ed890c294baa502a7cdb2118a447c601ee9cf4b` (`Open up the Little Home household`).\n\n**Deployment:** GitHub Pages run `33677427539` completed successfully for implementation commit `9ed890c294baa502a7cdb2118a447c601ee9cf4b`. The live preview remains `title-island-concepts/?c=2`.\n\n**Remaining risk / next action:** This polish pass is complete in the design-selection preview. Production remains intentionally unchanged. Next action is user review of the live five-resident Little Home and any further requested polish or explicit promotion to production.\n'''
          if '#### Completion summary' not in block:
              block += completion
          t=t[:start]+block+t[next_sep:]
          p.write_text(t)
          PY
          rm -f .github/workflows/close-little-home-five-residents.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-little-home-five-residents.yml
          git commit -m 'Complete five-resident Little Home handoff'
          git pull --rebase origin main
          git push origin HEAD:main
