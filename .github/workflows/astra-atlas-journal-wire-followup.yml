name: Astra Atlas journal wire followup

on:
  push:
    branches: [astra-atlas-journal-candidate]
    paths:
      - '.github/workflows/astra-atlas-journal-wire-followup.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-atlas-journal-candidate
          fetch-depth: 0
      - name: Fold viewport correction into canonical candidate helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/tmp/astra_atlas_journal_candidate.py')
          s=p.read_text(encoding='utf-8')
          marker="exec(Path('.github/tmp/astra_atlas_journal_viewport_followup.py').read_text(encoding='utf-8'), {'__name__':'__main__'})"
          anchor="print('Astra Atlas + journal candidate patch applied.')"
          assert anchor in s
          if marker not in s:
              s=s.replace(anchor, marker+'\n'+anchor, 1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -F "astra_atlas_journal_viewport_followup.py" .github/tmp/astra_atlas_journal_candidate.py
      - name: Commit helper wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/tmp/astra_atlas_journal_candidate.py
          if git diff --cached --quiet; then
            echo "Candidate helper already wired."
            exit 0
          fi
          git commit -m "Apply journal viewport followup in candidate helper"
          git push origin HEAD:astra-atlas-journal-candidate
