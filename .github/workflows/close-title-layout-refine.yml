name: Close Little Home Layout Refinement Handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-title-layout-refine.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete current work entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-10 — Refine Little Home title spacing, island placement, and bottom controls'
          start=s.find(heading)
          if start<0:
              raise SystemExit('Current layout refinement entry not found')
          end=s.find('\n---\n',start)
          if end<0:
              raise SystemExit('Current layout refinement entry terminator not found')
          block=s[start:end]
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in block:
              block += '''\n\n#### Completion summary\n\n**Result:** COMPLETED. The Little Home title screen was rebalanced around the enlarged header. The normal title block moved from 62px top offset to 70px, while the island scene moved from 174px to 196px, creating visible breathing room both above the title and between the tagline and island. The approved 62px title / 16px tagline scale and Wobbly Toy Letters treatment remain unchanged. On narrow embedded frames the title uses a 68px top offset and the island uses a 190px scene offset so the compact composition stays balanced.\n\n**Bottom controls:** The standard Play control grew from 60px to 72px tall and widened from 28px side insets to 22px; its text and icon were enlarged. Daily Puzzle and Level Select grew from 78px to 96px tall, moved lower, widened, and received larger text/icons. This brings the control group farther into the previously empty lower screen. The narrow-frame layout now explicitly repositions and sizes all three controls so the 390×700 production shell shows the entire Play/Daily/Level group instead of clipping the secondary row at the bottom. Button actions and interaction behavior are unchanged.\n\n**Validation and visual acceptance:** Product implementation run `34496068066` passed static assertions and Chromium geometry/overflow checks for the real production shell at 390×844 and 390×700, plus cinematic scene-only regression coverage. Artifact `10159842961` (`little-home-layout-refinement-render`) contains both production screenshots, metrics, and the cinematic screenshot. Manual inspection accepted both layouts: the standard frame has a less crowded header, a lower island, and materially larger bottom controls; the compact frame remains fully usable with all controls visible and no island/control collision. Cinematic scene-only composition remained unchanged. Product commit: `aa19a20153a3b93691ef06b8a341aa290063895b` (`Refine Little Home title screen spacing and controls`).\n\n**Deployment and hygiene:** The implementation helper self-removed on clean product state `7550e22308f18507baff7c2e43105b8c65c535e7`. GitHub Pages run `34496158565` completed successfully for that exact clean state. This documentation-only closeout helper removes itself after committing the completion.\n\n**Remaining risk / next action:** No known blocker remains. The standard and compact production shells exercised by the game are both accepted; if a future shell uses a substantially shorter or narrower iframe, give that shell its own responsive pass rather than compressing the approved standard composition.\n'''
          s=s[:start]+block+s[end:]
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Complete Little Home layout refinement handoff"
          git push
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm -f .github/workflows/close-title-layout-refine.yml
          git add .github/workflows/close-title-layout-refine.yml
          git commit -m "Remove layout refinement closeout helper"
          git push
