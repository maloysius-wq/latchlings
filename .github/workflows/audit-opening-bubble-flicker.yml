name: Audit opening bubble flicker
on:
  push:
    paths:
      - '.github/workflows/audit-opening-bubble-flicker.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser audit
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve current build
        shell: bash
        run: python3 -m http.server 4173 >/tmp/opening-bubble-audit-http.log 2>&1 &
      - name: Audit all opening bubbles
        shell: bash
        run: node .github/tmp/audit-opening-bubbles.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: opening-bubble-flicker-baseline
          path: opening-bubble-flicker-audit
      - name: Self-remove audit helpers
        if: always()
        shell: bash
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/audit-opening-bubble-flicker.yml .github/tmp/audit-opening-bubbles.mjs
          git commit -m 'Remove opening bubble flicker audit'
          git push