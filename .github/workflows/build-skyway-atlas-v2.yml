name: Build Skyway Atlas V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-skyway-atlas-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recreate accepted design candidate from V1 source
        shell: bash
        run: |
          set -euo pipefail
          git show c9feccb3ae854cbfac3c66e8938102514e8b9f15:.github/workflows/build-skyway-atlas-v1.yml > /tmp/v1.yml
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml,subprocess
          d=yaml.safe_load(open('/tmp/v1.yml'))
          wanted=['Preserve campaign hashes','Vendor referenced CC0 materials','Create Skyway Atlas art direction','Build atlas stylesheet','Patch Level Select markup, renderer, and credits']
          steps=d['jobs']['build']['steps']
          by={s.get('name'):s.get('run') for s in steps if isinstance(s,dict) and s.get('run')}
          for name in wanted:
              script=by.get(name)
              if not script: raise SystemExit(f'missing historical step {name}')
              print(f'--- running {name} ---',flush=True)
              subprocess.run(['bash','-euo','pipefail','-c',script],check=True)
          PY
      - name: Refine atlas composition and chapter scenery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('style400-skyway-atlas.css');s=p.read_text()
          s=s.replace('grid-template-rows:auto auto auto minmax(0,1fr) auto','grid-template-rows:auto auto auto auto minmax(0,1fr) auto',1)
          s=s.replace('#levels .level-node.atlas-node{position:absolute;left:var(--x);top:var(--y);width:54px;height:54px;min-width:54px;min-height:54px;', '#levels .level-node.atlas-node{position:absolute;left:var(--x);top:var(--y);width:58px;height:58px;min-width:58px;min-height:58px;',1)
          s=s.replace('#levels .atlas-node.milestone{width:64px;height:64px;min-width:64px;min-height:64px;', '#levels .atlas-node.milestone{width:70px;height:70px;min-width:70px;min-height:70px;',1)
          s=s.replace('#levels .atlas-node.current{width:72px;height:72px;min-width:72px;min-height:72px;', '#levels .atlas-node.current{width:78px;height:78px;min-width:78px;min-height:78px;',1)
          s += r'''

          /* V2 composition: fill the journey area and give every region a structural silhouette, not merely a palette. */
          .atlas-scene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:inherit}
          .atlas-scene i,.atlas-scene b,.atlas-scene em{position:absolute;display:block;font-style:normal}
          .atlas-node.milestone[data-variant="0"] .atlas-prop{rotate:-8deg;scale:1.08}
          .atlas-node.milestone[data-variant="1"] .atlas-prop{rotate:4deg;scale:1.13}
          .atlas-node.milestone[data-variant="2"] .atlas-prop{rotate:-2deg;scale:1.18}
          .atlas-node.milestone[data-variant="3"] .atlas-prop{rotate:7deg;scale:1.11}
          .atlas-node.milestone[data-variant="4"] .atlas-prop{rotate:0deg;scale:1.22}

          .theme-ch1 .atlas-scene:before{content:"";position:absolute;width:115px;height:115px;border-radius:50%;right:-34px;top:-37px;background:radial-gradient(circle,#fff6bd 0 25%,#f6d46a 45%,rgba(246,212,106,0) 68%);opacity:.42}
          .theme-ch1 .atlas-scene:after{content:"";position:absolute;left:-8%;right:-8%;bottom:-35px;height:135px;background:radial-gradient(ellipse at 18% 100%,rgba(105,176,77,.34) 0 35%,transparent 36%),radial-gradient(ellipse at 56% 105%,rgba(128,191,84,.25) 0 42%,transparent 43%),radial-gradient(ellipse at 93% 100%,rgba(92,159,67,.25) 0 37%,transparent 38%)}
          .theme-ch1 .atlas-scene i{left:7%;top:31%;width:46px;height:24px;border-radius:50%;background:rgba(255,255,255,.24);box-shadow:26px 4px 0 -7px rgba(255,255,255,.21)}
          .theme-ch1 .atlas-scene b{right:10%;bottom:13%;width:3px;height:25px;background:#6e563d;box-shadow:-5px 7px 0 -1px #6e563d,5px 7px 0 -1px #6e563d;opacity:.28}
          .theme-ch1 .atlas-scene em{left:8%;bottom:11%;width:4px;height:4px;border-radius:50%;background:#f3cf59;box-shadow:15px -4px #e98795,29px 4px #fff1aa,43px -2px #e98795,57px 3px #f3cf59;opacity:.38}

          .theme-ch2 .atlas-scene:before,.theme-ch2 .atlas-scene:after{content:"";position:absolute;top:-14px;bottom:-10px;width:56px;background:linear-gradient(90deg,rgba(12,31,27,.42),rgba(53,75,54,.22),rgba(12,31,27,.34));border-radius:46% 54% 38% 48%}
          .theme-ch2 .atlas-scene:before{left:-27px;box-shadow:36px 82px 0 -17px rgba(18,43,35,.27)}.theme-ch2 .atlas-scene:after{right:-30px;box-shadow:-37px 141px 0 -18px rgba(18,43,35,.25)}
          .theme-ch2 .atlas-scene i{left:4%;top:19%;width:10px;height:13px;border-radius:4px;background:#ffd06a;box-shadow:0 0 14px #efb246,302px 121px 0 -1px #ffd06a,302px 121px 14px #efb246;opacity:.62}
          .theme-ch2 .atlas-scene b{left:18%;top:5%;width:78px;height:38px;border-radius:50%;background:rgba(45,86,56,.19);box-shadow:205px 31px 0 -8px rgba(57,96,59,.18),86px 180px 0 -11px rgba(35,74,51,.15)}
          .theme-ch2 .atlas-scene em{right:8%;bottom:8%;width:36px;height:42px;border-left:4px solid rgba(94,70,47,.28);border-top:18px solid transparent;border-radius:45%}

          .theme-ch3 .atlas-scene:before{content:"";position:absolute;left:0;right:0;top:0;height:68px;background:linear-gradient(150deg,#0c1724 0 12%,transparent 12.5%),linear-gradient(210deg,#101b29 0 13%,transparent 13.5%),linear-gradient(165deg,transparent 0 27%,rgba(15,27,40,.64) 27.5% 38%,transparent 38.5% 61%,rgba(12,24,36,.58) 61.5% 73%,transparent 73.5%)}
          .theme-ch3 .atlas-scene:after{content:"";position:absolute;left:3%;bottom:5%;width:37px;height:110px;background:linear-gradient(150deg,#6de1ee,#4779a8);clip-path:polygon(53% 0,100% 72%,67% 100%,0 83%,20% 27%);opacity:.12;box-shadow:260px -112px 0 -4px rgba(145,103,221,.28)}
          .theme-ch3 .atlas-scene i{right:7%;top:16%;width:17px;height:56px;background:linear-gradient(#bdfbff,#5cb7d4);clip-path:polygon(50% 0,100% 69%,62% 100%,3% 84%,18% 28%);opacity:.18;filter:drop-shadow(0 0 12px #5dd4e5)}
          .theme-ch3 .atlas-scene b{left:10%;top:46%;width:31px;height:31px;border:5px solid rgba(96,210,225,.15);border-radius:50%}.theme-ch3 .atlas-scene em{right:14%;bottom:18%;width:56px;height:3px;background:rgba(100,209,226,.12);rotate:-23deg;box-shadow:0 9px rgba(100,209,226,.07)}

          .theme-ch4 .atlas-scene:before{content:"";position:absolute;right:8%;top:5%;width:58px;height:58px;border-radius:50%;background:rgba(239,227,255,.22);box-shadow:0 0 24px rgba(216,196,244,.10)}
          .theme-ch4 .atlas-scene:after{content:"";position:absolute;left:-4%;right:-4%;bottom:-3px;height:95px;background:linear-gradient(90deg,rgba(20,14,31,.34) 0 9%,transparent 9.5% 13%,rgba(20,14,31,.30) 13.5% 27%,transparent 27.5% 35%,rgba(20,14,31,.36) 35.5% 57%,transparent 57.5% 64%,rgba(20,14,31,.28) 64.5% 78%,transparent 78.5% 84%,rgba(20,14,31,.35) 84.5% 100%);clip-path:polygon(0 47%,5% 47%,5% 22%,11% 22%,11% 0,17% 0,17% 30%,26% 30%,26% 55%,37% 55%,37% 18%,42% 18%,42% 7%,49% 7%,49% 37%,58% 37%,58% 57%,68% 57%,68% 28%,73% 28%,73% 12%,80% 12%,80% 39%,90% 39%,90% 18%,96% 18%,96% 52%,100% 52%,100% 100%,0 100%)}
          .theme-ch4 .atlas-scene i{left:12%;top:18%;width:2px;height:70px;background:rgba(222,186,113,.24);box-shadow:0 0 0 1px rgba(20,14,31,.08)}.theme-ch4 .atlas-scene i:after{content:"";position:absolute;left:2px;top:0;width:20px;height:11px;background:rgba(226,113,131,.25);clip-path:polygon(0 0,100% 14%,72% 50%,100% 100%,0 82%)}
          .theme-ch4 .atlas-scene b{right:13%;top:39%;width:27px;height:42px;border:4px solid rgba(210,186,218,.12);border-bottom:0;border-radius:20px 20px 0 0}.theme-ch4 .atlas-scene em{left:7%;bottom:17%;width:62px;height:5px;background:rgba(229,197,139,.09);rotate:11deg}

          .theme-ch5 .atlas-scene:before{content:"";position:absolute;left:14%;right:14%;bottom:8%;height:55%;border:2px solid rgba(234,255,255,.20);border-bottom:0;border-radius:50% 50% 0 0;box-shadow:inset 0 0 35px rgba(255,255,255,.06)}
          .theme-ch5 .atlas-scene:after{content:"";position:absolute;left:45%;bottom:8%;height:55%;width:2px;background:rgba(235,255,255,.14);box-shadow:-83px 17px rgba(235,255,255,.09),83px 17px rgba(235,255,255,.09)}
          .theme-ch5 .atlas-scene i{left:5%;top:13%;width:54px;height:54px;background:conic-gradient(#ed7f98,#ffd264,#80d99b,#6fcbdc,#a78fe0,#ed7f98);clip-path:polygon(50% 0,60% 35%,92% 18%,72% 50%,100% 59%,66% 65%,72% 100%,50% 72%,28% 100%,34% 65%,0 59%,28% 50%,8% 18%,40% 35%);opacity:.10;filter:blur(.4px)}
          .theme-ch5 .atlas-scene b{right:7%;top:29%;width:76px;height:76px;border:6px double rgba(107,196,205,.09);border-radius:50%;rotate:17deg}.theme-ch5 .atlas-scene em{left:9%;bottom:5%;width:90px;height:14px;border-top:2px solid rgba(75,151,128,.12);border-radius:50%}

          .theme-ch6 .atlas-scene:before{content:"";position:absolute;left:-12%;right:-12%;bottom:10%;height:90px;border-top:7px double rgba(55,39,32,.22);border-bottom:7px double rgba(55,39,32,.15);border-radius:50%;rotate:-7deg}
          .theme-ch6 .atlas-scene:after{content:"";position:absolute;right:5%;top:10%;width:66px;height:66px;border:8px dotted rgba(229,162,98,.14);border-radius:50%;box-shadow:0 0 0 5px rgba(57,40,34,.05)}
          .theme-ch6 .atlas-scene i{left:6%;top:20%;width:5px;height:76px;background:rgba(65,48,40,.26)}.theme-ch6 .atlas-scene i:before{content:"";position:absolute;left:-8px;top:0;width:21px;height:16px;border-radius:8px;background:rgba(48,39,35,.31);border:3px solid rgba(203,127,74,.24)}
          .theme-ch6 .atlas-scene b{left:23%;bottom:4%;width:130px;height:3px;background:repeating-linear-gradient(90deg,rgba(55,40,33,.24) 0 8px,transparent 8px 15px);rotate:4deg}.theme-ch6 .atlas-scene em{right:12%;bottom:28%;width:38px;height:38px;border:5px dashed rgba(226,153,92,.10);border-radius:50%}

          .theme-ch7 .atlas-scene:before{content:"";position:absolute;left:-4%;right:-4%;bottom:0;height:102px;background:linear-gradient(90deg,rgba(11,25,34,.36) 0 12%,transparent 12.5% 17%,rgba(11,25,34,.32) 17.5% 32%,transparent 32.5% 37%,rgba(11,25,34,.40) 37.5% 58%,transparent 58.5% 64%,rgba(11,25,34,.34) 64.5% 77%,transparent 77.5% 82%,rgba(11,25,34,.38) 82.5% 100%);clip-path:polygon(0 42%,8% 42%,8% 8%,14% 8%,14% 54%,24% 54%,24% 30%,31% 30%,31% 0,36% 0,36% 48%,47% 48%,47% 20%,54% 20%,54% 61%,64% 61%,64% 36%,73% 36%,73% 12%,79% 12%,79% 50%,89% 50%,89% 27%,95% 27%,95% 58%,100% 58%,100% 100%,0 100%)}
          .theme-ch7 .atlas-scene:after{content:"";position:absolute;right:9%;top:2%;width:43px;height:88px;background:linear-gradient(151deg,transparent 0 25%,rgba(158,229,255,.30) 26% 31%,transparent 32% 48%,rgba(91,198,235,.26) 49% 55%,transparent 56%);filter:drop-shadow(0 0 6px rgba(77,195,237,.38));opacity:.65}
          .theme-ch7 .atlas-scene i{left:5%;top:18%;width:105px;height:3px;background:rgba(121,188,211,.12);box-shadow:0 11px rgba(121,188,211,.08);rotate:-7deg}.theme-ch7 .atlas-scene b{right:17%;top:33%;width:3px;height:72px;background:rgba(126,171,188,.16);box-shadow:8px 0 rgba(126,171,188,.09)}.theme-ch7 .atlas-scene em{left:10%;bottom:13%;width:31px;height:10px;border:2px solid rgba(95,195,229,.13);border-radius:6px}

          .theme-ch8 .atlas-scene:before{content:"";position:absolute;left:-18%;top:8%;width:145%;height:155px;border-radius:50%;border-top:19px solid rgba(103,236,205,.09);rotate:-11deg;box-shadow:0 -22px 0 -14px rgba(99,170,246,.11),0 22px 0 -14px rgba(180,111,236,.09);filter:blur(8px)}
          .theme-ch8 .atlas-scene:after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:radial-gradient(circle at 11% 23%,#eaffff 0 1px,transparent 1.5px),radial-gradient(circle at 79% 15%,#eaffff 0 1px,transparent 1.4px),radial-gradient(circle at 67% 62%,#eaffff 0 1px,transparent 1.4px),radial-gradient(circle at 28% 74%,#eaffff 0 1px,transparent 1.4px);opacity:.45}
          .theme-ch8 .atlas-scene i{left:5%;bottom:3%;width:57px;height:104px;background:linear-gradient(#e9ffff,#6fb9d2);clip-path:polygon(49% 0,100% 74%,66% 100%,0 86%,17% 31%);opacity:.10}.theme-ch8 .atlas-scene b{right:7%;bottom:7%;width:43px;height:79px;background:linear-gradient(#e9ffff,#8872b8);clip-path:polygon(49% 0,100% 74%,66% 100%,0 86%,17% 31%);opacity:.11}.theme-ch8 .atlas-scene em{left:47%;top:9%;width:9px;height:9px;border-radius:50%;background:#f3ffe3;box-shadow:0 0 15px #b8fff0;opacity:.55}
          '''
          p.write_text(s)

          p=Path('game400-a.js');s=p.read_text()
          old='map.innerHTML=`<div class="atlas-route-caption"><b>${waypoints[rangeView]}</b><span>Levels ${first}–${first+9} · Skyway stretch ${rangeView+1} of 5</span></div><svg class="atlas-route-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${route}</svg>${nodes}`;'
          new='map.innerHTML=`<div class="atlas-scene" aria-hidden="true"><i></i><b></b><em></em></div><div class="atlas-route-caption"><b>${waypoints[rangeView]}</b><span>Levels ${first}–${first+9} · Skyway stretch ${rangeView+1} of 5</span></div><svg class="atlas-route-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${route}</svg>${nodes}`;'
          if old not in s:raise SystemExit('map innerHTML anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          sha256sum campaign400-*.js > /tmp/campaign.after-v2
          diff -u /tmp/campaign.before /tmp/campaign.after-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve
        shell: bash
        run: python3 -m http.server 4173 >/tmp/atlas-http.log 2>&1 &
      - name: Validate and render V2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p atlas-audit/all atlas-audit/hero atlas-audit/compact atlas-audit/states
          cat > atlas-check.mjs <<'JS'
          import {chromium} from 'playwright';import fs from 'fs';
          const browser=await chromium.launch({headless:true});const failures=[],report=[];const fail=m=>{failures.push(m);console.error('FAIL',m)};
          async function setProgress(page,unlocked,stars={}){await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.evaluate(x=>localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify(x)),{unlocked,stars});await page.reload({waitUntil:'networkidle'});await page.waitForFunction(()=>window.LatchlingsHomeAction);await page.evaluate(()=>window.LatchlingsHomeAction('levels'));await page.waitForTimeout(720)}
          async function inspect(page,label){const m=await page.evaluate(()=>{const map=document.getElementById('levelGrid').getBoundingClientRect(),c=document.getElementById('continueBtn').getBoundingClientRect(),v={w:innerWidth,h:innerHeight},nodes=[...document.querySelectorAll('.atlas-node')].map(n=>{const r=n.getBoundingClientRect();return{level:+n.dataset.level,w:r.width,h:r.height,l:r.left,r:r.right,t:r.top,b:r.bottom,locked:n.disabled,current:n.classList.contains('current')}});return{map:{l:map.left,r:map.right,t:map.top,b:map.bottom,w:map.width,h:map.height},c:{l:c.left,r:c.right,t:c.top,b:c.bottom,w:c.width,h:c.height,text:document.getElementById('continueBtn').textContent},v,nodes,routes:document.querySelectorAll('.atlas-route').length,shadows:document.querySelectorAll('.atlas-route-shadow').length,chapters:document.querySelectorAll('.atlas-region-dot').length,waypoints:document.querySelectorAll('.atlas-waypoint-tab').length,scene:document.querySelectorAll('.atlas-scene').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth||document.body.scrollWidth>document.body.clientWidth,texture:getComputedStyle(document.getElementById('levels')).getPropertyValue('--atlas-texture')}});if(m.routes!==9||m.shadows!==9)fail(`${label} route construction wrong ${m.routes}/${m.shadows}`);if(m.chapters!==8||m.waypoints!==5||m.scene!==1)fail(`${label} navigation/scenery structure wrong`);if(m.overflow)fail(`${label} horizontal overflow`);if(!m.texture.includes('assets/level-select/'))fail(`${label} texture missing`);if(m.c.h<44||m.c.l<-1||m.c.r>m.v.w+1||m.c.b>m.v.h+1)fail(`${label} Continue bounds ${JSON.stringify(m.c)}`);for(const n of m.nodes){if(n.w<44||n.h<44)fail(`${label} level ${n.level} target too small`);if(n.l<m.map.l-20||n.r>m.map.r+20||n.t<m.map.t-22||n.b>m.map.b+22)fail(`${label} level ${n.level} outside map ${JSON.stringify(n)}`)}report.push({label,...m});return m}
          const allStars={};for(let i=1;i<=400;i++)allStars[i]=3;
          const full=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'no-preference'});await setProgress(full,400,allStars);for(let ch=1;ch<=8;ch++){await full.locator(`.atlas-region-dot[data-ch="${ch}"]`).click();await full.waitForTimeout(120);for(let r=0;r<5;r++){await full.locator(`.atlas-waypoint-tab[data-range="${r}"]`).click();await full.waitForTimeout(120);await inspect(full,`390x844 ch${ch} r${r+1}`);await full.screenshot({path:`atlas-audit/all/ch${ch}-r${r+1}.png`,fullPage:true})}}
          // Hero state per chapter: current destination, restored path behind it, clouds ahead.
          for(let ch=1;ch<=8;ch++){const hero=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'no-preference'}),start=(ch-1)*50+1,current=start+6,stars={};for(let i=1;i<current;i++)stars[i]=(i%3)+1;await setProgress(hero,current,stars);if(ch>1){await hero.locator(`.atlas-region-dot[data-ch="${ch}"]`).click();await hero.waitForTimeout(120)}await hero.locator('.atlas-waypoint-tab[data-range="0"]').click();await hero.waitForTimeout(120);const m=await inspect(hero,`hero ch${ch}`);if(!m.nodes.find(n=>n.level===current)?.current)fail(`hero ch${ch} missing current level`);await hero.screenshot({path:`atlas-audit/hero/ch${ch}.png`,fullPage:true});await hero.close()}
          const compact=await browser.newPage({viewport:{width:320,height:568},reducedMotion:'no-preference'});await setProgress(compact,47,Object.fromEntries(Array.from({length:46},(_,i)=>[i+1,3])));for(let r=0;r<5;r++){await compact.locator(`.atlas-waypoint-tab[data-range="${r}"]`).click();await compact.waitForTimeout(120);await inspect(compact,`320x568 ch1 r${r+1}`);await compact.screenshot({path:`atlas-audit/compact/ch1-r${r+1}.png`,fullPage:true})}
          const state=await browser.newPage({viewport:{width:390,height:700},reducedMotion:'reduce'});const midStars={};for(let i=1;i<=16;i++)midStars[i]=(i%3)+1;await setProgress(state,17,midStars);await state.locator('.atlas-waypoint-tab[data-range="1"]').click();await state.waitForTimeout(120);let m=await inspect(state,'mid level17');if(!m.nodes.find(n=>n.level===17)?.current)fail('level17 current marker missing');if(!m.c.text.includes('17'))fail('Continue copy missing level17');await state.screenshot({path:'atlas-audit/states/mid.png',fullPage:true});await state.locator('#resetProgressBtn').click();await state.waitForTimeout(80);if(!(await state.locator('#overlay.show #confirmReset').count()))fail('Reset confirmation unreachable');await state.locator('#cancelReset').click();await state.evaluate(()=>document.querySelector('.atlas-node[data-level="16"]').click());await state.waitForTimeout(150);if(!(await state.locator('#game.active').count())||(await state.locator('#levelTitle').textContent()).trim()!=='Level 16')fail('Level 16 did not launch');await state.evaluate(()=>{screen('levels');chapterView=1;rangeView=1;renderChapter()});await state.waitForTimeout(650);await state.evaluate(()=>document.getElementById('continueBtn').click());await state.waitForTimeout(160);if(!(await state.locator('#game.active').count())||(await state.locator('#levelTitle').textContent()).trim()!=='Level 17')fail('Continue did not launch level17');
          await state.evaluate(()=>{screen('levels');chapterView=1;rangeView=1;renderChapter()});await state.waitForTimeout(650);const anim=await state.evaluate(()=>({node:getComputedStyle(document.querySelector('.atlas-node')).animationName,route:getComputedStyle(document.querySelector('.atlas-route')).animationName,cloud:getComputedStyle(document.querySelector('.atlas-shell'),'::before').animationName}));if(anim.node!=='none'||anim.route!=='none'||anim.cloud!=='none')fail(`reduced motion active ${JSON.stringify(anim)}`);
          for(const a of ['sunpetal','lanternwood','lodestone','masquerade','prism','copperline','stormswitch','aurora']){const ok=await state.evaluate(async a=>{const r=await fetch(`assets/level-select/${a}.webp`);return r.ok&&(await r.blob()).size>5000},a);if(!ok)fail(`texture ${a} failed runtime load`)}
          fs.writeFileSync('atlas-audit/report.json',JSON.stringify({failures,report},null,2));await browser.close();if(failures.length)throw new Error(`V2 failed ${failures.length} checks`);console.log('SKYWAY_ATLAS_V2_ACCEPTED');
          JS
          node atlas-check.mjs
      - name: Commit accepted atlas
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json atlas-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html game400-a.js style400-skyway-atlas.css LEVEL_SELECT_ART_DIRECTION.md ART_ASSET_CREDITS.md assets/level-select/*.webp
