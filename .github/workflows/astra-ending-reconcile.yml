name: Astra ending closure reconciliation

on:
  push:
    branches: [astra-ending-closure-candidate]
    paths:
      - '.github/workflows/astra-ending-reconcile.yml'
      - '.github/tmp/astra_ending_reconcile.py'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out accepted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact accepted ending product head
        run: test "$(git rev-parse HEAD)" = "96aead97f525a25061f9b3e2b60b2a8263b2509d"

      - name: Load reconciliation helper
        run: |
          git fetch origin astra-ending-closure-candidate
          git show origin/astra-ending-closure-candidate:.github/tmp/astra_ending_reconcile.py > /tmp/astra_ending_reconcile.py

      - name: Apply ending reconciliation
        run: python /tmp/astra_ending_reconcile.py

      - name: Verify documentation-only reconciliation
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "ASTRA_AUDIT_ACCEPTANCE_MATRIX.md DEVELOPMENT_HANDOFF.md "
          grep -Fq '| V18 ending art quality | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -Fq '| N06 visual ending thesis | COMPLETED |' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -Fq '**COMPLETED for the audited cinematic and ending direction.**' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -Fq '### Ending closure' ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          grep -Fq 'Accepted Ending closure checkpoint (2026-09-14):' DEVELOPMENT_HANDOFF.md
          grep -Fq -- '- **ACCEPTED.** TDD RED run `34881984533`' DEVELOPMENT_HANDOFF.md
          grep -Fq 'Next action: Character/world coherence candidate.' DEVELOPMENT_HANDOFF.md
          grep -Fq 'V19 remains partial' DEVELOPMENT_HANDOFF.md

      - name: Commit reconciliation to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ASTRA_AUDIT_ACCEPTANCE_MATRIX.md DEVELOPMENT_HANDOFF.md
          git diff --cached --quiet && { echo 'No reconciliation diff'; exit 1; }
          git commit -m "Reconcile accepted Astra ending closure"
          git push origin HEAD:main
