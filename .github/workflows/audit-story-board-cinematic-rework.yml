name: Audit Story Board and Opening Cinematic Rework
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Static integrity checks
        shell: bash
        run: |
          set -euo pipefail
          node --check gameplay-story-rail400.js
          node --check cinematic-geometry400.js
          node --check cinematic-dialogue400.js
          ! grep -q 'style400-level-variation.css' index.html
          ! grep -q 'level-variation400.js' index.html
          grep -q 'style400-story-rail-board.css' index.html
          grep -q 'gameplay-story-rail400.js' index.html
          grep -q 'style400-cinematics-geometry.css' index.html
          grep -q 'cinematic-geometry400.js' index.html
          ! grep -q 'Prototype error:' game400-a.js
          ! grep -q 'not a command post' cinematic-dialogue400.js
          ! grep -q 'not a command center' story-grounding400.js
          git diff --quiet d8db67e06c63c22a6caef83d124d8856deaf91c6 -- 'campaign400-*.js'
      - name: Install browser tooling
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Audit all 50 Sunpetal levels and chapter representatives
        shell: bash
        run: |
          cat > gameplay-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out='audit-gameplay';fs.mkdirSync(out+'/sunpetal',{recursive:true});fs.mkdirSync(out+'/chapters',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
          await context.addInitScript(()=>{
            const seen={};for(let i=1;i<=400;i++)seen[i]=1;
            localStorage.setItem('latchlings_story_cards_seen_v1',JSON.stringify(seen));
            localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1,'across-drift':1,'old-maps':1,homeward:1}));
            localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars:{}}));
          });
          const page=await context.newPage();page.setDefaultTimeout(7000);const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!/favicon|ERR_ABORTED|Failed to load resource/i.test(m.text()))errors.push('console: '+m.text())});
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.LATCHLINGS_STORY&&window.LatchlingsStoryRail&&typeof startLevel==='function');
          const fail=m=>{throw new Error(m)};
          const manifest=[];const phaseFingerprints=new Map();const slotFingerprints=new Map();let railHeight=null;
          for(let level=1;level<=50;level++){
            await page.evaluate(n=>{if(window.LatchlingsCinematics?.active)window.LatchlingsCinematics.finish(true);window.LatchlingsStoryTheme?.close(false);startLevel(n);window.LatchlingsStoryTheme?.close(false)},level);
            await page.waitForFunction(n=>document.getElementById('mechanicNote')?.dataset.storyRailLevel===String(n)&&!!document.querySelector('#mechanicNote .story-level-rail'),level);
            const d=await page.evaluate(()=>{
              const game=document.getElementById('game'),rail=document.querySelector('.story-level-rail'),host=document.getElementById('mechanicNote'),board=document.getElementById('board'),cell=board.querySelector('.cell'),props=document.getElementById('levelProps'),style=getComputedStyle(board),cs=getComputedStyle(cell),rs=getComputedStyle(rail),title=document.querySelector('.story-rail-title')?.textContent,speaker=document.querySelector('.story-rail-person>strong')?.textContent,count=document.querySelector('.story-rail-count')?.textContent,movement=document.querySelector('.story-rail-movement')?.textContent;
              return {level:+document.getElementById('levelTitle').textContent.replace(/\D/g,''),chapter:+game.dataset.storyChapter,phase:+game.dataset.storyPhase,slot:+game.dataset.storySlot,milestone:game.dataset.storyMilestone,railHeight:rail.getBoundingClientRect().height,hostHeight:host.getBoundingClientRect().height,title,speaker,count,movement,boardBg:style.backgroundImage,boardBorder:style.borderColor,cellRadius:cs.borderRadius,cellBg:cs.backgroundImage,overflow:document.documentElement.scrollWidth-window.innerWidth,env:!!document.getElementById('levelEnvironment'),propsHidden:!props||getComputedStyle(props).display==='none'||props.hidden,medallions:document.querySelectorAll('.lv-subject-medallion,.level-prop').length,routeTip:!!document.querySelector('.mechanic-chip-label'),boardRect:(()=>{const r=board.getBoundingClientRect();return {l:r.left,r:r.right,t:r.top,b:r.bottom,w:r.width,h:r.height}})(),visibleText:document.querySelector('#game')?.innerText||''};
            });
            if(d.level!==level||d.chapter!==1||d.phase!==Math.floor((level-1)/10)+1||d.slot!==((level-1)%10)+1)fail(`Level state mismatch ${level}: ${JSON.stringify(d)}`);
            if(d.milestone!==(level%10===0?'true':'false'))fail(`Milestone mismatch ${level}`);
            if(d.env||!d.propsHidden||d.medallions||d.routeTip)fail(`Rejected old presentation remains at ${level}: ${JSON.stringify(d)}`);
            if(d.overflow>1||d.boardRect.l<0||d.boardRect.r>390.5)fail(`Gameplay overflow at ${level}: ${JSON.stringify(d)}`);
            if(!d.speaker||!d.title||!d.movement||d.count!==`${level} / 50`)fail(`Story rail incomplete ${level}: ${JSON.stringify(d)}`);
            if(/prototype error|command post|command center|the requester|implementation choice|development choice/i.test(d.visibleText))fail(`Developer-facing text visible on ${level}: ${d.visibleText}`);
            railHeight??=d.railHeight;if(Math.abs(d.railHeight-railHeight)>1.5)fail(`Rail height drift at ${level}: ${d.railHeight} vs ${railHeight}`);
            if(level===1||level===11||level===21||level===31||level===41)phaseFingerprints.set(d.phase,[d.boardBg,d.boardBorder,d.cellRadius].join('|'));
            if(level<=10)slotFingerprints.set(d.slot,d.boardBg);
            manifest.push(d);
            await page.screenshot({path:`${out}/sunpetal/level-${String(level).padStart(2,'0')}.png`,fullPage:false,animations:'disabled'});
          }
          if(new Set(phaseFingerprints.values()).size!==5)fail(`Expected five visibly distinct board movements, got ${JSON.stringify([...phaseFingerprints])}`);
          if(new Set(slotFingerprints.values()).size<9)fail(`Story motif board inlays are not distinct enough: ${new Set(slotFingerprints.values()).size}`);
          const reps=[51,101,151,201,251,301,351];const chapterStyles=[];
          for(const level of reps){await page.evaluate(n=>{window.LatchlingsStoryTheme?.close(false);startLevel(n);window.LatchlingsStoryTheme?.close(false)},level);await page.waitForFunction(n=>document.getElementById('mechanicNote')?.dataset.storyRailLevel===String(n),level);const d=await page.evaluate(()=>({chapter:+document.getElementById('game').dataset.storyChapter,speaker:document.querySelector('.story-rail-person>strong')?.textContent,movement:document.querySelector('.story-rail-movement')?.textContent,railBorder:getComputedStyle(document.querySelector('.story-level-rail')).borderColor,overflow:document.documentElement.scrollWidth-window.innerWidth}));if(d.chapter!==Math.ceil(level/50)||!d.speaker||!d.movement||d.overflow>1)fail(`Chapter rail regression ${level}: ${JSON.stringify(d)}`);chapterStyles.push(d.railBorder);await page.screenshot({path:`${out}/chapters/level-${level}.png`,fullPage:false,animations:'disabled'});}
          if(new Set(chapterStyles).size<6)fail(`Chapter rail theming too similar: ${JSON.stringify(chapterStyles)}`);
          fs.writeFileSync(`${out}/manifest.json`,JSON.stringify({manifest,phaseFingerprints:[...phaseFingerprints],slotCount:new Set(slotFingerprints.values()).size,chapterStyles},null,2));
          if(errors.length)fail(errors.join('\n'));await browser.close();console.log('GAMEPLAY_STORY_BOARD_OK');
          EOF
          node gameplay-audit.mjs
      - name: Build gameplay contact sheets
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          os.makedirs('audit-gameplay/contact-sheets',exist_ok=True)
          files=sorted(glob.glob('audit-gameplay/sunpetal/level-*.png'))
          for group in range(5):
              subset=files[group*10:(group+1)*10]
              if not subset: continue
              w=156; h=int(w*844/390); cols=5; rows=2
              canvas=Image.new('RGB',(cols*w,rows*(h+17)),'white'); draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(subset):
                  im=Image.open(f).convert('RGB'); im.thumbnail((w,h)); x=(i%cols)*w; y=(i//cols)*(h+17); canvas.paste(im,(x,y)); draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save(f'audit-gameplay/contact-sheets/sunpetal-{group*10+1:02d}-{group*10+10:02d}.jpg',quality=91)
          reps=sorted(glob.glob('audit-gameplay/chapters/*.png'))
          if reps:
              w=156;h=int(w*844/390);cols=4;rows=math.ceil(len(reps)/cols);canvas=Image.new('RGB',(cols*w,rows*(h+17)),'white');draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(reps):
                  im=Image.open(f).convert('RGB');im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+17);canvas.paste(im,(x,y));draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save('audit-gameplay/contact-sheets/chapter-representatives.jpg',quality=91)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-board-gameplay-audit
          path: audit-gameplay
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser tooling
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Audit opening geometry and speech
        shell: bash
        run: |
          cat > cinematic-audit.mjs <<'EOF'
          import { chromium } from 'playwright';import fs from 'node:fs';
          const out='audit-cinematic';fs.mkdirSync(out,{recursive:true});const fail=m=>{throw new Error(m)};
          const browser=await chromium.launch({headless:true});const context=await browser.newContext({viewport:{width:390,height:844}});const page=await context.newPage();page.setDefaultTimeout(7000);const errors=[];
          page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!/favicon|ERR_ABORTED|Failed to load resource/i.test(m.text()))errors.push('console: '+m.text())});
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.LatchlingsCinematics&&window.LatchlingsCinematicGeometry&&window.LatchlingsCinematicDialogue);
          await page.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));await page.waitForTimeout(180);
          const manifest=[];
          for(let i=0;i<7;i++){
            if(i){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(180)}
            const d=await page.evaluate(()=>{
              const stage=document.getElementById('cinematicStage'),sr=stage.getBoundingClientRect(),overlap=(a,b)=>Math.max(0,Math.min(a.right,b.right)-Math.max(a.left,b.left))*Math.max(0,Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top));
              const layers=[...stage.querySelectorAll(':scope > .cin-dialogue-layer')];const bubbleGroups=layers.map(layer=>{const bubbles=[...layer.querySelectorAll('.cin-speech-bubble')];return bubbles.map(b=>{const r=b.getBoundingClientRect(),p=b.closest('[data-speaker]')?.querySelector('.dialogue-portrait')?.getBoundingClientRect(),tail=parseFloat(getComputedStyle(b).getPropertyValue('--cin-tail-x'))||50,tailX=r.left+r.width*tail/100,pc=p?p.left+p.width/2:null;return {speaker:b.closest('[data-speaker]')?.dataset.speaker,h:r.height,t:r.top,b:r.bottom,l:r.left,r:r.right,tailX,portraitCenter:pc,tailError:pc==null?999:Math.abs(tailX-pc)}})});
              const routeSets=[...stage.querySelectorAll('.cin-islands')].map(islands=>{const g=islands.__latchRouteGeometry||[],pairs=window.LatchlingsCinematicGeometry.ROUTE_PAIRS;return g.filter(Boolean).map((x,j)=>{const a=islands.querySelector(':scope > .cin-island.'+pairs[j][0])?.getBoundingClientRect(),b=islands.querySelector(':scope > .cin-island.'+pairs[j][1])?.getBoundingClientRect(),p1={x:sr.left+x.x1,y:sr.top+x.y1},p2={x:sr.left+x.x2,y:sr.top+x.y2},inside=(p,r)=>!!r&&p.x>=r.left-2&&p.x<=r.right+2&&p.y>=r.top-2&&p.y<=r.bottom+2;return {route:j+1,startInside:inside(p1,a),endInside:inside(p2,b),x1:x.x1,y1:x.y1,x2:x.x2,y2:x.y2}})});
              const trees=[...stage.querySelectorAll('.prop-tree[data-detailed-tree="true"]')].map(t=>({wood:getComputedStyle(t.querySelector('.cin-tree-trunk')).backgroundImage,grass:getComputedStyle(t.querySelector('.cin-tree-crown')).backgroundImage,crowns:t.querySelectorAll('.cin-tree-crown').length}));
              let protectedRect=null;const beat=window.LatchlingsCinematics.beat+1;
              if(beat===2||beat===7){const frame=stage.querySelector('.cin-home-reference'),doc=frame?.contentDocument,cot=doc?.querySelector('#c2 .cottage');if(frame&&cot){const fr=frame.getBoundingClientRect(),cr=cot.getBoundingClientRect(),sx=fr.width/(frame.clientWidth||fr.width),sy=fr.height/(frame.clientHeight||fr.height);protectedRect={left:fr.left+cr.left*sx,top:fr.top+cr.top*sy,right:fr.left+cr.right*sx,bottom:fr.top+cr.bottom*sy}}}
              if(beat===4){const r=stage.querySelector('.cin-compass')?.getBoundingClientRect();if(r)protectedRect={left:r.left,top:r.top,right:r.right,bottom:r.bottom}}
              if(beat===5){const r=stage.querySelector('.cin-helper-story')?.getBoundingClientRect();if(r)protectedRect={left:r.left,top:r.top,right:r.right,bottom:r.bottom}}
              if(beat===6){const r=stage.querySelector('.cin-demo-board')?.getBoundingClientRect();if(r)protectedRect={left:r.left,top:r.top,right:r.right,bottom:r.bottom}}
              const dialogueRects=[...stage.querySelectorAll('.cin-speech-bubble,.cin-dialogue-speaker .dialogue-portrait,.cin-intro-person .dialogue-portrait')].map(x=>x.getBoundingClientRect()),protectedOverlap=protectedRect?dialogueRects.reduce((s,r)=>s+overlap(r,protectedRect),0):0;
              return {beat,bubbleGroups,routeSets,trees,protectedOverlap,overflow:document.documentElement.scrollWidth-window.innerWidth,dialogueCount:stage.querySelectorAll('.cin-speech-bubble').length,narratorLabel:/Narrator/i.test(document.getElementById('cinematicLines')?.textContent||'')};
            });
            if(d.overflow>1||d.narratorLabel)fail(`Opening beat ${i+1} overflow/narrator regression: ${JSON.stringify(d)}`);
            for(const group of d.bubbleGroups){if(group.length){const hs=group.map(x=>x.h),tops=group.map(x=>x.t);if(Math.max(...hs)-Math.min(...hs)>2||Math.max(...tops)-Math.min(...tops)>2.5)fail(`Bubble band not normalized beat ${i+1}: ${JSON.stringify(group)}`);if(group.some(x=>x.tailError>3))fail(`Bubble tail misses speaker beat ${i+1}: ${JSON.stringify(group)}`)}}
            if(d.routeSets.flat().some(x=>!x.startInside||!x.endInside))fail(`Route endpoints detached beat ${i+1}: ${JSON.stringify(d.routeSets)}`);
            if((i===0||i===2||i===3)&&(!d.trees.length||d.trees.some(t=>t.crowns!==3||!/wood\.jpg/.test(t.wood)||!/grass\.jpg/.test(t.grass))))fail(`Generic tree material regression beat ${i+1}: ${JSON.stringify(d.trees)}`);
            if(d.protectedOverlap>2)fail(`Dialogue overlaps protected focal area beat ${i+1}: ${d.protectedOverlap}`);
            if(i===2){
              const samples=[];for(let s=0;s<3;s++){await page.waitForTimeout(260);samples.push(await page.evaluate(()=>{const stage=document.getElementById('cinematicStage'),sr=stage.getBoundingClientRect(),cargo=stage.querySelector('.cin-route-cargo'),geoms=cargo?.__latchRouteGeometry||[],dist=(p,a,b)=>{const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/l)),x=a.x+t*dx,y=a.y+t*dy;return Math.hypot(p.x-x,p.y-y)};return [...(cargo?.querySelectorAll('i')||[])].map((el,j)=>{const r=el.getBoundingClientRect(),g=geoms[j],p={x:r.left+r.width/2-sr.left,y:r.top+r.height/2-sr.top};return {x:p.x,y:p.y,d:g?dist(p,{x:g.x1,y:g.y1},{x:g.x2,y:g.y2}):999}})}));}
              if(samples.flat().some(x=>x.d>2.5))fail(`Cargo left route: ${JSON.stringify(samples)}`);const moved=samples[0].some((p,j)=>Math.hypot(p.x-samples[2][j].x,p.y-samples[2][j].y)>5);if(!moved)fail(`Cargo did not travel along route: ${JSON.stringify(samples)}`);d.cargoSamples=samples;
            }
            manifest.push(d);await page.screenshot({path:`${out}/opening-${String(i+1).padStart(2,'0')}.png`,fullPage:false,animations:'disabled'});
          }
          await page.evaluate(()=>window.LatchlingsCinematics.finish(false));await context.close();
          const compact=await browser.newContext({viewport:{width:390,height:700},reducedMotion:'reduce'}),cp=await compact.newPage();await cp.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});await cp.waitForFunction(()=>window.LatchlingsCinematics&&window.LatchlingsCinematicGeometry);await cp.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));for(let i=0;i<6;i++){await cp.evaluate(()=>window.LatchlingsCinematics.next());await cp.waitForTimeout(70)}await cp.waitForTimeout(120);const compactData=await cp.evaluate(()=>({overflow:document.documentElement.scrollWidth-window.innerWidth,bubbles:[...document.querySelectorAll('#cinematicStage .cin-speech-bubble')].map(x=>{const r=x.getBoundingClientRect();return {l:r.left,r:r.right,t:r.top,b:r.bottom}}),stage:(()=>{const r=document.getElementById('cinematicStage').getBoundingClientRect();return {l:r.left,r:r.right,t:r.top,b:r.bottom}})()}));if(compactData.overflow>1||compactData.bubbles.some(r=>r.l<compactData.stage.l-1||r.r>compactData.stage.r+1||r.t<compactData.stage.t-1||r.b>compactData.stage.b+1))fail(`Compact opening regression ${JSON.stringify(compactData)}`);await cp.screenshot({path:`${out}/opening-07-compact.png`,fullPage:false,animations:'disabled'});await compact.close();
          fs.writeFileSync(`${out}/manifest.json`,JSON.stringify({manifest,compactData},null,2));if(errors.length)fail(errors.join('\n'));await browser.close();console.log('OPENING_GEOMETRY_OK');
          EOF
          node cinematic-audit.mjs
      - name: Build opening contact sheet
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          files=sorted(glob.glob('audit-cinematic/opening-??.png'))
          if files:
              w=195;h=int(w*844/390);cols=4;rows=math.ceil(len(files)/cols);canvas=Image.new('RGB',(cols*w,rows*(h+18)),'white');draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(files):
                  im=Image.open(f).convert('RGB');im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+18);canvas.paste(im,(x,y));draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save('audit-cinematic/opening-contact-sheet.jpg',quality=92)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-cinematic-geometry-audit
          path: audit-cinematic
  cleanup:
    if: always()
    needs: [gameplay, cinematic]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm -f .github/workflows/audit-story-board-cinematic-rework.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-story-board-cinematic-rework.yml
          if ! git diff --cached --quiet; then git commit -m "Remove temporary story board cinematic audit" && git push; fi
