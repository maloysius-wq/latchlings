name: Refine Little Home Five Residents

on:
  push:
    paths:
      - '.github/workflows/refine-little-home-five-residents.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply five-resident and blue-flower polish
        run: python3 .github/scripts/refine_little_home_five_residents.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          roles=re.findall(r'data-role="(adult|child)"',c2)
          if len(roles)!=5 or roles.count('adult')!=3 or roles.count('child')!=2:
              raise SystemExit(f'Expected 3 adults / 2 children, got {roles}')
          if 'resident adult life-home' in c2 or 'data-activity="home"' in c2:
              raise SystemExit('Removed center/home adult still present')
          for token in ['resident adult life-garden','resident adult life-parcel','resident adult life-tree']:
              if c2.count(token)!=1:
                  raise SystemExit(f'Remaining adult routine missing or duplicated: {token}')
          if c2.count('class="flower ')!=3 or 'class="flower blue f3"' not in c2:
              raise SystemExit('Expected three flowers including blue f3')
          for token in ['#c2 .flower.f3{left:148px;top:84px}','#c2 .flower.blue:after','#72aef5']:
              if token not in t:
                  raise SystemExit(f'Missing blue-flower styling: {token}')
          if c2.count('class="cloud ')!=4 or 'class="deck' in c2 or 'class="fence' in c2:
              raise SystemExit('Cloud/deck/fence scene regression')
          if '<img' in t.lower() or 'https://' in c2 or 'http://' in c2:
              raise SystemExit('Unexpected runtime image/hotlink')
          if 'five-Latchling household' not in c2 or 'five-resident home' not in c2:
              raise SystemExit('Concept copy did not update to five residents')
          print('FIVE_RESIDENT_STATIC_OK', {'residents':5,'adults':3,'children':2,'flowers':3})
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js style400-game.css

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-five-node"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and screenshots
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-five-node"
          mkdir -p five-resident-renders
          python3 -m http.server 8127 >/tmp/little-home-five-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cp .github/scripts/validate_little_home_five_residents.mjs "$TEST_NODE/validate_little_home_five_residents.mjs"
          node "$TEST_NODE/validate_little_home_five_residents.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-five-resident-renders
          path: five-resident-renders/*.png
          if-no-files-found: error

      - name: Commit validated polish and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf five-resident-renders
          rm -f .github/workflows/refine-little-home-five-residents.yml .github/scripts/refine_little_home_five_residents.py .github/scripts/validate_little_home_five_residents.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-five-residents.yml .github/scripts/refine_little_home_five_residents.py .github/scripts/validate_little_home_five_residents.mjs
          git commit -m 'Open up the Little Home household'
          git pull --rebase origin main
          git push origin HEAD:main
