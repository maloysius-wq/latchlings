name: Fix Story Residents Opening Deep Audit V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-story-residents-opening-deep-audit-v2.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply product repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          story=Path('style400-story-theme.css'); s=story.read_text()
          if '/* Deep audit: Story & Residents face anatomy repair. */' not in s:
              s += r'''

          /* Deep audit: Story & Residents face anatomy repair. */
          .story-person-portrait>.story-character-avatar .story-character-avatar-face{left:11%!important;right:11%!important;top:27%!important;height:61%!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes{left:0!important;right:0!important;top:5%!important;height:38%!important;gap:20%!important;justify-content:center!important;align-items:center!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes i{display:block!important;width:24%!important;height:100%!important;min-width:6px!important;max-width:8px!important;border-radius:50%!important;background:#17253a!important;box-shadow:inset 0 -1px rgba(5,16,29,.18)!important;opacity:1!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes i:before{content:""!important;display:block!important;position:absolute!important;width:36%!important;height:36%!important;border-radius:50%!important;background:#fff!important;left:12%!important;top:9%!important;opacity:1!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-eyes i:after{content:""!important;display:block!important;position:absolute!important;width:15%!important;height:15%!important;border-radius:50%!important;background:rgba(255,255,255,.78)!important;right:16%!important;bottom:17%!important;opacity:1!important}
          .story-person-portrait>.story-character-avatar .story-character-avatar-mouth{left:50%!important;top:48%!important;translate:-50% 0!important;margin:0!important;border:0!important;background:transparent!important;rotate:0deg!important;box-sizing:border-box!important}
          .story-person-portrait>.story-character-avatar.expr-happy .story-character-avatar-mouth{width:28%!important;height:20%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 55% 55%!important}
          .story-person-portrait>.story-character-avatar.expr-smug .story-character-avatar-mouth{width:29%!important;height:18%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 72% 30%!important;rotate:-5deg!important}
          .story-person-portrait>.story-character-avatar.expr-curious .story-character-avatar-mouth{width:23%!important;height:19%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 58% 45%!important;rotate:5deg!important}
          .story-person-portrait>.story-character-avatar.expr-determined .story-character-avatar-mouth{width:25%!important;height:16%!important;border-bottom:1.8px solid #28415f!important;border-radius:0 0 38% 38%!important}
          .story-person-portrait>.story-character-avatar.expr-surprised .story-character-avatar-mouth{width:19%!important;height:22%!important;border:1.4px solid #17253a!important;border-radius:50%!important;background:#29415f!important}
          '''
              story.write_text(s)
          geo=Path('style400-cinematics-geometry.css'); g=geo.read_text()
          if '/* Deep audit: content-safe opening dialogue and tutorial geometry. */' not in g:
              g += r'''

          /* Deep audit: content-safe opening dialogue and tutorial geometry. */
          .cin-dialogue-layer[data-dialogue-count] .cin-speech-bubble{height:auto!important;min-height:var(--cin-bubble-height,0px)!important;overflow:visible!important;box-sizing:border-box!important;left:calc(50% + var(--cin-bubble-shift,0px))!important;white-space:normal!important;overflow-wrap:anywhere!important}
          .cin-dialogue-layer[data-dialogue-count] .cin-speech-bubble span{overflow:visible!important}
          .cinematic-copy{scroll-padding-top:8px;overscroll-behavior:contain}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-board{inset:8px 16px auto!important;height:150px!important;transform:none!important;display:grid!important;grid-template-rows:12px 52px 12px 52px!important;gap:3px!important;padding:7px 14px!important;overflow:hidden!important;box-sizing:border-box!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-label{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;align-self:end!important;line-height:1!important;z-index:3!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;height:52px!important;box-sizing:border-box!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-arrow{display:none!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track .cin-character{width:30px!important;height:30px!important}
          .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-mover{top:8px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-rock{width:32px!important;height:30px!important;top:8px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-blocker{top:7px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-nest{width:34px!important;height:34px!important;top:6px!important}
          @media(max-height:720px){
            .cinematic-shell{grid-template-rows:auto clamp(230px,38vh,260px) minmax(0,1fr)!important}.cinematic-stage{min-height:0!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-board{inset:6px 14px auto!important;height:118px!important;grid-template-rows:8px 40px 8px 40px!important;gap:3px!important;padding:5px 12px!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-label{font-size:7px!important;letter-spacing:.08em!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track{height:40px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track .cin-character{width:26px!important;height:26px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-mover{top:5px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-rock{width:28px!important;height:26px!important;top:5px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-blocker{top:4px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-nest{width:29px!important;height:29px!important;top:3px!important;border-width:2px!important}
          }
          @media(max-height:600px){
            .cinematic-shell{grid-template-rows:auto 230px minmax(0,1fr)!important}
            .cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-board{inset:5px 12px auto!important;height:106px!important;grid-template-rows:7px 36px 7px 36px!important;gap:2px!important;padding:4px 10px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-label{font-size:6.5px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track{height:36px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .cin-demo-track .cin-character{width:24px!important;height:24px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-mover{top:4px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-rock{width:26px!important;height:24px!important;top:4px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-blocker{top:3px!important}.cinematic-overlay[data-cinematic="opening"][data-beat="6"] .demo-nest{width:27px!important;height:27px!important;top:2px!important}
          }
          '''
              geo.write_text(g)
          js=Path('cinematic-geometry400.js'); j=js.read_text()
          old="""function normalizeDialogue(stage){\n const layers=[...stage.querySelectorAll(':scope > .cin-dialogue-layer')];\n layers.forEach(layer=>{\n  const bubbles=[...layer.querySelectorAll('.cin-speech-bubble')];if(!bubbles.length)return;\n  layer.style.removeProperty('--cin-bubble-height');\n  let target=Math.max(...bubbles.map(b=>Math.ceil(b.scrollHeight)));const compact=stage.getBoundingClientRect().height<280;target=clamp(target,compact?46:50,compact?70:82);layer.style.setProperty('--cin-bubble-height',`${target}px`);\n  requestAnimationFrame(()=>bubbles.forEach(b=>{\n   const speaker=b.closest('[data-speaker]'),portrait=speaker?.querySelector('.dialogue-portrait'),br=b.getBoundingClientRect(),pr=portrait?.getBoundingClientRect();if(!pr||!br.width)return;const px=pr.left+pr.width/2,tail=clamp((px-br.left)/br.width*100,12,88);b.style.setProperty('--cin-tail-x',`${tail.toFixed(2)}%`);\n  }));\n });\n}\n"""
          new="""function normalizeDialogue(stage){\n const layers=[...stage.querySelectorAll(':scope > .cin-dialogue-layer')];\n layers.forEach(layer=>{\n  const bubbles=[...layer.querySelectorAll('.cin-speech-bubble')];if(!bubbles.length)return;\n  layer.style.removeProperty('--cin-bubble-height');bubbles.forEach(b=>b.style.removeProperty('--cin-bubble-shift'));\n  layer.style.setProperty('--cin-bubble-height',`${Math.max(...bubbles.map(b=>Math.ceil(b.scrollHeight)))}px`);\n  requestAnimationFrame(()=>{const sr=stage.getBoundingClientRect(),pad=5;bubbles.forEach(b=>{b.style.removeProperty('--cin-bubble-shift');const br=b.getBoundingClientRect();let shift=0;if(br.left<sr.left+pad)shift+=sr.left+pad-br.left;if(br.right>sr.right-pad)shift-=br.right-(sr.right-pad);if(Math.abs(shift)>.25)b.style.setProperty('--cin-bubble-shift',`${shift.toFixed(2)}px`)});requestAnimationFrame(()=>bubbles.forEach(b=>{const speaker=b.closest('[data-speaker]'),portrait=speaker?.querySelector('.dialogue-portrait'),br=b.getBoundingClientRect(),pr=portrait?.getBoundingClientRect();if(!pr||!br.width)return;const px=pr.left+pr.width/2,tail=clamp((px-br.left)/br.width*100,12,88);b.style.setProperty('--cin-tail-x',`${tail.toFixed(2)}%`)}))});\n });\n}\n"""
          if old not in j: raise SystemExit('normalizeDialogue anchor missing')
          js.write_text(j.replace(old,new,1))
          cin=Path('cinematics400.js'); c=cin.read_text()
          oldf="setTimeout(()=>document.getElementById('cinematicNext')?.focus(),50);return true"
          newf="setTimeout(()=>{const b=document.getElementById('cinematicNext');if(b)try{b.focus({preventScroll:true})}catch(_){b.focus()}const copy=document.querySelector('.cinematic-copy');if(copy)copy.scrollTop=0},50);return true"
          oldr="nextBtn.textContent=activeIndex===c.beats.length-1?c.finalLabel:'Continue';requestAnimationFrame(()=>o.classList.add('beat-ready'))"
          newr="nextBtn.textContent=activeIndex===c.beats.length-1?c.finalLabel:'Continue';const copy=document.querySelector('.cinematic-copy');if(copy)copy.scrollTop=0;requestAnimationFrame(()=>o.classList.add('beat-ready'))"
          if oldf not in c or oldr not in c: raise SystemExit('cinematic anchors missing')
          cin.write_text(c.replace(oldf,newf,1).replace(oldr,newr,1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve
        run: python3 -m http.server 4173 >/tmp/http.log 2>&1 &
      - name: Full responsive visual validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p accepted/story accepted/opening accepted/later
          cat > check.mjs <<'JS'
          import {chromium} from 'playwright'; import fs from 'fs';
          const browser=await chromium.launch({headless:true}); const sizes=[[320,568],[360,640],[390,700],[390,844],[430,932]], report={story:{},opening:{}}; const A=(v,m)=>{if(!v)throw new Error(m)};
          for(const [width,height] of sizes){const key=`${width}x${height}`,page=await browser.newPage({viewport:{width,height},reducedMotion:'reduce'});await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.waitForFunction(()=>window.LatchlingsStoryTheme&&window.LatchlingsCinematics);await page.evaluate(()=>{localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars:{}}));openStoryScreen()});await page.waitForTimeout(120);
            const faces=await page.evaluate(()=>[...document.querySelectorAll('#storyCast .story-person-portrait')].map(card=>({name:card.dataset.character,eyes:[...card.querySelectorAll('.story-character-avatar-eyes i')].map(e=>{const r=e.getBoundingClientRect(),cs=getComputedStyle(e,'::before');return{w:r.width,h:r.height,opacity:+getComputedStyle(e).opacity,catchlight:cs.content}}),mouth:(()=>{const m=card.querySelector('.story-character-avatar-mouth'),r=m.getBoundingClientRect(),cs=getComputedStyle(m);return{w:r.width,h:r.height,bottom:parseFloat(cs.borderBottomWidth),top:parseFloat(cs.borderTopWidth),bg:cs.backgroundColor}})()})));
            A(faces.length===5,`${key} missing residents`);for(const f of faces){A(f.eyes.length===2,`${key} ${f.name} eye elements`);for(const e of f.eyes)A(e.w>=5&&e.h>=6&&e.opacity>.9&&e.catchlight!=='none',`${key} ${f.name} invisible eye ${JSON.stringify(e)}`);A(f.mouth.w>=5&&f.mouth.h>=3,`${key} ${f.name} mouth collapsed`);if(f.name!=='Tansy')A(f.mouth.bottom>0,`${key} ${f.name} mouth not clean curve`)} report.story[key]=faces;await page.screenshot({path:`accepted/story/story-${key}.png`,fullPage:true});await page.evaluate(()=>storyModal());await page.waitForTimeout(80);await page.locator('#modal').screenshot({path:`accepted/story/story-modal-${key}.png`});await page.evaluate(()=>{closeModal();window.LatchlingsCinematics.show('opening',{markSeen:false})});await page.waitForTimeout(250);report.opening[key]=[];
            for(let i=0;i<7;i++){if(i){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(200)}const m=await page.evaluate(()=>{const R=e=>{const r=e.getBoundingClientRect();return{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom}},stage=document.getElementById('cinematicStage'),sr=stage.getBoundingClientRect(),copy=document.querySelector('.cinematic-copy'),cr=copy.getBoundingClientRect(),title=document.getElementById('cinematicTitle').getBoundingClientRect(),next=document.getElementById('cinematicNext').getBoundingClientRect(),inside=r=>r.left>=sr.left-2&&r.right<=sr.right+2&&r.top>=sr.top-2&&r.bottom<=sr.bottom+2,bubbles=[...stage.querySelectorAll('.cin-speech-bubble')].map(b=>{const r=b.getBoundingClientRect(),sp=b.closest('[data-speaker]'),pr=sp?.querySelector('.dialogue-portrait')?.getBoundingClientRect(),tail=parseFloat(getComputedStyle(b).getPropertyValue('--cin-tail-x'))||50;return{speaker:sp?.dataset.speaker||'',rect:R(b),clipY:b.scrollHeight>b.clientHeight+1,clipX:b.scrollWidth>b.clientWidth+1,inside:inside(r),tailError:pr?Math.abs(r.left+r.width*tail/100-(pr.left+pr.width/2)):0}}),demo=stage.querySelector('.cin-demo-board'),dr=demo?.getBoundingClientRect(),kids=demo?[...demo.querySelectorAll('.cin-demo-label,.cin-demo-track,.demo-mover,.demo-rock,.demo-blocker,.demo-nest')].map(e=>{const r=e.getBoundingClientRect();return{cls:e.className||'',inside:r.left>=dr.left-2&&r.right<=dr.right+2&&r.top>=dr.top-2&&r.bottom<=dr.bottom+2}}):[];return{beat:window.LatchlingsCinematics.beat+1,scrollTop:copy.scrollTop,titleVisible:title.top>=cr.top-1&&title.bottom<=cr.bottom+1,nextVisible:next.top>=cr.top-1&&next.bottom<=cr.bottom+1,bubbles,demo:demo?{inside:inside(dr),kids}:null,docOverflow:document.documentElement.scrollWidth>document.documentElement.clientWidth}});A(m.scrollTop<=1,`${key} beat${i+1} copy scrolled ${m.scrollTop}`);A(m.titleVisible,`${key} beat${i+1} title clipped`);A(m.nextVisible,`${key} beat${i+1} continue clipped`);A(!m.docOverflow,`${key} beat${i+1} doc overflow`);for(const b of m.bubbles){A(!b.clipX&&!b.clipY,`${key} beat${i+1} ${b.speaker} text clipped`);A(b.inside,`${key} beat${i+1} ${b.speaker} outside stage`);A(b.tailError<=Math.max(20,b.rect.w*.3),`${key} beat${i+1} ${b.speaker} tail off ${b.tailError}`)}if(m.demo){A(m.demo.inside,`${key} beat${i+1} demo outside`);for(const k of m.demo.kids)A(k.inside,`${key} beat${i+1} demo child outside ${k.cls}`)}report.opening[key].push(m);await page.locator('.cinematic-shell').screenshot({path:`accepted/opening/${key}-beat-${i+1}.png`})}await page.close()}
          const page=await browser.newPage({viewport:{width:390,height:700},reducedMotion:'reduce'});await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await page.waitForFunction(()=>window.LatchlingsCinematics);for(const id of ['across-drift','old-maps','homeward']){await page.evaluate(id=>window.LatchlingsCinematics.show(id,{markSeen:false}),id);await page.waitForTimeout(160);const n=await page.evaluate(id=>window.LatchlingsCinematics.CINEMATICS[id].beats.length,id);for(let i=0;i<n;i++){if(i){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(130)}const ok=await page.evaluate(()=>{const s=document.getElementById('cinematicStage').getBoundingClientRect();return[...document.querySelectorAll('#cinematicStage .cin-speech-bubble')].every(b=>{const r=b.getBoundingClientRect();return b.scrollHeight<=b.clientHeight+1&&b.scrollWidth<=b.clientWidth+1&&r.left>=s.left-2&&r.right<=s.right+2&&r.top>=s.top-2&&r.bottom<=s.bottom+2})});A(ok,`${id} beat${i+1} shared bubble regression`)}await page.evaluate(()=>window.LatchlingsCinematics.finish(true))}await page.close();fs.writeFileSync('accepted/report.json',JSON.stringify(report,null,2));console.log('DEEP_STORY_RESIDENTS_OPENING_ACCEPTED');await browser.close();
          JS
          node check.mjs
      - name: Commit product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-story-theme.css style400-cinematics-geometry.css cinematic-geometry400.js cinematics400.js
          git commit -m "Repair Story resident faces and cinematic clipping"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-residents-opening-deep-fix-v2
          path: accepted
      - name: Self-remove
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD; git pull --ff-only origin main; rm -f check.mjs package.json package-lock.json
          git rm .github/workflows/fix-story-residents-opening-deep-audit-v2.yml
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Story Residents opening fix v2 workflow"; git push
