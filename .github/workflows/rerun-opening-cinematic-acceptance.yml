name: Rerun Opening Cinematic Acceptance
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rehydrate acceptance script
        shell: bash
        run: |
          set -euo pipefail
          git show 327ed1c481d85c2bbcbd7fcd20ec7e5ddb1e41e9:.github/workflows/final-opening-cinematic-acceptance.yml > /tmp/prior.yml
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/prior.yml').read_text();marker="cat > cinematic-final-audit.mjs <<'EOF'\n";start=text.index(marker)+len(marker);end=text.index("\n          EOF\n",start);Path('cinematic-final-audit.mjs').write_text(text[start:end])
          PY
          grep -q OPENING_CINEMATIC_ACCEPTED cinematic-final-audit.mjs
      - name: Install browser tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start server
        shell: bash
        run: |
          python3 -m http.server 8080 >/tmp/latchlings-server.log 2>&1 &
          sleep 2
      - name: Run acceptance
        shell: bash
        run: |
          set -euo pipefail
          node cinematic-final-audit.mjs
      - name: Build contact sheet
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          files=sorted(glob.glob('cinematic-final-audit/opening-??.png'))
          if files:
              w=195;h=int(w*844/390);cols=4;rows=math.ceil(len(files)/cols);canvas=Image.new('RGB',(cols*w,rows*(h+18)),'white');draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(files):
                  im=Image.open(f).convert('RGB');im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+18);canvas.paste(im,(x,y));draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save('cinematic-final-audit/opening-contact-sheet.jpg',quality=92)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-cinematic-accepted-rerun
          path: cinematic-final-audit
          if-no-files-found: warn
      - name: Self-remove
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f cinematic-final-audit.mjs
          git pull --ff-only origin main
          rm -f .github/workflows/rerun-opening-cinematic-acceptance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rerun-opening-cinematic-acceptance.yml
          if ! git diff --cached --quiet; then git commit -m "Remove rerun opening cinematic audit" && git push; fi
