name: Finalize SFX Handoff

on:
  push:
    paths:
      - '.github/workflows/finish-sfx-handoff.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record completed SFX pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('DEVELOPMENT_HANDOFF.md')
          text = p.read_text()
          payload = ''
          completed = base64.b64decode(payload).decode('utf-8')
          start = text.index('### 2026-08-31 — Full licensed sound-effects pass')
          end = text.index('\n---\n', start)
          text = text[:start] + completed + text[end:]
          old = '- `music400.js`\n\n**Music / licensing**'
          new = '- `music400.js`\n- `sfx400.js`\n\n**Music / licensing**'
          if old in text:
              text = text.replace(old, new, 1)
          old = '- `MUSIC_CREDITS.md` — permanent license/provenance record\n'
          new = old + '\n**Sound effects / licensing**\n- `assets/sfx/*.wav` — 21 local sourced CC0 SFX files\n- `SFX_CREDITS.md` — permanent CC0/provenance record\n'
          if '**Sound effects / licensing**' not in text:
              text = text.replace(old, new, 1)
          needle = '- Current music direction: title/menu = highly happy/cutesy; level tracks = chapter-specific, cute, soft, slow, pensive/inquisitive, instrumental. Preserve `MUSIC_CREDITS.md` when swapping tracks.\n'
          if 'Current SFX direction:' not in text:
              text = text.replace(needle, needle + '- Current SFX direction: sourced recorded audio only, no procedural generation; one continuous travel sound per magnetic snap; restrained semantic endpoint/UI cues. Preserve `SFX_CREDITS.md` when swapping effects.\n', 1)
          text = text.replace('- Music preference key: `latchlings_music_enabled_v1`.\n', '- Music preference key: `latchlings_music_enabled_v1`.\n- SFX preference key: `latchlings_sfx_enabled_v1`.\n', 1)
          text = text.replace('5. Preserve/update `MUSIC_CREDITS.md` if soundtrack files change.\n6. At task completion, update and commit this handoff again.', '5. Preserve/update `MUSIC_CREDITS.md` if soundtrack files change.\n6. Preserve/update `SFX_CREDITS.md` if sound-effect files change; keep SFX sourced-recording-only.\n7. At task completion, update and commit this handoff again.')
          p.write_text(text)
          PY
      - name: Commit final handoff and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finish-sfx-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/finish-sfx-handoff.yml
          git commit -m 'Complete licensed SFX development handoff'
          git pull --rebase origin main
          git push origin HEAD:main
