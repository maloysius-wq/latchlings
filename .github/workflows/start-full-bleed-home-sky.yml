name: Start Full-Bleed Home Sky Handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-full-bleed-home-sky.yml'
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current work
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-10 — Make the Little Home sky full-bleed to the screen edges'
          if heading not in s:
              marker='## Current Work\n\n'
              entry='''### 2026-09-10 — Make the Little Home sky full-bleed to the screen edges\n\n**Status: IN PROGRESS**\n\n**User goal:** Remove the visible inner scene boundary on the initial Little Home title screen. Clouds should only clip at the physical screen edge, and the sky scene should extend continuously to the full viewport instead of ending at a centered portrait frame with plain light-blue gutters.\n\n**Implementation plan:** Fix the production home shell rather than painting over the seam. Make the embedded Little Home surface fill the entire home viewport width and height, then make the embedded `.phone` fill that viewport instead of preserving a 390:844 frame that narrows on shorter screens. Preserve the centered Little Home composition and approved title/button sizing. Convert the existing compact behavior from an accidental width-based trigger caused by the 323px iframe into an explicit short-viewport rule so 390×700 keeps the accepted compact title, island, and button layout while gaining full-bleed sky and clouds.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md`, `style400-ui.css`, and `title-island-concepts/index.html`; temporary self-removing screenshot validation workflow(s) may be used. No gameplay, story, campaign, solver, audio, cinematic dialogue, button actions, Little Home art, or title wording changes are intended.\n\n**Validation plan:** Render the actual production shell at 390×844 and 390×700. Assert the home wrapper and iframe span the viewport, the embedded phone matches the iframe dimensions, no horizontal overflow exists, no solid-color side gutters remain, edge clouds clip only against the viewport, the title/island/buttons remain within accepted geometry, all three buttons remain visible on the compact screen, and cinematic scene-only composition is unchanged. Manually inspect both screenshots.\n\n**Deployment plan:** Commit this IN PROGRESS state before product edits, implement and screenshot-test the full-bleed treatment, self-remove temporary workflows, verify GitHub Pages deploys the accepted clean state, confirm `validate-repository-access-guard.yml` is again the only durable workflow, then close this entry as COMPLETED/PARTIAL/BLOCKED with exact commit/run/artifact details and remaining risk.\n\n---\n\n'''
              if marker not in s: raise SystemExit('Current Work marker missing')
              s=s.replace(marker,marker+entry,1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "Start full-bleed home sky handoff"
            git push
          fi
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm -f .github/workflows/start-full-bleed-home-sky.yml
          git add .github/workflows/start-full-bleed-home-sky.yml
          git commit -m "Remove full-bleed sky handoff helper"
          git push
