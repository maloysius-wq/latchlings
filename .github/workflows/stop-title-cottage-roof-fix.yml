name: Stop Premature Title Cottage Roof Fix
on:
  push:
    paths:
      - '.github/workflows/stop-title-cottage-roof-fix.yml'
permissions:
  actions: write
  contents: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove premature fixer if still present
        run: |
          rm -f .github/workflows/fix-title-cottage-roof.yml .github/workflows/stop-title-cottage-roof-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fix-title-cottage-roof.yml .github/workflows/stop-title-cottage-roof-fix.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Reset title cottage roof fix staging'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
