name: Close story presentation

on:
  push:
    paths:
      - '.github/workflows/close-story-presentation.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff
        run: python .github/tmp/close-story-presentation.py
      - name: Commit handoff
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete story presentation handoff"
          git push
