name: Close Procedural Title Rebuild Handoff

on:
  push:
    paths:
      - '.github/workflows/close-procedural-title-handoff.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          title='### 2026-09-02 — Rebuild floating-island title concepts with procedural models + CC0 textures'
          start=t.index(title)
          end=t.index('\n---\n', start)
          block=t[start:end]
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          completion='''\n\n#### Completion summary\n\n**Implementation:** Rebuilt the focused `title-island-concepts/` gallery away from premade environment sprites/models. The floating landmass, grass cap, earth sides, clouds, path, rocks, tree, fence, deck, cottage, bridge, and flowers are now browser-built HTML/CSS geometry. The active preview contains zero environment `<img>` elements and no active Kenney/isometric references. Production `index.html` was not changed.\n\n**Latchling fidelity:** Rebuilt the preview characters directly from the current shipping `style400-game.css` / `game400-a.js` language: exact coral/blue/mint/gold/lavender COLORS/LIGHT/DARK values, shipping radial/linear body shading, 29% crown suit-mark proportions, exact heart/diamond/club/spade/star SVG paths, shipping eye/pupil/highlight proportions, all seven shipping expression classes (`happy`, `surprised`, `angry`, `smug`, `sleepy`, `curious`, `determined`), and asynchronous blink/face timing.\n\n**CC0 materials:** Added only three local 512×512 compressed color/albedo maps from ambientCG, which publishes its assets under CC0 1.0: Grass005 as `textures/grass.jpg`, Ground085 as `textures/earth.jpg`, and Wood093 as `textures/wood.jpg`. No normal/roughness/displacement maps, preview sheets, premade models, or runtime hotlinks are used.\n\n**Files changed:** `title-island-concepts/index.html`, `title-island-concepts/ASSET_CREDITS.md`, `title-island-concepts/textures/grass.jpg`, `title-island-concepts/textures/earth.jpg`, `title-island-concepts/textures/wood.jpg`. Temporary build/finalization workflows and rebuild script self-removed.\n\n**Validation:** GitHub Actions run `33651741229` passed the substantive static and Chromium gates. Static validation confirmed exactly three concepts, zero sprite image elements, zero legacy isometric runtime references, exactly the three local 512×512 texture maps, and shipping palette/expression/suit requirements. Chromium at 390×844 passed all three concepts with no console/page/request errors, no horizontal overflow, no clipped primary UI, three loaded local texture resources, zero `<img>` elements, and complete suit/face markup for 6 / 6 / 7 Latchlings. Screenshot artifact `9855068387` was downloaded and all three renders were visually inspected.\n\n**Implementation commit:** `4d2b0ed0b84965e74875cc61b306455712213f9a` (`Rebuild title concepts with procedural textured models`).\n\n**Deployment:** GitHub Pages run `33651987557` completed successfully for implementation commit `4d2b0ed0b84965e74875cc61b306455712213f9a`. The focused preview remains at `title-island-concepts/`, with `?c=1`, `?c=2`, and `?c=3` selecting Quiet Perch, Little Home, and Island Life.\n\n**Remaining risk / next action:** This is still a design-selection preview. Do not replace the production title screen until the user chooses a procedural concept, requests a hybrid, or asks for another refinement pass. Older unused experimental asset files remain archived in the repository but are not referenced by this focused preview.\n'''
          if '#### Completion summary' not in block:
              block += completion
          t=t[:start]+block+t[end:]
          p.write_text(t)
          PY
          rm -f .github/workflows/close-procedural-title-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-procedural-title-handoff.yml
          git commit -m 'Complete procedural title rebuild handoff'
          git push origin HEAD:main
