name: Refine Little Home Life

on:
  push:
    paths:
      - '.github/workflows/refine-little-home-life.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Little Home household refinement
        run: python3 .github/scripts/refine_little_home_life.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          if 'class="fence"' in c2:
              raise SystemExit('Concept 2 fence still present')
          residents=re.findall(r'<div class="latchling ([^"]+)"[^>]*data-role="(adult|child)"', c2)
          if len(residents)!=6:
              raise SystemExit(f'Expected 6 Concept 2 residents, got {len(residents)}')
          roles=[role for _,role in residents]
          if roles.count('adult')!=4 or roles.count('child')!=2:
              raise SystemExit(f'Expected 4 adults + 2 children, got {roles}')
          for cls in ['life-garden','life-parcel','life-tree','life-home','kid-one','kid-two']:
              if cls not in c2 or f'.{cls}' not in t:
                  raise SystemExit(f'Missing routine {cls}')
          if 'class="play-ball"' not in c2 or '@keyframes littleHomeBall' not in t:
              raise SystemExit('Children play prop/animation missing')
          if '#c2 .latchling{width:34px;height:34px' not in t:
              raise SystemExit('Adult scale rule missing')
          if '#c2 .latchling.child{width:25px;height:25px}' not in t:
              raise SystemExit('Child scale rule missing')
          for value in ['#ef5f66','#4c8ff4','#66bd72','#f6b737','#9a72df']:
              if value not in t:
                  raise SystemExit(f'Shipping palette value missing: {value}')
          if '<img' in t.lower():
              raise SystemExit('Preview unexpectedly contains image elements')
          if 'https://' in c2 or 'http://' in c2:
              raise SystemExit('Concept 2 runtime hotlink found')
          print('STATIC_OK', {'residents':len(residents),'adults':roles.count('adult'),'children':roles.count('child')})
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Browser validation and animation screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p little-home-life-renders
          python3 -m http.server 8124 >/tmp/little-home-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > .validate-little-home.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          page.on('pageerror',e=>errors.push('pageerror:'+e.message));
          page.on('requestfailed',r=>errors.push('request:'+r.url()));
          const res=await page.goto('http://127.0.0.1:8124/title-island-concepts/?c=2',{waitUntil:'networkidle'});
          if(!res?.ok())throw new Error('Little Home response failed');
          await page.waitForTimeout(500);
          const sample=async()=>page.evaluate(()=>{
            const a=document.querySelector('#c2.active');
            const island=a.querySelector('.island-top').getBoundingClientRect();
            const phone=a.querySelector('.phone').getBoundingClientRect();
            const play=a.querySelector('.play').getBoundingClientRect();
            const secondary=a.querySelector('.secondary').getBoundingClientRect();
            const residents=[...a.querySelectorAll('.resident')].map((el,i)=>{
              const r=el.getBoundingClientRect();
              const cs=getComputedStyle(el);
              return {i,role:el.dataset.role,activity:el.dataset.activity,x:r.x,y:r.y,w:r.width,h:r.height,cx:r.x+r.width/2,cy:r.y+r.height/2,animation:cs.animationName};
            });
            return {bodyWidth:document.body.scrollWidth,viewport:innerWidth,phone:{left:phone.left,right:phone.right,bottom:phone.bottom},play:{top:play.top,bottom:play.bottom},secondary:{bottom:secondary.bottom},island:{left:island.left,right:island.right,top:island.top,bottom:island.bottom},fences:a.querySelectorAll('.fence').length,residents,adults:a.querySelectorAll('.resident.adult').length,children:a.querySelectorAll('.resident.child').length,ball:a.querySelectorAll('.play-ball').length,img:a.querySelectorAll('img').length};
          });
          const s0=await sample();
          await page.screenshot({path:'little-home-life-renders/little-home-phase-1.png',fullPage:true});
          await page.waitForTimeout(1450);
          const s1=await sample();
          await page.screenshot({path:'little-home-life-renders/little-home-phase-2.png',fullPage:true});
          await page.waitForTimeout(1450);
          const s2=await sample();
          await page.screenshot({path:'little-home-life-renders/little-home-phase-3.png',fullPage:true});
          if(s0.bodyWidth>s0.viewport+1)throw new Error(`Horizontal overflow ${s0.bodyWidth}/${s0.viewport}`);
          if(s0.phone.left<-1||s0.phone.right>s0.viewport+1)throw new Error('Phone out of viewport');
          if(s0.secondary.bottom>s0.phone.bottom+1)throw new Error('Primary UI clipped');
          if(s0.fences!==0||s0.residents.length!==6||s0.adults!==4||s0.children!==2||s0.ball!==1||s0.img!==0)throw new Error('Household structure mismatch '+JSON.stringify(s0));
          const adults=s0.residents.filter(x=>x.role==='adult');
          const children=s0.residents.filter(x=>x.role==='child');
          const adultSize=adults.reduce((a,x)=>a+x.w,0)/adults.length;
          const childSize=children.reduce((a,x)=>a+x.w,0)/children.length;
          if(!(adultSize>=32&&adultSize<=36&&childSize>=23&&childSize<=27&&childSize<adultSize-5))throw new Error(`Scale mismatch adults=${adultSize} children=${childSize}`);
          for(const state of [s0,s1,s2]){
            for(const r of state.residents){
              if(r.cx<state.island.left-4||r.cx>state.island.right+4||r.cy<state.island.top-5||r.cy>state.island.bottom+12)throw new Error(`Resident ${r.i} left island at ${JSON.stringify(r)}`);
              if(r.y+r.h>state.play.top-35)throw new Error(`Resident ${r.i} too close to primary UI`);
              if(!r.animation||r.animation==='none')throw new Error(`Resident ${r.i} has no locomotion animation`);
            }
          }
          for(let i=0;i<6;i++){
            const pts=[s0.residents[i],s1.residents[i],s2.residents[i]];
            const ds=[];
            for(let a=0;a<pts.length;a++)for(let b=a+1;b<pts.length;b++)ds.push(Math.hypot(pts[a].cx-pts[b].cx,pts[a].cy-pts[b].cy));
            if(Math.max(...ds)<3)throw new Error(`Resident ${i} did not visibly move: ${JSON.stringify(ds)}`);
          }
          if(errors.length)throw new Error(errors.join(' | '));
          console.log('LITTLE_HOME_OK',JSON.stringify({adultSize,childSize,positions:[s0.residents,s1.residents,s2.residents]}));
          for(const id of [1,3]){
            const p=await browser.newPage({viewport:{width:390,height:844}});
            const localErrors=[];
            p.on('pageerror',e=>localErrors.push(e.message));
            p.on('requestfailed',r=>localErrors.push(r.url()));
            await p.goto(`http://127.0.0.1:8124/title-island-concepts/?c=${id}`,{waitUntil:'networkidle'});
            const sanity=await p.evaluate(()=>({active:document.querySelector('.concept.active')?.id,count:document.querySelector('.concept.active')?.querySelectorAll('.latchling').length,overflow:document.body.scrollWidth-innerWidth}));
            const expected=id===1?6:7;
            if(sanity.active!==`c${id}`||sanity.count!==expected||sanity.overflow>1||localErrors.length)throw new Error(`Concept ${id} sanity failed ${JSON.stringify({sanity,localErrors})}`);
            await p.close();
          }
          await browser.close();
          JS
          node .validate-little-home.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-life-renders
          path: little-home-life-renders/*.png
          if-no-files-found: error

      - name: Commit validated refinement and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf little-home-life-renders node_modules package.json package-lock.json .validate-little-home.mjs
          rm -f .github/workflows/refine-little-home-life.yml .github/scripts/refine_little_home_life.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-life.yml .github/scripts/refine_little_home_life.py
          git commit -m 'Animate the Little Home household'
          git pull --rebase origin main
          git push origin HEAD:main
