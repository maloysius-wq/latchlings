name: Implement Full-Bleed Little Home Sky
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-full-bleed-home-sky.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make home sky full bleed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('style400-ui.css')
          s=p.read_text()
          old='.production-home-wrap{width:min(390px,100vw,46.2085svh);aspect-ratio:390/844;max-height:100svh;overflow:hidden;border-radius:30px;box-shadow:0 18px 42px rgba(29,55,88,.16);background:#dceffa}'
          new='.production-home-wrap{width:100vw;height:100svh;max-width:none;max-height:none;aspect-ratio:auto;overflow:hidden;border-radius:30px;box-shadow:0 18px 42px rgba(29,55,88,.16);background:#dceffa}'
          if old not in s: raise SystemExit('production home wrapper baseline not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('title-island-concepts/index.html')
          s=p.read_text()
          old='body.embed-mode #c2 .phone{border-radius:0;box-shadow:none;width:100%}'
          new='body.embed-mode #c2 .phone{border-radius:0;box-shadow:none;width:100%;height:100svh;min-height:100svh;aspect-ratio:auto}'
          if old not in s: raise SystemExit('embedded phone baseline not found')
          s=s.replace(old,new,1)
          marker='/* Cinematic scene-only reuse of the production Little Home */'
          compact='''/* Full-bleed production home: compact height preserves the accepted short-screen composition. */
          @media(max-height:740px){
          #c2 .toy-brand{top:68px;left:4px;right:4px}
          #c2 .toy-logo span{font-size:56px;-webkit-text-stroke:6.5px var(--navy)}
          #c2 .toy-tagline{margin-top:12px;padding:8px 16px;font-size:14px;letter-spacing:.02em}
          #c2 .scene{top:190px}
          #c2 .play{left:16px;right:16px;top:546px;height:68px;font-size:24px;border-radius:22px}
          #c2 .play:before{inset:5px;border-radius:16px}
          #c2 .play svg{width:29px;height:29px;padding:6px}
          #c2 .secondary{left:16px;right:16px;top:626px;gap:8px}
          #c2 .secondary button{height:68px;border-radius:18px;padding:8px 9px 8px 11px;grid-template-columns:1fr 30px;column-gap:5px}
          #c2 .secondary button:before{inset:4px;border-radius:13px}
          #c2 .secondary strong{font-size:15px}
          #c2 .secondary span{font-size:9px;line-height:1.08;margin-top:4px}
          #c2 .secondary svg{width:29px;height:29px;padding:5px}
          }

          '''
          if compact.strip() not in s:
              if marker not in s: raise SystemExit('cinematic marker not found')
              s=s.replace(marker,compact+marker,1)
          p.write_text(s)
          PY
      - name: Static assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.production-home-wrap{width:100vw;height:100svh;max-width:none;max-height:none;aspect-ratio:auto' style400-ui.css
          grep -Fq 'body.embed-mode #c2 .phone{border-radius:0;box-shadow:none;width:100%;height:100svh;min-height:100svh;aspect-ratio:auto}' title-island-concepts/index.html
          grep -Fq '@media(max-height:740px)' title-island-concepts/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-http.log 2>&1 &
          echo $! > /tmp/latchlings-http.pid
      - name: Render and verify full-bleed production home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p full-bleed-home-audit
          cat > audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const cases=[
            {name:'production-home-390x844',width:390,height:844},
            {name:'production-home-390x700',width:390,height:700},
            {name:'production-home-430x932',width:430,height:932}
          ];
          const metrics={};
          const assert=(v,msg)=>{if(!v)throw new Error(msg)};
          for(const c of cases){
            const page=await browser.newPage({viewport:{width:c.width,height:c.height}});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            const frameEl=page.locator('#homeTitleFrame');
            await frameEl.waitFor();
            const frame=page.frames().find(f=>f.url().includes('title-island-concepts'));
            assert(frame,'home title iframe missing');
            await frame.waitForSelector('#c2 .phone');
            await page.waitForTimeout(1300);
            const outer=await page.evaluate(()=>{
              const box=e=>{const r=e.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
              return {home:box(document.querySelector('#home')),wrap:box(document.querySelector('.production-home-wrap')),frame:box(document.querySelector('#homeTitleFrame')),sw:innerWidth,sh:innerHeight,overflow:document.documentElement.scrollWidth-innerWidth};
            });
            const inner=await frame.evaluate(()=>{
              const box=e=>{const r=e.getBoundingClientRect();return {left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height}};
              return {phone:box(document.querySelector('#c2 .phone')),cloudA:box(document.querySelector('#c2 .cloud.a')),cloudB:box(document.querySelector('#c2 .cloud.b')),title:box(document.querySelector('#c2 .toy-logo')),tagline:box(document.querySelector('#c2 .toy-tagline')),scene:box(document.querySelector('#c2 .scene')),play:box(document.querySelector('#c2 .play')),secondary:box(document.querySelector('#c2 .secondary')),iw:innerWidth,ih:innerHeight,overflow:document.documentElement.scrollWidth-innerWidth};
            });
            const eps=1.5;
            assert(Math.abs(outer.wrap.left)<=eps && Math.abs(outer.wrap.right-c.width)<=eps,`${c.name}: wrapper not full width`);
            assert(Math.abs(outer.frame.left)<=eps && Math.abs(outer.frame.right-c.width)<=eps,`${c.name}: iframe not full width`);
            assert(Math.abs(outer.wrap.height-c.height)<=eps && Math.abs(outer.frame.height-c.height)<=eps,`${c.name}: home not full height`);
            assert(Math.abs(inner.phone.width-c.width)<=eps && Math.abs(inner.phone.height-c.height)<=eps,`${c.name}: embedded phone does not match viewport`);
            assert(inner.cloudA.left<0,`${c.name}: left edge cloud no longer reaches screen edge`);
            assert(inner.cloudB.right>c.width,`${c.name}: right edge cloud no longer reaches screen edge`);
            assert(Math.abs(outer.overflow)<=eps && Math.abs(inner.overflow)<=eps,`${c.name}: horizontal overflow`);
            assert(inner.title.left>=-eps && inner.title.right<=c.width+eps,`${c.name}: title clipped`);
            assert(inner.tagline.left>=-eps && inner.tagline.right<=c.width+eps,`${c.name}: tagline clipped`);
            assert(inner.play.left>=0 && inner.play.right<=c.width && inner.play.bottom<=c.height,`${c.name}: Play clipped`);
            assert(inner.secondary.left>=0 && inner.secondary.right<=c.width && inner.secondary.bottom<=c.height,`${c.name}: secondary controls clipped`);
            metrics[c.name]={outer,inner};
            await page.screenshot({path:`full-bleed-home-audit/${c.name}.png`,fullPage:false});
            await page.close();
          }
          const cin=await browser.newPage({viewport:{width:390,height:700}});
          await cin.goto('http://127.0.0.1:4173/title-island-concepts/?c=2&embed=1&cinematic=1',{waitUntil:'networkidle'});
          await cin.waitForTimeout(800);
          const cinematic=await cin.evaluate(()=>{
            const r=document.querySelector('#c2 .scene').getBoundingClientRect();
            return {left:r.left,top:r.top,width:r.width,height:r.height,viewport:{width:innerWidth,height:innerHeight},titleDisplay:getComputedStyle(document.querySelector('#c2 .toy-brand')).display};
          });
          assert(cinematic.titleDisplay==='none','cinematic title unexpectedly visible');
          assert(Math.abs(cinematic.width-350)<2 && Math.abs(cinematic.height-350)<2,'cinematic scene geometry changed');
          metrics.cinematic=cinematic;
          await cin.screenshot({path:'full-bleed-home-audit/cinematic-scene-only.png',fullPage:false});
          fs.writeFileSync('full-bleed-home-audit/metrics.json',JSON.stringify(metrics,null,2));
          await browser.close();
          JS
          node audit.mjs
      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-ui.css title-island-concepts/index.html
          git commit -m "Make Little Home sky full bleed"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: full-bleed-home-sky-render
          path: full-bleed-home-audit
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm -f .github/workflows/implement-full-bleed-home-sky.yml
          git add .github/workflows/implement-full-bleed-home-sky.yml
          git commit -m "Remove full-bleed sky implementation workflow"
          git push
