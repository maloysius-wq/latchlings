name: Prepare Astra audit R1-R5 candidate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build targeted R1-R5 files
        run: python .github/tmp/prepare-audit-r1-r5.py
      - name: Create remote Git blobs without moving main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,base64,urllib.request
          root=Path('/tmp/r1r5-prepared')
          manifest=json.loads((root/'manifest.json').read_text())
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          out={}
          for path in manifest:
              data=(root/path).read_bytes()
              body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs',data=body,method='POST',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r: payload=json.load(r)
              out[path]={'blob_sha':payload['sha'],**manifest[path]}
          (root/'blob-shas.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Upload prepared candidate
        uses: actions/upload-artifact@v4
        with:
          name: audit-r1-r5-prepared
          path: /tmp/r1r5-prepared
          if-no-files-found: error
