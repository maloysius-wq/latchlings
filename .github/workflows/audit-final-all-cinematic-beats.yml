name: Final All-Beat Cinematic Visual Audit
on:
  push:
    paths:
      - '.github/workflows/audit-final-all-cinematic-beats.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static final visual assertions
        run: |
          set -euo pipefail
          node --check cinematics400.js
          grep -q 'style400-cinematics-polish.css' index.html
          grep -q 'style400-cinematics-refine.css' index.html
          grep -q 'html.cinematic-mode,body.cinematic-mode' title-island-concepts/index.html
          grep -q "document.documentElement.classList.add('cinematic-mode')" title-island-concepts/index.html
          grep -q 'grid-template-columns:repeat(8' style400-cinematics-refine.css
          grep -q 'AUTO ROUTER' style400-cinematics-refine.css
          grep -q 'type-lodestone' style400-cinematics-refine.css
      - name: Install Chromium
        run: |
          TEST_NODE="$RUNNER_TEMP/latchlings-final-all-beats"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Validate and render every final beat
        run: |
          TEST_NODE="$RUNNER_TEMP/latchlings-final-all-beats"
          cat > "$TEST_NODE/audit.mjs" <<'MJS'
          import {chromium} from 'playwright';import fs from 'node:fs';
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          const out=process.env.GITHUB_WORKSPACE+'/final-all-beats';fs.mkdirSync(out,{recursive:true});
          const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({viewport:{width:390,height:844}});const page=await ctx.newPage();const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});page.on('requestfailed',r=>errors.push('request:'+r.url()+':'+(r.failure()?.errorText||'')));
          await page.goto('http://127.0.0.1:8163/',{waitUntil:'domcontentloaded'});await page.waitForFunction(()=>window.LatchlingsCinematics);
          const ids=['opening','across-drift','old-maps','homeward'],manifest=[];
          async function inspectHome(){const frame=page.frames().find(f=>f.url().includes('cinematic=1'));if(!frame)return null;await frame.waitForSelector('#c2 .island-model');await frame.waitForTimeout(200);return await frame.evaluate(()=>{const html=getComputedStyle(document.documentElement),body=getComputedStyle(document.body),model=document.querySelector('#c2 .island-model').getBoundingClientRect();return{htmlMode:document.documentElement.classList.contains('cinematic-mode'),bodyMode:document.body.classList.contains('cinematic-mode'),htmlBg:html.backgroundColor,bodyBg:body.backgroundColor,residents:document.querySelectorAll('#c2 .resident').length,cottage:!!document.querySelector('#c2 .cottage'),tree:!!document.querySelector('#c2 .little-home-tree'),model:{x:model.x,y:model.y,w:model.width,h:model.height},materials:[...document.querySelectorAll('#c2 .island-side,#c2 .island-rim,#c2 .island-top,#c2 .house-front,#c2 .trunk')].map(e=>getComputedStyle(e).backgroundImage).join(' ')}})}
          for(const id of ids){const count=await page.evaluate(id=>LatchlingsCinematics.CINEMATICS[id].beats.length,id);await page.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id);await page.waitForSelector(`#cinematicOverlay.show[data-cinematic="${id}"]`);
            for(let i=0;i<count;i++){if(i){await page.click('#cinematicNext');await page.waitForTimeout(110)}await page.waitForTimeout(280);const home=await inspectHome();if(home){ok(home.htmlMode&&home.bodyMode,'cinematic document mode missing '+id+' '+i);ok(home.htmlBg==='rgba(0, 0, 0, 0)'&&home.bodyBg==='rgba(0, 0, 0, 0)','cinematic iframe not transparent '+JSON.stringify(home));ok(home.residents===5&&home.cottage&&home.tree,'Little Home structure incomplete '+JSON.stringify(home));ok(home.materials.includes('earth.jpg')&&home.materials.includes('grass.jpg')&&home.materials.includes('wood.jpg'),'Little Home material parity missing')}
              const meta=await page.evaluate(()=>{const st=document.getElementById('cinematicStage').getBoundingClientRect(),vis=document.getElementById('cinematicOverlay').dataset.visual;return{id:LatchlingsCinematics.active,beat:LatchlingsCinematics.beat,title:document.getElementById('cinematicBeat').textContent,visual:vis,overflow:document.documentElement.scrollWidth>innerWidth+1,homeFrames:document.querySelectorAll('iframe.cin-home-reference').length,islands:document.querySelectorAll('.cin-island').length,networkNodes:document.querySelectorAll('.cin-network .node').length,keepsakes:document.querySelectorAll('.cin-keepsake-token').length,stage:{x:st.x,y:st.y,w:st.width,h:st.height}}});ok(!meta.overflow,'overflow '+id+' '+i);if(meta.visual==='homeward-network'){ok(meta.homeFrames===1&&meta.networkNodes===8,'Homeward composite missing layers '+JSON.stringify(meta))}if(meta.visual==='keepsakes')ok(meta.keepsakes===7,'keepsake count wrong');const name=`${id}-${String(i+1).padStart(2,'0')}-${meta.visual}.png`;await page.screenshot({path:out+'/'+name,fullPage:true});manifest.push({...meta,home,file:name});}
            await page.keyboard.press('Escape');await page.waitForFunction(()=>!document.getElementById('cinematicOverlay').classList.contains('show'))}
          ok(manifest.length===24,'Expected 24 final renders, got '+manifest.length);
          await page.goto('http://127.0.0.1:8163/title-island-concepts/?c=2&embed=1',{waitUntil:'domcontentloaded'});await page.waitForSelector('#c2 .island-model');await page.waitForTimeout(350);const normal=await page.evaluate(()=>({htmlMode:document.documentElement.classList.contains('cinematic-mode'),bodyMode:document.body.classList.contains('cinematic-mode'),logo:!!document.querySelector('#c2 .toy-brand'),play:!!document.querySelector('#c2 .play'),residents:document.querySelectorAll('#c2 .resident').length}));ok(!normal.htmlMode&&!normal.bodyMode&&normal.logo&&normal.play&&normal.residents===5,'normal title regression '+JSON.stringify(normal));await page.screenshot({path:out+'/REFERENCE-normal-title.png',fullPage:true});
          fs.writeFileSync(out+'/manifest.json',JSON.stringify({beats:manifest,normalTitle:normal,errors},null,2));ok(errors.length===0,'browser errors '+errors.join(' | '));await browser.close();console.log('FINAL_ALL_24_VISUALS_OK');
          MJS
          python3 -m http.server 8163 >/tmp/latchlings-final-all-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cd "$TEST_NODE"
          node audit.mjs
      - name: Wide and reduced-motion final checks
        run: |
          TEST_NODE="$RUNNER_TEMP/latchlings-final-all-beats"
          cat > "$TEST_NODE/extra.mjs" <<'MJS'
          import {chromium} from 'playwright';const ok=(c,m)=>{if(!c)throw new Error(m)};const browser=await chromium.launch({headless:true});for(const cfg of [{viewport:{width:900,height:844},reducedMotion:'no-preference'},{viewport:{width:390,height:844},reducedMotion:'reduce'}]){const ctx=await browser.newContext(cfg);const p=await ctx.newPage();await p.goto('http://127.0.0.1:8163/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.LatchlingsCinematics);await p.evaluate(()=>LatchlingsCinematics.show('homeward',{markSeen:false}));await p.waitForSelector('#cinematicOverlay.show');for(let i=0;i<5;i++){await p.click('#cinematicNext');await p.waitForTimeout(80)}const shell=await p.locator('.cinematic-shell').boundingBox();ok(shell&&shell.width<=522,'wide shell bad');if(cfg.reducedMotion==='reduce'){const wire=await p.evaluate(()=>getComputedStyle(document.querySelector('.cin-network .wire')).animationName);ok(wire==='none','network still animating in reduced motion: '+wire)}await ctx.close()}await browser.close();console.log('FINAL_EXTRA_OK');
          MJS
          python3 -m http.server 8163 >/tmp/latchlings-final-extra-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cd "$TEST_NODE"
          node extra.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-all-24-cinematic-beats
          path: final-all-beats/*
          if-no-files-found: error
      - name: Self-remove final audit workflow
        run: |
          rm -rf final-all-beats
          rm -f .github/workflows/audit-final-all-cinematic-beats.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete final all-beat cinematic visual audit'
          git pull --rebase origin main
          git push origin HEAD:main
