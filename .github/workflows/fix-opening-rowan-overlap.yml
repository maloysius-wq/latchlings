name: Close Out Opening Rowan Overlap

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Mark handoff complete and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('DEVELOPMENT_HANDOFF.md')
          text = p.read_text()
          old = '**Status: IN PROGRESS / FIXING COMMITTED-MAIN 360×800 ROWAN OVERLAP**'
          new = '**Status: COMPLETED / COMMITTED-MAIN REGRESSION FIXED AND VERIFIED**'
          evidence = (
              "\n\nCloseout (2026-09-15): PR #3 was squash-merged to `main` as "
              "`8ce8556f31c2099e448e522b9e3ca7cd2501b1c9`. The root cause was a stale filled Web Animation: "
              "after the basket travel step, `place()` updated inline route coordinates without cancelling the still-active "
              "`fill: 'forwards'` animation, so rapid story advancement could leave the basket frozen mid-route over Rowan at "
              "360×800. `place()` now cancels active element animations before applying the resolved route point. Candidate GitHub "
              "Actions run `35026680458` passed the targeted phone visual regression and the complete shipped `npm test`; latest "
              "branch-head run `35026926425` also passed both gates. Most importantly, committed-main GitHub Actions run "
              "`35027136387` passed `tests/phone-visual-regressions.browser.cjs` and the full four-suite `npm test` on exact merge "
              "SHA `8ce8556f31c2099e448e522b9e3ca7cd2501b1c9`. Repository access guard run `35027136530` also passed. "
              "The temporary repair workflow was removed during closeout; only handoff/workflow housekeeping changed after the "
              "verified product merge.\n"
          )
          if new in text:
              if 'Closeout (2026-09-15): PR #3' not in text:
                  text = text.replace(new, new + evidence, 1)
          elif old in text:
              text = text.replace(old, new + evidence, 1)
          else:
              raise SystemExit('Expected in-progress status marker not found')
          p.write_text(text)
          Path('.github/workflows/fix-opening-rowan-overlap.yml').unlink()
      - name: Commit closeout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git add -u .github/workflows/fix-opening-rowan-overlap.yml
          git commit -m '[opening-rowan-action] Complete verified overlap repair'
          git push origin HEAD:main
