name: Record Level 269 Repair

on:
  push:
    paths:
      - '.github/workflows/record-level269-repair.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add repair note and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          marker='## Current Work\n\n'
          entry='''### 2026-09-02 — Repair Level 269 campaign integrity defect\n\n**Status: IN PROGRESS**\n\n**Why this was discovered:** Full-campaign validation performed while repairing the missing Chapter 3 file found exactly one pre-existing campaign integrity defect outside Chapter 3. Level 269 has a rail on cell `6,1`, which is also a nest. The shipping simulator blocks that nest entry because the rail direction check runs before nest capture, so the stored solution is invalid.\n\n**Implementation plan:** Remove or relocate the conflicting rail with the smallest possible Level 269-only data change, then replay the stored solution and independently solve the repaired board. Do not alter unrelated Chapter 6 boards.\n\n**Validation plan:** Require zero nest/object overlaps across all 400 levels, require every stored solution to replay to completion, and verify Level 269 shortest-path optimality against its stored `optimal` value.\n\n---\n\n'''
          if '### 2026-09-02 — Repair Level 269 campaign integrity defect' not in t:
              t=t.replace(marker,marker+entry,1)
          p.write_text(t)
          PY
          rm -f .github/workflows/record-level269-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/record-level269-repair.yml
          git commit -m 'Document Level 269 campaign defect'
          for attempt in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((attempt*2)); done
          exit 1
