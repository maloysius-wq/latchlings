name: Astra Presentation Accessibility Rerun 6

on:
  push:
    branches: [astra-presentation-accessibility-candidate]
    paths:
      - '.github/workflows/astra-presentation-accessibility-rerun6.yml'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-presentation-accessibility-candidate
          fetch-depth: 0
      - name: Apply corrected candidate
        shell: bash
        run: |
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js > /tmp/campaign-before.sha256
          sha256sum cinematic-dialogue400.js style400-cinematics-dialogue.css style400-cinematics-geometry.css cinematic-geometry400.js gameplay-story-rail400.js story-grounding400.js story-theme400.js style400-story-rail-board.css style400-atlas-progression.css pass3-chapter5-prism.js pass3-chapter5-prism.css pass3-chapter6-copperline.js pass3-chapter6-copperline.css pass3-chapter7-stormswitch.js pass3-chapter7-stormswitch.css pass3-chapter8-aurora.js pass3-chapter8-aurora.css > /tmp/protected-before.sha256
          python .github/tmp/astra_pa_patch.py
          python .github/tmp/astra_pa_memories_followup.py
          sha256sum -c /tmp/campaign-before.sha256
          sha256sum -c /tmp/protected-before.sha256
          node --check story400.js
          node --check cinematics400.js
          node --check game400-b.js
          python - <<'PY'
          from pathlib import Path
          import re,subprocess
          h=Path('title-island-concepts/index.html').read_text()
          for n,script in enumerate(re.findall(r'<script>(.*?)</script>',h,re.S)):
              q=Path(f'/tmp/title-pa6-{n}.js');q.write_text(script);subprocess.run(['node','--check',str(q)],check=True)
          idx=Path('index.html').read_text()
          assert 'memories-home' in h
          assert 'homeMemoriesModal' in Path('game400-b.js').read_text()
          assert all(x not in idx for x in ['style400-cinematics-polish.css','style400-cinematics-refine.css','style400-cinematics-refine2.css'])
          PY
          git diff --check
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run synchronized browser matrix
        shell: bash
        run: |
          mkdir -p /tmp/astra-pa-evidence
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/astra-pa-http.log 2>&1 &
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/astra-presentation-accessibility-candidate.yml').read_text()
          marker="cat > .astra-pa-green.mjs <<'JS'\n"
          body=s.split(marker,1)[1].split('\n          JS\n',1)[0]
          lines=[line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          text='\n'.join(lines)+'\n'
          old="""const memoryEffective=await homeFrame.evaluate(()=>[...document.querySelectorAll('.story-keepsake[role=\"button\"]')].filter(x=>getComputedStyle(x).display!=='none').map(x=>{const r=x.getBoundingClientRect();return {key:x.dataset.memory,w:r.width+16,h:r.height+16}}));if(memoryEffective.some(x=>x.w<44||x.h<44))fail(size.name,'keepsake effective target',memoryEffective);"""
          new="""const memoryTool=await homeFrame.$eval('.memories-home',el=>el.getBoundingClientRect().toJSON());if(memoryTool.width<44||memoryTool.height<44)fail(size.name,'Memories tool target',memoryTool);await homeFrame.click('.memories-home');await page.waitForTimeout(30);const memoryChoices=await visibleTargets(page,'#modal .home-memory-choice');if(memoryChoices.length!==7)fail(size.name,'earned memory list',{count:memoryChoices.length});const memoryBad=memoryChoices.filter(x=>x.w<43.5||x.h<43.5);if(memoryBad.length)fail(size.name,'memory list targets',memoryBad);const memoryClose=await visibleTargets(page,'#homeMemoriesClose');if(memoryClose.length!==1||memoryClose[0].w<43.5||memoryClose[0].h<43.5)fail(size.name,'memory close target',memoryClose);await page.click('#homeMemoriesClose');await page.waitForTimeout(20);"""
          assert old in text
          text=text.replace(old,new,1)
          oldloop="""for(const id of ids){await cp.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id);await cp.waitForTimeout(20);while(await cp.evaluate(()=>!!LatchlingsCinematics.active)){const state=await cp.evaluate(()=>{const next=document.getElementById('cinematicNext'),skip=document.getElementById('cinematicSkip'),line=document.querySelectorAll('#cinematicLines .is-current'),shell=document.querySelector('.cinematic-shell')?.getBoundingClientRect(),nr=next?.getBoundingClientRect(),sr=skip?.getBoundingClientRect();return {lines:line.length,shell:shell?.toJSON(),next:nr?.toJSON(),skip:sr?.toJSON(),sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}});if(state.lines!==1||!state.next||state.next.width<44||state.next.height<44||!state.skip||state.skip.width<44||state.skip.height<44||state.sw>state.cw+1||state.shell.bottom>568.5)fail('cinematic-'+id,'utterance layout',state);turns++;await cp.evaluate(()=>LatchlingsCinematics.next());await cp.waitForTimeout(8)}}"""
          newloop="""for(const id of ids){await cp.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id);while(await cp.evaluate(()=>!!LatchlingsCinematics.active)){await cp.waitForFunction(()=>{const canonical=LatchlingsCinematics.CINEMATICS[LatchlingsCinematics.active]?.beats?.[LatchlingsCinematics.beat]?.lines?.[LatchlingsCinematics.line];if(!canonical)return false;const narrators=[...document.querySelectorAll('#cinematicLines > p.narrator-only')],rows=[...document.querySelectorAll('.cin-opening-dialogue-dock .cin-opening-dialogue-row')],visible=[...narrators,...rows].map(x=>x.textContent?.replace(/\\s+/g,' ').trim()||'');const expectedNarrator=canonical[0]==='Narrator';return narrators.length+rows.length===1&&visible[0]?.includes(canonical[1])&&(expectedNarrator?narrators.length===1:rows.length===1)},null,{timeout:1500});const state=await cp.evaluate(()=>{const next=document.getElementById('cinematicNext'),skip=document.getElementById('cinematicSkip'),narrators=[...document.querySelectorAll('#cinematicLines > p.narrator-only')],rows=[...document.querySelectorAll('.cin-opening-dialogue-dock .cin-opening-dialogue-row')],shell=document.querySelector('.cinematic-shell')?.getBoundingClientRect(),nr=next?.getBoundingClientRect(),sr=skip?.getBoundingClientRect(),canonical=LatchlingsCinematics.CINEMATICS[LatchlingsCinematics.active]?.beats?.[LatchlingsCinematics.beat]?.lines?.[LatchlingsCinematics.line],linesHidden=document.getElementById('cinematicLines')?.hidden;const visible=[...narrators,...rows].map(x=>x.textContent?.replace(/\\s+/g,' ').trim()||'');return {narrators:narrators.length,rows:rows.length,visible,canonical,linesHidden,shell:shell?.toJSON(),next:nr?.toJSON(),skip:sr?.toJSON(),sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}});const expectedNarrator=state.canonical?.[0]==='Narrator';if(state.narrators+state.rows!==1||!state.canonical||!state.visible[0].includes(state.canonical[1])||(expectedNarrator&&(state.narrators!==1||state.linesHidden))||(!expectedNarrator&&(state.rows!==1||!state.linesHidden))||!state.next||state.next.width<44||state.next.height<44||!state.skip||state.skip.width<44||state.skip.height<44||state.sw>state.cw+1||state.shell.bottom>568.5)fail('cinematic-'+id,'utterance layout',state);turns++;await cp.evaluate(()=>LatchlingsCinematics.next())}}"""
          assert oldloop in text
          text=text.replace(oldloop,newloop,1)
          Path('.astra-pa-green.mjs').write_text(text)
          PY
          node .astra-pa-green.mjs
      - name: Commit accepted candidate product
        shell: bash
        run: |
          git config user.name "maloysius-wq"
          git config user.email "maloysius@gmail.com"
          git add story400.js cinematics400.js style400-cinematics.css index.html game400-b.js style400-ui.css style400-game.css title-island-concepts/index.html
          git add -u style400-cinematics-polish.css style400-cinematics-refine.css style400-cinematics-refine2.css
          git diff --cached --check
          git commit -m "Stage presentation accessibility consolidation [skip ci]"
          git push origin HEAD:astra-presentation-accessibility-candidate
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: astra-presentation-accessibility-evidence
          path: /tmp/astra-pa-evidence
          if-no-files-found: error
