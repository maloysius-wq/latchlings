name: Validate Chapter 5 Pass 3 live build

on:
  push:
    paths:
      - '.github/workflows/validate-chapter5-pass3.yml'
      - '.github/tmp/validate-chapter5-live.mjs'
      - 'pass3-chapter5-prism.css'
      - 'pass3-chapter5-prism.js'
      - 'index.html'
      - 'LEVEL_SELECT_ART_DIRECTION.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected Chapter 1-4 and authored source stayed unchanged
        run: |
          protected=(
            campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js
            campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
            game400-a.js game400-b.js
            style400-production-slice.css style400-skyway-atlas.css title-island-concepts/index.html
            story400.js story-grounding400.js STORY_BIBLE.md
            cinematics400.js cinematic-dialogue400.js gameplay-story-rail400.js story-theme400.js
            music400.js sfx400.js style400-game.css style400-board-surfaces.css
          )
          git diff --exit-code 6573e9ecc84de26e17f801534b42ee7131ff7da0 HEAD -- "${protected[@]}"
          sha256sum "${protected[@]}" pass3-chapter5-prism.css pass3-chapter5-prism.js index.html LEVEL_SELECT_ART_DIRECTION.md > /tmp/ch5-live-before.sha256
          echo "Protected source matches the clean Chapter 4 checkpoint."

      - name: Static live wiring checks
        run: |
          node --check pass3-chapter5-prism.js
          test "$(grep -Fc 'pass3-chapter5-prism.css?v=20260913-ch5modular-1' index.html)" -eq 1
          test "$(grep -Fc 'pass3-chapter5-prism.js?v=20260913-ch5modular-1' index.html)" -eq 1
          grep -F 'glasshouse lookout / sighting arch' LEVEL_SELECT_ART_DIRECTION.md
          grep -F "VISUAL_CHAPTER_MODES[5]='prism'" pass3-chapter5-prism.js
          grep -F 'chapter-five-reward' pass3-chapter5-prism.js
          grep -F 'theme-ch5 .atlas-map.atlas-range-3 .atlas-scene em' pass3-chapter5-prism.css
          echo "Chapter 5 committed wiring is present exactly once."

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance against committed live build
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-ch5-live-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 420s node .github/tmp/validate-chapter5-live.mjs
          sha256sum -c /tmp/ch5-live-before.sha256

      - name: Package live acceptance evidence
        if: always()
        run: |
          mkdir -p /tmp/chapter5-live-validation
          git rev-parse HEAD > /tmp/chapter5-live-validation/validated-head.txt
          cp /tmp/ch5-live-before.sha256 /tmp/chapter5-live-validation/source-hashes.sha256 || true
          cp /tmp/latchlings-ch5-live-server.log /tmp/chapter5-live-validation/server.log || true

      - name: Upload Chapter 5 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter5-pass3-live-acceptance
          path: /tmp/chapter5-live-validation
          if-no-files-found: error
