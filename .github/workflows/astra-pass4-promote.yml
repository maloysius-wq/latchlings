name: Astra Pass 4 promote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-pass4-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Require expected source head
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "eb88684040f99cf4a7ec0b423d9b0f54f4210ead"
          test "$(git log -1 --pretty=%s)" = "Stage accepted Astra Pass 4 promotion"

      - name: Snapshot protected sources
        shell: bash
        run: |
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js > /tmp/campaign-before.sha256
          sha256sum gameplay-story-rail400.js style400-story-rail-board.css style400-story-theme.css game400-b.js title-island-concepts/index.html > /tmp/r1r5-before.sha256

      - name: Import exact accepted candidate product
        shell: bash
        run: |
          git fetch origin astra-pass4-candidate
          git checkout b8f6addf83611b3f8daf71311372e10de3ed90b6 -- cinematics400.js cinematic-dialogue400.js style400-cinematics.css style400-ui.css index.html
          git diff --exit-code b8f6addf83611b3f8daf71311372e10de3ed90b6 -- cinematics400.js cinematic-dialogue400.js style400-cinematics.css style400-ui.css index.html

      - name: Verify protection and product invariants
        shell: bash
        run: |
          sha256sum -c /tmp/campaign-before.sha256
          sha256sum -c /tmp/r1r5-before.sha256
          node --check cinematics400.js
          node --check cinematic-dialogue400.js
          python - <<'PY'
          from pathlib import Path
          cin=Path('cinematics400.js').read_text()
          dlg=Path('cinematic-dialogue400.js').read_text()
          idx=Path('index.html').read_text()
          assert cin.count("label:'") == 25
          assert 'function renderTurn()' in cin and 'activeLine' in cin
          assert 'lineIndex=Math.max(0,Number(API.line)||0)' in dlg
          assert 'ending-home-frame' in idx and 'ending-resolution' not in idx
          assert idx.index('id="completeHome"') < idx.index('id="completeLevels"')
          assert idx.count('cinematic-dialogue400.js?v=20260914-astra-pass4-candidate1') == 1
          print('Accepted Pass 4 product matches candidate invariants.')
          PY

      - name: Commit exact accepted product to main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cinematics400.js cinematic-dialogue400.js style400-cinematics.css style400-ui.css index.html
          git commit -m "Promote accepted Astra Pass 4 cinematics and ending"
          git push origin HEAD:main
