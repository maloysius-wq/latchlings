name: Astra Little Home coherence promote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-little-home-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Snapshot protected sources
        shell: bash
        run: |
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js > /tmp/campaign-before.sha256
          sha256sum cinematics400.js cinematic-dialogue400.js style400-cinematics.css gameplay-story-rail400.js style400-story-rail-board.css style400-story-theme.css > /tmp/accepted-before.sha256

      - name: Import exact accepted candidate product
        shell: bash
        run: |
          git fetch origin astra-little-home-candidate
          git checkout 119ece1000cdab69c902ec75d2b0d89881372bd1 -- game400-a.js game400-b.js title-island-concepts/index.html index.html
          git diff --exit-code 119ece1000cdab69c902ec75d2b0d89881372bd1 -- game400-a.js game400-b.js title-island-concepts/index.html index.html

      - name: Verify protected sources and Little Home invariants
        shell: bash
        run: |
          sha256sum -c /tmp/campaign-before.sha256
          sha256sum -c /tmp/accepted-before.sha256
          node --check game400-a.js
          node --check game400-b.js
          python - <<'PY'
          from pathlib import Path
          a=Path('game400-a.js').read_text()
          b=Path('game400-b.js').read_text()
          h=Path('title-island-concepts/index.html').read_text()
          i=Path('index.html').read_text()
          assert 'primaryLabel' in a and 'primaryMeta' in a
          assert 'HOME_KEEPSAKE_MEMORIES' in b and "startsWith('memory:')" in b
          assert h.count('aria-label="Memory:') == 7
          assert 'completedWorkCycles' in h and 'record:false' in h
          assert 'memory-unlocked' in h and 'home-primary-copy' in h
          assert "document.documentElement.dataset.motion==='reduced'" in h
          assert i.count('game400-a.js?v=20260914-home-coherence-candidate1') == 1
          assert i.count('game400-b.js?v=20260914-home-coherence-candidate1') == 1
          assert i.count('title-island-concepts/?c=2&amp;embed=1&amp;v=20260914-home-coherence-candidate1') == 1
          print('Accepted Little Home candidate invariants passed.')
          PY

      - name: Commit exact accepted product to main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game400-a.js game400-b.js title-island-concepts/index.html index.html
          git commit -m "Promote accepted Little Home coherence"
          git push origin HEAD:main
