name: Import Curated CC0 SFX

on:
  push:
    paths:
      - '.github/workflows/import-sfx.yml'

permissions:
  contents: write

jobs:
  import-sfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Fetch and prepare curated source recordings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/sfx /tmp/latchlings-sfx
          I='https://raw.githubusercontent.com/Calinou/kenney-interface-sounds/master/addons/kenney_interface_sounds'
          P='https://raw.githubusercontent.com/Boyquotes/kenney-impact-sounds-for-godot/main/addons/kenney%20impact%20sounds'
          F='https://gamesounds.xyz/Kenney%27s%20Sound%20Pack/Foley%20Sounds/Woosh'

          fetch() { curl --retry 3 --retry-delay 2 -fL "$1" -o "$2"; }

          fetch "$I/click_001.wav" /tmp/latchlings-sfx/ui-tap.wav
          fetch "$I/back_002.wav" /tmp/latchlings-sfx/ui-back.wav
          fetch "$I/open_002.wav" /tmp/latchlings-sfx/ui-open.wav
          fetch "$I/confirmation_001.wav" /tmp/latchlings-sfx/ui-confirm.wav
          fetch "$I/question_002.wav" /tmp/latchlings-sfx/hint.wav
          fetch "$I/select_004.wav" /tmp/latchlings-sfx/select-latchling.wav
          fetch "$I/tick_001.wav" /tmp/latchlings-sfx/cycle-latchling.wav
          fetch "$I/error_002.wav" /tmp/latchlings-sfx/invalid.wav
          fetch "$I/switch_003.wav" /tmp/latchlings-sfx/switch.wav
          fetch "$I/tick_004.wav" /tmp/latchlings-sfx/turn.wav
          fetch "$I/confirmation_003.wav" /tmp/latchlings-sfx/capture.wav
          fetch "$I/confirmation_004.wav" /tmp/latchlings-sfx/level-clear.wav
          fetch "$I/error_004.wav" /tmp/latchlings-sfx/level-lose.wav
          fetch "$I/bong_001.wav" /tmp/latchlings-sfx/campaign-complete.wav

          fetch "$P/impact_soft_medium_001.ogg" /tmp/latchlings-sfx/stop-soft.ogg
          fetch "$P/impact_mining_001.ogg" /tmp/latchlings-sfx/stop-rock.ogg
          fetch "$P/impact_metal_light_001.ogg" /tmp/latchlings-sfx/stop-anchor.ogg
          fetch "$P/impact_generic_light_001.ogg" /tmp/latchlings-sfx/stop-blocked.ogg

          fetch "$F/woosh2.ogg" /tmp/latchlings-sfx/move-short.ogg
          fetch "$F/woosh5.ogg" /tmp/latchlings-sfx/move-medium.ogg
          fetch "$F/woosh8.ogg" /tmp/latchlings-sfx/move-long.ogg

          for f in /tmp/latchlings-sfx/*; do
            name="$(basename "${f%.*}")"
            ffmpeg -y -loglevel error -i "$f" -ac 1 -ar 44100 -c:a pcm_s16le "assets/sfx/$name.wav"
            test -s "assets/sfx/$name.wav"
          done

          echo 'Prepared SFX:'
          for f in assets/sfx/*.wav; do
            dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")"
            printf '%-30s %8s sec %8s bytes\n' "$(basename "$f")" "$dur" "$(stat -c%s "$f")"
          done
          test "$(find assets/sfx -maxdepth 1 -name '*.wav' | wc -l)" -eq 21

      - name: Commit local SFX assets and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-sfx.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sfx .github/workflows/import-sfx.yml
          git commit -m 'Add curated CC0 SFX assets'
          git pull --rebase origin main
          git push origin HEAD:main
