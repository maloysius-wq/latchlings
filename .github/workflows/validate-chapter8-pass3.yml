name: Validate Chapter 8 Pass 3 candidate

on:
  push:
    branches: [main]
    paths:
      - 'pass3-chapter8-aurora.css'
      - 'pass3-chapter8-aurora.js'
      - '.github/tmp/validate-chapter8-pass3.mjs'
      - '.github/workflows/validate-chapter8-pass3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect authored and accepted Chapters 1-7 source
        shell: bash
        run: |
          set -euo pipefail
          BASE=7c800131795b75280a7f01c2649817ff7abd7d37
          protected=(
            campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js
            campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
            game400-a.js game400-b.js style400-game.css style400-board-surfaces.css
            style400-production-slice.css style400-skyway-atlas.css title-island-concepts/index.html
            story400.js story-grounding400.js STORY_BIBLE.md cinematics400.js cinematic-dialogue400.js
            gameplay-story-rail400.js story-theme400.js music400.js sfx400.js
            pass3-chapter5-prism.css pass3-chapter5-prism.js
            pass3-chapter6-copperline.css pass3-chapter6-copperline.js
            pass3-chapter7-stormswitch.css pass3-chapter7-stormswitch.js
            index.html LEVEL_SELECT_ART_DIRECTION.md
          )
          git diff --exit-code "$BASE" -- "${protected[@]}"

      - name: Static candidate checks
        shell: bash
        run: |
          set -euo pipefail
          node --check pass3-chapter8-aurora.js
          grep -q "VISUAL_CHAPTER_MODES\[8\]='aurora'" pass3-chapter8-aurora.js
          grep -q 'currentLevel===400' pass3-chapter8-aurora.js
          grep -q 'story-focus-living-skyway' pass3-chapter8-aurora.js
          grep -q 'chapter-eight-reward' pass3-chapter8-aurora.js
          grep -q 'atlas-map.atlas-range-1' pass3-chapter8-aurora.css
          grep -q 'aurora-reward-postcard' pass3-chapter8-aurora.css
          grep -q "No master switch" index.html
          grep -q "No final map" index.html
          test "$(grep -c 'pass3-chapter8-aurora.css' index.html || true)" -eq 0
          test "$(grep -c 'pass3-chapter8-aurora.js' index.html || true)" -eq 0

      - name: Prepare candidate-only live page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='<link rel="stylesheet" href="pass3-chapter7-stormswitch.css?v=20260913-ch7pass3-1">'
          js='<script src="pass3-chapter7-stormswitch.js?v=20260913-ch7pass3-1"></script>'
          assert css in s and js in s
          assert 'pass3-chapter8-aurora.css' not in s
          assert 'pass3-chapter8-aurora.js' not in s
          s=s.replace(css,css+'\n<link rel="stylesheet" href="pass3-chapter8-aurora.css?v=20260913-ch8candidate-1">',1)
          s=s.replace(js,js+'\n<script src="pass3-chapter8-aurora.js?v=20260913-ch8candidate-1"></script>',1)
          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium validation runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser candidate acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/chapter8-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
          node .github/tmp/validate-chapter8-pass3.mjs

      - name: Package candidate evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/chapter8-pass3
          cp pass3-chapter8-aurora.css /tmp/chapter8-pass3/
          cp pass3-chapter8-aurora.js /tmp/chapter8-pass3/
          git diff -- index.html > /tmp/chapter8-pass3/candidate-index.diff || true
          git status --short > /tmp/chapter8-pass3/status.txt

      - name: Upload Chapter 8 candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter8-pass3-candidate
          path: /tmp/chapter8-pass3
          if-no-files-found: error
