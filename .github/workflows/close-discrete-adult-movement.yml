name: Close discrete adult movement handoff
on:
  push:
    paths:
      - '.github/workflows/close-discrete-adult-movement.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-11 — Make Little Home adult movement discrete with 4–10 second gaps'
          start=s.index(heading)
          next_heading=s.find('\n### ',start+len(heading))
          if next_heading<0:
              next_heading=len(s)
          block=s[start:next_heading]
          block=block.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary='''\n#### Completion summary\n\n- **Result:** COMPLETED. Adult motion no longer consists of a long pause followed by a burst of six or seven rapid waypoints. Every scheduled adult event now advances exactly one waypoint, then the home remains quiet for a fresh randomized 4–10 seconds before any adult can move again.\n- **Architecture change:** The old `adult-outing` CSS animations and the `littleHomeGarden` / `littleHomeParcel` / `littleHomeTree` multi-keyframe bursts were removed. The original route points were preserved as JavaScript waypoint arrays, and a single global scheduler now advances one adult by one waypoint per turn. Turns rotate garden → parcel → tree, so only one adult can move at a time and each adult keeps progressing along its existing route over multiple separated events.\n- **Timing contract:** Each single movement lasts a short smooth **0.75–1.15 seconds**. After that movement fully completes, the scheduler draws a new quiet interval of **4.0–10.0 seconds** before starting the next adult movement. The first movement uses the same 4–10 second rule. There is no overlapping adult movement path.\n- **Carried props / other motion:** The previously fixed external carried props remain unclipped and move with their adult. Children and the play ball retain their existing independent choreography. Reduced-motion mode keeps all adults stationary.\n- **Cache freshness:** `index.html` now loads the production Little Home iframe with `v=20260911-discretesteps5`.\n- **Changed files / commits:** Accepted product commit `f9a2d295e0036e77bd3b654ccb18ba186b065321` (`Make home adult movement discrete`) changes only `title-island-concepts/index.html` and `index.html`. Temporary validator helpers self-removed in `38b856dd967c70383039ab5f0b2842cc1bf82a0a` (`Remove discrete adult movement validator`).\n- **Accepted validation:** GitHub Actions run `34616014622`, job `103318011063`, passed and printed `DISCRETE_ADULT_MOVEMENT_ACCEPTED`. The browser observed three real-time events covering all three adults. Every start reported exactly one moving adult and exactly one waypoint advance (`moveCount=1`, `routeIndex=1`).\n- **Observed real-time timings:** The three single-step movement durations were **841 ms**, **1119.4 ms**, and **831.1 ms**. The measured quiet finish-to-next-start gaps were **9280.3 ms** and **5485.3 ms**, both inside the requested 4–10 second interval. No overlap occurred.\n- **Reduced-motion / scope protection:** A reduced-motion browser remained at `moveCount=0` and `routeIndex=0` for all three adults after 10.5 seconds. Hash verification confirmed puzzle gameplay/style, SFX/music, UI/theme/Atlas/board CSS, story/cinematic sources, and all eight campaign files stayed byte-identical.\n- **Artifact:** `discrete-adult-movement-audit`, artifact ID `10270840463`, SHA-256 `d6c6c9d7cd295bec909f93f4d3b436fa458ba9f5b02eadd8037cd452dcc11017`, contains the timing report and a production home screenshot after the first three discrete moves.\n- **Deployment / hygiene:** GitHub Pages run `34616133136` successfully built and deployed clean accepted state `38b856dd967c70383039ab5f0b2842cc1bf82a0a`. Temporary validation helpers were already removed before this closeout helper was added; this closeout helper self-removes after recording the journal.\n- **Remaining risk / next action:** No known blocker remains. Real-device viewing is the final subjective pace check, but the acceptance test directly measures the requested no-burst, one-movement-at-a-time, 4–10-second-gap behavior.\n\n'''
          if '#### Completion summary' not in block:
              block=block.rstrip()+summary
          s=s[:start]+block+s[next_heading:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Complete discrete adult movement handoff'
          git push
      - name: Self-remove closeout helper
        shell: bash
        run: |
          git pull --ff-only origin main
          git rm -f .github/workflows/close-discrete-adult-movement.yml
          git commit -m 'Remove discrete adult movement closeout helper'
          git push
