name: Close Little Home Brass Buttons

on:
  push:
    paths:
      - '.github/workflows/close-little-home-brass-buttons.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete brass button handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          title='### 2026-09-02 — Apply Brass Toy Plates to Little Home controls'
          start=t.index(title)
          end=t.index('\n---\n', start)
          section=t[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' not in section:
              section += '''\n\n#### Completion summary\n\n**Implementation:** Restyled only selected Concept 2 / Little Home controls in `title-island-concepts/index.html`. The existing generic cream Play hero rectangle and two oversized white secondary cards now render as a coordinated Brass Toy Plates control cluster. Play uses a chamfered eight-corner metal plate silhouette, brushed horizontal brass grain, four inset rivets, engraved inner frame, darker lower mechanical lip, embossed text, and a pressed circular play-icon medallion. Daily Puzzle and Level Select use compact matching brass plates with their own slightly varied brass tones, four rivets each, engraved inset frames, compact typography, and pressed circular icon medallions. Hover/press states move the plates like physical controls instead of generic card hover effects. No control labels or markup/functionality changed.\n\n**Design decision:** The brass treatment is intentionally limited to Concept 2 so the user can judge it against the existing Little Home composition. It was adapted to the real title page rather than the discarded standalone mock: the island, floating debris, clouds, residents, cottage, tree, flowers, and current spacing remain the actual source-of-truth scene. Concepts 1 and 3 keep their previous control styling.\n\n**Files changed:** Permanent product implementation changed only `title-island-concepts/index.html`; this handoff was updated separately for project tracking. Temporary transformer/browser-validator/workflow files self-removed. Production `index.html`, campaign files, game runtime, textures, and other assets were untouched.\n\n**Validation:** GitHub Actions run `33686091263` passed static and Chromium validation. At 390×844, Play rendered at 318×60 px; the two secondary plates rendered at 154.5×78 px each. All three controls remained fully inside the phone, Play did not overlap the secondary plates, and the moving island remained more than 16px clear of the Play control. Browser checks confirmed chamfered clip paths, multi-layer radial/repeating-linear brass backgrounds, 2px plate borders, engraved pseudo-element frames, readable labels, pressed icon medallions, the existing 5 residents / 6 floating pebbles / 4 clouds, no console/page/request errors, and no horizontal overflow. Concepts 1 and 3 were separately sanity-checked and retained their original non-brass control styles. Screenshot artifact `9868170479` was downloaded and visually inspected; the resulting controls read as deliberate toy-console hardware rather than generic hero/cards.\n\n**Implementation commit:** `7b35e950c96052929aaa63594d92950b7794e7fe` (`Style Little Home controls as brass toy plates`).\n\n**Deployment:** GitHub Pages run `33686161062` completed successfully for exact implementation commit `7b35e950c96052929aaa63594d92950b7794e7fe`. Live preview remains `https://maloysius-wq.github.io/latchlings/title-island-concepts/?c=2`.\n\n**Remaining risk / next action:** This is a design-selection pass, not production integration. User should review the live brass controls in motion. The brass warmth, plate heights, secondary label wrapping, or rivet/engraving intensity can be tuned further if desired. Production title remains intentionally untouched pending explicit promotion.\n'''
          t=t[:start]+section+t[end:]
          p.write_text(t)
          PY
          rm -f .github/workflows/close-little-home-brass-buttons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-little-home-brass-buttons.yml
          git commit -m 'Complete Little Home brass button handoff'
          git pull --rebase origin main
          git push origin HEAD:main
