name: Validate Chapter 6 Pass 3 live build

on:
  push:
    branches: [main]
    paths:
      - 'pass3-chapter6-copperline.css'
      - 'pass3-chapter6-copperline.js'
      - 'index.html'
      - 'LEVEL_SELECT_ART_DIRECTION.md'
      - '.github/tmp/validate-chapter6-pass3.mjs'
      - '.github/workflows/validate-chapter6-pass3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect authored and accepted Chapters 1-5 source
        shell: bash
        run: |
          set -euo pipefail
          BASE=7fcbb3473d8c6b63018c840fdad62f3712c23aed
          CANDIDATE=ea955e6a53a744ab5ac5a2e09939e0354358f49a
          protected=(
            campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js
            campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
            game400-a.js game400-b.js style400-game.css style400-board-surfaces.css
            style400-production-slice.css style400-skyway-atlas.css title-island-concepts/index.html
            story400.js story-grounding400.js STORY_BIBLE.md cinematics400.js cinematic-dialogue400.js
            gameplay-story-rail400.js story-theme400.js music400.js sfx400.js
            pass3-chapter5-prism.css pass3-chapter5-prism.js
          )
          git diff --exit-code "$BASE" -- "${protected[@]}"
          git diff --exit-code "$CANDIDATE" -- pass3-chapter6-copperline.css pass3-chapter6-copperline.js

      - name: Static live wiring checks
        shell: bash
        run: |
          set -euo pipefail
          node --check pass3-chapter6-copperline.js
          grep -q "VISUAL_CHAPTER_MODES\[6\]='copperline'" pass3-chapter6-copperline.js
          grep -q 'currentLevel===300' pass3-chapter6-copperline.js
          grep -q 'old-maps' cinematics400.js
          grep -q 'story-stage-6' title-island-concepts/index.html
          grep -q 'atlas-map.atlas-range-3' pass3-chapter6-copperline.css
          grep -q 'copperline-reward-postcard' pass3-chapter6-copperline.css
          test "$(grep -c 'pass3-chapter6-copperline.css?v=20260913-ch6pass3-1' index.html)" -eq 1
          test "$(grep -c 'pass3-chapter6-copperline.js?v=20260913-ch6pass3-1' index.html)" -eq 1
          grep -q '<div class="story-cast" id="storyCast"></div>' index.html
          ! grep -q 'id="story-cast" id="storyCast"' index.html
          grep -q 'compact station archive / timetable kiosk' LEVEL_SELECT_ART_DIRECTION.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium validation runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance against committed live build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/chapter6-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
          node .github/tmp/validate-chapter6-pass3.mjs

      - name: Package live acceptance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/chapter6-pass3
          cp pass3-chapter6-copperline.css /tmp/chapter6-pass3/
          cp pass3-chapter6-copperline.js /tmp/chapter6-pass3/
          git status --short > /tmp/chapter6-pass3/status.txt

      - name: Upload Chapter 6 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter6-pass3-live-acceptance
          path: /tmp/chapter6-pass3
          if-no-files-found: error
