name: Refine Level Story Props

on:
  push:
    paths:
      - '.github/workflows/refine-level-story-props.yml'
      - '.github/scripts/refine_level_story_props.py'
      - '.github/scripts/validate_level_story_props.mjs'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prop medallion refinement
        run: python3 .github/scripts/refine_level_story_props.py
      - name: Static check
        run: |
          grep -q 'Visible story-prop medallion refinement' style400-story-theme.css
          node --check story-theme400.js
          git diff --exit-code -- campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
      - name: Install Chromium outside repository
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/prop-node"
          mkdir -p "$TEST_NODE" && cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Validate and render all chapters
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/prop-node"
          mkdir -p prop-refinement-renders
          python3 -m http.server 8139 >/tmp/prop-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cp .github/scripts/validate_level_story_props.mjs "$TEST_NODE/validate_level_story_props.mjs"
          timeout 100s node "$TEST_NODE/validate_level_story_props.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: story-prop-refinement-renders
          path: prop-refinement-renders/*.png
          if-no-files-found: error
      - name: Commit validated refinement and self-remove
        run: |
          set -euo pipefail
          rm -rf prop-refinement-renders
          rm -f .github/workflows/refine-level-story-props.yml .github/scripts/refine_level_story_props.py .github/scripts/validate_level_story_props.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style400-story-theme.css .github/workflows/refine-level-story-props.yml .github/scripts/refine_level_story_props.py .github/scripts/validate_level_story_props.mjs
          git commit -m 'Make level story props visibly decorative'
          git pull --rebase origin main
          git push origin HEAD:main
