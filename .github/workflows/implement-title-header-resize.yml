name: Implement Larger Little Home Title Header
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-title-header-resize.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enlarge title and tagline responsively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('title-island-concepts/index.html')
          s=p.read_text()
          changes={
            '#c2 .toy-brand{top:67px;left:15px;right:15px}':'#c2 .toy-brand{top:62px;left:8px;right:8px}',
            '#c2 .toy-logo span{display:inline-block;font-size:45px;font-weight:950;color:#fff0c9;-webkit-text-stroke:6px var(--navy);':'#c2 .toy-logo span{display:inline-block;font-size:62px;font-weight:950;color:#fff0c9;-webkit-text-stroke:7px var(--navy);',
            '#c2 .toy-tagline{display:inline-block;margin:14px 0 0;padding:7px 14px;':'#c2 .toy-tagline{display:inline-block;margin:13px 0 0;padding:10px 20px;',
            'font-size:10px;font-weight:900;line-height:1;letter-spacing:.05em;text-transform:none;white-space:nowrap}':'font-size:16px;font-weight:900;line-height:1;letter-spacing:.025em;text-transform:none;white-space:nowrap}'
          }
          for old,new in changes.items():
              if old not in s:
                  raise SystemExit('Expected title CSS not found: '+old[:80])
              s=s.replace(old,new,1)
          anchor='#c2 .toy-tagline{display:inline-block;margin:13px 0 0;padding:10px 20px;border-radius:999px;background:rgba(245,222,172,.94);box-shadow:0 3px 0 rgba(187,147,76,.28),0 8px 18px rgba(60,77,88,.08);color:var(--navy);font-family:Inter,ui-rounded,"Avenir Next",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;font-weight:900;line-height:1;letter-spacing:.025em;text-transform:none;white-space:nowrap}'
          fallback='''\n@media(max-width:350px){\n#c2 .toy-brand{left:4px;right:4px}\n#c2 .toy-logo span{font-size:56px;-webkit-text-stroke:6.5px var(--navy)}\n#c2 .toy-tagline{margin-top:12px;padding:8px 16px;font-size:14px;letter-spacing:.02em}\n}\n'''
          if anchor not in s:
              raise SystemExit('Enlarged tagline rule not found for compact fallback')
          s=s.replace(anchor,anchor+fallback,1)
          p.write_text(s)
          PY
          git diff -- title-island-concepts/index.html
      - name: Static title assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('title-island-concepts/index.html').read_text()
          assert '#c2 .toy-brand{top:62px;left:8px;right:8px}' in s
          assert 'font-size:62px' in s
          assert '-webkit-text-stroke:7px var(--navy)' in s
          assert 'margin:13px 0 0;padding:10px 20px' in s
          assert 'font-size:16px;font-weight:900;line-height:1;letter-spacing:.025em' in s
          assert '@media(max-width:350px)' in s
          assert '#c2 .toy-logo span{font-size:56px;-webkit-text-stroke:6.5px var(--navy)}' in s
          assert '#c2 .toy-tagline{margin-top:12px;padding:8px 16px;font-size:14px;letter-spacing:.02em}' in s
          assert 'Small friends. Smart puzzles.' in s
          assert '@keyframes littleHomeTitleDrop' in s
          assert 'body.cinematic-mode #c2 .topline,body.cinematic-mode #c2 .toy-brand' in s
          print('TITLE_RESIZE_STATIC_OK')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser tooling
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local server
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-title-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/latchlings-title-http.log
          exit 1
      - name: Render and verify title header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p title-header-audit
          cat > title-header-audit/audit.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          page.on('pageerror',e=>errors.push(String(e)));
          await page.addInitScript(()=>localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1})));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          await page.waitForTimeout(1700);
          const frame=page.frames().find(f=>f.url().includes('title-island-concepts'));
          if(!frame)throw new Error('Production title iframe did not load');
          const collect=()=>frame.evaluate(()=>{
            const phone=document.querySelector('#c2 .phone');
            const spans=[...document.querySelectorAll('#c2 .toy-logo span')].map(x=>x.getBoundingClientRect());
            const logo={left:Math.min(...spans.map(r=>r.left)),right:Math.max(...spans.map(r=>r.right)),top:Math.min(...spans.map(r=>r.top)),bottom:Math.max(...spans.map(r=>r.bottom))};
            logo.width=logo.right-logo.left;logo.height=logo.bottom-logo.top;
            const tagline=document.querySelector('#c2 .toy-tagline').getBoundingClientRect();
            const progress=document.querySelector('#c2 .progress').getBoundingClientRect();
            const settings=document.querySelector('#c2 .settings').getBoundingClientRect();
            const tree=document.querySelector('#c2 .little-home-tree').getBoundingClientRect();
            const cottage=document.querySelector('#c2 .cottage').getBoundingClientRect();
            const grass=document.querySelector('#c2 .island-top').getBoundingClientRect();
            return {phone:{left:phone.getBoundingClientRect().left,right:phone.getBoundingClientRect().right},logo,tagline:{left:tagline.left,right:tagline.right,top:tagline.top,bottom:tagline.bottom,width:tagline.width,height:tagline.height},progress:{left:progress.left,right:progress.right,top:progress.top,bottom:progress.bottom},settings:{left:settings.left,right:settings.right,top:settings.top,bottom:settings.bottom},visibleTop:Math.min(tree.top,cottage.top,grass.top),fontSize:getComputedStyle(document.querySelector('#c2 .toy-logo span')).fontSize,tagFontSize:getComputedStyle(document.querySelector('#c2 .toy-tagline')).fontSize,scrollWidth:document.documentElement.scrollWidth,innerWidth};
          });
          const normal=await collect();
          fs.writeFileSync('title-header-audit/metrics-390x844.json',JSON.stringify(normal,null,2));
          console.log('TITLE_NORMAL',JSON.stringify(normal));
          if(normal.innerWidth!==390)throw new Error('Expected full-width production title frame');
          if(normal.fontSize!=='62px'||normal.tagFontSize!=='16px')throw new Error('Normal title scale mismatch');
          if(normal.logo.width<330||normal.logo.left<8||normal.logo.right>382)throw new Error('Normal title size/safe-width mismatch '+JSON.stringify(normal.logo));
          if(normal.tagline.width<300||normal.tagline.left<20||normal.tagline.right>370)throw new Error('Normal tagline size/safe-width mismatch '+JSON.stringify(normal.tagline));
          if(normal.logo.top<=normal.progress.bottom-2||normal.logo.top<=normal.settings.bottom-2)throw new Error('Normal title collides with top controls');
          if(normal.tagline.bottom>=normal.visibleTop-4)throw new Error('Normal tagline collides with Little Home art');
          if(normal.scrollWidth>normal.innerWidth)throw new Error('Normal title source horizontal overflow');
          await page.screenshot({path:'title-header-audit/production-home-390x844.png',fullPage:true});

          await page.setViewportSize({width:390,height:700});
          await page.waitForTimeout(300);
          const compact=await collect();
          fs.writeFileSync('title-header-audit/metrics-390x700.json',JSON.stringify(compact,null,2));
          console.log('TITLE_COMPACT',JSON.stringify(compact));
          if(compact.innerWidth>350)throw new Error('Compact production frame did not exercise narrow fallback '+compact.innerWidth);
          if(compact.fontSize!=='56px'||compact.tagFontSize!=='14px')throw new Error('Compact fallback scale mismatch '+JSON.stringify(compact));
          if(compact.logo.left<3||compact.logo.right>compact.innerWidth-3)throw new Error('Compact title exceeds frame '+JSON.stringify(compact.logo));
          if(compact.tagline.left<3||compact.tagline.right>compact.innerWidth-3)throw new Error('Compact tagline exceeds frame '+JSON.stringify(compact.tagline));
          if(compact.tagline.bottom>=compact.visibleTop-4)throw new Error('Compact tagline collides with Little Home art');
          if(compact.scrollWidth>compact.innerWidth)throw new Error('Compact title source horizontal overflow');
          await page.screenshot({path:'title-header-audit/production-home-390x700.png',fullPage:true});
          if(errors.length)throw new Error('Page errors: '+errors.join(' | '));

          const scenePage=await browser.newPage({viewport:{width:390,height:300},deviceScaleFactor:1,reducedMotion:'reduce'});
          await scenePage.goto('http://127.0.0.1:4173/title-island-concepts/?c=2&embed=1&cinematic=1',{waitUntil:'networkidle'});
          const sceneMode=await scenePage.evaluate(()=>({brand:getComputedStyle(document.querySelector('#c2 .toy-brand')).display,overflow:document.documentElement.scrollWidth>innerWidth}));
          if(sceneMode.brand!=='none'||sceneMode.overflow)throw new Error('Cinematic scene-only mode regression '+JSON.stringify(sceneMode));
          fs.writeFileSync('title-header-audit/cinematic-mode.json',JSON.stringify(sceneMode,null,2));
          await scenePage.screenshot({path:'title-header-audit/cinematic-scene-only.png'});
          await scenePage.close();
          console.log('TITLE_RESIZE_BROWSER_OK');
          await browser.close();
          JS
          node title-header-audit/audit.mjs
      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add title-island-concepts/index.html
          git commit -m "Enlarge Little Home title and tagline"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: little-home-larger-title-render
          path: title-header-audit
          if-no-files-found: error
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm -f .github/workflows/implement-title-header-resize.yml
          git add .github/workflows/implement-title-header-resize.yml
          git commit -m "Remove title resize implementation workflow"
          git push
