name: Validate Chapter 7 Pass 3 live build

on:
  push:
    branches: [main]
    paths:
      - 'pass3-chapter7-stormswitch.css'
      - 'pass3-chapter7-stormswitch.js'
      - 'index.html'
      - 'LEVEL_SELECT_ART_DIRECTION.md'
      - '.github/tmp/validate-chapter7-pass3.mjs'
      - '.github/workflows/validate-chapter7-pass3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protect authored and accepted Chapters 1-6 source
        shell: bash
        run: |
          set -euo pipefail
          BASE=8ee722375f68462cc8ee595eaa6870109cd8c5c3
          protected=(
            campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js
            campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
            game400-a.js game400-b.js style400-game.css style400-board-surfaces.css
            style400-production-slice.css style400-skyway-atlas.css title-island-concepts/index.html
            story400.js story-grounding400.js STORY_BIBLE.md cinematics400.js cinematic-dialogue400.js
            gameplay-story-rail400.js story-theme400.js music400.js sfx400.js
            pass3-chapter5-prism.css pass3-chapter5-prism.js
            pass3-chapter6-copperline.css pass3-chapter6-copperline.js
          )
          git diff --exit-code "$BASE" -- "${protected[@]}"
          git diff --exit-code a674b27bac74f5ae47bccd46ee16f832de0eb49b -- pass3-chapter7-stormswitch.css pass3-chapter7-stormswitch.js

      - name: Static live wiring checks
        shell: bash
        run: |
          set -euo pipefail
          node --check pass3-chapter7-stormswitch.js
          grep -q "VISUAL_CHAPTER_MODES\[7\]='stormswitch'" pass3-chapter7-stormswitch.js
          grep -q 'currentLevel===350' pass3-chapter7-stormswitch.js
          grep -q "homeward" cinematics400.js
          grep -q 'story-stage-7' title-island-concepts/index.html
          grep -q 'atlas-map.atlas-range-3' pass3-chapter7-stormswitch.css
          grep -q 'stormswitch-reward-postcard' pass3-chapter7-stormswitch.css
          test "$(grep -c 'pass3-chapter7-stormswitch.css?v=20260913-ch7pass3-1' index.html)" -eq 1
          test "$(grep -c 'pass3-chapter7-stormswitch.js?v=20260913-ch7pass3-1' index.html)" -eq 1
          grep -q '<div class="story-cast" id="storyCast"></div>' index.html
          ! grep -q '<div id="story-cast" id="storyCast"></div>' index.html
          grep -q 'multi-region synchronization relay' LEVEL_SELECT_ART_DIRECTION.md
          grep -q 'amber correction lamp' LEVEL_SELECT_ART_DIRECTION.md

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium validation runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser acceptance against committed live build
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/chapter7-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 0.2; done
          node .github/tmp/validate-chapter7-pass3.mjs
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const [width,height,name] of [[390,844,'chapter7-level301-390.png'],[320,568,'chapter7-level301-320.png']]){
            const ctx=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
            const stars={};for(let i=1;i<400;i++)stars[i]=3;
            await ctx.addInitScript(({stars})=>{localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars}));localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1,'across-drift':1,'old-maps':1,homeward:1}))},{stars});
            const p=await ctx.newPage();await p.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});await p.evaluate(()=>window.startLevel(301));await p.waitForTimeout(1800);
            await p.evaluate(()=>{try{window.LatchlingsStoryTheme?.close(false)}catch(_){};const sc=document.getElementById('storyCardOverlay');if(sc){sc.classList.remove('show');sc.setAttribute('aria-hidden','true')}const co=document.getElementById('cinematicOverlay');if(co){co.classList.remove('show','active');co.setAttribute('aria-hidden','true')}});await p.waitForTimeout(120);
            await p.screenshot({path:`/tmp/chapter7-pass3/${name}`,fullPage:false});await ctx.close();
          }
          await browser.close();
          NODE

      - name: Package live acceptance evidence
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/chapter7-pass3
          cp pass3-chapter7-stormswitch.css /tmp/chapter7-pass3/
          cp pass3-chapter7-stormswitch.js /tmp/chapter7-pass3/
          grep -n 'pass3-chapter7-stormswitch' index.html > /tmp/chapter7-pass3/live-index-wiring.txt || true
          git status --short > /tmp/chapter7-pass3/status.txt

      - name: Upload Chapter 7 live acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter7-pass3-live-acceptance
          path: /tmp/chapter7-pass3
          if-no-files-found: error
