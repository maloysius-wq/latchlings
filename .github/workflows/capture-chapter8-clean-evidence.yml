name: Capture clean Chapter 8 evidence

on:
  push:
    branches: [main]
    paths:
      - '.github/tmp/capture-chapter8-clean-evidence.mjs'
      - '.github/workflows/capture-chapter8-clean-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare candidate-only page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text()
          css='<link rel="stylesheet" href="pass3-chapter7-stormswitch.css?v=20260913-ch7pass3-1">'
          js='<script src="pass3-chapter7-stormswitch.js?v=20260913-ch7pass3-1"></script>'
          assert css in s and js in s
          assert 'pass3-chapter8-aurora.css' not in s and 'pass3-chapter8-aurora.js' not in s
          s=s.replace(css,css+'\n<link rel="stylesheet" href="pass3-chapter8-aurora.css?v=20260913-ch8candidate-1">',1)
          s=s.replace(js,js+'\n<script src="pass3-chapter8-aurora.js?v=20260913-ch8candidate-1"></script>',1)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium runtime
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture settled evidence
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/ch8-clean-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep .2; done
          node .github/tmp/capture-chapter8-clean-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: chapter8-clean-evidence
          path: /tmp/chapter8-clean
          if-no-files-found: error
