name: Render Title Concepts

on:
  push:
    paths:
      - '.github/workflows/render-title-concepts.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static preview validation
        shell: bash
        run: |
          set -euo pipefail
          node --check title-concepts/concepts.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('title-concepts')
          required=['index.html','concept.html','shared.css','themes-a.css','themes-b.css','concepts.js','ASSET_CREDITS.md']
          for f in required:
              assert (root/f).is_file(), f
          js=(root/'concepts.js').read_text()
          for n in range(1,11):
              assert re.search(rf'\n\s*{n}: \(\) =>',js), n
          for textfile in [root/'index.html',root/'concept.html',root/'shared.css',root/'themes-a.css',root/'themes-b.css',root/'concepts.js']:
              text=textfile.read_text()
              for ch in text:
                  cp=ord(ch)
                  assert not (0x1F300 <= cp <= 0x1FAFF or 0x2600 <= cp <= 0x27BF), (textfile,ch,hex(cp))
          expected={'cloud1.png','cloud4.png','tree.png','castleSmallAlt.png','bush3.png'}
          found={p.name for p in (root/'assets/kenney').glob('*.png')}
          assert found==expected,(found,expected)
          assert 'http://' not in js and 'https://' not in js
          print('Static validation passed')
          PY
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Render all ten at phone size
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p title-concept-screenshots
          python3 -m http.server 8000 >/tmp/latchlings-title-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true});
            const summary=[];
            for(let n=1;n<=10;n++){
              const page=await context.newPage();
              const errors=[];
              const failed=[];
              page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||'failed'}`));
              const url=`http://127.0.0.1:8000/title-concepts/concept.html?c=${n}&clean=1`;
              const res=await page.goto(url,{waitUntil:'networkidle'});
              if(!res || !res.ok()) throw new Error(`Concept ${n} HTTP failure`);
              await page.waitForSelector(`.concept-screen.c${n}`);
              const texts=await page.locator('body').innerText();
              for(const required of ['Latchlings','Daily Puzzle','Level Select']){
                if(!texts.includes(required)) throw new Error(`Concept ${n} missing ${required}`);
              }
              const latchCount=await page.locator('.latchling').count();
              if(latchCount<3) throw new Error(`Concept ${n} only has ${latchCount} Latchlings`);
              const broken=await page.locator('img').evaluateAll(imgs=>imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')));
              if(broken.length) throw new Error(`Concept ${n} broken images: ${broken.join(',')}`);
              const metrics=await page.evaluate(()=>({scrollHeight:document.documentElement.scrollHeight,scrollWidth:document.documentElement.scrollWidth,innerWidth,innerHeight}));
              if(metrics.scrollWidth>metrics.innerWidth+2) throw new Error(`Concept ${n} horizontal overflow ${JSON.stringify(metrics)}`);
              if(errors.length || failed.length) throw new Error(`Concept ${n} browser errors: ${errors.concat(failed).join(' | ')}`);
              await page.screenshot({path:`title-concept-screenshots/concept-${String(n).padStart(2,'0')}.png`,fullPage:true});
              summary.push({concept:n,latchCount,...metrics});
              await page.close();
            }
            fs.writeFileSync('title-concept-screenshots/render-summary.json',JSON.stringify(summary,null,2));
            console.log(summary);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: latchlings-title-concept-renders
          path: title-concept-screenshots
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary render workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/render-title-concepts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/render-title-concepts.yml
          git commit -m 'Complete title concept browser render pass'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
