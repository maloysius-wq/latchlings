name: Validate Atlas island zoom transitions

on:
  push:
    paths:
      - '.github/workflows/validate-atlas-island-zoom.yml'
      - '.github/tmp/validate-atlas-island-zoom.mjs'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate
        shell: python
        run: |
          from pathlib import Path
          import base64
          encoded=''
          new=base64.b64decode(encoded).decode()
          p=Path('game400-a.js')
          s=p.read_text()
          a=s.index('function screen(id){')
          b=s.index('\nfunction icon(name){',a)
          p.write_text(s[:a]+new+s[b:])
          i=Path('index.html')
          h=i.read_text().replace('game400-a.js?v=20260911-atlaspace1','game400-a.js?v=20260911-atlaszoom1')
          if 'game400-a.js?v=20260911-atlaszoom1' not in h: raise SystemExit('cache bust failed')
          i.write_text(h)

      - name: Static validation
        run: |
          node --check game400-a.js
          python - <<'PY'
          from pathlib import Path
          import subprocess
          s=Path('game400-a.js').read_text()
          for x in ["atlasDive=current.id==='levels'&&id==='game'","atlasPullback=current.id==='game'&&id==='levels'","scale(1.34)","scale(.76)","duration=atlasDive||atlasPullback?460:420","translate3d(106vw,0,0) scaleX(1.018)","animation.cancel();animation=null"]:
              assert x in s,x
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'game400-a.js','index.html'},changed
          print('STATIC_ISLAND_ZOOM_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser validation
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .github/tmp/validate-atlas-island-zoom.mjs

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-island-zoom-audit
          path: /tmp/atlas-island-zoom-audit

      - name: Commit accepted product files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game400-a.js index.html
          git commit -m "Add immersive Atlas island zoom transitions"
          git push

      - name: Self-remove validation helpers
        run: |
          git pull --rebase
          git rm .github/workflows/validate-atlas-island-zoom.yml .github/tmp/validate-atlas-island-zoom.mjs
          git commit -m "Remove Atlas island zoom validator"
          git push
