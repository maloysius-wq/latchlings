name: Validate Atlas island zoom transitions

on:
  push:
    paths:
      - '.github/workflows/validate-atlas-island-zoom.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply candidate island zoom transition
        shell: python
        run: |
          from pathlib import Path
          p=Path('game400-a.js')
          s=p.read_text()
          start=s.index('function screen(id){')
          end=s.index('\nfunction icon(name){',start)
          new=r'''function screen(id){
 const next=document.getElementById(id);if(!next)return;
 if(activeScreenTransition&&typeof activeScreenTransition.skipTransition==='function')activeScreenTransition.skipTransition();
 const current=document.querySelector('.screen.active');
 if(current===next){document.body.dataset.screen=id;if(id==='home')setTimeout(()=>updateHome(true),0);return}
 const swap=()=>{document.body.dataset.screen=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));next.classList.add('active');if(id==='home')setTimeout(()=>updateHome(true),0)};
 const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches),canAnimate=!!current&&!reduced&&typeof current.animate==='function';
 if(!canAnimate){swap();return}
 const atlasDive=current.id==='levels'&&id==='game',atlasPullback=current.id==='game'&&id==='levels';
 const priorStyle=current.getAttribute('style'),rect=current.getBoundingClientRect(),computedDisplay=getComputedStyle(current).display,display=computedDisplay==='none'?'flex':computedDisplay;
 let transformOrigin='50% 50%';
 if(atlasDive){const target=current.querySelector(`.atlas-node[data-level="${currentLevel}"]`)||current.querySelector('.atlas-node.current:not(.locked)')||current.querySelector('.atlas-node:not(.locked)');if(target){const tr=target.getBoundingClientRect(),ox=tr.left+tr.width/2-rect.left,oy=tr.top+tr.height/2-rect.top;transformOrigin=`${Math.round(ox)}px ${Math.round(oy)}px`}}
 let animation=null,rafA=0,rafB=0,settled=false,readySettled=false,resolveReady,resolveFinished,controller;
 const ready=new Promise(r=>resolveReady=r),finished=new Promise(r=>resolveFinished=r);
 const markReady=()=>{if(readySettled)return;readySettled=true;resolveReady()};
 const restore=()=>{if(priorStyle===null)current.removeAttribute('style');else current.setAttribute('style',priorStyle);current.classList.remove('screen-transition-outgoing')};
 const settle=()=>{if(settled)return;settled=true;if(rafA)cancelAnimationFrame(rafA);if(rafB)cancelAnimationFrame(rafB);if(animation){animation.onfinish=null;animation.oncancel=null;animation.cancel();animation=null}markReady();restore();resolveFinished();if(activeScreenTransition===controller)activeScreenTransition=null};
 controller={ready,finished,skipTransition(){if(settled)return;if(animation)animation.cancel();settle()}};
 activeScreenTransition=controller;
 current.classList.add('screen-transition-outgoing');
 Object.assign(current.style,{display,position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',margin:'0',zIndex:'40',pointerEvents:'none',willChange:'transform,opacity',transformOrigin,transform:'translate3d(0,0,0) scale(1)',opacity:'1'});
 swap();
 if(window.LatchlingsSFX&&window.LatchlingsSFX.screenSwipe)window.LatchlingsSFX.screenSwipe();
 void next.offsetWidth;
 rafA=requestAnimationFrame(()=>{rafB=requestAnimationFrame(()=>{if(settled)return;markReady();const frames=atlasDive?[{transform:'translate3d(0,0,0) scale(1)',opacity:1},{transform:'translate3d(0,0,0) scale(1.045)',opacity:1,offset:.18},{transform:'translate3d(0,0,0) scale(1.34)',opacity:.02}]:atlasPullback?[{transform:'translate3d(0,0,0) scale(1)',opacity:1},{transform:'translate3d(0,0,0) scale(.94)',opacity:.94,offset:.24},{transform:'translate3d(0,0,0) scale(.76)',opacity:0}]:[{transform:'translate3d(0,0,0) scaleX(1)',opacity:1},{transform:'translate3d(106vw,0,0) scaleX(1.018)',opacity:.10}],duration=atlasDive||atlasPullback?460:420,easing=atlasDive?'cubic-bezier(.18,.72,.2,1)':atlasPullback?'cubic-bezier(.24,.62,.24,1)':'cubic-bezier(.22,.61,.36,1)';animation=current.animate(frames,{duration,easing,fill:'forwards'});animation.onfinish=settle;animation.oncancel=()=>{if(!settled)settle()}})});
 return controller;
}'''
          p.write_text(s[:start]+new+s[end:])

          ip=Path('index.html')
          h=ip.read_text()
          h=h.replace('game400-a.js?v=20260911-atlaspace1','game400-a.js?v=20260911-atlaszoom1')
          if 'game400-a.js?v=20260911-atlaszoom1' not in h:
              raise SystemExit('cache-bust replacement failed')
          ip.write_text(h)

      - name: Static validation
        run: |
          node --check game400-a.js
          python - <<'PY'
          from pathlib import Path
          s=Path('game400-a.js').read_text()
          required=[
            "atlasDive=current.id==='levels'&&id==='game'",
            "atlasPullback=current.id==='game'&&id==='levels'",
            "scale(1.34)",
            "scale(.76)",
            "duration=atlasDive||atlasPullback?460:420",
            "translate3d(106vw,0,0) scaleX(1.018)",
            "animation.cancel();animation=null"
          ]
          for x in required:
              assert x in s, x
          changed=set(__import__('subprocess').check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'game400-a.js','index.html'}, changed
          print('STATIC_ISLAND_ZOOM_OK')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium validation runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Browser validation
        shell: bash
        run: |
          mkdir -p /tmp/atlas-island-zoom-audit
          python3 -m http.server 4173 >/tmp/latchlings-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          cat >/tmp/validate-atlas-island-zoom.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const out='/tmp/atlas-island-zoom-audit';
          const errors=[];
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:1});
          await context.addInitScript(() => {
            const original=Element.prototype.animate;
            window.__screenTransitionAudit=[];
            Element.prototype.animate=function(frames,options){
              const shouldRecord=this.classList&&this.classList.contains('screen-transition-outgoing');
              if(shouldRecord){
                let safeFrames=[];
                try{safeFrames=JSON.parse(JSON.stringify(frames))}catch(_){safeFrames=[]}
                window.__screenTransitionAudit.push({
                  id:this.id,
                  frames:safeFrames,
                  duration:typeof options==='number'?options:options?.duration,
                  easing:typeof options==='object'?options?.easing:null,
                  origin:this.style.transformOrigin,
                  targetScreen:document.body.dataset.screen,
                  at:performance.now()
                });
              }
              return original.call(this,frames,options);
            };
          });
          const page=await context.newPage();
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{if(m.type()==='error')errors.push('console: '+m.text())});
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
          await page.evaluate(()=>localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:3,stars:{1:3,2:3}})));
          await page.reload({waitUntil:'load'});
          await page.waitForFunction(()=>window.LatchlingsHomeAction);

          // Enter Atlas from Home and let the ordinary swipe finish.
          await page.evaluate(()=>window.LatchlingsHomeAction('levels'));
          await page.waitForSelector('#levels.active .atlas-node[data-level="3"]');
          await page.waitForTimeout(520);

          const targetGeometry=await page.evaluate(()=>{
            const screen=document.getElementById('levels').getBoundingClientRect();
            const node=document.querySelector('.atlas-node[data-level="3"]').getBoundingClientRect();
            return {x:node.left+node.width/2-screen.left,y:node.top+node.height/2-screen.top};
          });
          await page.screenshot({path:`${out}/atlas-before-dive.png`});
          await page.click('.atlas-node[data-level="3"]');
          await page.waitForFunction(()=>document.body.dataset.screen==='game');
          await page.waitForTimeout(210);
          const diveMid=await page.evaluate(()=>({
            transform:getComputedStyle(document.getElementById('levels')).transform,
            opacity:getComputedStyle(document.getElementById('levels')).opacity,
            origin:getComputedStyle(document.getElementById('levels')).transformOrigin,
            outgoing:document.getElementById('levels').classList.contains('screen-transition-outgoing')
          }));
          await page.screenshot({path:`${out}/atlas-dive-mid.png`});
          await page.waitForTimeout(360);
          const diveEnd=await page.evaluate(()=>({
            active:document.getElementById('game').classList.contains('active'),
            outgoing:document.querySelectorAll('.screen-transition-outgoing').length,
            directAnimations:document.getElementById('levels').getAnimations().length,
            inlineStyle:document.getElementById('levels').getAttribute('style'),
            log:window.__screenTransitionAudit.slice()
          }));
          const dive=diveEnd.log.at(-1);
          if(!dive||dive.id!=='levels') throw new Error('missing Atlas dive animation log');
          if(dive.duration!==460) throw new Error(`Atlas dive duration ${dive.duration}`);
          if(!String(dive.frames.at(-1)?.transform).includes('scale(1.34)')) throw new Error('Atlas dive final scale missing');
          if(dive.frames.some(f=>String(f.transform||'').includes('106vw'))) throw new Error('Atlas dive incorrectly uses sideways swipe');
          const [ox,oy]=String(dive.origin).split(' ').map(parseFloat);
          if(Math.abs(ox-targetGeometry.x)>3||Math.abs(oy-targetGeometry.y)>3) throw new Error(`Atlas dive origin ${dive.origin} not selected island ${JSON.stringify(targetGeometry)}`);
          if(!diveMid.outgoing||diveMid.opacity>=1) throw new Error(`Atlas dive did not visibly progress ${JSON.stringify(diveMid)}`);
          if(!diveEnd.active||diveEnd.outgoing!==0||diveEnd.directAnimations!==0) throw new Error(`Atlas dive cleanup failed ${JSON.stringify(diveEnd)}`);

          // Return through the real pause > Level Select path.
          await page.click('#pauseBtn');
          await page.waitForSelector('#pauseLevels');
          await page.click('#pauseLevels');
          await page.waitForFunction(()=>document.body.dataset.screen==='levels');
          await page.waitForTimeout(210);
          const pullMid=await page.evaluate(()=>({
            transform:getComputedStyle(document.getElementById('game')).transform,
            opacity:getComputedStyle(document.getElementById('game')).opacity,
            outgoing:document.getElementById('game').classList.contains('screen-transition-outgoing')
          }));
          await page.screenshot({path:`${out}/game-pullback-mid.png`});
          await page.waitForTimeout(360);
          const pullEnd=await page.evaluate(()=>({
            active:document.getElementById('levels').classList.contains('active'),
            outgoing:document.querySelectorAll('.screen-transition-outgoing').length,
            directAnimations:document.getElementById('game').getAnimations().length,
            log:window.__screenTransitionAudit.slice()
          }));
          const pull=pullEnd.log.at(-1);
          if(!pull||pull.id!=='game') throw new Error('missing game pullback animation log');
          if(pull.duration!==460) throw new Error(`pullback duration ${pull.duration}`);
          if(!String(pull.frames.at(-1)?.transform).includes('scale(.76)')) throw new Error('pullback final scale missing');
          if(pull.frames.some(f=>String(f.transform||'').includes('106vw'))) throw new Error('pullback incorrectly uses sideways swipe');
          if(!pullMid.outgoing||pullMid.opacity>=1) throw new Error(`pullback did not visibly progress ${JSON.stringify(pullMid)}`);
          if(!pullEnd.active||pullEnd.outgoing!==0||pullEnd.directAnimations!==0) throw new Error(`pullback cleanup failed ${JSON.stringify(pullEnd)}`);

          // Repeat the special round trip to guard against stale fill:forwards effects.
          await page.click('.atlas-node[data-level="3"]');
          await page.waitForTimeout(540);
          await page.click('#pauseBtn');
          await page.click('#pauseLevels');
          await page.waitForTimeout(540);
          const repeatClean=await page.evaluate(()=>({
            active:document.body.dataset.screen,
            outgoing:document.querySelectorAll('.screen-transition-outgoing').length,
            levelsAnimations:document.getElementById('levels').getAnimations().length,
            gameAnimations:document.getElementById('game').getAnimations().length,
            levelsTransform:getComputedStyle(document.getElementById('levels')).transform,
            levelsOpacity:getComputedStyle(document.getElementById('levels')).opacity
          }));
          if(repeatClean.active!=='levels'||repeatClean.outgoing||repeatClean.levelsAnimations||repeatClean.gameAnimations||repeatClean.levelsTransform!=='none'||repeatClean.levelsOpacity!=='1') throw new Error(`repeat cleanup failed ${JSON.stringify(repeatClean)}`);

          // Unrelated Atlas -> Home still uses the original 420 ms sideways transition.
          await page.click('#levelsBack');
          await page.waitForTimeout(90);
          const generic=await page.evaluate(()=>window.__screenTransitionAudit.at(-1));
          if(!generic||generic.id!=='levels'||generic.duration!==420||!generic.frames.some(f=>String(f.transform||'').includes('106vw'))) throw new Error(`generic transition contract changed ${JSON.stringify(generic)}`);
          await page.waitForTimeout(420);

          // Rapid cancellation: start Home -> Atlas, then immediately dive to a level.
          await page.evaluate(()=>window.LatchlingsHomeAction('levels'));
          await page.waitForSelector('#levels.active .atlas-node[data-level="3"]');
          await page.click('.atlas-node[data-level="3"]');
          await page.waitForTimeout(560);
          const rapid=await page.evaluate(()=>({
            screen:document.body.dataset.screen,
            outgoing:document.querySelectorAll('.screen-transition-outgoing').length,
            animations:[...document.querySelectorAll('.screen')].reduce((n,e)=>n+e.getAnimations().length,0)
          }));
          if(rapid.screen!=='game'||rapid.outgoing||rapid.animations) throw new Error(`rapid cancellation cleanup failed ${JSON.stringify(rapid)}`);

          fs.writeFileSync(`${out}/report.json`,JSON.stringify({targetGeometry,diveMid,dive,pullMid,pull,repeatClean,generic,rapid,errors},null,2));
          if(errors.length) throw new Error(`browser errors: ${errors.join(' | ')}`);
          await context.close();

          // Reduced motion skips the camera zoom entirely.
          const reduced=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce'});
          const rp=await reduced.newPage();
          await rp.goto('http://127.0.0.1:4173/',{waitUntil:'load'});
          await rp.evaluate(()=>localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:3,stars:{1:3,2:3}})));
          await rp.reload({waitUntil:'load'});
          await rp.waitForFunction(()=>window.LatchlingsHomeAction);
          await rp.evaluate(()=>window.LatchlingsHomeAction('levels'));
          await rp.waitForSelector('#levels.active .atlas-node[data-level="3"]');
          await rp.click('.atlas-node[data-level="3"]');
          const reducedState=await rp.evaluate(()=>({screen:document.body.dataset.screen,outgoing:document.querySelectorAll('.screen-transition-outgoing').length,animations:[...document.querySelectorAll('.screen')].reduce((n,e)=>n+e.getAnimations().length,0)}));
          if(reducedState.screen!=='game'||reducedState.outgoing||reducedState.animations) throw new Error(`reduced motion failed ${JSON.stringify(reducedState)}`);
          fs.writeFileSync(`${out}/reduced-motion.json`,JSON.stringify(reducedState,null,2));
          await reduced.close();
          await browser.close();
          console.log('ATLAS_ISLAND_ZOOM_ACCEPTED');
          NODE
          node /tmp/validate-atlas-island-zoom.mjs

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-island-zoom-audit
          path: /tmp/atlas-island-zoom-audit

      - name: Commit accepted product files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game400-a.js index.html
          git commit -m "Add immersive Atlas island zoom transitions"
          git push

      - name: Self-remove validator
        run: |
          git pull --rebase
          git rm .github/workflows/validate-atlas-island-zoom.yml
          git commit -m "Remove Atlas island zoom validator"
          git push
