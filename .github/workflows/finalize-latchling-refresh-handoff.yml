name: Finalize Latchling Refresh Handoff
on:
  push:
    paths:
      - '.github/workflows/finalize-latchling-refresh-handoff.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm deployed production assets
        run: |
          set -euo pipefail
          base='https://maloysius-wq.github.io/latchlings'
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 2 --retry-delay 2 "$base/" -o /tmp/live-index.html \
              && curl -fsSL --retry 2 --retry-delay 2 "$base/style400-game.css" -o /tmp/live-game.css \
              && curl -fsSL --retry 2 --retry-delay 2 "$base/style400-story-theme.css" -o /tmp/live-story.css; then
              break
            fi
            sleep 5
          done
          grep -q '<title>Latchlings</title>' /tmp/live-index.html
          grep -q 'Refined spherical Latchling model' /tmp/live-game.css
          grep -q 'Refined spherical Latchling portraits' /tmp/live-story.css
          echo LIVE_LATCHLING_ASSETS_OK
      - name: Open deployed app in Chromium
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/latchling-live-final"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
          cat > live.mjs <<'MJS'
          import {chromium} from 'playwright';
          const ok=(c,m)=>{if(!c)throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'no-preference'});
          const page=await ctx.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('https://maloysius-wq.github.io/latchlings/',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForFunction(()=>typeof startLevel==='function'&&window.LatchlingsStoryTheme&&window.LATCHLINGS_STORY,{timeout:30000});
          ok((await page.title())==='Latchlings','wrong title');
          const frame=page.frames().find(f=>/title-island-concepts/.test(f.url()));
          ok(frame,'Little Home iframe missing');
          await frame.waitForSelector('#c2 .latchling',{timeout:20000});
          ok(await frame.locator('#c2 .latchling').count()===5,'live Little Home resident count changed');
          await page.evaluate(()=>startLevel(400));
          await page.waitForSelector('#game.active .latchling',{timeout:20000});
          await page.waitForTimeout(420);
          await page.evaluate(()=>{try{LatchlingsStoryTheme.close(false)}catch(_){};try{closeModal()}catch(_){}});
          const state=await page.evaluate(()=>({screen:document.body.dataset.screen,count:document.querySelectorAll('#game .latchling').length,round:[...document.querySelectorAll('#game .latchling')].every(x=>{const r=x.getBoundingClientRect();return Math.abs(r.width-r.height)<.25}),marker:getComputedStyle(document.querySelector('#game .latchling .eye')).backgroundColor}));
          ok(state.screen==='game'&&state.count>1&&state.round&&state.marker==='rgb(23, 37, 58)','live puzzle face model mismatch '+JSON.stringify(state));
          ok(errors.length===0,'live browser errors '+errors.join(' | '));
          console.log('LIVE_LATCHLING_BROWSER_OK',JSON.stringify(state));
          await browser.close();
          MJS
          node live.mjs
      - name: Close completed handoff entry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          heading='### 2026-09-04 — Refresh all Latchlings with refined spherical face model'
          start=t.index(heading)
          end=t.index('\n---\n',start)
          section=t[start:end]
          if '**Status: IN PROGRESS**' not in section:
              raise SystemExit('Expected active spherical refresh entry was not IN PROGRESS')
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          if '#### Completion summary' in section:
              raise SystemExit('Completion summary already present')
          run_id=os.environ['GITHUB_RUN_ID']
          summary=f'''\n\n#### Completion summary\n\n**Implementation:** The refined spherical face language is now the production Latchling model across puzzle-board pieces, the five Little Home residents, named Story Card portraits, and Story & Residents avatars. The model keeps circular bodies with no head appendages, dark glossy eyes and catchlights, soft cheeks, raised expression-specific mouths, and forehead suit marks. Puzzle gameplay still supports all seven authored expressions (happy, surprised, angry, smug, sleepy, curious, determined), while the five named residents retain their canonical expressions and asynchronous blink timing.\n\n**Product commit:** `ec21a9fa2a11b4c9377827b67d2cb51290f0aa0f` (`Refresh all Latchlings with polished spherical faces`). Product files changed there are `style400-game.css`, `title-island-concepts/index.html`, `story-theme400.js`, and `style400-story-theme.css`; campaign definitions, puzzle mechanics, story canon, audio, and production loader remained unchanged.\n\n**Handoff repair:** Continuation audit found that the earlier programmatic validation run `33897067802` had passed, but its render artifact `9946166689` captured several requested surfaces during transitions or with completion overlays. Those images were not accepted as final visual proof. Five temporary model-refresh workflows that had failed to self-remove were also found on `main`. Repair commit `4559f1ed28e6f225ed267e82d314904a8cfeb273` documented the gap and removed all abandoned temporary workflows before further feature work.\n\n**Corrected validation:** Settled-state audit run `33901011206` completed successfully. Its browser harness isolated every surface in a fresh state and rejected captures if the wrong screen, generic modal, or Story Card overlay was present. It verified the clean Level 400 puzzle, clean Little Home title, single and paired Story Cards, the Story & Residents screen, wide-layout Story Card behavior, and reduced-motion behavior. It also rechecked spherical geometry, dark eyes/catchlights, cheeks, raised mouth placement, forehead suits, async blinking, selection state, absence of head appendages, five-resident roster, and the established Little Home sizes of **34×34 px adults** and **25×25 px children**. The audit produced artifact `9947639477` (`settled-latchling-refresh-renders`) with six clean renders, all manually inspected and accepted. The temporary audit workflow self-removed in commit `60c8d0252b4c46f70eee138d1de549c3563bf12b`.\n\n**Deployment:** GitHub Pages run `33901071825` completed successfully for audit-clean commit `60c8d0252b4c46f70eee138d1de549c3563bf12b`. This finalization run `{run_id}` additionally fetched the deployed production HTML/CSS and opened `https://maloysius-wq.github.io/latchlings/` in Chromium, verifying the Little Home roster and the live Level 400 spherical puzzle model with no browser errors before this handoff was closed.\n\n**Repository hygiene:** All model-refresh implementation/audit workflows are now self-removed; `.github/workflows/validate-repository-access-guard.yml` is the only durable workflow expected to remain.\n\n**Remaining risk / next action:** No blocking issue remains from the spherical model refresh. Future visual changes should preserve the clean-state screenshot discipline introduced by the settled-state audit so transitions and modals cannot masquerade as surface validation.\n'''
          section += summary
          t=t[:start]+section+t[end:]
          p.write_text(t)
          PY
      - name: Commit final handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-latchling-refresh-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/finalize-latchling-refresh-handoff.yml
          git commit -m 'Close spherical Latchling refresh handoff'
          git pull --rebase origin main
          git push origin HEAD:main
