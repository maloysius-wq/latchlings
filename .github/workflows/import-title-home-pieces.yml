name: Import Matching Title Home Pieces

on:
  push:
    paths:
      - '.github/workflows/import-title-home-pieces.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import matching home pieces
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/Tiddybub/2d-assets/main/nature/isometric-miniature-farm/Isometric'
          for f in woodWallDoorClosed_S.png roofSingle_S.png woodWallWindow_S.png planks_S.png; do
            curl -fsSL "$BASE/$f" -o "title-island-concepts/assets/isometric/$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import struct
          for name in ['woodWallDoorClosed_S.png','roofSingle_S.png','woodWallWindow_S.png','planks_S.png']:
              p=Path('title-island-concepts/assets/isometric')/name
              b=p.read_bytes()
              if not b.startswith(b'\x89PNG\r\n\x1a\n'): raise SystemExit(f'Not PNG: {p}')
              print(name, struct.unpack('>II',b[16:24]))
          PY
      - name: Commit and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-title-home-pieces.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/assets/isometric .github/workflows/import-title-home-pieces.yml
          git commit -m 'Add matching CC0 isometric home pieces'
          git pull --rebase origin main
          git push origin HEAD:main
