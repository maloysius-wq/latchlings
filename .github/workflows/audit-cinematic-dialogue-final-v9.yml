name: Audit Cinematic Dialogue Final v9

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static checks
        run: |
          node --check cinematic-dialogue400.js
          node --check cinematics400.js
          grep -q "if(!lines.classList.contains('cinematic-narration-only'))" cinematic-dialogue400.js
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start static server
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Audit cinematic dialogue
        run: |
          cat > audit-v9.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';import path from 'node:path';
          const OUT='cinematic-v9';fs.mkdirSync(OUT,{recursive:true});
          const fail=m=>{throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();page.setDefaultTimeout(5000);
          const errors=[];page.on('pageerror',e=>errors.push('pageerror: '+e.message));page.on('console',m=>{if(m.type()==='error'&&!/ERR_ABORTED|favicon|Failed to load resource/i.test(m.text()))errors.push('console: '+m.text())});
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
          await page.waitForFunction(()=>window.LatchlingsCinematics&&window.LatchlingsCinematicDialogue?.dialogueGroups);
          const manifest=[];
          for(const id of ['opening','across-drift','old-maps','homeward']){
            console.log('SHOW_START',id);
            const shown=await page.evaluate(id=>window.LatchlingsCinematics.show(id,{markSeen:false}),id);
            if(!shown)fail(`Could not show ${id}`);
            console.log('SHOW_OK',id);
            await page.waitForTimeout(80);
            const count=await page.evaluate(()=>window.LatchlingsCinematics.CINEMATICS[window.LatchlingsCinematics.active].beats.length);
            for(let i=0;i<count;i++){
              if(i){await page.evaluate(()=>window.LatchlingsCinematics.next());await page.waitForTimeout(70)}
              const d=await page.evaluate(()=>{
                const a=window.LatchlingsCinematics,beat=a.CINEMATICS[a.active].beats[a.beat],groups=window.LatchlingsCinematicDialogue.dialogueGroups(beat),narr=window.LatchlingsCinematicDialogue.narratorLines(beat),stage=document.getElementById('cinematicStage'),lines=document.getElementById('cinematicLines'),sr=stage.getBoundingClientRect();
                const bubbles=[...stage.querySelectorAll('.cin-speech-bubble')].map(x=>x.getBoundingClientRect());
                return {id:a.active,index:a.beat,label:beat.label,expected:groups.length,narrExpected:narr.length,bubbles:bubbles.length,narr:lines.querySelectorAll('.narrator-only').length,old:lines.querySelectorAll('.dialogue').length,narrLabel:/Narrator/i.test(lines.textContent||''),within:bubbles.every(r=>r.left>=sr.left-1&&r.right<=sr.right+1&&r.top>=sr.top-1&&r.bottom<=sr.bottom+1),intro:stage.querySelectorAll('.cin-intro-person').length,names:[...stage.querySelectorAll('.cin-intro-person .cin-speaker-name')].map(x=>x.textContent),overflow:document.documentElement.scrollWidth-window.innerWidth};
              });
              if(d.bubbles!==d.expected||d.narr!==d.narrExpected||d.old||d.narrLabel||!d.within||d.overflow>1)fail(`${id} beat ${i+1}: ${JSON.stringify(d)}`);
              if(id==='opening'&&i===1){if(d.intro!==5)fail('Opening cast count');for(const n of ['Pippa','Bramble','Rowan','Pip','Tansy'])if(!d.names.includes(n))fail(`Opening cast missing ${n}`)}
              if(id==='opening')await page.screenshot({path:path.join(OUT,`opening-${String(i+1).padStart(2,'0')}.png`),fullPage:false,animations:'disabled'});
              manifest.push(d);console.log('BEAT_OK',id,i+1);
            }
            await page.evaluate(()=>window.LatchlingsCinematics.finish(false));await page.waitForTimeout(30);
          }
          fs.writeFileSync(path.join(OUT,'manifest.json'),JSON.stringify(manifest,null,2));
          await context.close();
          const wideContext=await browser.newContext({viewport:{width:900,height:844},reducedMotion:'reduce'});const wide=await wideContext.newPage();wide.setDefaultTimeout(5000);
          await wide.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});await wide.waitForFunction(()=>window.LatchlingsCinematics&&document.getElementById('homeTitleFrame')?.contentDocument?.querySelector('#c2 .toy-logo'));
          await wide.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));await wide.waitForTimeout(80);await wide.evaluate(()=>window.LatchlingsCinematics.next());await wide.waitForTimeout(70);
          const wd=await wide.evaluate(()=>({overflow:document.documentElement.scrollWidth-window.innerWidth,people:document.querySelectorAll('.cin-intro-person').length,animations:[...document.querySelectorAll('.cin-dialogue-layer *')].map(x=>getComputedStyle(x).animationName).filter(x=>x&&x!=='none')}));if(wd.overflow>1||wd.people!==5||wd.animations.length)fail(`Wide/reduced regression ${JSON.stringify(wd)}`);
          await wide.screenshot({path:path.join(OUT,'opening-cast-wide-reduced.png'),fullPage:false,animations:'disabled'});await wide.evaluate(()=>window.LatchlingsCinematics.finish(false));
          const title=await wide.evaluate(()=>{const d=document.getElementById('homeTitleFrame').contentDocument;return {titleFont:getComputedStyle(d.querySelector('#c2 .toy-logo')).fontFamily,tagFont:getComputedStyle(d.querySelector('#c2 .toy-tagline')).fontFamily,title:d.querySelector('#c2 .toy-logo').textContent.replace(/\s+/g,''),tag:d.querySelector('#c2 .toy-tagline').textContent.trim()}});if(!/Arial Rounded|Trebuchet/i.test(title.titleFont)||!/Inter|Avenir Next|system-ui/i.test(title.tagFont))fail(`Title typography changed ${JSON.stringify(title)}`);
          fs.writeFileSync(path.join(OUT,'wide-title.json'),JSON.stringify({wd,title},null,2));await wideContext.close();if(errors.length)fail('Browser errors:\n'+errors.join('\n'));await browser.close();console.log('CINEMATIC_V9_OK');
          EOF
          timeout 360s node audit-v9.mjs
      - name: Build opening sheet
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import glob,os,math
          files=sorted(glob.glob('cinematic-v9/opening-??.png'))
          if files:
              w=195;h=int(w*844/390);cols=4;rows=math.ceil(len(files)/cols);canvas=Image.new('RGB',(cols*w,rows*(h+18)),'white');draw=ImageDraw.Draw(canvas)
              for i,f in enumerate(files):
                  im=Image.open(f).convert('RGB');im.thumbnail((w,h));x=(i%cols)*w;y=(i//cols)*(h+18);canvas.paste(im,(x,y));draw.text((x+3,y+h+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save('cinematic-v9/opening-contact-sheet.jpg',quality=92)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-dialogue-v9
          path: cinematic-v9
          if-no-files-found: warn
      - name: Remove temporary audit
        if: always()
        run: |
          git pull --ff-only origin main
          rm -f .github/workflows/audit-cinematic-dialogue-final-v9.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-cinematic-dialogue-final-v9.yml
          if ! git diff --cached --quiet; then git commit -m "Remove temporary cinematic dialogue v9" && git push; fi
