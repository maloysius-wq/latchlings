name: Close single Atlas traveler handoff
on:
  push:
    paths:
      - '.github/workflows/close-single-atlas-traveler.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete handoff entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          title='### 2026-09-10 — Keep only the animated Atlas traveler'
          if title not in s:
              raise SystemExit('handoff entry missing')
          start=s.index(title)
          end=s.find('\n### ',start+len(title))
          if end<0: end=len(s)
          section=s[start:end]
          section=section.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary='''\n#### Completion summary\n\n- **Result:** COMPLETED. Removed the static Latchling/guide that the normal Atlas renderer attached beside the current destination. The Skyway progression sequence now shows only the single guide created by `atlasTraveler()` inside `.atlas-travel-token`; normal Atlas views and completed post-arrival states contain no extra guide figure. The current-stop pennant text remains intact.\n- **Implementation:** Only `game400-a.js` changed. The current-node `pennant` renderer no longer appends `atlasGuideHtml(chapterView)`. `atlasGuideHtml()` itself remains available exclusively to the animated traveler path, so route travel, cloud clearing, arrival timing, unlock behavior, board themes, story, cinematics, and puzzle data are unchanged.\n- **Product / cleanup commits:** Accepted product commit `9cc3009c3d8be680f74439d861df726f4a7d6821` (`Keep only animated Atlas traveler`). Temporary validator cleanup commit `05f7fd98df47ee8d144549f44de05a9db0f9c44c` (`Remove single Atlas traveler validator`).\n- **Acceptance:** GitHub Actions run `34539537908` completed successfully and printed `SINGLE_ATLAS_TRAVELER_ACCEPTED`. Browser assertions verified zero static `.atlas-guide` elements on a normal Atlas, exactly one guide during ordinary 1→2 travel and 10→11 boundary travel, that the one guide is nested under `.atlas-travel-token`, zero node-attached guides during movement, zero guide left behind after Level Select arrival, preserved Next Level auto-continuation to Level 2, and no static guide in the reduced-motion path.\n- **Scope protection:** SHA-256 checks confirmed `story400.js`, `story-grounding400.js`, `cinematics400.js`, `cinematic-dialogue400.js`, and all eight `campaign400-*.js` files were unchanged.\n- **Artifact / visual review:** Acceptance artifact `single-atlas-traveler-renders`, artifact ID `10176738362`, SHA-256 `b9540380627b6a60a153b8b011a1ab55bda7c62c94b7c03d69c50a1289aed83b`, contains progression screenshots plus `report.json` with `accepted: true`. Manual review of the 1→2 and 10→11 moving frames confirmed one visible moving Latchling only, with no second static copy beside the source or destination.\n- **Diagnostics / iteration:** Run `34539351305` failed only because its Playwright validation script was created under `/tmp` and therefore could not resolve the repository-installed package; no product commit occurred. Run `34539439021` passed every duplicate-traveler assertion but rejected an unrelated 2.45-second screen-transition timing assertion even though `currentLevel` had already advanced to 2; no product commit occurred. The accepted run moved the test into the repository and widened only that screen-transition observation window.\n- **Deployment / hygiene:** GitHub Pages run `34539625836` completed successfully for clean accepted product state `05f7fd98df47ee8d144549f44de05a9db0f9c44c`. After validator cleanup, `.github/workflows` contained only `validate-repository-access-guard.yml`.\n- **Remaining risk / next action:** No known blocker remains. Future Atlas current-stop decorations should not call `atlasGuideHtml()` outside `atlasTraveler()` unless a second visible character is explicitly intended.\n'''
          if '#### Completion summary' not in section:
              section=section.rstrip()+"\n"+summary+"\n\n"
          s=s[:start]+section+s[end:]
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Complete single Atlas traveler handoff'
          git push
      - name: Self-remove closeout
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/close-single-atlas-traveler.yml
          git commit -m 'Remove single Atlas traveler closeout'
          git push
