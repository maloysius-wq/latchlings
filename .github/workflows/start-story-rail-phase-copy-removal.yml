name: Start Story Rail Phase Copy Removal
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-story-rail-phase-copy-removal.yml'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record IN PROGRESS handoff and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          marker='## Current Work\n'
          entry='''\n### 2026-09-07 — Remove supplemental green phase copy from level story rail\n\n**Status: IN PROGRESS**\n\n**User goal:** Remove the green supplemental sentence from the plot/story description at the top of every level, including the recurring Chapter 1 line about the route/detour moving again. Keep the actual level-specific character line and the rest of the story rail intact.\n\n**Implementation plan:** Update `gameplay-story-rail400.js` so the per-phase `PHASE_LINES` sentence is no longer rendered in the visible story description or repeated in its accessibility label. Preserve the named speaker, level-specific `LINES` copy, title, level count, movement label, progress bar, chapter theming, and gameplay behavior. No campaign/story progression data will change.\n\n**Expected files/systems:** `DEVELOPMENT_HANDOFF.md` and `gameplay-story-rail400.js`. A temporary self-removing validation workflow may be used. No campaign, solver, audio, cinematic, or visual-layout files are expected to change.\n\n**Validation plan:** Staticaly confirm the story rail no longer emits a `<small>` phase sentence or appends `phaseLine` to its aria-label, while level-specific character copy remains. Run a browser smoke check on representative levels across multiple chapters to confirm the green supplemental text is absent and the rail still renders correctly without overflow or console errors.\n\n**Deployment plan:** Deploy the clean accepted state through GitHub Pages, verify success, remove all temporary workflows, confirm `validate-repository-access-guard.yml` is again the only durable workflow, then close this same entry with exact commit/run details.\n\n---\n'''
          if '### 2026-09-07 — Remove supplemental green phase copy from level story rail' not in s:
              s=s.replace(marker, marker+entry, 1)
              p.write_text(s)
          PY
          rm -f .github/workflows/start-story-rail-phase-copy-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md .github/workflows/start-story-rail-phase-copy-removal.yml
          git commit -m "Record story rail copy removal handoff"
          git push
