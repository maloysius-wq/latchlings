name: Apply Professional Cinematic Visual Rebuild
on:
  push:
    paths:
      - '.github/workflows/apply-cinematic-visual-rebuild.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cinematic scene rebuild
        run: |
          python3 .github/apply_cinematic_visual_rebuild.py
          node --check cinematics400.js
          grep -q 'style400-cinematics-polish.css' index.html
          grep -q 'cinematic-mode' title-island-concepts/index.html
          grep -q 'cin-home-reference' cinematics400.js
          grep -q 'cin-keepsake-board' cinematics400.js
          grep -q 'node-side' cinematics400.js
      - name: Commit product rebuild and cleanup
        run: |
          rm -f .github/apply_cinematic_visual_rebuild.py .github/workflows/apply-cinematic-visual-rebuild.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cinematics400.js style400-cinematics-polish.css index.html title-island-concepts/index.html .github/apply_cinematic_visual_rebuild.py .github/workflows/apply-cinematic-visual-rebuild.yml
          git commit -m 'Rebuild cinematic scenes with production materials'
          git pull --rebase origin main
          git push origin HEAD:main
