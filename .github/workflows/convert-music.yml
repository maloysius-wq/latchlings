name: Prepare Latchlings Music

on:
  push:
    paths:
      - '.github/workflows/convert-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-music:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Convert and normalize soundtrack for mobile browsers
        shell: bash
        run: |
          set -euo pipefail
          for f in assets/music/*.ogg; do
            out="${f%.ogg}.mp3"
            ffmpeg -y -loglevel error -i "$f" \
              -af 'loudnorm=I=-20:TP=-2:LRA=7' \
              -codec:a libmp3lame -q:a 5 "$out"
            test -s "$out"
          done
          rm assets/music/*.ogg

      - name: Commit mobile soundtrack and remove converter
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/convert-music.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music .github/workflows/convert-music.yml
          git commit -m 'Normalize and convert soundtrack to MP3'
          git push origin HEAD:main
