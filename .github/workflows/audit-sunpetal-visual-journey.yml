name: Audit Sunpetal Visual Journey

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static integrity checks
        run: |
          node --check level-variation400.js
          node --check story-grounding400.js
          node --check cinematic-dialogue400.js
          node --check cinematics400.js
          node --check game400-a.js
          node --check game400-b.js
          test "$(git diff --name-only eb3fb94a20befb81cb2e178d186bd08e5e16ba49..HEAD -- 'campaign400-*.js' | wc -l)" -eq 0
          grep -q 'style400-level-variation.css' index.html
          grep -q 'style400-whimsy-font.css' index.html
          grep -q 'style400-cinematics-dialogue.css' index.html
          grep -q 'story-grounding400.js' index.html
          grep -q 'cinematic-dialogue400.js' index.html
          grep -q 'level-variation400.js' index.html
          grep -q 'coordination point, not a command center' STORY_BIBLE.md
          ! grep -q '^\*\*Narrator:\*\*' CINEMATICS_SCRIPT.md
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          python3 -m pip install --quiet pillow
      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/latchlings-server.log 2>&1 &
          echo $! > /tmp/latchlings-server.pid
          sleep 2
      - name: Create browser audit harness
        run: |
          cat > /tmp/audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          const OUT='audit-renders';fs.mkdirSync(OUT,{recursive:true});fs.mkdirSync(path.join(OUT,'levels'),{recursive:true});fs.mkdirSync(path.join(OUT,'cinematics'),{recursive:true});
          const fail=(m)=>{throw new Error(m)};
          const browser=await chromium.launch({headless:true});
          const errors=[];
          const makePage=async(viewport={width:390,height:844},reducedMotion='no-preference')=>{
            const context=await browser.newContext({viewport,reducedMotion});
            const page=await context.newPage();
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('console',m=>{if(m.type()==='error'&&!/ERR_ABORTED|favicon/i.test(m.text()))errors.push('console: '+m.text())});
            return {context,page};
          };
          const seed=async(page)=>page.addInitScript(()=>{
            const stars={};for(let i=1;i<=400;i++)stars[i]=0;
            localStorage.setItem('latchlings_campaign400_progress_v1',JSON.stringify({unlocked:400,stars}));
            const story={};for(let i=1;i<=400;i++)story[i]=1;
            localStorage.setItem('latchlings_story_cards_seen_v1',JSON.stringify(story));
            localStorage.setItem('latchlings_cinematics_seen_v1',JSON.stringify({opening:1,'across-drift':1,'old-maps':1,homeward:1}));
          });
          const phaseKeys=['home-morning','meadow-detours','open-fields','reroute-work','golden-return'];
          const subjects=['breakfast','watering','kite','bread','mail','tea','gate','picnic','cart','scarf'];
          const landmarks=['.lv-cottage','.lv-signpost','.lv-windmill','.lv-route-stake','.lv-lantern'];
          const {context,page}=await makePage();await seed(page);await page.goto('http://127.0.0.1:8080/',{waitUntil:'networkidle'});
          const levelManifest=[];
          for(let L=1;L<=50;L++){
            await page.evaluate(n=>startLevel(n),L);await page.waitForTimeout(L===1?320:110);
            const data=await page.evaluate(({L,phaseKeys,subjects,landmarks})=>{
              const app=document.getElementById('app'),game=document.getElementById('game'),env=document.getElementById('levelEnvironment'),board=document.getElementById('board');
              const phase=Math.floor((L-1)/10),slot=(L-1)%10,land=document.querySelector(landmarks[phase]),br=board.getBoundingClientRect(),center=document.elementFromPoint(br.left+br.width/2,br.top+br.height/2);
              return {phase:app.dataset.sunpetalPhase,envPhase:env?.dataset.phase,ambient:env?.dataset.ambient,subject:game.dataset.levelSubject,milestone:env?.classList.contains('milestone'),envHidden:!!env?.hidden,landVisible:!!land&&getComputedStyle(land).display!=='none'&&land.getBoundingClientRect().width>0,overflow:document.documentElement.scrollWidth-window.innerWidth,boardTop:br.top,boardBottom:br.bottom,boardInside:!!center&&board.contains(center),font:getComputedStyle(document.querySelector('.game-title')).fontFamily,logoFont:getComputedStyle(document.querySelector('#game .logo')).fontFamily};
            },{L,phaseKeys,subjects,landmarks});
            const phase=Math.floor((L-1)/10),slot=(L-1)%10;
            if(data.phase!==String(phase+1))fail(`Level ${L}: wrong phase ${data.phase}`);
            if(data.envPhase!==phaseKeys[phase])fail(`Level ${L}: wrong environment phase ${data.envPhase}`);
            if(data.subject!==subjects[slot])fail(`Level ${L}: wrong subject ${data.subject}`);
            if(data.ambient!==((slot<5)?'a':'b'))fail(`Level ${L}: wrong ambient ${data.ambient}`);
            if(data.milestone!==(L%10===0))fail(`Level ${L}: wrong milestone state`);
            if(data.envHidden)fail(`Level ${L}: environment hidden`);
            if(!data.landVisible)fail(`Level ${L}: phase landmark is not visible`);
            if(data.overflow>1)fail(`Level ${L}: horizontal overflow ${data.overflow}`);
            if(!data.boardInside)fail(`Level ${L}: environment or prop obscures board center`);
            if(!/Rounded|Trebuchet|ui-rounded/i.test(data.font))fail(`Whimsical game font missing: ${data.font}`);
            if(!/Georgia/i.test(data.logoFont))fail(`Gameplay Latchlings logo font changed: ${data.logoFont}`);
            const file=path.join(OUT,'levels',`level-${String(L).padStart(2,'0')}.png`);await page.screenshot({path:file,fullPage:true});
            levelManifest.push({level:L,...data,file});
          }
          // Reactive environment should visibly change state as helpers are delivered.
          await page.evaluate(()=>startLevel(19));await page.waitForTimeout(120);
          const totalPieces=await page.locator('#pieceLayer .latchling').count();if(totalPieces<2)fail('Reactive test level does not contain enough helpers');
          await page.evaluate(()=>document.querySelector('#pieceLayer .latchling')?.remove());await page.waitForTimeout(80);
          let state=await page.locator('#game').getAttribute('data-route-progress');if(state!=='working')fail('Reactive scenery did not enter working state');
          await page.evaluate(()=>document.querySelectorAll('#pieceLayer .latchling').forEach(x=>x.remove()));await page.waitForTimeout(80);
          state=await page.locator('#game').getAttribute('data-route-progress');if(state!=='complete')fail('Reactive scenery did not enter complete state');
          // Player-facing story copy must explain the cooperative model.
          const storyGrounding=await page.evaluate(()=>({motto:LATCHLINGS_STORY.helperCrewMotto,explain:LATCHLINGS_STORY.helperCrewExplanation,premise:LATCHLINGS_STORY.premise}));
          if(!/Every island knows its own paths/i.test(storyGrounding.motto)||!/not a command center/i.test(storyGrounding.explain)||!/first household/i.test(storyGrounding.premise))fail('Community rationale is not exposed through production story data');
          await context.close();

          // Audit every cinematic beat for separation of narrator copy and character speech.
          const {context:cinContext,page:cinPage}=await makePage();await cinPage.goto('http://127.0.0.1:8080/',{waitUntil:'networkidle'});
          const cinematicManifest=[];const ids=['opening','across-drift','old-maps','homeward'];
          for(const id of ids){
            const shown=await cinPage.evaluate(id=>window.LatchlingsCinematics.show(id,{markSeen:false}),id);if(!shown)fail(`Could not show ${id}`);await cinPage.waitForTimeout(220);
            const count=await cinPage.evaluate(()=>window.LatchlingsCinematics.CINEMATICS[window.LatchlingsCinematics.active].beats.length);
            for(let i=0;i<count;i++){
              if(i){await cinPage.evaluate(()=>window.LatchlingsCinematics.next());await cinPage.waitForTimeout(140)}
              const d=await cinPage.evaluate(()=>{
                const api=window.LatchlingsCinematics,beat=api.CINEMATICS[api.active].beats[api.beat],groups=window.LatchlingsCinematicDialogue.dialogueGroups(beat),narr=window.LatchlingsCinematicDialogue.narratorLines(beat),stage=document.getElementById('cinematicStage'),lines=document.getElementById('cinematicLines');
                return {id:api.active,index:api.beat,label:beat.label,expectedSpeakers:groups.length,expectedNarrators:narr.length,bubbles:stage.querySelectorAll('.cin-speech-bubble').length,speakers:stage.querySelectorAll('.cin-dialogue-speaker,.cin-intro-person').length,narrators:lines.querySelectorAll('.narrator-only').length,bottomVisibleText:Array.from(lines.querySelectorAll('.narrator-only')).map(x=>x.textContent).join(' '),hasOldDialogue:lines.querySelectorAll('.dialogue').length,introPeople:stage.querySelectorAll('.cin-intro-person').length,introNames:Array.from(stage.querySelectorAll('.cin-intro-person .cin-speaker-name')).map(x=>x.textContent),overflow:document.documentElement.scrollWidth-window.innerWidth};
              });
              if(d.bubbles!==d.expectedSpeakers)fail(`${id} beat ${i+1}: expected ${d.expectedSpeakers} speech bubbles, got ${d.bubbles}`);
              if(d.narrators!==d.expectedNarrators)fail(`${id} beat ${i+1}: narrator count mismatch`);
              if(d.hasOldDialogue)fail(`${id} beat ${i+1}: old bottom dialogue remains`);
              if(/Narrator/i.test(d.bottomVisibleText))fail(`${id} beat ${i+1}: visible Narrator label remains`);
              if(d.overflow>1)fail(`${id} beat ${i+1}: horizontal overflow`);
              if(id==='opening'&&i===1){if(d.introPeople!==5)fail('Opening cast intro does not identify five residents');const names=['Pippa','Bramble','Rowan','Pip','Tansy'];if(names.some(n=>!d.introNames.includes(n)))fail('Opening cast intro names are incomplete')}
              const capture=id==='opening'||i===0||i===count-1;
              let file=null;if(capture){file=path.join(OUT,'cinematics',`${id}-${String(i+1).padStart(2,'0')}.png`);await cinPage.screenshot({path:file,fullPage:true})}
              cinematicManifest.push({...d,file});
            }
            await cinPage.evaluate(()=>window.LatchlingsCinematics.finish(false));await cinPage.waitForTimeout(70);
          }
          await cinContext.close();

          // Wide + reduced-motion presentation and untouched title/tagline typography inside the iframe.
          const {context:wideContext,page:wide}=await makePage({width:900,height:844},'reduce');await wide.goto('http://127.0.0.1:8080/',{waitUntil:'networkidle'});
          await wide.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));await wide.waitForTimeout(160);await wide.evaluate(()=>window.LatchlingsCinematics.next());await wide.waitForTimeout(160);
          const wideData=await wide.evaluate(()=>({overflow:document.documentElement.scrollWidth-window.innerWidth,people:document.querySelectorAll('.cin-intro-person').length,animations:Array.from(document.querySelectorAll('.cin-dialogue-layer *')).map(x=>getComputedStyle(x).animationName).filter(x=>x&&x!=='none')}));
          if(wideData.overflow>1||wideData.people!==5||wideData.animations.length)fail('Wide/reduced-motion cinematic presentation failed');
          await wide.screenshot({path:path.join(OUT,'cinematics','opening-cast-wide-reduced.png'),fullPage:true});await wide.evaluate(()=>window.LatchlingsCinematics.finish(false));
          const titleData=await wide.evaluate(()=>{const f=document.getElementById('homeTitleFrame'),d=f.contentDocument;return {titleFont:getComputedStyle(d.querySelector('#c2 .toy-logo')).fontFamily,tagFont:getComputedStyle(d.querySelector('#c2 .toy-tagline')).fontFamily,titleText:d.querySelector('#c2 .toy-logo')?.textContent?.replace(/\s+/g,''),tagText:d.querySelector('#c2 .toy-tagline')?.textContent?.trim()}});
          if(!/Arial Rounded|Trebuchet/i.test(titleData.titleFont)||!/Inter|Avenir Next|system-ui/i.test(titleData.tagFont))fail('Title or tagline typography changed unexpectedly');
          await wideContext.close();
          if(errors.length)fail('Browser errors:\n'+errors.join('\n'));
          fs.writeFileSync(path.join(OUT,'manifest.json'),JSON.stringify({levels:levelManifest,cinematics:cinematicManifest,title:titleData},null,2));
          await browser.close();
          EOF
      - name: Run browser audit
        run: node /tmp/audit.mjs
      - name: Build visual contact sheets
        if: always()
        run: |
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import os,glob,math
          os.makedirs('audit-renders/contact-sheets',exist_ok=True)
          files=sorted(glob.glob('audit-renders/levels/level-*.png'))
          def sheet(items,path,cols,thumbw):
              if not items: return
              samples=[Image.open(f).convert('RGB') for f in items]
              ratio=samples[0].height/samples[0].width
              thumbh=int(thumbw*ratio)
              rows=math.ceil(len(items)/cols)
              canvas=Image.new('RGB',(cols*thumbw,rows*(thumbh+18)),'white');draw=ImageDraw.Draw(canvas)
              for i,(im,f) in enumerate(zip(samples,items)):
                  im.thumbnail((thumbw,thumbh))
                  x=(i%cols)*thumbw;y=(i//cols)*(thumbh+18)
                  canvas.paste(im,(x,y));draw.text((x+4,y+thumbh+2),os.path.basename(f).replace('.png',''),fill='black')
              canvas.save(path,quality=90)
          if len(files)==50:
              sheet(files,'audit-renders/contact-sheets/all-50-overview.jpg',10,117)
              for p in range(5): sheet(files[p*10:(p+1)*10],f'audit-renders/contact-sheets/phase-{p+1}.jpg',5,195)
          cfiles=sorted(glob.glob('audit-renders/cinematics/*.png'))
          sheet(cfiles,'audit-renders/contact-sheets/cinematics.jpg',4,195)
          PY
      - name: Upload audit renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sunpetal-visual-journey-audit
          path: audit-renders
          if-no-files-found: warn
      - name: Remove temporary audit workflow
        if: always()
        run: |
          rm -f .github/workflows/audit-sunpetal-visual-journey.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/audit-sunpetal-visual-journey.yml
          if ! git diff --cached --quiet; then
            git commit -m "Remove temporary Sunpetal visual audit"
            git push
          fi
