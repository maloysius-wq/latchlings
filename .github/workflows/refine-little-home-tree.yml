name: Refine Little Home Tree

on:
  push:
    paths:
      - '.github/workflows/refine-little-home-tree.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply organic tree refinement
        run: python3 .github/scripts/refine_little_home_tree.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          checks={
              'dedicated tree':'little-home-tree',
              'tree shadow':'tree-ground-shadow',
              'foliage wrapper':'class="foliage"',
              'wood texture':"url('textures/wood.jpg')",
              'grass texture':"url('textures/grass.jpg')",
              'canopy motion':'@keyframes littleHomeCanopy',
          }
          for name,token in checks.items():
              if token not in t:
                  raise SystemExit(f'Missing {name}: {token}')
          if c2.count('leaf-cluster') != 7:
              raise SystemExit(f'Expected 7 foliage clusters, got {c2.count("leaf-cluster")}')
          if c2.count('branch branch-') != 3:
              raise SystemExit(f'Expected 3 branch forms, got {c2.count("branch branch-")}')
          if c2.count('root root-') != 3:
              raise SystemExit(f'Expected 3 root forms, got {c2.count("root root-")}')
          if 'crown one' in c2 or 'crown two' in c2 or 'crown three' in c2:
              raise SystemExit('Old three-circle Concept 2 canopy still present')
          residents=re.findall(r'<div class="latchling ([^"]+)"[^>]*data-role="(adult|child)"',c2)
          roles=[r for _,r in residents]
          if len(residents)!=6 or roles.count('adult')!=4 or roles.count('child')!=2:
              raise SystemExit(f'Little Home household changed unexpectedly: {roles}')
          if 'class="fence"' in c2:
              raise SystemExit('Concept 2 fence reappeared')
          if '<img' in t.lower() or 'https://' in c2 or 'http://' in c2:
              raise SystemExit('Unexpected image element or runtime hotlink')
          print('STATIC_TREE_OK', {'foliage':7,'branches':3,'roots':3,'residents':len(residents)})
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js style400-game.css

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          TREE_NODE="$RUNNER_TEMP/little-home-tree-node"
          mkdir -p "$TREE_NODE"
          cd "$TREE_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and screenshots
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD"
          TREE_NODE="$RUNNER_TEMP/little-home-tree-node"
          mkdir -p tree-renders
          python3 -m http.server 8125 >/tmp/little-home-tree-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > "$TREE_NODE/validate-tree.mjs" <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          page.on('pageerror',e=>errors.push('pageerror:'+e.message));
          page.on('requestfailed',r=>errors.push('request:'+r.url()));
          const res=await page.goto('http://127.0.0.1:8125/title-island-concepts/?c=2',{waitUntil:'networkidle'});
          if(!res?.ok())throw new Error('Little Home response failed');
          await page.waitForTimeout(650);
          const sample=async()=>page.evaluate(()=>{
            const a=document.querySelector('#c2.active');
            const box=s=>{const r=a.querySelector(s).getBoundingClientRect();return {x:r.x,y:r.y,left:r.left,right:r.right,top:r.top,bottom:r.bottom,w:r.width,h:r.height}};
            const leaves=[...a.querySelectorAll('.little-home-tree .leaf-cluster')];
            const trunk=a.querySelector('.little-home-tree .trunk');
            return {
              bodyWidth:document.body.scrollWidth,viewport:innerWidth,
              phone:box('.phone'),brand:box('.brand'),tree:box('.little-home-tree'),cottage:box('.cottage'),play:box('.play'),secondary:box('.secondary'),
              leaves:leaves.length,branches:a.querySelectorAll('.little-home-tree .branch').length,roots:a.querySelectorAll('.little-home-tree .root').length,
              foliageTransform:getComputedStyle(a.querySelector('.little-home-tree .foliage')).transform,
              leafBackground:getComputedStyle(leaves[0]).backgroundImage,
              trunkBackground:getComputedStyle(trunk).backgroundImage,
              residents:a.querySelectorAll('.resident').length,children:a.querySelectorAll('.resident.child').length,
              imgs:a.querySelectorAll('img').length,fences:a.querySelectorAll('.fence').length
            };
          });
          const s0=await sample();
          await page.screenshot({path:`${process.env.GITHUB_WORKSPACE}/tree-renders/little-home-tree-phase-1.png`,fullPage:true});
          await page.waitForTimeout(1800);
          const s1=await sample();
          await page.screenshot({path:`${process.env.GITHUB_WORKSPACE}/tree-renders/little-home-tree-phase-2.png`,fullPage:true});
          await page.waitForTimeout(1800);
          const s2=await sample();
          await page.screenshot({path:`${process.env.GITHUB_WORKSPACE}/tree-renders/little-home-tree-phase-3.png`,fullPage:true});
          if(s0.bodyWidth>s0.viewport+1)throw new Error(`Horizontal overflow ${s0.bodyWidth}/${s0.viewport}`);
          if(s0.phone.left<-1||s0.phone.right>s0.viewport+1||s0.secondary.bottom>s0.phone.bottom+1)throw new Error('Phone/UI bounds failed');
          if(s0.leaves!==7||s0.branches!==3||s0.roots!==3||s0.residents!==6||s0.children!==2||s0.imgs!==0||s0.fences!==0)throw new Error('Tree/household structure mismatch '+JSON.stringify(s0));
          if(!s0.leafBackground.includes('grass.jpg')||!s0.trunkBackground.includes('wood.jpg'))throw new Error('Tree texture mapping missing');
          if(s0.tree.top < s0.brand.bottom+20)throw new Error('Tree crowds title branding');
          if(s0.tree.right > s0.cottage.left-18)throw new Error('Tree crowds cottage');
          if(s0.tree.bottom > s0.play.top-95)throw new Error('Tree crowds primary controls');
          if(s0.foliageTransform===s1.foliageTransform && s1.foliageTransform===s2.foliageTransform)throw new Error('Canopy sway did not change across samples');
          if(errors.length)throw new Error(errors.join(' | '));
          console.log('TREE_BROWSER_OK',JSON.stringify({tree:s0.tree,cottage:s0.cottage,leaves:s0.leaves,branches:s0.branches,roots:s0.roots,canopy:[s0.foliageTransform,s1.foliageTransform,s2.foliageTransform]}));
          for(const id of [1,3]){
            const p=await browser.newPage({viewport:{width:390,height:844}});
            const localErrors=[];
            p.on('pageerror',e=>localErrors.push(e.message));
            p.on('requestfailed',r=>localErrors.push(r.url()));
            await p.goto(`http://127.0.0.1:8125/title-island-concepts/?c=${id}`,{waitUntil:'networkidle'});
            const sanity=await p.evaluate(()=>({active:document.querySelector('.concept.active')?.id,count:document.querySelector('.concept.active')?.querySelectorAll('.latchling').length,overflow:document.body.scrollWidth-innerWidth,organic:document.querySelector('.concept.active')?.querySelectorAll('.little-home-tree').length}));
            const expected=id===1?6:7;
            if(sanity.active!==`c${id}`||sanity.count!==expected||sanity.overflow>1||sanity.organic!==0||localErrors.length)throw new Error(`Concept ${id} sanity failed ${JSON.stringify({sanity,localErrors})}`);
            await p.close();
          }
          await browser.close();
          JS
          node "$TREE_NODE/validate-tree.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-tree-renders
          path: tree-renders/*.png
          if-no-files-found: error

      - name: Commit validated tree and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tree-renders
          rm -f .github/workflows/refine-little-home-tree.yml .github/scripts/refine_little_home_tree.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-tree.yml .github/scripts/refine_little_home_tree.py
          git commit -m 'Grow a textured organic Little Home tree'
          git pull --rebase origin main
          git push origin HEAD:main
