name: Astra Character World Committed Main

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/astra-character-world-live.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c7d78aa61080513ac6f7ea31d9e82d7cd4ee2a4e
          fetch-depth: 0
      - name: Verify exact promoted product
        shell: bash
        run: |
          git diff --exit-code c4cab777dceb1b2162efa42fbd2fa126ef57b84a c7d78aa61080513ac6f7ea31d9e82d7cd4ee2a4e -- \
            story-grounding400.js \
            gameplay-story-rail400.js \
            story-theme400.js \
            game400-a.js \
            game400-b.js \
            title-island-concepts/index.html \
            style400-story-theme.css \
            style400-skyway-atlas.css \
            index.html
          node --check story-grounding400.js
          node --check gameplay-story-rail400.js
          node --check story-theme400.js
          node --check game400-a.js
          node --check game400-b.js
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate committed behavior matrix
        shell: bash
        run: |
          mkdir -p /tmp/astra-character-world-live
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/astra-character-world-live-http.log 2>&1 &
          cat > .astra-character-world-live.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const sizes=[{name:'short',width:320,height:568},{name:'phone',width:390,height:844},{name:'wide',width:430,height:932}];
          const results=[];
          for(const size of sizes){
            const context=await browser.newContext({viewport:{width:size.width,height:size.height},reducedMotion:'no-preference'});const page=await context.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror ${e.message}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console ${m.text()}`)});
            await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            await page.evaluate(()=>{progress={unlocked:80,stars:{50:3}};startLevel(62)});await page.waitForTimeout(80);
            const motive=await page.evaluate(()=>({role:document.querySelector('#storyRailSlot [data-story-role]')?.dataset.storyRole||'',line:document.querySelector('#storyRailSlot p')?.textContent?.trim()||'',expected:LATCHLINGS_STORY.levelMeta(62).context}));
            if(motive.role!=='motive'||motive.line!==motive.expected)throw new Error(`${size.name}: motive ${JSON.stringify(motive)}`);
            await page.evaluate(()=>window.LatchlingsStoryTheme.show(61,false));await page.waitForTimeout(30);
            const clue=await page.evaluate(()=>({role:document.getElementById('storyCardOverlay')?.dataset.storyRole||'',line:document.querySelector('#storyCardLine em')?.textContent?.trim()||'',setup:LATCHLINGS_STORY.movementForLevel(61).setup,question:document.querySelector('#storyCardGoal span')?.textContent?.trim()||'',expectedQuestion:LATCHLINGS_STORY.movementForLevel(61).question}));
            if(clue.role!=='movement-clue'||clue.line!==clue.setup||clue.question!==clue.expectedQuestion)throw new Error(`${size.name}: clue ${JSON.stringify(clue)}`);
            await page.evaluate(()=>{window.LatchlingsStoryTheme.close(false);startLevel(60);winLevel()});
            const result=await page.evaluate(()=>({role:document.querySelector('.story-beat-result')?.dataset.storyRole||'',text:document.querySelector('.story-beat-result p')?.textContent?.trim()||'',expected:LATCHLINGS_STORY.beatForLevel(60).text}));
            if(result.role!=='result'||result.text!==result.expected)throw new Error(`${size.name}: result ${JSON.stringify(result)}`);await page.evaluate(()=>closeModal());
            await page.evaluate(()=>{progress={unlocked:121,stars:{50:3,100:3,110:3,120:3}};openStoryScreen()});
            const journal=await page.evaluate(()=>({briefing:document.querySelectorAll('#storyNowPanel [data-story-role="briefing"]').length,recaps:document.querySelectorAll('#storyJourneyPanel [data-story-role="recap"]').length}));
            if(journal.briefing!==1||journal.recaps<2)throw new Error(`${size.name}: journal ${JSON.stringify(journal)}`);
            const expr=await page.evaluate(()=>({rowanA:LatchlingsStoryTheme.expressionForLine('Rowan','The route failed after fresh drift.'),rowanB:LatchlingsStoryTheme.expressionForLine('Rowan','The route works and home is connected.'),tansyA:LatchlingsStoryTheme.expressionForLine('Tansy','A missed visit left our friend farther away.'),tansyB:LatchlingsStoryTheme.expressionForLine('Tansy','Our friend can visit home again.'),pipA:LatchlingsStoryTheme.expressionForLine('Pip','I found an overlooked marker.'),pipB:LatchlingsStoryTheme.expressionForLine('Pip','I found a shortcut.')}));
            if(expr.rowanA===expr.rowanB||expr.tansyA===expr.tansyB||expr.pipA===expr.pipB)throw new Error(`${size.name}: expressions ${JSON.stringify(expr)}`);
            const fixtures=await page.evaluate(()=>({lantern:LATCHLINGS_STORY.movementFixtureFor(71).id,prism:LATCHLINGS_STORY.movementFixtureFor(221).id,markerA:LATCHLINGS_STORY.movementFixtureFor(21).id,markerB:LATCHLINGS_STORY.movementFixtureFor(111).id}));
            if(fixtures.lantern!=='twin-lantern-porch'||fixtures.prism!==fixtures.lantern||fixtures.markerA!=='waykeeper-marker'||fixtures.markerB!==fixtures.markerA)throw new Error(`${size.name}: fixtures ${JSON.stringify(fixtures)}`);
            const landmarks=await page.evaluate(()=>{progress={unlocked:400,stars:{}};const rows=[];for(let ch=1;ch<=8;ch++){const labels=[];for(let r=0;r<5;r++){chapterView=ch;rangeView=r;screen('levels');renderChapter();const n=document.querySelector('#levelGrid .atlas-node.milestone');labels.push({label:n?.dataset.landmarkLabel||'',fixture:n?.dataset.fixture||'',kind:n?.dataset.landmarkKind||'',mark:!!n?.querySelector('.atlas-landmark-mark')})}rows.push(labels)}return rows});
            for(const labels of landmarks){if(labels.length!==5||new Set(labels.map(x=>x.label)).size!==5||labels.some(x=>!x.label||!x.fixture||!x.kind||!x.mark))throw new Error(`${size.name}: Atlas landmark contract ${JSON.stringify(labels)}`)}
            await page.evaluate(()=>{progress={unlocked:351,stars:{50:3,100:3,150:3,200:3,250:3,300:3,350:3}};screen('home');updateHome(false)});await page.waitForTimeout(100);
            const frame=page.frames().find(f=>f.url().includes('title-island-concepts'));if(!frame)throw new Error(`${size.name}: Home frame missing`);
            const home=await frame.evaluate(()=>({uses:window.LatchlingsHomeLife?.keepsakeUses||[],pip:!!document.querySelector('[data-resident="Pip"]'),tansy:!!document.querySelector('[data-resident="Tansy"]'),unlocked:document.querySelectorAll('.story-keepsake.memory-unlocked').length}));
            if(home.uses.length!==7||new Set(home.uses.map(x=>x.keepsake)).size!==7||!home.pip||!home.tansy||home.unlocked!==7)throw new Error(`${size.name}: Home contract ${JSON.stringify(home)}`);
            await frame.evaluate(()=>{window.LatchlingsHomeLife.stopChildren();window.LatchlingsHomeLife.stopAdults()});await page.evaluate(()=>focusHomeReward('anchor'));await page.waitForTimeout(330);
            await frame.waitForFunction(()=>document.querySelector('[data-resident="Rowan"]')?.dataset.keepsakeUse==='anchor'&&document.querySelector('[data-memory="anchor"]')?.classList.contains('is-being-used'),null,{timeout:2500});
            await page.waitForTimeout(1600);await frame.evaluate(()=>{window.LatchlingsHomeLife.stopChildren();void window.LatchlingsHomeLife.runChild('Pip')});
            await frame.waitForFunction(()=>{const x=document.querySelector('[data-resident="Pip"]');return /overlooked marker|shortcut/.test(x?.dataset.behaviorAction||'')&&['curious','smug'].includes(x?.dataset.expression)},null,{timeout:3000});
            const pip=await frame.evaluate(()=>{const x=document.querySelector('[data-resident="Pip"]');return {action:x.dataset.behaviorAction,expr:x.dataset.expression}});await frame.evaluate(()=>window.LatchlingsHomeLife.stopChildren());
            await frame.evaluate(()=>{window.LatchlingsHomeLife.stopChildren();void window.LatchlingsHomeLife.runChild('Tansy')});await frame.waitForFunction(()=>{const x=document.querySelector('[data-resident="Tansy"]');return /missed visit|friends can visit/.test(x?.dataset.behaviorAction||'')&&['curious','happy'].includes(x?.dataset.expression)},null,{timeout:3000});
            const tansy=await frame.evaluate(()=>{const x=document.querySelector('[data-resident="Tansy"]');return {action:x.dataset.behaviorAction,expr:x.dataset.expression}});await frame.evaluate(()=>window.LatchlingsHomeLife.stopChildren());
            await frame.evaluate(()=>document.querySelector('[data-memory="telescope"]')?.click());const memory=await page.locator('#modal').textContent();if(!memory.includes('Prism Telescope')||!memory.includes('Prism Gardens'))throw new Error(`${size.name}: memory regression`);await page.evaluate(()=>closeModal());
            await page.evaluate(()=>window.LatchlingsPrefs.set('motion','reduced'));await page.waitForTimeout(120);const reduced=await frame.evaluate(()=>({motion:document.documentElement.dataset.motion,work:document.querySelectorAll('.work-active').length,behavior:document.querySelectorAll('.behavior-active').length,running:document.getAnimations().filter(a=>a.playState==='running'&&a.effect?.target?.closest?.('#c2 .resident')).length}));if(reduced.motion!=='reduced'||reduced.work||reduced.behavior||reduced.running)throw new Error(`${size.name}: reduced ${JSON.stringify(reduced)}`);
            await page.evaluate(()=>{window.LatchlingsPrefs.set('motion','system');screen('levels')});await page.waitForTimeout(150);const offscreen=await frame.evaluate(()=>({active:document.documentElement.dataset.sceneActive,work:document.querySelectorAll('.work-active').length,behavior:document.querySelectorAll('.behavior-active').length,running:document.getAnimations().filter(a=>a.playState==='running'&&a.effect?.target?.closest?.('#c2 .resident')).length}));if(offscreen.active!=='false'||offscreen.work||offscreen.behavior||offscreen.running)throw new Error(`${size.name}: offscreen ${JSON.stringify(offscreen)}`);
            if(size.name==='phone'){await page.evaluate(()=>{chapterView=5;rangeView=0;screen('levels');renderChapter()});await page.screenshot({path:'/tmp/astra-character-world-live/committed-atlas-phone.png',fullPage:true});await page.evaluate(()=>{progress={unlocked:351,stars:{50:3,100:3,150:3,200:3,250:3,300:3,350:3}};screen('home');updateHome(false)});await page.screenshot({path:'/tmp/astra-character-world-live/committed-home-phone.png',fullPage:true})}
            if(errors.length)throw new Error(`${size.name}: runtime errors ${errors.join(' | ')}`);
            results.push({size,motive,clue,result,journal,expr,fixtures,home,pip,tansy,reduced,offscreen});await context.close();
          }
          fs.writeFileSync('/tmp/astra-character-world-live/results.json',JSON.stringify(results,null,2));await browser.close();
          JS
          node .astra-character-world-live.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: astra-character-world-committed-main
          path: /tmp/astra-character-world-live
          if-no-files-found: error
