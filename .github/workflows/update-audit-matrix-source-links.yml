name: Update Astra matrix source links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-audit-matrix-source-links.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Correct canonical source language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ASTRA_AUDIT_ACCEPTANCE_MATRIX.md')
          s=p.read_text()
          old='The original standalone audit/review files were supplied outside the repository and therefore are not treated as repository source files. Their acceptance requirements are preserved here so future implementation work does not depend on an external attachment.'
          new='The canonical source documents now live in this repository as [`LATCHLINGS_VISUAL_STORY_AUDIT.md`](LATCHLINGS_VISUAL_STORY_AUDIT.md) and [`LATCHLINGS_IMPLEMENTATION_REVIEW.md`](LATCHLINGS_IMPLEMENTATION_REVIEW.md). This matrix is the living reconciliation ledger against those source documents and current `main`; it does not replace their original wording, evidence, or Pass 1–5 acceptance definitions.'
          assert old in s
          p.write_text(s.replace(old,new), newline='')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ASTRA_AUDIT_ACCEPTANCE_MATRIX.md
          git commit -m "Reference canonical Astra audit sources"
          git push origin HEAD:main
