name: Astra Atlas journal coherence promote

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-atlas-journal-promote.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Snapshot protected accepted sources
        shell: bash
        run: |
          sha256sum campaign400-{1,2,3,4,5,6,7,8}.js > /tmp/campaign-before.sha256
          sha256sum cinematics400.js cinematic-dialogue400.js style400-cinematics.css gameplay-story-rail400.js style400-story-rail-board.css title-island-concepts/index.html pass3-chapter5-prism.js pass3-chapter6-copperline.js pass3-chapter7-stormswitch.js pass3-chapter8-aurora.js > /tmp/accepted-before.sha256

      - name: Import exact accepted Atlas and journal product
        shell: bash
        run: |
          git fetch origin astra-atlas-journal-candidate
          git checkout b359b522961f01287dbe1c5a25a60d848c0fdead -- game400-a.js game400-b.js index.html style400-skyway-atlas.css style400-story-theme.css style400-atlas-progression.css
          git diff --exit-code b359b522961f01287dbe1c5a25a60d848c0fdead -- game400-a.js game400-b.js index.html style400-skyway-atlas.css style400-story-theme.css style400-atlas-progression.css

      - name: Verify protected sources and accepted invariants
        shell: bash
        run: |
          sha256sum -c /tmp/campaign-before.sha256
          sha256sum -c /tmp/accepted-before.sha256
          git diff --exit-code 99912672237fc7841244cd3ac1637bb39062f6db -- campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js cinematics400.js cinematic-dialogue400.js style400-cinematics.css gameplay-story-rail400.js style400-story-rail-board.css title-island-concepts/index.html pass3-chapter5-prism.js pass3-chapter6-copperline.js pass3-chapter7-stormswitch.js pass3-chapter8-aurora.js
          node --check game400-a.js
          node --check game400-b.js
          python - <<'PY'
          from pathlib import Path
          a=Path('game400-a.js').read_text(); b=Path('game400-b.js').read_text(); i=Path('index.html').read_text(); atlas=Path('style400-skyway-atlas.css').read_text(); story=Path('style400-story-theme.css').read_text(); prog=Path('style400-atlas-progression.css').read_text()
          assert 'atlas-region-dot' not in a[a.index('function renderChapter'):]
          assert 'atlas-range-current' in a and 'data-state="${state}"' in a
          assert "reward-working" in a and 'effectiveReducedMotion()' in a
          assert "STORY_SECTION_ORDER=['Now','Residents','Journey','Cinematics']" in b
          assert i.count('role="tab"') == 4 and 'storyNowPanel' in i and 'storyCinematicsPanel' in i
          assert 'Astra Atlas hierarchy coherence' in atlas
          assert 'Astra journal section coherence' in story
          assert 'Astra journal viewport containment' in story
          assert 'Astra working-landmark arrival' in prog
          print('Accepted Atlas/journal invariants passed.')
          PY

      - name: Commit exact accepted product to main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add game400-a.js game400-b.js index.html style400-skyway-atlas.css style400-story-theme.css style400-atlas-progression.css
          git commit -m "Promote accepted Atlas and journal coherence"
          git push origin HEAD:main
