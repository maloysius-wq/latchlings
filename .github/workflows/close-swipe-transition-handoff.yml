name: Close Swipe Transition Handoff

on:
  push:
    paths:
      - '.github/workflows/close-swipe-transition-handoff.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close handoff entry
        run: python3 .github/scripts/close_swipe_transition_handoff.py
      - name: Validate closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('DEVELOPMENT_HANDOFF.md').read_text()
          h='### 2026-09-03 — Replace veil transition with fast right-swipe motion blur and CC0 whoosh'
          s=t.index(h)
          nh=t.find('\n### ',s+len(h)); sep=t.find('\n---',s+len(h)); ends=[x for x in (nh,sep) if x>=0]; e=min(ends) if ends else len(t)
          x=t[s:e]
          for token in ['**Status: COMPLETED**','4eea640ff7e4b8f5025c06272d56274a0178abe6','33807719535','9913606116','33807823049','screen-swipe.wav','0.103923','0.002200','artisticdude','CC0']:
              assert token in x,token
          print('SWIPE_TRANSITION_HANDOFF_CLOSURE_OK')
          PY
      - name: Commit handoff and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/close-swipe-transition-handoff.yml .github/scripts/close_swipe_transition_handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-swipe-transition-handoff.yml .github/scripts/close_swipe_transition_handoff.py
          git commit -m 'Close fast swipe transition handoff'
          git pull --rebase origin main
          git push origin HEAD:main
