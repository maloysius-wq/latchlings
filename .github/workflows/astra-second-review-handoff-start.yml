name: Astra Second Review Handoff Start

on:
  push:
    branches:
      - astra-second-review-finishing
    paths:
      - '.github/workflows/astra-second-review-handoff-start.yml'

permissions:
  contents: write

jobs:
  mark-in-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-second-review-finishing
          fetch-depth: 0
      - name: Mark bounded finishing pass in progress
        shell: python
        run: |
          from pathlib import Path
          p = Path('DEVELOPMENT_HANDOFF.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Current work\n'
          section = '''\n### Astra second-review finishing pass\n**Status: IN PROGRESS**\n\nSource: [`LATCHLINGS_SECOND_REVIEW.md`](LATCHLINGS_SECOND_REVIEW.md), reviewing main `9dffa07d9f1fcd0c48029e13e8a641596c630fc8`. Preserve independently reverified R1-R5, authored campaign definitions/solutions, accepted Home/Atlas/journal/ending behavior, and completed browser-addressable certification.\n\nApproved bounded scope:\n- S1: visually stage the Opening beat-1 breakfast-basket travel and Across the Drift beat-5 reconnection to the same twin-lantern porch; add a small unattended-desk cue to Old Maps beat 4 only if it fits the existing composition cleanly.\n- S2: shorten first-run opening pacing to roughly five meaningful advances while retaining the complete canonical 8-beat / 18-utterance opening in Journal replay.\n- S3: raise journal primary body copy to a comfortable phone-reading baseline around 14px Normal / 16px Large and let the existing internal panels scroll.\n- S4: leave as deliberately deferred art-direction refinement unless the bounded S1-S3 changes naturally improve it.\n\nValidation contract: TDD RED before product edits; candidate-first browser validation at 320x568 / 390x844 / 430x932; visual proof screenshots for Opening beat 1 and Across beat 5 with dialogue hidden; full canonical cinematic replay preserved; journal text-size/containment regression checks; exact authored campaign hash protection; committed-main revalidation; temporary-workflow cleanup; final Pages and repository guard.\n\n'''
          if '### Astra second-review finishing pass' not in text:
              text = text.replace(marker, marker + section, 1)
          stale = 'Next action: Presentation/accessibility consolidation candidate. Preserve every accepted product slice while closing V04/V19/U02/U03/U11/V20 and the browser-addressable portions of A01/P01 where the source audit can be tested here; then run the full Pass 5 browser certification matrix. External physical-device, genuine iOS Safari, exhaustive assistive-technology, and subjective real-speaker/headphone certifications must remain explicitly unverified.'
          fresh = 'Next action: Complete the approved bounded second-review S1-S3 finishing pass on `astra-second-review-finishing`; keep S4 deliberately deferred unless a bounded change naturally improves it. External physical-device, genuine iOS Safari, exhaustive assistive-technology, and subjective real-speaker/headphone certifications remain explicitly unverified.'
          text = text.replace(stale, fresh)
          p.write_text(text, encoding='utf-8')
      - name: Commit handoff checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git diff --cached --quiet && exit 0
          git commit -m 'Mark Astra second-review finishing pass in progress'
          git push origin HEAD:astra-second-review-finishing
