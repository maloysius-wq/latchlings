name: Astra Second Review Committed Main

on:
  push:
    branches:
      - astra-second-review-finishing
    paths:
      - '.github/workflows/astra-second-review-live.yml'

jobs:
  committed-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact committed-main provenance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN=4e18050462d5b58d326a35130b4e9ec6ebe231c9
          ACCEPTED=bd0633290cbc01ce6dac398ab2ee49b8dcdb4f2c
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git fetch origin astra-second-review-finishing:refs/remotes/origin/astra-second-review-finishing
          for f in cinematics400.js style400-cinematics.css style400-story-theme.css index.html; do
            test "$(git rev-parse HEAD:$f)" = "$(git rev-parse $ACCEPTED:$f)"
          done
          for f in campaign400-{1..8}.js; do
            test "$(git rev-parse HEAD:$f)" = "$(git rev-parse 9dffa07d9f1fcd0c48029e13e8a641596c630fc8:$f)"
          done
          git show origin/astra-second-review-finishing:.github/tmp/astra_second_review_candidate.cjs > astra-second-live.cjs
          git show origin/astra-second-review-finishing:.github/tmp/astra_second_review_settled.cjs > astra-second-live-settled.cjs
      - name: Install browser runner
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Revalidate committed main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p second-review-evidence second-review-settled
          python3 -m http.server 4173 >/tmp/latchlings-second-live-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node astra-second-live.cjs
          node astra-second-live-settled.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: astra-second-review-committed-main-evidence
          path: |
            second-review-evidence
            second-review-settled
          if-no-files-found: error
