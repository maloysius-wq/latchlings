name: Fix Latchling Model Refresh Validator
on:
  push:
    paths:
      - '.github/workflows/fix-latchling-model-refresh-validator.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make blink phase sampling delay-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/implement-latchling-model-refresh-v2.yml')
          t=p.read_text()
          old="const expressionAudit=await page.evaluate(()=>{const piece=document.querySelector('#game .latchling'),eyes=piece.querySelector('.eyes'),anim=eyes.getAnimations().find(a=>a.animationName==='blinkCycle')||eyes.getAnimations()[0],duration=parseFloat(getComputedStyle(eyes).animationDuration)*1000;anim.pause();anim.currentTime=duration*.445;const closed=getComputedStyle(eyes).scale;anim.currentTime=duration*.10;const open=getComputedStyle(eyes).scale;anim.cancel();const all=['happy','surprised','angry','smug','sleepy','curious','determined'],out={closed,open,expr:{}};"
          new="const expressionAudit=await page.evaluate(async()=>{const piece=document.querySelector('#game .latchling'),eyes=piece.querySelector('.eyes'),anim=eyes.getAnimations().find(a=>a.animationName==='blinkCycle')||eyes.getAnimations()[0],timing=anim.effect.getTiming(),duration=Number(timing.duration)||parseFloat(getComputedStyle(eyes).animationDuration)*1000,delay=Number(timing.delay)||0,keyframes=anim.effect.getKeyframes();anim.pause();anim.currentTime=delay+duration*.445;await new Promise(r=>requestAnimationFrame(()=>r()));const closed=getComputedStyle(eyes).scale,closedRect=eyes.getBoundingClientRect().height;anim.currentTime=delay+duration*.10;await new Promise(r=>requestAnimationFrame(()=>r()));const open=getComputedStyle(eyes).scale,openRect=eyes.getBoundingClientRect().height;anim.cancel();const all=['happy','surprised','angry','smug','sleepy','curious','determined'],out={closed,open,closedRect,openRect,keyframes:keyframes.map(k=>({offset:k.offset,scale:k.scale})),expr:{}};"
          if old not in t: raise SystemExit('Blink audit anchor not found')
          t=t.replace(old,new,1)
          old2="ok(expressionAudit.closed.includes('0.07')||expressionAudit.closed.includes('0.069'),'Blink does not close '+expressionAudit.closed);ok(expressionAudit.open==='1'||expressionAudit.open==='1 1','Blink does not open '+expressionAudit.open);"
          new2="ok(expressionAudit.keyframes.some(k=>String(k.scale).includes('0.07')),'Blink keyframe missing '+JSON.stringify(expressionAudit.keyframes));ok(expressionAudit.closedRect<expressionAudit.openRect*.2,'Blink does not visibly close '+JSON.stringify(expressionAudit));ok(expressionAudit.openRect>expressionAudit.closedRect*4,'Blink does not visibly reopen '+JSON.stringify(expressionAudit));"
          if old2 not in t: raise SystemExit('Blink assertion anchor not found')
          t=t.replace(old2,new2,1)
          p.write_text(t)
          print('LATCHLING_BLINK_VALIDATOR_FIXED')
          PY
      - name: Commit validator fix and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-latchling-model-refresh-validator.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/implement-latchling-model-refresh-v2.yml .github/workflows/fix-latchling-model-refresh-validator.yml
          git commit -m 'Make Latchling blink validation delay-aware'
          git pull --rebase origin main
          git push origin HEAD:main
