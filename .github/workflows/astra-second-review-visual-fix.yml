name: Astra Second Review Visual Correction

on:
  push:
    branches:
      - astra-second-review-finishing
    paths:
      - '.github/workflows/astra-second-review-visual-fix.yml'

permissions:
  contents: write

jobs:
  visual-correction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-second-review-finishing
          fetch-depth: 0
      - name: Verify accepted candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          BASE=897cd8f82ea5dc3de51eb5db4f85be90e8ee93f0
          for f in cinematics400.js style400-cinematics.css style400-story-theme.css index.html; do
            test "$(git rev-parse "$BASE:$f")" = "$(git hash-object "$f")"
          done
          for f in campaign400-{1..8}.js; do
            test "$(git rev-parse 9dffa07d9f1fcd0c48029e13e8a641596c630fc8:$f)" = "$(git hash-object "$f")"
          done
      - name: Apply porch visibility correction
        run: python .github/tmp/astra_second_review_visual_fix.py
      - name: Verify correction scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "style400-cinematics.css"
          node --check cinematics400.js
      - name: Install browser runner
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Re-run full bounded candidate and settled visual captures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p second-review-evidence second-review-settled
          python3 -m http.server 4173 >/tmp/latchlings-second-visual-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node .github/tmp/astra_second_review_candidate.cjs
          node .github/tmp/astra_second_review_settled.cjs
      - name: Commit visual correction
        shell: bash
        run: |
          set -euo pipefail
          git restore package.json package-lock.json 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add style400-cinematics.css
          git diff --cached --quiet && { echo 'No correction staged'; exit 1; }
          git commit -m 'Make familiar porch legible in route reconnection [skip ci]'
          git push origin HEAD:astra-second-review-finishing
          git rev-parse HEAD > second-review-settled/candidate-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: astra-second-review-settled-visuals
          path: |
            second-review-settled
            second-review-evidence/results.json
          if-no-files-found: error
