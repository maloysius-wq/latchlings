name: Refine Campaign Cinematics
on:
  push:
    paths:
      - '.github/workflows/refine-campaign-cinematics.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply settled cinematic refinements
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          a=Path('game400-a.js')
          s=a.read_text()
          old="function startLevel(L){currentLevel=Math.max(1,Math.min(400,L));const lev=LEVELS[currentLevel-1];if(!lev){showError('Missing level '+currentLevel);return}chapterView=Math.ceil(currentLevel/50);rangeView=Math.floor(((currentLevel-1)%50)/10);applyTheme(chapterView);positions=lev.pieces.map(p=>p.pos.slice());doorMask=0;movesUsed=0;selected=0;hintStep=0;animating=false;screen('game');renderGame(true);const enterStory=()=>{if(window.LatchlingsStoryTheme)window.LatchlingsStoryTheme.enterLevel(currentLevel)};if(window.LatchlingsCinematics&&window.LatchlingsCinematics.maybeShowBeforeLevel(currentLevel,progress.unlocked,enterStory))return;enterStory()}"
          new="function startLevel(L){currentLevel=Math.max(1,Math.min(400,L));const lev=LEVELS[currentLevel-1];if(!lev){showError('Missing level '+currentLevel);return}chapterView=Math.ceil(currentLevel/50);rangeView=Math.floor(((currentLevel-1)%50)/10);applyTheme(chapterView);positions=lev.pieces.map(p=>p.pos.slice());doorMask=0;movesUsed=0;selected=0;hintStep=0;animating=false;screen('game');renderGame(true);const enterStory=()=>{if(window.LatchlingsStoryTheme)window.LatchlingsStoryTheme.enterLevel(currentLevel)},enterCinematicOrStory=()=>{if(window.LatchlingsCinematics&&window.LatchlingsCinematics.maybeShowBeforeLevel(currentLevel,progress.unlocked,enterStory))return;enterStory()};if(activeScreenTransition&&activeScreenTransition.finished)activeScreenTransition.finished.then(enterCinematicOrStory).catch(enterCinematicOrStory);else enterCinematicOrStory()}"
          if s.count(old)!=1: raise SystemExit(f'startLevel refinement count {s.count(old)}')
          a.write_text(s.replace(old,new))

          p=Path('style400-cinematics.css')
          s=p.read_text()
          old=".cin-home-island{position:absolute;width:244px;height:105px;left:50%;top:48%;translate:-50% -25%;background:linear-gradient(#91ce71 0 24%,#a97952 25% 62%,#675044 64% 100%);clip-path:polygon(2% 5%,98% 5%,91% 52%,68% 88%,50% 100%,30% 87%,9% 53%);filter:drop-shadow(0 15px 12px rgba(40,66,83,.18));animation:cinFloat 5.2s ease-in-out infinite}"
          new=".cin-home-island{position:absolute;width:244px;height:105px;left:50%;top:48%;translate:-50% -25%;background:linear-gradient(#91ce71 0 24%,#a97952 25% 62%,#675044 64% 100%);clip-path:polygon(2% 5%,98% 5%,91% 52%,68% 88%,50% 100%,30% 87%,9% 53%);filter:drop-shadow(0 15px 12px rgba(40,66,83,.18));animation:cinHomeFloat 5.2s ease-in-out infinite}"
          if s.count(old)!=1: raise SystemExit(f'home island rule count {s.count(old)}')
          s=s.replace(old,new)
          old=".cin-helper-story .portrait{left:50%;top:34%;translate:-50% -50%;width:56px;height:56px}"
          new=".cin-helper-story .portrait{left:50%;top:34%;translate:-50% -50%;width:56px;height:56px;animation:cinPortraitBob 2.8s ease-in-out infinite}"
          if s.count(old)!=1: raise SystemExit(f'portrait rule count {s.count(old)}')
          s=s.replace(old,new)
          old=".cin-demo-track .cin-character{position:relative;width:33px;height:33px}"
          new=".cin-demo-track .cin-character{display:block;position:relative;width:33px;height:33px}"
          if s.count(old)!=1: raise SystemExit(f'demo character rule count {s.count(old)}')
          s=s.replace(old,new)
          anchor="@keyframes cinFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}"
          insert="@keyframes cinFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}\n@keyframes cinHomeFloat{0%,100%{translate:-50% -25%}50%{translate:-50% calc(-25% - 5px)}}\n@keyframes cinPortraitBob{0%,100%{translate:-50% -50%}50%{translate:-50% calc(-50% - 2px)}}"
          if s.count(anchor)!=1: raise SystemExit(f'keyframe anchor count {s.count(anchor)}')
          p.write_text(s.replace(anchor,insert))
          PY
          node --check game400-a.js
          grep -q 'activeScreenTransition.finished.then(enterCinematicOrStory)' game400-a.js
          grep -q 'display:block;position:relative;width:33px;height:33px' style400-cinematics.css
          grep -q '@keyframes cinHomeFloat' style400-cinematics.css
          grep -q '@keyframes cinPortraitBob' style400-cinematics.css
      - name: Commit refinements and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-campaign-cinematics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game400-a.js style400-cinematics.css .github/workflows/refine-campaign-cinematics.yml
          git commit -m 'Refine cinematic transitions and staging'
          git pull --rebase origin main
          git push origin HEAD:main
