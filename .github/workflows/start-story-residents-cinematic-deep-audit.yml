name: Start Story Residents Cinematic Deep Audit Handoff
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current work
        env:
          ENTRY_B64: 
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          text=p.read_text()
          entry=base64.b64decode(os.environ['ENTRY_B64']).decode()
          heading='### 2026-09-10 — Deep audit Story/Residents Latchling faces and opening cinematic clipping'
          if heading not in text:
              text=text.replace('## Current Work\n','## Current Work\n'+entry,1)
              p.write_text(text)
          PY
      - name: Commit handoff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          git diff --cached --quiet || git commit -m "Start Story Residents cinematic deep audit"
          git push
      - name: Self-remove
        run: |
          git rm .github/workflows/start-story-residents-cinematic-deep-audit.yml
          git commit -m "Remove Story Residents cinematic audit starter"
          git push
