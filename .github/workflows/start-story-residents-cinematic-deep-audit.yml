name: Start Story Residents Cinematic Deep Audit Handoff
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/start-story-residents-cinematic-deep-audit.yml'
permissions:
  contents: write
jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current work
        shell: bash
        env:
          ENTRY_B64: ""
        run: |
          set -euo pipefail
          python3 -c 'import os,base64,pathlib; p=pathlib.Path("DEVELOPMENT_HANDOFF.md"); text=p.read_text(); entry=base64.b64decode(os.environ["ENTRY_B64"]).decode(); heading="### 2026-09-10 — Deep audit Story/Residents Latchling faces and opening cinematic clipping"; p.write_text(text if heading in text else text.replace("## Current Work\n","## Current Work\n"+entry,1))'
      - name: Commit handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEVELOPMENT_HANDOFF.md
          git diff --cached --quiet || git commit -m "Start Story Residents cinematic deep audit"
          git push
      - name: Self-remove
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/start-story-residents-cinematic-deep-audit.yml
          git commit -m "Remove Story Residents cinematic audit starter"
          git push
