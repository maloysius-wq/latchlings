name: Opening story balance

on:
  push:
    branches:
      - opening-story-balance

permissions:
  contents: write

jobs:
  opening-balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify handoff is in progress
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '### Opening story balance pass' DEVELOPMENT_HANDOFF.md
          grep -Fq '**Status: IN PROGRESS**' DEVELOPMENT_HANDOFF.md
          grep -Fq '[[0,0],[1,0],[1,1],[1,2],[1,3],[2,2],[3,0],[4,0],[6,0],[7,1]]' DEVELOPMENT_HANDOFF.md
      - name: Verify approved ten-step first-run opening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import ast, re
          src = Path('cinematics400.js').read_text()
          m = re.search(r'const OPENING_FIRST_RUN_STEPS=(\[[^;]+\]);', src)
          if not m:
              raise SystemExit('OPENING_FIRST_RUN_STEPS not found')
          actual = ast.literal_eval(m.group(1))
          expected = [[0,0],[1,0],[1,1],[1,2],[1,3],[2,2],[3,0],[4,0],[6,0],[7,1]]
          assert actual == expected, (actual, expected)
          required = [
              "['Pippa','Watering line first.']",
              "['Bramble','Bread route second.']",
              "['Rowan','And I will measure how far home moved overnight.']",
              "['Tansy','Please measure before breakfast becomes lunch.']",
              "['Rowan','Little Home is healthy. The routes are stopping where home used to be.']",
              "['Narrator','A working Skyway carries parcels, visits, and daily chores while the islands keep moving. The route adapts; the world does not hold still.']",
              "['Pippa','We sent the old Waykeeper call. You answered.']",
              "['Rowan','Choose a helper and a direction. They slide until the route gives them a real stopping point.']",
              "['Pip','Then we investigate breakfast.']",
          ]
          for line in required:
              assert line in src, line
          print('STATIC_OPENING_BALANCE_OK')
          PY
          test -z "$(git diff --name-only 9015bdb6b2f60e30b98afddc677e990ba8b1bff4 -- 'campaign400-*.js')"
          test -z "$(git diff --name-only 9015bdb6b2f60e30b98afddc677e990ba8b1bff4 -- style400-control-restoration.css style400-whimsy-font.css)"
      - name: Install browser validation runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate first-run story, replay, controls, and motion in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p opening-story-evidence
          python3 -m http.server 8000 >/tmp/latchlings-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const compactCoords = [[0,0],[1,0],[1,1],[1,2],[1,3],[2,2],[3,0],[4,0],[6,0],[7,1]];
          const sizes = [[320,568],[390,844],[430,932]];
          const shotSteps = new Set([0,1,4,5,6,7,8,9]);
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function presentedTurn(page) {
            return page.evaluate(() => {
              const api = window.LatchlingsCinematics;
              const [speaker, canonicalText] = api.CINEMATICS[api.active].beats[api.beat].lines[api.line];
              const overlay = document.querySelector('#cinematicOverlay');
              const lines = document.querySelector('#cinematicLines');
              let renderedSpeaker = null, renderedText = null, surface = null;
              if (speaker === 'Narrator') {
                renderedSpeaker = 'Narrator';
                renderedText = lines?.querySelector('.narrator-only span')?.textContent?.trim() || null;
                surface = 'narration';
              } else {
                const dock = document.querySelector('.cinematic-copy > .cin-opening-dialogue-dock');
                const row = dock?.querySelector(`[data-speaker="${CSS.escape(speaker)}"]`);
                renderedSpeaker = row?.dataset?.speaker || null;
                renderedText = row?.querySelector('.cin-opening-bubble > span')?.textContent?.trim() || null;
                surface = 'dialogue-dock';
              }
              const btn = document.querySelector('#cinematicNext');
              const r = btn.getBoundingClientRect();
              return {
                mode: api.mode, step: api.step, beat: api.beat, line: api.line,
                speaker, canonicalText, renderedSpeaker, renderedText, surface,
                narratorCount: overlay?.dataset?.narratorCount,
                dialogueCount: overlay?.dataset?.dialogueCount,
                counter: document.querySelector('#cinematicCounter')?.textContent?.trim(),
                button: {x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom,right:r.right},
                scrollW: overlay.scrollWidth, clientW: overlay.clientWidth,
                scrollH: overlay.scrollHeight, clientH: overlay.clientHeight,
                visible: getComputedStyle(btn).visibility !== 'hidden' && getComputedStyle(btn).display !== 'none'
              };
            });
          }
          function assertPresentation(state,label) {
            if (state.renderedSpeaker !== state.speaker || state.renderedText !== state.canonicalText) {
              throw new Error(`${label}: presentation mismatch: ${JSON.stringify(state)}`);
            }
            if (state.speaker === 'Narrator') {
              if (state.surface !== 'narration' || state.narratorCount !== '1' || state.dialogueCount !== '0') throw new Error(`${label}: narrator surface mismatch: ${JSON.stringify(state)}`);
            } else {
              if (state.surface !== 'dialogue-dock' || state.dialogueCount !== '1' || state.narratorCount !== '0') throw new Error(`${label}: dialogue surface mismatch: ${JSON.stringify(state)}`);
            }
          }
          async function collectCompact(page, label) {
            const started = await page.evaluate(() => window.LatchlingsCinematics.show('opening',{compact:true,markSeen:false}));
            if (!started) throw new Error(`${label}: compact opening did not start`);
            const turns = [];
            for (let i=0;i<compactCoords.length;i++) {
              await page.waitForSelector('#cinematicOverlay.show');
              await sleep(90);
              const state = await presentedTurn(page);
              const [eb,el] = compactCoords[i];
              if (state.mode !== 'first-run' || state.step !== i || state.beat !== eb || state.line !== el) throw new Error(`${label}: wrong compact coordinate at ${i}: ${JSON.stringify(state)}`);
              if (state.counter !== `${i+1} / 10`) throw new Error(`${label}: wrong counter ${state.counter}`);
              assertPresentation(state,`${label} compact step ${i+1}`);
              if (!state.visible || state.button.h < 44 || state.button.w < 44 || state.button.bottom > page.viewportSize().height + 1 || state.button.right > page.viewportSize().width + 1 || state.button.x < -1 || state.button.y < -1) throw new Error(`${label}: cinematic action control not safely visible: ${JSON.stringify(state.button)}`);
              if (state.scrollW > state.clientW + 1 || state.scrollH > state.clientH + 1) throw new Error(`${label}: cinematic overlay overflow ${state.scrollW}x${state.scrollH} vs ${state.clientW}x${state.clientH}`);
              turns.push(state);
              if (label === '390x844' && shotSteps.has(i)) await page.screenshot({path:`opening-story-evidence/opening-${String(i+1).padStart(2,'0')}.png`,fullPage:true});
              await page.click('#cinematicNext');
              await sleep(90);
            }
            if (await page.evaluate(() => !!window.LatchlingsCinematics.active)) throw new Error(`${label}: compact opening did not finish after ten advances`);
            return turns;
          }
          async function collectFull(page, id) {
            const expectedCount = await page.evaluate(id => window.LatchlingsCinematics.CINEMATICS[id].beats.reduce((n,b)=>n+b.lines.length,0), id);
            const started = await page.evaluate(id => window.LatchlingsCinematics.show(id,{markSeen:false}), id);
            if (!started) throw new Error(`${id}: full replay did not start`);
            let seen = 0;
            for (let i=0;i<expectedCount;i++) {
              await sleep(70);
              const state = await presentedTurn(page);
              if (state.mode !== 'full') throw new Error(`${id}: replay unexpectedly compact at turn ${i+1}`);
              assertPresentation(state,`${id} replay turn ${i+1}`);
              seen++;
              await page.click('#cinematicNext');
              await sleep(70);
            }
            if (await page.evaluate(() => !!window.LatchlingsCinematics.active)) throw new Error(`${id}: replay did not finish`);
            return seen;
          }
          (async () => {
            const browser = await chromium.launch({headless:true});
            const summary = {compact:{},full:{},reducedMotion:null,dpad:{}};
            for (const [w,h] of sizes) {
              const page = await browser.newPage({viewport:{width:w,height:h}});
              await page.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
              summary.compact[`${w}x${h}`] = await collectCompact(page,`${w}x${h}`);
              await page.close();
            }
            const replayPage = await browser.newPage({viewport:{width:390,height:844}});
            await replayPage.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            let total = 0;
            for (const id of ['opening','across-drift','old-maps','homeward']) {
              const n = await collectFull(replayPage,id);
              summary.full[id] = n;
              total += n;
            }
            if (summary.full.opening !== 18) throw new Error(`opening replay expected 18 utterances, got ${summary.full.opening}`);
            if (total !== 56) throw new Error(`all canonical cinematics expected 56 utterances, got ${total}`);
            await replayPage.evaluate(() => {
              document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
              document.querySelector('#game').classList.add('active');
              document.body.dataset.screen='game';
            });
            const dpad = await replayPage.evaluate(() => {
              const r=document.querySelector('#game .dpad').getBoundingClientRect(); return {w:r.width,h:r.height};
            });
            summary.dpad['390x844']=dpad;
            if (Math.abs(dpad.w-206.7)>1.2 || Math.abs(dpad.h-206.7)>1.2) throw new Error(`restored D-pad regressed: ${JSON.stringify(dpad)}`);
            await replayPage.close();
            const reducePage = await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
            await reducePage.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            await reducePage.evaluate(() => window.LatchlingsCinematics.show('opening',{compact:true,markSeen:false}));
            await sleep(180);
            const motion = await reducePage.evaluate(() => ({running:document.getAnimations().filter(a=>a.playState==='running').length,mode:window.LatchlingsCinematics.mode,counter:document.querySelector('#cinematicCounter')?.textContent?.trim()}));
            summary.reducedMotion=motion;
            if (motion.running !== 0 || motion.mode !== 'first-run' || motion.counter !== '1 / 10') throw new Error(`Reduced Motion regression: ${JSON.stringify(motion)}`);
            await reducePage.screenshot({path:'opening-story-evidence/opening-reduced-motion.png',fullPage:true});
            await reducePage.close();
            fs.writeFileSync('opening-story-evidence/results.json',JSON.stringify(summary,null,2));
            await browser.close();
            console.log('OPENING_STORY_BALANCE_BROWSER_OK');
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Upload opening story evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opening-story-balance-evidence
          path: opening-story-evidence
          if-no-files-found: warn
