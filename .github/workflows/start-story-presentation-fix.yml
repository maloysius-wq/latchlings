name: Start story presentation handoff

on:
  push:
    paths:
      - '.github/workflows/start-story-presentation-fix.yml'

permissions:
  contents: write

jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record current work
        shell: python
        env:
          ENTRY_B64: 
        run: |
          import base64, os
          from pathlib import Path
          p = Path('DEVELOPMENT_HANDOFF.md')
          text = p.read_text()
          marker = '## Current Work\n'
          entry = base64.b64decode(os.environ['ENTRY_B64']).decode()
          heading = '### 2026-09-11 — Unblock opening dialogue and make level story beats self-explanatory'
          if heading not in text:
              text = text.replace(marker, marker + '\n\n' + entry, 1)
              p.write_text(text)
      - name: Commit handoff
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Open story presentation work"
          git push
