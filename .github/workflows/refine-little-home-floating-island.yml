name: Refine Little Home Floating Island

on:
  push:
    paths:
      - '.github/workflows/refine-little-home-floating-island.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply floating island refinement
        run: python3 .github/scripts/refine_little_home_floating_island.py

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          for token in [
              '#c2 .cloud.a{left:-40px;top:184px;transform:scale(.9);--cloud-speed:38s',
              '#c2 .cloud.b{right:-34px;top:234px;transform:scale(.73);--cloud-speed:46s',
              '#c2 .cloud.c{left:16px;top:405px;transform:scale(.58);--cloud-speed:53s',
              '#c2 .cloud.d{right:12px;top:374px;transform:scale(.51);--cloud-speed:42s',
              '@keyframes littleHomeCloudDrift',
              '#c2 .island-model{animation:littleHomeIslandFloat 7.6s ease-in-out infinite',
              '#c2 .island-shadow{animation:littleHomeShadowAnchor 7.6s ease-in-out infinite',
              '@keyframes littleHomeIslandFloat',
              '@keyframes littleHomeShadowAnchor',
              '@keyframes littleHomePebbleFloat',
              '#c2 .float-pebble{',
              "url('textures/earth.jpg')",
              '#c2 .island-model,#c2 .island-shadow,#c2 .float-pebble{animation:none!important}'
          ]:
              if token not in t:
                  raise SystemExit(f'Missing required floating-island token: {token}')
          if c2.count('class="float-pebble pebble-') != 6:
              raise SystemExit(f'Expected 6 floating pebbles, found {c2.count("class=\"float-pebble pebble-")}')
          delays=re.findall(r'--pebble-delay:([^;]+)',t)
          if len(delays)<6 or len(set(delays[:6]))<6:
              raise SystemExit(f'Pebble delays are not independently staggered: {delays[:6]}')
          roles=re.findall(r'data-role="(adult|child)"',c2)
          if len(roles)!=5 or roles.count('adult')!=3 or roles.count('child')!=2:
              raise SystemExit(f'Household changed unexpectedly: {roles}')
          if c2.count('class="cloud ')!=4:
              raise SystemExit('Cloud count changed unexpectedly')
          if 'class="deck' in c2 or 'class="fence' in c2:
              raise SystemExit('Removed Little Home deck/fence regressed')
          if '<img' in t.lower() or 'https://' in c2 or 'http://' in c2:
              raise SystemExit('Unexpected image element or runtime hotlink')
          print('FLOATING_ISLAND_STATIC_OK', {'pebbles':6,'clouds':4,'residents':len(roles),'dur':'7.6s'})
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js style400-game.css

      - name: Install Playwright outside repository
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-float-node"
          mkdir -p "$TEST_NODE"
          cd "$TEST_NODE"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null

      - name: Browser validation and screenshots
        shell: bash
        run: |
          set -euo pipefail
          TEST_NODE="$RUNNER_TEMP/little-home-float-node"
          mkdir -p floating-island-renders
          python3 -m http.server 8130 >/tmp/little-home-float-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cp .github/scripts/validate_little_home_floating_island.mjs "$TEST_NODE/validate_little_home_floating_island.mjs"
          node "$TEST_NODE/validate_little_home_floating_island.mjs"

      - uses: actions/upload-artifact@v4
        with:
          name: little-home-floating-island-renders
          path: floating-island-renders/*.png
          if-no-files-found: error

      - name: Commit validated refinement and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -rf floating-island-renders
          rm -f .github/workflows/refine-little-home-floating-island.yml .github/scripts/refine_little_home_floating_island.py .github/scripts/validate_little_home_floating_island.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-floating-island.yml .github/scripts/refine_little_home_floating_island.py .github/scripts/validate_little_home_floating_island.mjs
          git commit -m 'Float the Little Home island'
          git pull --rebase origin main
          git push origin HEAD:main
