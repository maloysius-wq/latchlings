name: Validate round Latchling outline
on:
  push:
    paths:
      - '.github/workflows/validate-round-latchling-outline.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        shell: bash
        run: |
          sha256sum game400-a.js game400-b.js sfx400.js music400.js index.html style400-ui.css style400-themes.css style400-skyway-atlas.css style400-atlas-progression.css style400-board-surfaces.css story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/round-latchling-protected.sha
      - name: Apply candidate outline fix
        shell: bash
        run: |
          python3 .github/tmp/apply-round-latchling-outline.py
          git diff --check
          git diff -- style400-game.css
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser validator
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve candidate
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/latchlings-round-outline-http.log 2>&1 &
      - name: Browser-check circular outlines
        shell: bash
        run: |
          node .github/tmp/validate-round-latchlings.mjs
      - name: Verify protected source unchanged
        shell: bash
        run: |
          sha256sum -c /tmp/round-latchling-protected.sha
      - name: Commit accepted product fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style400-game.css
          git commit -m 'Restore complete Latchling outlines'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: round-latchling-outline-audit
          path: round-latchling-outline-audit
      - name: Self-remove validation helpers
        shell: bash
        run: |
          git reset --hard HEAD
          git pull --ff-only origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/validate-round-latchling-outline.yml .github/tmp/apply-round-latchling-outline.py .github/tmp/validate-round-latchlings.mjs
          git commit -m 'Remove round Latchling outline validator'
          git push
# validator rerun after layered background-clip assertion correction
