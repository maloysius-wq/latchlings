name: Finalize Little Home Life

on:
  push:
    paths:
      - '.github/workflows/finalize-little-home-life.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce validated Little Home refinement
        run: python3 .github/scripts/refine_little_home_life.py
      - name: Verify validated structure before commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('title-island-concepts/index.html').read_text()
          c2=t.split('<section class="concept" id="c2"',1)[1].split('<section class="concept" id="c3"',1)[0]
          assert 'class="fence"' not in c2
          assert len(re.findall(r'data-role="adult"',c2)) == 4
          assert len(re.findall(r'data-role="child"',c2)) == 2
          assert len(re.findall(r'<div class="latchling resident',c2)) == 6
          assert 'class="play-ball"' in c2
          assert '#c2 .latchling{width:34px;height:34px' in t
          assert '#c2 .latchling.child{width:25px;height:25px}' in t
          for k in ['littleHomeGarden','littleHomeParcel','littleHomeTree','littleHomeCircuit','littleHomeKidOne','littleHomeKidTwo','littleHomeBall']:
              assert k in t
          print('FINAL_STRUCTURE_OK')
          PY
          git diff --exit-code -- index.html campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js game400-a.js game400-b.js
      - name: Commit validated refinement and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-little-home-life.yml .github/workflows/finalize-little-home-life.yml .github/scripts/refine_little_home_life.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-life.yml .github/workflows/finalize-little-home-life.yml .github/scripts/refine_little_home_life.py
          git commit -m 'Animate the Little Home household'
          git pull --rebase origin main
          git push origin HEAD:main
