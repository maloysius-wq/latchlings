name: Astra PA Settled Visual Review

on:
  push:
    branches: [astra-presentation-accessibility-candidate]
    paths: ['.github/workflows/astra-pa-settled-visual.yml']

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-presentation-accessibility-candidate
          fetch-depth: 0
      - name: Require exact accepted product bytes
        run: |
          git diff --exit-code e02ba6a9b9ee8925b73e915a17712852da103023 HEAD -- story400.js cinematics400.js style400-cinematics.css index.html game400-b.js style400-ui.css style400-game.css title-island-concepts/index.html style400-cinematics-polish.css style400-cinematics-refine.css style400-cinematics-refine2.css
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture settled representative screens
        shell: bash
        run: |
          mkdir -p /tmp/astra-pa-settled
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          cat > .astra-pa-settled.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const b=await chromium.launch({headless:true});
          async function phone(){
            const c=await b.newContext({viewport:{width:390,height:844}}),p=await c.newPage();
            const errors=[];p.on('pageerror',e=>errors.push(e.message));
            await p.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});
            await p.evaluate(()=>{progress={unlocked:400,stars:{50:3,100:3,150:3,200:3,250:3,300:3,350:3,400:3}};saveProgress();screen('home');updateHome(false)});await p.waitForTimeout(650);
            await p.screenshot({path:'/tmp/astra-pa-settled/home.png'});
            const f=p.frames().find(x=>x.url().includes('title-island-concepts'));if(!f)throw new Error('Home frame missing');await f.click('.memories-home');await p.waitForTimeout(120);await p.screenshot({path:'/tmp/astra-pa-settled/memories.png'});await p.click('#homeMemoriesClose');
            await p.evaluate(()=>openStoryScreen());await p.waitForTimeout(650);await p.screenshot({path:'/tmp/astra-pa-settled/journal.png'});
            await p.evaluate(()=>screen('complete'));await p.waitForTimeout(650);await p.screenshot({path:'/tmp/astra-pa-settled/ending.png'});
            await p.evaluate(()=>LatchlingsCinematics.show('across-drift',{markSeen:false}));await p.waitForTimeout(250);await p.screenshot({path:'/tmp/astra-pa-settled/cinematic.png'});await p.evaluate(()=>LatchlingsCinematics.finish(true));
            if(errors.length)throw new Error(errors.join('\n'));await c.close();
          }
          async function landscape(){const c=await b.newContext({viewport:{width:844,height:390}}),p=await c.newPage();await p.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});await p.evaluate(()=>{progress={unlocked:2,stars:{}};startLevel(2)});await p.waitForTimeout(650);await p.screenshot({path:'/tmp/astra-pa-settled/game-landscape.png'});await c.close()}
          await phone();await landscape();fs.writeFileSync('/tmp/astra-pa-settled/provenance.txt','product=e02ba6a9b9ee8925b73e915a17712852da103023\n');await b.close();
          JS
          node .astra-pa-settled.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: astra-pa-settled-visual
          path: /tmp/astra-pa-settled
          if-no-files-found: error
