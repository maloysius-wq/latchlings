name: Refine Story Board and Cinematic v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual acceptance refinements
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          cat >> style400-cinematics-geometry.css <<'EOF'

/* Acceptance refinement: every simultaneous speaker shares one deliberate speech band. */
.cin-dialogue-layer[data-dialogue-count="1"] .cin-speech-bubble{height:54px!important}
.cin-dialogue-layer[data-dialogue-count="2"] .cin-speech-bubble{height:56px!important}
.cin-dialogue-layer[data-dialogue-count="3"] .cin-speech-bubble{height:62px!important}
.cin-dialogue-layer[data-dialogue-count="4"] .cin-speech-bubble{height:68px!important}
.cin-cast-intro[data-dialogue-count="2"] .intro-bubble{height:54px!important}
@media(max-height:720px){
 .cin-dialogue-layer[data-dialogue-count="1"] .cin-speech-bubble{height:48px!important}
 .cin-dialogue-layer[data-dialogue-count="2"] .cin-speech-bubble{height:50px!important}
 .cin-dialogue-layer[data-dialogue-count="3"] .cin-speech-bubble{height:56px!important}
 .cin-dialogue-layer[data-dialogue-count="4"] .cin-speech-bubble{height:62px!important}
 .cin-cast-intro[data-dialogue-count="2"] .intro-bubble{height:48px!important}
}
EOF
          cat >> style400-story-rail-board.css <<'EOF'

/* Sunpetal acceptance refinement: the five movements must read on the focal board at phone scale, not only in metadata. */
#app.theme-ch1 #game[data-story-phase="1"] .board{border-color:#8a6b43;box-shadow:0 17px 35px rgba(30,48,65,.25),0 0 0 3px rgba(118,163,91,.12),inset 0 0 0 5px rgba(119,173,93,.13);--cellPhaseTint:#f3e7c8}
#app.theme-ch1 #game[data-story-phase="2"] .board{border-color:#5f8c4e;background-color:#7a9c5f;box-shadow:0 17px 35px rgba(30,48,65,.25),0 0 0 4px rgba(91,139,75,.18),inset 0 0 0 5px rgba(83,132,70,.17);--cellPhaseTint:#e3e8c8}
#app.theme-ch1 #game[data-story-phase="2"] .cell{border-color:#9f9a6f}
#app.theme-ch1 #game[data-story-phase="3"] .board{border-color:#5d9fbd;background-color:#96c8cf;box-shadow:0 17px 35px rgba(30,48,65,.25),0 0 0 4px rgba(91,168,195,.2),inset 0 0 0 5px rgba(111,185,202,.17);--cellPhaseTint:#e2efdf}
#app.theme-ch1 #game[data-story-phase="3"] .cell{border-color:#9ea985}
#app.theme-ch1 #game[data-story-phase="4"] .board{border-color:#bf7542;background-color:#ca9860;box-shadow:0 17px 35px rgba(30,48,65,.25),0 0 0 4px rgba(198,117,63,.19),inset 0 0 0 5px rgba(217,147,74,.16);--cellPhaseTint:#efd6b4}
#app.theme-ch1 #game[data-story-phase="4"] .cell{border-color:#a78561}
#app.theme-ch1 #game[data-story-phase="5"] .board{border-color:#d0a346;background-color:#d2b66c;box-shadow:0 17px 35px rgba(30,48,65,.26),0 0 0 4px rgba(233,185,86,.22),0 0 18px rgba(240,193,86,.12),inset 0 0 0 5px rgba(238,194,91,.18);--cellPhaseTint:#f3dfbd}
#app.theme-ch1 #game[data-story-phase="5"] .cell{border-color:#ad9062}
EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cinematic-geometry400.js');text=p.read_text();old='if(brightGeom)layoutCargo(stage,brightGeom,time);';new="if(brightGeom)layoutCargo(stage,brightGeom,(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?cargoEpoch+2200:time);"
          if old not in text: raise SystemExit('cargo timing target missing')
          p.write_text(text.replace(old,new,1))
          PY
          rm -f .github/workflows/refine-story-board-cinematic-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style400-cinematics-geometry.css style400-story-rail-board.css cinematic-geometry400.js .github/workflows/refine-story-board-cinematic-v2.yml
          git commit -m "Refine story board phases and speech bands"
          git push
