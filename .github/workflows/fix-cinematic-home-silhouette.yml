name: Restore Cinematic Little Home Silhouette
on:
  push:
    paths:
      - '.github/workflows/fix-cinematic-home-silhouette.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move island clipping to body layer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('style400-cinematics.css')
          s=p.read_text()
          old=".cin-home-island{position:absolute;width:244px;height:105px;left:50%;top:48%;translate:-50% -25%;background:linear-gradient(#91ce71 0 24%,#a97952 25% 62%,#675044 64% 100%);clip-path:polygon(2% 5%,98% 5%,91% 52%,68% 88%,50% 100%,30% 87%,9% 53%);filter:drop-shadow(0 15px 12px rgba(40,66,83,.18));animation:cinHomeFloat 5.2s ease-in-out infinite}"
          new=".cin-home-island{position:absolute;width:244px;height:105px;left:50%;top:48%;translate:-50% -25%;background:transparent;animation:cinHomeFloat 5.2s ease-in-out infinite}.cin-home-island:before{content:\"\";position:absolute;inset:0;z-index:0;background:linear-gradient(#91ce71 0 24%,#a97952 25% 62%,#675044 64% 100%);clip-path:polygon(2% 5%,98% 5%,91% 52%,68% 88%,50% 100%,30% 87%,9% 53%);filter:drop-shadow(0 15px 12px rgba(40,66,83,.18))}"
          if s.count(old)!=1: raise SystemExit(f'home island silhouette rule count {s.count(old)}')
          s=s.replace(old,new)
          old=".cin-home-grass{position:absolute;left:4%;right:4%;top:-4px;height:30px;border-radius:50%;background:#9bd878}"
          new=".cin-home-grass{position:absolute;left:4%;right:4%;top:-4px;height:30px;border-radius:50%;background:#9bd878;z-index:1}"
          if s.count(old)!=1: raise SystemExit(f'grass rule count {s.count(old)}')
          s=s.replace(old,new)
          old=".cin-cottage{position:absolute;width:72px;height:52px;left:47%;top:-32px;translate:-50% 0;background:#fff0d8;border:2px solid #c79d6c;border-radius:14px 14px 5px 5px}"
          new=".cin-cottage{position:absolute;width:72px;height:52px;left:47%;top:-32px;translate:-50% 0;z-index:3;background:#fff0d8;border:2px solid #c79d6c;border-radius:14px 14px 5px 5px}"
          if s.count(old)!=1: raise SystemExit(f'cottage rule count {s.count(old)}')
          s=s.replace(old,new)
          old=".cin-tree{position:absolute;width:14px;height:43px;left:20%;top:-17px;background:#6f5039;border-radius:8px}"
          new=".cin-tree{position:absolute;width:14px;height:43px;left:20%;top:-17px;z-index:2;background:#6f5039;border-radius:8px}"
          if s.count(old)!=1: raise SystemExit(f'tree rule count {s.count(old)}')
          s=s.replace(old,new)
          anchor=".cin-home-cast .cin-character.pippa{left:37%;top:17px}"
          replacement=".cin-home-cast .cin-character{z-index:4}.cin-home-cast .cin-character.pippa{left:37%;top:17px}"
          if s.count(anchor)!=1: raise SystemExit(f'cast rule count {s.count(anchor)}')
          p.write_text(s.replace(anchor,replacement))
          PY
          grep -q '.cin-home-island:before' style400-cinematics.css
          grep -q '.cin-cottage.*z-index:3' style400-cinematics.css
          grep -q '.cin-tree.*z-index:2' style400-cinematics.css
          grep -q '.cin-home-cast .cin-character{z-index:4}' style400-cinematics.css
      - name: Commit silhouette repair and self-remove
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-cinematic-home-silhouette.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style400-cinematics.css .github/workflows/fix-cinematic-home-silhouette.yml
          git commit -m 'Restore cinematic Little Home scenery'
          git pull --rebase origin main
          git push origin HEAD:main
