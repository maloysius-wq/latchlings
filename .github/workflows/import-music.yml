name: Import Latchlings Music

on:
  push:
    paths:
      - '.github/workflows/import-music.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-music:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download curated CC0 soundtrack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/music
          base='https://raw.githubusercontent.com/euuuuuuan/todak-public/main/assets/music'
          curl -fL --retry 3 "$base/acoustic/Happy_Ukelele_Island_Surfing_Theme.ogg" -o assets/music/title-happy-ukulele.ogg
          curl -fL --retry 3 "$base/relax/Calm3_Peaceful_Days.ogg" -o assets/music/chapter-1-peaceful-days.ogg
          curl -fL --retry 3 "$base/relax/Calm1_A_Place_I_Call_Home.ogg" -o assets/music/chapter-2-place-i-call-home.ogg
          curl -fL --retry 3 "$base/focus/A_Small_Town_On_Pluto_Music_Box.ogg" -o assets/music/chapter-3-pluto-music-box.ogg
          curl -fL --retry 3 "$base/piano/Mystical_Piano.ogg" -o assets/music/chapter-4-mystical-piano.ogg
          curl -fL --retry 3 "$base/piano/Gem_Popper_Piano_Tune.ogg" -o assets/music/chapter-5-gem-popper.ogg
          curl -fL --retry 3 "$base/acoustic/Cozy_Puzzle_In_Game_3.ogg" -o assets/music/chapter-6-cozy-puzzle.ogg
          curl -fL --retry 3 "$base/piano/Electric_Piano_And_Piano_Soft_Melody.ogg" -o assets/music/chapter-7-electric-soft.ogg
          curl -fL --retry 3 "$base/piano/Calm_Piano_1_Vaporware.ogg" -o assets/music/chapter-8-vaporware.ogg
          for f in assets/music/*.ogg; do test -s "$f"; done

      - name: Commit imported audio and remove importer
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-music.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/music .github/workflows/import-music.yml
          git commit -m 'Add curated CC0 soundtrack assets'
          git push origin HEAD:main
