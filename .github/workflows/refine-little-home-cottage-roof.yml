name: Refine Little Home Cottage Roof
on:
  push:
    paths:
      - '.github/workflows/refine-little-home-cottage-roof.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Journal visual refinement before product edit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('DEVELOPMENT_HANDOFF.md')
          t=p.read_text()
          anchor="**Implementation plan:** Inspect the existing Little Home cottage markup/CSS in `title-island-concepts/index.html` and preserve its established walls, chimney, windows/door, island placement, resident choreography, title layout, and 1.10× island scale. Confirm whether the current roof sections belong to one cottage. If they do, add the smallest connecting roof geometry needed to close the visible gap, matching the existing roof palette and depth language rather than redesigning the cottage.\n"
          note="\n**Render refinement note:** The first validated overlap pass (Actions run `33902161335`, artifact `9948058317`) removed the literal box gap but manual inspection still read the right roof as a second attached gable because `.roof-b` retained its own independent peak. The final geometry is therefore being refined so the darker side roof plane begins at the front gable's existing apex/ridge and slopes back over the side wall, which is the correct single-cottage perspective. The cottage footprint and all non-roof title elements remain unchanged.\n"
          if note.strip() not in t:
              if anchor not in t: raise SystemExit('handoff implementation anchor missing')
              t=t.replace(anchor,anchor+note,1)
              p.write_text(t)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md
          git commit -m 'Journal shared-ridge cottage roof refinement'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Make the side roof share the front gable ridge
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('title-island-concepts/index.html')
          t=p.read_text()
          old='.roof-b{left:64px;width:46px;clip-path:polygon(0 69%,30% 0,100% 64%,100% 90%,0 86%);filter:brightness(.78)}'
          new='.roof-b{left:38px;width:72px;clip-path:polygon(0 0,100% 64%,100% 90%,48% 86%,48% 69%);filter:brightness(.78)}'
          if old not in t: raise SystemExit('overlap-pass roof-b rule not found')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Static validation
        run: |
          set -euo pipefail
          grep -q '.roof-b{left:38px;width:72px;clip-path:polygon(0 0,100% 64%,100% 90%,48% 86%,48% 69%);filter:brightness(.78)}' title-island-concepts/index.html
          git diff --exit-code -- index.html style400-game.css style400-story-theme.css story-theme400.js game400-a.js game400-b.js story400.js music400.js sfx400.js campaign400-1.js campaign400-2.js campaign400-3.js campaign400-4.js campaign400-5.js campaign400-6.js campaign400-7.js campaign400-8.js
      - name: Install Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/roof-refine"
          cd "$RUNNER_TEMP/roof-refine"
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          ./node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Validate shared ridge and render
        run: |
          set -euo pipefail
          python3 -m http.server 8154 >/tmp/little-home-roof-refine-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          cat > "$RUNNER_TEMP/roof-refine/audit.mjs" <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8154/title-island-concepts/?c=2&embed=1',{waitUntil:'domcontentloaded'});
          await page.waitForSelector('#c2 .cottage .roof-b');
          const data=await page.evaluate(()=>{
            const c=document.querySelector('#c2 .cottage'),a=c.querySelector('.roof-a'),b=c.querySelector('.roof-b');
            const cr=c.getBoundingClientRect(),ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();
            const residents=[...document.querySelectorAll('#c2 .latchling')].map(x=>({role:x.dataset.role,w:x.getBoundingClientRect().width,h:x.getBoundingClientRect().height}));
            return {cottage:{w:cr.width,h:cr.height},roofA:{x:ar.x,w:ar.width,right:ar.right},roofB:{x:br.x,w:br.width,right:br.right},ridgeDelta:Math.abs((ar.x+ar.width*.5)-br.x),rightDelta:Math.abs(ar.x+106*1.1-br.right),residents,overflow:document.documentElement.scrollWidth>innerWidth+1};
          });
          if(Math.abs(data.cottage.w-122.1)>.5||Math.abs(data.cottage.h-110)>.5) throw new Error('cottage footprint changed '+JSON.stringify(data));
          if(data.ridgeDelta>1) throw new Error('side roof does not share front ridge '+JSON.stringify(data));
          const adults=data.residents.filter(x=>x.role==='adult'), kids=data.residents.filter(x=>x.role==='child');
          if(adults.length!==3||kids.length!==2) throw new Error('resident roster changed '+JSON.stringify(data));
          if(!adults.every(x=>Math.abs(x.w-34)<.3&&Math.abs(x.h-34)<.3)||!kids.every(x=>Math.abs(x.w-25)<.3&&Math.abs(x.h-25)<.3)) throw new Error('resident sizes changed '+JSON.stringify(data));
          if(data.overflow) throw new Error('horizontal overflow');
          if(errors.length) throw new Error(errors.join(' | '));
          await page.screenshot({path:'little-home-cottage-shared-ridge.png',fullPage:true});
          console.log('LITTLE_HOME_SHARED_RIDGE_OK',JSON.stringify(data));
          await browser.close();
          JS
          cd "$RUNNER_TEMP/roof-refine"
          node audit.mjs
          cp little-home-cottage-shared-ridge.png "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: little-home-cottage-shared-ridge
          path: little-home-cottage-shared-ridge.png
          if-no-files-found: error
      - name: Commit refined roof and self-remove
        run: |
          set -euo pipefail
          rm -f little-home-cottage-shared-ridge.png
          rm -f .github/workflows/refine-little-home-cottage-roof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add title-island-concepts/index.html .github/workflows/refine-little-home-cottage-roof.yml
          git commit -m 'Unify Little Home cottage roof ridge'
          git pull --rebase origin main
          git push origin HEAD:main
