name: Close Story Production Handoff

on:
  push:
    paths:
      - '.github/workflows/close-story-production-handoff.yml'

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Close completed handoff entry
        run: python3 .github/scripts/close_story_production_handoff.py

      - name: Validate handoff closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          t=Path('DEVELOPMENT_HANDOFF.md').read_text()
          h='### 2026-09-03 — Build the Latchlings story layer and promote Little Home to production'
          s=t.index(h); e=t.index('\n---',s); section=t[s:e]
          assert '**Status: COMPLETED**' in section
          assert '#### Completion summary' in section
          assert '90d3ab17a311136f61f2d9a6960b84a47bae2aec' in section
          assert '33796934770' in section
          assert '33796990359' in section
          assert 'https://maloysius-wq.github.io/latchlings/' in section
          print('HANDOFF_CLOSURE_OK')
          PY

      - name: Commit handoff and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/close-story-production-handoff.yml .github/scripts/close_story_production_handoff.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DEVELOPMENT_HANDOFF.md .github/workflows/close-story-production-handoff.yml .github/scripts/close_story_production_handoff.py
          git commit -m 'Close story production handoff'
          git pull --rebase origin main
          git push origin HEAD:main
