name: Astra Second Review RED

on:
  push:
    branches:
      - astra-second-review-finishing
    paths:
      - '.github/workflows/astra-second-review-red.yml'

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-second-review-finishing
          fetch-depth: 0
      - name: Protect authored campaign definitions
        shell: bash
        run: |
          set -euo pipefail
          for f in campaign400-{1..8}.js; do
            test "$(git rev-parse 9dffa07d9f1fcd0c48029e13e8a641596c630fc8:$f)" = "$(git hash-object "$f")"
          done
      - name: Install browser runner
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run expected-failing second-review contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/latchlings-red-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          cat > astra-second-red.cjs <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('assert');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle'});
            const countAdvances = async (starter)=>{
              await page.evaluate(starter);
              await page.waitForFunction(()=>window.LatchlingsCinematics?.active);
              let presses=0;
              while(await page.evaluate(()=>!!window.LatchlingsCinematics.active)){
                await page.evaluate(()=>window.LatchlingsCinematics.next());
                presses++;
                await page.waitForTimeout(55);
                if(presses>40) throw new Error('cinematic did not finish');
              }
              return presses;
            };
            const replayPresses=await countAdvances(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));
            assert.strictEqual(replayPresses,18,'full Journal/replay opening must retain all 18 canonical utterances');
            await page.evaluate(()=>localStorage.removeItem('latchlings_cinematics_seen_v1'));
            const firstRunPresses=await countAdvances(()=>window.LatchlingsCinematics.maybeShowBeforeLevel(1,1,()=>{}));
            assert(firstRunPresses<=5,`first-run opening should require <=5 advances, got ${firstRunPresses}`);

            await page.evaluate(()=>window.LatchlingsCinematics.show('opening',{markSeen:false}));
            await page.waitForFunction(()=>document.querySelector('#cinematicStage'));
            assert(await page.locator('#cinematicStage [data-story-action="breakfast-basket-travel"]').count(), 'Opening beat 1 must visibly stage the traveling breakfast basket');
            await page.evaluate(()=>window.LatchlingsCinematics.finish(true));

            await page.evaluate(()=>window.LatchlingsCinematics.show('across-drift',{markSeen:false}));
            for(let i=0;i<20;i++){
              const beat=await page.evaluate(()=>window.LatchlingsCinematics.beat);
              if(beat===4) break;
              await page.evaluate(()=>window.LatchlingsCinematics.next());
              await page.waitForTimeout(55);
            }
            assert.strictEqual(await page.evaluate(()=>window.LatchlingsCinematics.beat),4,'Across the Drift should reach beat 5');
            assert(await page.locator('#cinematicStage [data-story-action="route-reaches-familiar-porch"]').count(), 'Across beat 5 must visibly reconnect the familiar porch');
            assert(await page.locator('#cinematicStage .porch-friend-lantern').count()>=2,'Across beat 5 must reuse the twin-lantern porch identity');
            await page.evaluate(()=>window.LatchlingsCinematics.finish(true));

            await page.evaluate(()=>window.LatchlingsCinematics.show('old-maps',{markSeen:false}));
            for(let i=0;i<20;i++){
              const beat=await page.evaluate(()=>window.LatchlingsCinematics.beat);
              if(beat===3) break;
              await page.evaluate(()=>window.LatchlingsCinematics.next());
              await page.waitForTimeout(55);
            }
            assert(await page.locator('#cinematicStage [data-story-action="unattended-desk"]').count(), 'Old Maps beat 4 should visibly show the unattended desk');
            await page.evaluate(()=>window.LatchlingsCinematics.finish(true));

            await page.evaluate(()=>openStoryScreen());
            await page.waitForSelector('.story-now-chapter>p');
            const normal=parseFloat(await page.locator('.story-now-chapter>p').evaluate(el=>getComputedStyle(el).fontSize));
            assert(normal>=14,`journal body Normal should be >=14px, got ${normal}px`);
            await page.evaluate(()=>window.LatchlingsPrefs.set('textSize','large'));
            await page.waitForTimeout(50);
            const large=parseFloat(await page.locator('.story-now-chapter>p').evaluate(el=>getComputedStyle(el).fontSize));
            assert(large>=16,`journal body Large should be >=16px, got ${large}px`);
            assert.strictEqual(errors.length,0,`page errors: ${errors.join(' | ')}`);
            await browser.close();
          })().catch(err=>{console.error('EXPECTED_RED:',err.message);process.exit(1)});
          NODE
          node astra-second-red.cjs
