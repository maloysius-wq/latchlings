name: Validate story presentation

on:
  push:
    paths:
      - '.github/workflows/validate-story-presentation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply visual correction
        run: python .github/tmp/fix-story-presentation-visuals.py
      - name: Verify candidate scope and syntax
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' style400-cinematics-dialogue.css style400-story-rail-board.css | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected candidate scope:'
            echo "$actual"
            exit 1
          fi
          node --check cinematic-dialogue400.js
          node --check gameplay-story-rail400.js
          grep -Fq 'cin-opening-dialogue-dock' cinematic-dialogue400.js
          grep -Fq 'opening-dialogue-portrait' style400-cinematics-dialogue.css
          grep -Fq 'white-space:normal!important' style400-story-rail-board.css
          grep -Fq 'storypresentation1' index.html
      - name: Install browser validator
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Run browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/latchlings-story-server.log 2>&1 &
          server=$!
          trap 'kill $server || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node .github/tmp/validate-story-presentation.mjs
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-presentation-audit-v2
          path: story-presentation-audit
          if-no-files-found: ignore
      - name: Commit accepted visual correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add style400-cinematics-dialogue.css style400-story-rail-board.css
          git commit -m "Finish story presentation layout"
          git push
