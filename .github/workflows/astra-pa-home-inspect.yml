name: Astra PA Home Inspect

on:
  push:
    branches: [astra-presentation-accessibility-candidate]
    paths:
      - '.github/workflows/astra-pa-home-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-presentation-accessibility-candidate
      - name: Print relevant Home hooks
        run: |
          echo '--- title action hooks ---'
          grep -nE 'postMessage|memory|Memory|action|Action|primary|Primary|button|LittleHome|HomeAction' title-island-concepts/index.html | tail -n 140
          echo '--- parent Home hooks ---'
          grep -nE 'HOME_KEEPSAKE_MEMORIES|homeMemory|HomeAction|homeAction|memory:' game400-b.js | head -n 120
