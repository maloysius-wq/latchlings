name: Astra PA Home Inspect

on:
  push:
    branches: [astra-presentation-accessibility-candidate]
    paths:
      - '.github/workflows/astra-pa-home-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-presentation-accessibility-candidate
      - name: Print relevant Home hooks
        run: |
          echo '--- parent memory data ---'
          sed -n '55,82p' game400-b.js
          echo '--- Home state sender / stage logic ---'
          grep -nE 'function updateHome|const updateHome|home-state|storyProgress|stage:' game400-a.js game400-b.js | head -n 100
          echo '--- title embed event block ---'
          sed -n '412,431p' title-island-concepts/index.html
