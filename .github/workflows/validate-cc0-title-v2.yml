name: Validate CC0 Title V2

on:
  push:
    paths:
      - '.github/workflows/validate-cc0-title-v2.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          test -f title-concepts-cc0-v2/index.html
          test -f title-concepts-cc0-v2/ASSET_CREDITS.md
          test "$(find title-concepts-cc0-v2/assets -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 12
          test "$(grep -o "\['[A-Za-z][^']*','[^']*','#[0-9a-f]*'" title-concepts-cc0-v2/index.html | wc -l)" -eq 10
          ! grep -Eq 'https?://[^"'"'"' ]+\.(png|jpg|jpeg|webp)' title-concepts-cc0-v2/index.html
      - name: Install browser test dependency
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Browser validation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/title-v2-server.log 2>&1 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            const failed=[];
            page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>failed.push(r.url()));
            await page.goto('http://127.0.0.1:8000/title-concepts-cc0-v2/',{waitUntil:'networkidle'});
            const gallery = await page.evaluate(()=>({
              cards: document.querySelectorAll('.card').length,
              phones: document.querySelectorAll('.phone').length,
              images: [...document.images].map(i=>({src:i.getAttribute('src'),complete:i.complete,w:i.naturalWidth,h:i.naturalHeight})),
              sw: document.documentElement.scrollWidth,
              iw: innerWidth
            }));
            if(gallery.cards!==10 || gallery.phones!==10) throw new Error(`Expected 10 concepts, got ${JSON.stringify(gallery)}`);
            const bad=gallery.images.filter(i=>!i.complete || !i.w || !i.h);
            if(bad.length) throw new Error(`Broken images: ${JSON.stringify(bad)}`);
            if(gallery.sw>gallery.iw+2) throw new Error(`Horizontal overflow: ${gallery.sw} > ${gallery.iw}`);
            if(errors.length) throw new Error(`Browser errors: ${errors.join(' | ')}`);
            if(failed.length) throw new Error(`Failed requests: ${failed.join(' | ')}`);
            for(let c=1;c<=10;c++){
              await page.goto(`http://127.0.0.1:8000/title-concepts-cc0-v2/?c=${c}`,{waitUntil:'networkidle'});
              const one=await page.evaluate(()=>({phones:document.querySelectorAll('.phone').length,bad:[...document.images].filter(i=>!i.complete||!i.naturalWidth).length,sw:document.documentElement.scrollWidth,iw:innerWidth}));
              if(one.phones!==1 || one.bad || one.sw>one.iw+2) throw new Error(`Concept ${c} failed: ${JSON.stringify(one)}`);
            }
            console.log('All ten concepts render with local CC0 assets and no broken requests.');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove validator and commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-cc0-title-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete CC0 title concepts v2 browser validation'
          git pull --rebase origin main
          git push origin HEAD:main
