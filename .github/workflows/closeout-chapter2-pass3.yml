name: Close Chapter 2 Pass 3 handoff

on:
  push:
    paths:
      - '.github/workflows/closeout-chapter2-pass3.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Complete Chapter 2 Pass 3 handoff entry
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          p=Path('DEVELOPMENT_HANDOFF.md')
          s=p.read_text()
          heading='### 2026-09-12 — Pass 3 Chapter 2 Lanternwood campaign application'
          if heading not in s:
              raise SystemExit('Chapter 2 Pass 3 entry missing')
          start=s.index(heading)
          next_heading=s.find('\n### ',start+len(heading))
          if next_heading<0:
              next_heading=len(s)
          entry=s[start:next_heading]
          if '**Status: IN PROGRESS**' not in entry:
              raise SystemExit('Chapter 2 Pass 3 entry is not IN PROGRESS')
          entry=entry.replace('**Status: IN PROGRESS**','**Status: COMPLETED**',1)
          summary=dedent('''

          #### Completion summary

          - **Result:** COMPLETED. Audit Pass 3 now covers Chapter 2 / Lanternwood Grove (campaign Levels 51–100) with the accepted production material grammar, stronger chapter continuity, a recognizable Atlas landmark, and a visible Little Home keepsake payoff. Daily remains visually neutral; Chapter 1 remains Sunpetal; Level 101 remains outside this rollout; the Level 366 Aurora proof is unchanged. All eight authored campaign definition files and protected unrelated runtime systems remained byte-for-byte unchanged.
          - **Product commit:** `e4d1076a07904a8662c6330981e7fbb493f1ac4e` (`Apply Pass 3 production treatment to Lanternwood`). Product files changed exactly `game400-a.js`, `game400-b.js`, `style400-production-slice.css`, `style400-skyway-atlas.css`, `story400.js`, `story-grounding400.js`, `STORY_BIBLE.md`, `cinematics400.js`, `title-island-concepts/index.html`, and `index.html`.
          - **Lanternwood production family:** `VISUAL_CHAPTER_MODES` now maps Chapter 2 to `lanternwood`. Five 10-level movement ranges use distinct but quiet desaturated timber/forest materials, deeper perimeter silhouettes, and warm destination lighting. Cell rule space remains linear and matte; decorative pseudo-elements remain suppressed; the selected Latchling / matching nest hierarchy is preserved.
          - **Relationship continuity:** Chapter 2 now establishes the neighbors' porch through a recurring **twin amber lanterns** motif rather than adding a new core-cast dependency. The same motif is recorded in `STORY_BIBLE.md`, appears in Chapter 2 movement/story copy, returns in the later Prism-era story, is visible as the Chapter 2 movement-3 Atlas porch landmark, and is repeated on the existing Across the Drift Familiar Porch cinematic. This directly addresses the audit's note that Tansy's Lanternwood friend/place needed a recognizable name, silhouette, or object before the telescope payoff.
          - **Chapter 2 reward / Little Home:** Completing the real authored Level 100 route now opens a dedicated Lanternwood chapter reward with the twin-lantern porch, ordinary-life/social-route consequence, stars secondary, `Visit Little Home`, and `Continue to Lodestone`. `Visit Little Home` focuses the existing canonical stage-2 visitor pennant. The pennant was repositioned beside the cottage and strengthened visually so it reads as a flag rather than overlapping the cottage/door; reduced-motion mode reaches the same informative state without depending on animation.
          - **Primary validation:** Initial candidate Actions run `34738205968`, job `103673293029`, passed static/source protection and the full Chromium matrix: Levels 51/60/61/70/71/80/81/90/91/100 at 390x844, Level 51 and 100 at 320x568, Daily isolation, Level 50 Sunpetal boundary, untouched Level 101, Level 366 Aurora override, five distinct movement surfaces, selected/matching-nest pairing, quiet-floor contract, >=44px phone controls, story continuity, Atlas landmark, Familiar Porch paired lights, the real authored Level 100 solution, Little Home pennant payoff, and reduced motion. Artifact `chapter2-pass3-campaign-application` ID `10311477295`, SHA-256 `47a3d16aee5a3bddf3a373e5b83cd3ab7b9ff9c8f8a1725c5d56120b6d423512`.
          - **Manual evidence review and correction:** Human review rejected two initial screenshots even though assertions were green: the Atlas capture had a late Story card over it, and the Little Home capture froze during the normal outgoing game transition. Those were evidence-timing defects, not shipped-state defects. Corrected evidence run `34738314566`, job `103673573552`, source-locked the accepted candidate and produced clean Atlas/Little Home captures; artifact ID `10312170815`, SHA-256 `3b45b13ffd2829442d46490818dcddd470526d8f9eebaa5415cf0403f67c819e`.
          - **Pennant refinement found by visual review:** The clean Little Home capture then exposed a real presentation issue: the canonical visitor pennant overlapped the cottage enough that the focus halo read like a glowing door. The candidate was refined before promotion to move the pennant fully beside the cottage, increase flag contrast, and add an explicit browser assertion that the rendered pennant and cottage bounds do not overlap. Refined validation run `34738427227`, job `103673864648`, passed the entire matrix plus the new clean-evidence/non-overlap checks. Artifact ID `10311956356`, SHA-256 `98039905223b9833d923f93ef3a36b362187f879d31704ec5203ee4c8f5f72cf`. Manual review accepted the final Atlas and Little Home captures.
          - **Promotion / deployment:** Promotion run `34738501821`, job `103674056805`, reran the complete protected-source, static, Chromium, real-Level-100, and final-evidence gates before committing. Promotion artifact ID `10311297962`, SHA-256 `aff38c8fb7ff77589a8c048c6a1f44b49936c5d7d8ed5a624e85c8c88c9a7649`. Validator cleanup commit `8d4c44f4ae1d430e83af9e159358e4d3d26dc1d5` removed all Chapter 2 temporary helpers. GitHub Pages run `34738540354` (run 1007) succeeded on that clean head. Before this closeout helper was added, `.github/workflows` contained only permanent `validate-repository-access-guard.yml`.
          - **Remaining scope / exact next action:** Continue audit Pass 3 with Chapter 3, **Lodestone Caverns (Levels 101–150)**, as a separate protected slice. Recheck the audit against current `main`, then establish the proposed geological-slab / clustered-crystal / old-Waykeeper-marker material family across its five movement ranges and evaluate the Chapter 3 Atlas/reward/anchor-trophy payoff with the same source-protection and manual screenshot gates. Do not automatically carry Lanternwood styling into Chapter 3.
          ''')
          if '#### Completion summary' in entry:
              raise SystemExit('completion summary already exists')
          entry=entry.rstrip()+summary+'\n\n'
          s=s[:start]+entry+s[next_heading:]
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add DEVELOPMENT_HANDOFF.md
          git commit -m "Complete Pass 3 Chapter 2 Lanternwood handoff"
          git push
      - name: Self-remove closeout helper
        run: |
          git pull --rebase
          git rm .github/workflows/closeout-chapter2-pass3.yml
          git commit -m "Remove Chapter 2 Pass 3 closeout helper"
          git push
