name: Promote opening story balance v2

on:
  push:
    branches:
      - opening-story-balance
    paths:
      - '.github/workflows/opening-story-promote-live-v2.yml'

permissions:
  contents: write

jobs:
  promote-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote exact accepted product to main
        shell: bash
        run: |
          set -euo pipefail
          ACCEPTED=a710738756472142c906f71d956652ceb1a5f749
          BASE=9015bdb6b2f60e30b98afddc677e990ba8b1bff4
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE"
          test -z "$(git diff --name-only "$BASE" "$ACCEPTED" -- 'campaign400-*.js' style400-control-restoration.css style400-whimsy-font.css)"
          blob=$(git rev-parse "$ACCEPTED:cinematics400.js")
          git checkout -B main origin/main
          git checkout "$ACCEPTED" -- cinematics400.js
          test "$(git hash-object cinematics400.js)" = "$blob"
          test "$(git diff --cached --name-only)" = "cinematics400.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore richer first-run opening story"
          git push origin HEAD:main
          echo "PROMOTED=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PRODUCT_BLOB=$blob" >> "$GITHUB_ENV"
      - name: Verify committed-main provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$PROMOTED"
          test "$(git rev-parse HEAD:cinematics400.js)" = "$PRODUCT_BLOB"
          test -z "$(git diff --name-only 9015bdb6b2f60e30b98afddc677e990ba8b1bff4 HEAD -- 'campaign400-*.js' style400-control-restoration.css style400-whimsy-font.css)"
      - name: Install Chromium
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate committed main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-evidence
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" || true' EXIT
          node <<'NODE'
          const {chromium}=require('playwright'),fs=require('fs');
          const coords=[[0,0],[1,0],[1,1],[1,2],[1,3],[2,2],[3,0],[4,0],[6,0],[7,1]], sizes=[[320,568],[390,844],[430,932]], sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function visible(page){return page.evaluate(()=>{const a=window.LatchlingsCinematics,[speaker,text]=a.CINEMATICS[a.active].beats[a.beat].lines[a.line],o=document.querySelector('#cinematicOverlay'),b=document.querySelector('#cinematicNext'),r=b.getBoundingClientRect();let rs,rt;if(speaker==='Narrator'){rs='Narrator';rt=document.querySelector('#cinematicLines .narrator-only span')?.textContent?.trim()}else{const row=document.querySelector(`.cin-opening-dialogue-dock [data-speaker="${CSS.escape(speaker)}"]`);rs=row?.dataset.speaker;rt=row?.querySelector('.cin-opening-bubble > span')?.textContent?.trim()}return{speaker,text,rs,rt,beat:a.beat,line:a.line,step:a.step,mode:a.mode,counter:document.querySelector('#cinematicCounter')?.textContent?.trim(),dc:o.dataset.dialogueCount,nc:o.dataset.narratorCount,button:{x:r.x,y:r.y,w:r.width,h:r.height,right:r.right,bottom:r.bottom},sw:o.scrollWidth,cw:o.clientWidth,sh:o.scrollHeight,ch:o.clientHeight}})}
          function assertTurn(s,label){if(s.rs!==s.speaker||s.rt!==s.text)throw Error(`${label} presentation ${JSON.stringify(s)}`);if(s.speaker==='Narrator'&&(s.nc!=='1'||s.dc!=='0'))throw Error(`${label} narrator counts`);if(s.speaker!=='Narrator'&&(s.dc!=='1'||s.nc!=='0'))throw Error(`${label} dialogue counts`)}
          (async()=>{const browser=await chromium.launch({headless:true}),out={compact:{},replay:{},dpad:null,reduced:null};for(const [w,h] of sizes){const p=await browser.newPage({viewport:{width:w,height:h}});await p.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});if(!await p.evaluate(()=>LatchlingsCinematics.show('opening',{compact:true,markSeen:false})))throw Error('compact start');out.compact[`${w}x${h}`]=[];for(let i=0;i<10;i++){await sleep(90);const s=await visible(p),[eb,el]=coords[i],vp=p.viewportSize();if(s.mode!=='first-run'||s.step!==i||s.beat!==eb||s.line!==el||s.counter!==`${i+1} / 10`)throw Error(`${w}x${h} step ${i+1} ${JSON.stringify(s)}`);assertTurn(s,`${w}x${h} ${i+1}`);if(s.button.w<44||s.button.h<44||s.button.x< -1||s.button.y< -1||s.button.right>vp.width+1||s.button.bottom>vp.height+1||s.sw>s.cw+1||s.sh>s.ch+1)throw Error(`${w}x${h} containment`);out.compact[`${w}x${h}`].push([s.speaker,s.text]);await p.click('#cinematicNext');await sleep(90)}if(await p.evaluate(()=>!!LatchlingsCinematics.active))throw Error(`${w}x${h} compact did not finish`);await p.close()}
          const p=await browser.newPage({viewport:{width:390,height:844}});await p.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});let total=0;for(const id of ['opening','across-drift','old-maps','homeward']){const n=await p.evaluate(id=>LatchlingsCinematics.CINEMATICS[id].beats.reduce((x,b)=>x+b.lines.length,0),id);if(!await p.evaluate(id=>LatchlingsCinematics.show(id,{markSeen:false}),id))throw Error(`${id} start`);for(let i=0;i<n;i++){await sleep(70);const s=await visible(p);if(s.mode!=='full')throw Error(`${id} mode`);assertTurn(s,`${id} ${i+1}`);await p.click('#cinematicNext');await sleep(70)}if(await p.evaluate(()=>!!LatchlingsCinematics.active))throw Error(`${id} replay did not finish`);out.replay[id]=n;total+=n}if(out.replay.opening!==18||total!==56)throw Error(`replay ${JSON.stringify(out.replay)} total ${total}`);await p.evaluate(()=>{document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.querySelector('#game').classList.add('active');document.body.dataset.screen='game'});out.dpad=await p.evaluate(()=>{const r=document.querySelector('#game .dpad').getBoundingClientRect();return[r.width,r.height]});if(Math.abs(out.dpad[0]-206.7)>1.2||Math.abs(out.dpad[1]-206.7)>1.2)throw Error(`dpad ${out.dpad}`);await p.close();const rp=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});await rp.goto('http://127.0.0.1:8000/index.html',{waitUntil:'networkidle'});await rp.evaluate(()=>LatchlingsCinematics.show('opening',{compact:true,markSeen:false}));await sleep(180);out.reduced=await rp.evaluate(()=>({running:document.getAnimations().filter(a=>a.playState==='running').length,counter:document.querySelector('#cinematicCounter')?.textContent?.trim(),mode:LatchlingsCinematics.mode}));if(out.reduced.running||out.reduced.counter!=='1 / 10'||out.reduced.mode!=='first-run')throw Error(`reduced ${JSON.stringify(out.reduced)}`);await rp.close();fs.writeFileSync('live-evidence/results.json',JSON.stringify(out,null,2));await browser.close();console.log('COMMITTED_MAIN_OPENING_BALANCE_OK')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload live evidence
        uses: actions/upload-artifact@v4
        with:
          name: opening-story-live-evidence
          path: live-evidence
