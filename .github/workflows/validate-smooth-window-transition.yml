name: Validate smooth window transition
on:
  push:
    paths:
      - '.github/workflows/validate-smooth-window-transition.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve protected source hashes
        shell: bash
        run: |
          sha256sum game400-b.js sfx400.js music400.js index.html style400-board-surfaces.css style400-atlas-progression.css story400.js story-grounding400.js cinematics400.js cinematic-dialogue400.js campaign400-*.js > /tmp/protected-before.sha
      - name: Apply manual transition candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('game400-a.js')
          s=p.read_text()
          old="let activeScreenTransition=null;function screen(id){const next=document.getElementById(id),current=document.querySelector('.screen.active');if(!next)return;if(current===next){document.body.dataset.screen=id;if(id==='home')setTimeout(()=>updateHome(true),0);return}const swap=()=>{document.body.dataset.screen=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));next.classList.add('active');if(id==='home')setTimeout(()=>updateHome(true),0)};const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches,canSwipe=!!current&&!reduced&&typeof document.startViewTransition==='function';if(!canSwipe){swap();return}try{if(activeScreenTransition&&typeof activeScreenTransition.skipTransition==='function')activeScreenTransition.skipTransition();const vt=document.startViewTransition(swap);activeScreenTransition=vt;if(window.LatchlingsSFX&&window.LatchlingsSFX.screenSwipe)window.LatchlingsSFX.screenSwipe();vt.finished.finally(()=>{if(activeScreenTransition===vt)activeScreenTransition=null})}catch(_){activeScreenTransition=null;swap()}}"
          new="""let activeScreenTransition=null;
function screen(id){
 const next=document.getElementById(id);if(!next)return;
 if(activeScreenTransition&&typeof activeScreenTransition.skipTransition==='function')activeScreenTransition.skipTransition();
 const current=document.querySelector('.screen.active');
 if(current===next){document.body.dataset.screen=id;if(id==='home')setTimeout(()=>updateHome(true),0);return}
 const swap=()=>{document.body.dataset.screen=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));next.classList.add('active');if(id==='home')setTimeout(()=>updateHome(true),0)};
 const reduced=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches),canSlide=!!current&&!reduced&&typeof current.animate==='function';
 if(!canSlide){swap();return}
 const priorStyle=current.getAttribute('style'),rect=current.getBoundingClientRect(),display=getComputedStyle(current).display==='none'?'flex':getComputedStyle(current).display;
 let animation=null,rafA=0,rafB=0,settled=false,resolveReady,resolveFinished,controller;
 const ready=new Promise(r=>resolveReady=r),finished=new Promise(r=>resolveFinished=r);
 const restore=()=>{if(priorStyle===null)current.removeAttribute('style');else current.setAttribute('style',priorStyle);current.classList.remove('screen-transition-outgoing')};
 const settle=()=>{if(settled)return;settled=true;if(rafA)cancelAnimationFrame(rafA);if(rafB)cancelAnimationFrame(rafB);if(animation){animation.onfinish=null;animation.oncancel=null}restore();resolveReady();resolveFinished();if(activeScreenTransition===controller)activeScreenTransition=null};
 controller={ready,finished,skipTransition(){if(settled)return;if(animation)animation.cancel();settle()}};
 activeScreenTransition=controller;
 current.classList.add('screen-transition-outgoing');
 Object.assign(current.style,{display,position:'fixed',left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px',margin:'0',zIndex:'40',pointerEvents:'none',willChange:'transform,opacity',transform:'translate3d(0,0,0) scaleX(1)',opacity:'1'});
 swap();
 if(window.LatchlingsSFX&&window.LatchlingsSFX.screenSwipe)window.LatchlingsSFX.screenSwipe();
 void next.offsetWidth;
 rafA=requestAnimationFrame(()=>{rafB=requestAnimationFrame(()=>{if(settled)return;resolveReady();animation=current.animate([{transform:'translate3d(0,0,0) scaleX(1)',opacity:1},{transform:'translate3d(106vw,0,0) scaleX(1.018)',opacity:.10}],{duration:420,easing:'cubic-bezier(.22,.61,.36,1)',fill:'forwards'});animation.onfinish=settle;animation.oncancel=()=>{if(!settled)settle()}})});
 return controller;
}"""
          if old not in s: raise SystemExit('screen() source anchor not found')
          p.write_text(s.replace(old,new,1))

          css=Path('style400-ui.css')
          c=css.read_text()
          start=c.index('/* Fast right-swipe root snapshot transitions */')
          end=c.index('@media(prefers-reduced-motion:reduce)',start)
          replacement='''/* Smooth screen transition: destination lays out behind a fixed outgoing screen, then only the outgoing screen moves. */\n.screen.screen-transition-outgoing{display:flex!important;flex-direction:column;backface-visibility:hidden;contain:paint;isolation:isolate}\n'''
          css.write_text(c[:start]+replacement+c[end:])
          PY
          node --check game400-a.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path('game400-a.js').read_text(); css=Path('style400-ui.css').read_text()
          assert 'document.startViewTransition' not in js
          assert "duration:420" in js
          assert "current.animate" in js
          assert "ready,finished,skipTransition" in js
          assert "screen-transition-outgoing" in js and "screen-transition-outgoing" in css
          assert '::view-transition-' not in css
          assert 'latchlingsSwipeRightOld' not in css
          print('MANUAL_TRANSITION_STATIC_CHECKS_OK')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve candidate
        run: python3 -m http.server 4173 >/tmp/latchlings-smooth-http.log 2>&1 &
      - name: Browser-check prepared overlay transition
        shell: bash
        run: |
          mkdir -p smooth-transition-audit
          cat > validate-smooth-transition.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
          const source=await (await fetch('http://127.0.0.1:4173/game400-a.js')).text();
          const css=await (await fetch('http://127.0.0.1:4173/style400-ui.css')).text();
          if(source.includes('document.startViewTransition')) throw new Error('root View Transition API still used');
          if(!source.includes('duration:420')) throw new Error('420ms duration missing');
          if(!source.includes('current.animate')) throw new Error('outgoing element animation missing');
          if(css.includes('::view-transition-')) throw new Error('obsolete root snapshot CSS remains');

          const runs=await page.evaluate(async()=>{
            const prepare=(target)=>{
              if(target==='levels'){
                chapterView=Math.ceil(progress.unlocked/50);rangeView=Math.floor(((progress.unlocked-1)%50)/10);const c=screen('levels');renderChapter();return c;
              }
              if(target==='story'){const c=screen('story');renderStoryScreen();return c;}
              if(target==='game'){
                currentLevel=1;const lev=LEVELS[0];positions=lev.pieces.map(p=>p.pos.slice());doorMask=0;movesUsed=0;selected=0;hintStep=0;animating=false;applyTheme(1);const c=screen('game');renderGame(true);return c;
              }
              return screen(target);
            };
            const output=[];
            for(const target of ['levels','home','story','home','game','home','levels','home']){
              const callStart=performance.now();const ctl=prepare(target)||activeScreenTransition;
              if(!ctl||!ctl.ready||!ctl.finished||typeof ctl.skipTransition!=='function')throw new Error('transition contract missing for '+target);
              await ctl.ready;const motionStart=performance.now();
              const stamps=[];let stop=false;const pump=t=>{stamps.push(t);if(!stop)requestAnimationFrame(pump)};requestAnimationFrame(pump);
              await ctl.finished;stop=true;const end=performance.now();
              const deltas=stamps.slice(1).map((t,i)=>t-stamps[i]);
              output.push({target,readyDelay:motionStart-callStart,motion:end-motionStart,total:end-callStart,frames:stamps.length,maxGap:deltas.length?Math.max(...deltas):0,avgGap:deltas.length?deltas.reduce((a,b)=>a+b,0)/deltas.length:0,outgoingLeft:document.querySelectorAll('.screen-transition-outgoing').length,activeCount:document.querySelectorAll('.screen.active').length});
              await new Promise(r=>setTimeout(r,35));
            }
            return output;
          });
          console.log('PREPARED_TRANSITION_CADENCE',JSON.stringify(runs));
          for(const r of runs){
            if(r.readyDelay<0||r.readyDelay>190)throw new Error(`prep delay out of band ${r.target}: ${r.readyDelay}`);
            if(r.motion<380||r.motion>520)throw new Error(`motion duration out of band ${r.target}: ${r.motion}`);
            if(r.total>680)throw new Error(`total transition too long ${r.target}: ${r.total}`);
            if(r.frames<18)throw new Error(`too few motion frames ${r.target}: ${r.frames}`);
            if(r.avgGap>20.5)throw new Error(`poor motion average cadence ${r.target}: ${r.avgGap}`);
            if(r.maxGap>55)throw new Error(`motion frame stall ${r.target}: ${r.maxGap}`);
            if(r.outgoingLeft!==0||r.activeCount!==1)throw new Error(`transition cleanup failed ${r.target}`);
          }
          if(errors.length)throw new Error('page errors: '+errors.join(' | '));
          const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);if(overflow>1)throw new Error('horizontal overflow '+overflow);

          await page.emulateMedia({reducedMotion:'reduce'});
          const reduced=await page.evaluate(()=>{const before=document.body.dataset.screen;screen('levels');renderChapter();return {before,after:document.body.dataset.screen,active:!!activeScreenTransition,outgoing:document.querySelectorAll('.screen-transition-outgoing').length}});
          if(reduced.active||reduced.outgoing!==0||reduced.after!=='levels')throw new Error('reduced-motion path should swap immediately');
          await page.emulateMedia({reducedMotion:'no-preference'});

          const rapid=await page.evaluate(async()=>{screen('story');renderStoryScreen();screen('home');const c=activeScreenTransition;if(c)await c.finished;return {screen:document.body.dataset.screen,outgoing:document.querySelectorAll('.screen-transition-outgoing').length,activeCount:document.querySelectorAll('.screen.active').length}});
          if(rapid.screen!=='home'||rapid.outgoing!==0||rapid.activeCount!==1)throw new Error('rapid navigation cleanup failed');

          await page.evaluate(()=>{chapterView=Math.ceil(progress.unlocked/50);rangeView=Math.floor(((progress.unlocked-1)%50)/10);screen('levels');renderChapter()});
          const ctl=await page.evaluateHandle(()=>activeScreenTransition);
          for(let i=0;i<7;i++){if(i)await page.waitForTimeout(65);await page.screenshot({path:`smooth-transition-audit/frame-${String(i).padStart(2,'0')}-${i*65}ms.png`,fullPage:true});}
          await page.evaluate(async()=>{if(activeScreenTransition)await activeScreenTransition.finished});
          fs.writeFileSync('smooth-transition-audit/report.json',JSON.stringify({accepted:true,runs,reduced,rapid},null,2));
          console.log('SMOOTH_WINDOW_TRANSITION_ACCEPTED');
          await browser.close();
          JS
          node validate-smooth-transition.mjs
      - name: Verify protected source unchanged
        run: sha256sum -c /tmp/protected-before.sha
      - name: Commit accepted transition
        shell: bash
        run: |
          set -euo pipefail
          rm -f package.json package-lock.json validate-smooth-transition.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game400-a.js style400-ui.css
          git commit -m 'Eliminate screen transition stutter'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: smooth-window-transition-renders
          path: smooth-transition-audit
      - name: Self-remove validator
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git pull --ff-only origin main
          git rm .github/workflows/validate-smooth-window-transition.yml
          git commit -m 'Remove smooth transition validator'
          git push
