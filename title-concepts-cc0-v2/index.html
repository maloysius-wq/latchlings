<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Latchlings CC0 Title Concepts</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef5f8;color:#23456f;font-family:Arial,sans-serif}.page{max-width:1480px;margin:auto;padding:22px}.head{display:flex;gap:18px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.head h1{margin:0;font:700 38px Georgia,serif}.head p{max-width:820px;margin:7px 0 0;color:#607b98;line-height:1.45}.nav a,.meta a{color:#35608f;text-decoration:none;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:22px}.card{padding:14px;border-radius:26px;background:#ffffffbf;box-shadow:0 12px 32px #23456f12}.meta{display:flex;justify-content:space-between;gap:12px;padding:2px 4px 10px}.meta b{font-size:18px}.meta small{display:block;margin-top:4px;color:#69829c}.phone{position:relative;aspect-ratio:390/844;border-radius:24px;overflow:hidden;background:var(--bg);box-shadow:0 18px 40px #23456f2b}.top{position:absolute;top:16px;right:16px;display:flex;gap:8px;z-index:8}.pill{padding:9px 13px;border-radius:999px;background:#fff6e6;color:#284c78;font-weight:900;font-size:12px;box-shadow:0 7px 18px #24466e1f}.brand{position:absolute;top:78px;left:20px;right:20px;text-align:center;z-index:8}.brand h2{margin:0;font:700 50px Georgia,serif;letter-spacing:-1px;text-shadow:0 3px #ffffff70}.brand p{margin:9px 0 0;font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:900;color:#59738f}.stage{position:absolute;top:170px;left:18px;right:18px;height:410px;border-radius:30px;overflow:hidden;background:#d9edf6;box-shadow:inset 0 0 0 1px #ffffff90}.art{position:absolute;object-fit:cover;border-radius:22px;box-shadow:0 14px 26px #1f385331;border:7px solid #fff8eb}.play{position:absolute;top:594px;left:18px;right:18px;height:63px;border-radius:22px;border:2px solid #c78a50;background:#f8eac9;color:#23456f;font-size:25px;font-weight:900;display:grid;place-items:center;z-index:8}.subs{position:absolute;top:667px;left:18px;right:18px;display:grid;grid-template-columns:1fr 1fr;gap:11px;z-index:8}.sub{min-height:92px;border-radius:21px;background:#f8eac9;padding:18px 15px;display:flex;flex-direction:column;justify-content:flex-end}.sub b{font-size:17px}.sub span{font-size:12px;color:#647e99;margin-top:6px;font-weight:700}.latch{position:absolute;width:102px;height:102px;z-index:6;animation:float 4.2s ease-in-out infinite}.latch.big{width:116px;height:116px}.latch svg{width:100%;height:100%;filter:drop-shadow(0 10px 12px #2f46612b)}.eyes{transform-box:fill-box;transform-origin:center;animation:blink var(--blink,4.7s) infinite var(--delay,0s)}@keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}@keyframes float{0%,100%{transform:translateY(0) rotate(var(--tilt,0deg))}50%{transform:translateY(-7px) rotate(var(--tilt,0deg))}}.caption{padding:10px 4px 2px;color:#617c98;font-size:13px;line-height:1.4}.caption b{display:block;color:#28496f;margin-bottom:3px}.solo{max-width:430px;margin:auto}.solo .meta{display:flex}@media(max-width:470px){.page{padding:10px}.grid{display:block}.card{margin-bottom:16px}.head h1{font-size:30px}.nav{display:none}}
</style></head><body><main class="page"><header class="head"><div><h1>Latchlings: 10 CC0-art title concepts</h1><p>Every non-Latchling illustration inside these title screens comes from locally hosted CC0 source art. The Latchlings remain custom animated HTML/SVG characters so they can blink, bob, and keep their personality.</p></div><div class="nav" id="nav"></div></header><section class="grid" id="grid"></section></main><script>
const A='assets/';
const C=[
['Postcard Skyway','Layered scenic postcards','#cfe9f6','Play','Plan the route. Find every nest.',['background-sample.png','foliage-sample.png','sketch-town-preview.png']],
['Grove Landing','Nature art as the whole stage','#c8e8f5','Start Journey','A little flock. A lot of routes.',['foliage-sample.png','background-preview.png']],
['Questboard Nest','Adventure UI used as scenery','#dbe6f0','Accept Quest','Chart a course. Crack the puzzle.',['ui-adventure-sample.png','ui-adventure-preview.png','background-sample.png']],
['Village Welcome','Isometric town worldbuilding','#d4e8f5','Visit the Village','Home is where the route leads.',['sketch-town-sample.png','background-preview.png']],
['Skyway Atlas','Map-forward route fantasy','#e7e2d2','Open the Atlas','Pick a path. Find the nest.',['sketch-town-preview.png','sketch-town-sample.png','ui-adventure-preview.png']],
['Nestmates','Cute CC0 animals around the flock','#d8eef7','Play Together','Nestmates and new friends.',['animal-pack-sample.png','animal-pack-preview.png','background-sample.png']],
['Shape Parade','Bright graphic companions','#e4ebf7','Join the Parade','Tiny flaps. Clever paths.',['shape-characters-sample.png','shape-characters-preview.png','foliage-preview.png']],
['Window Waypoint','Framed scenic layers','#efd8c9','Open the Window','A little window into the skyway.',['foliage-sample.png','sketch-town-sample.png','ui-adventure-sample.png']],
['Patchwork Route','Scrapbook-like CC0 collage','#d6ebf6','Follow the Route','Every clue points home.',['background-preview.png','sketch-town-preview.png','ui-adventure-preview.png','foliage-preview.png']],
['Courtyard Chorus','A fuller world-opening composition','#d4ebf8','Enter the Courtyard','Every Latchling has a homeward path.',['sketch-town-sample.png','foliage-sample.png','animal-pack-preview.png','background-sample.png']]
];
const marks=['M50 10c-12 12-13 29-2 37-11 2-18 9-18 16 12 7 25 9 38 0-1-8-7-14-18-16 2-14 0-31-2-37z','M50 9c-15 15-14 30-3 38-10 3-16 9-15 16 10 7 23 8 36 0 0-8-6-14-17-16 2-14 0-29-1-38z','M50 8c-13 12-15 29-4 39-10 3-17 10-16 17 12 6 25 8 39 0 0-8-7-14-19-17 1-13 0-29-1-39z'];
function L(x,y,c,w,i=0,s=''){return `<div class="latch ${s}" style="left:${x}px;top:${y}px;--blink:${4.1+i*.63}s;--delay:-${i*.71}s;--tilt:${i%2?2:-2}deg"><svg viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="50" cy="92" rx="28" ry="5" fill="#30496518"/><ellipse cx="18" cy="57" rx="13" ry="16" fill="${w}"/><ellipse cx="82" cy="57" rx="13" ry="16" fill="${w}"/><circle cx="50" cy="50" r="32" fill="${c}"/><ellipse cx="50" cy="47" rx="25" ry="21" fill="#ffffff2b"/><path d="${marks[i%3]}" fill="#17283c" transform="translate(36 11) scale(.28)"/><g class="eyes"><circle cx="42" cy="48" r="3.5" fill="#162639"/><circle cx="59" cy="48" r="3.5" fill="#162639"/><circle cx="41" cy="47" r="1" fill="white"/><circle cx="58" cy="47" r="1" fill="white"/></g><circle cx="31" cy="57" r="4" fill="#f2b7c4aa"/><circle cx="69" cy="57" r="4" fill="#f2b7c4aa"/><path d="M47 55h7l-3.5 4z" fill="#e7a64c"/><ellipse cx="42" cy="83" rx="5" ry="3" fill="#c89556"/><ellipse cx="58" cy="83" rx="5" ry="3" fill="#c89556"/></svg></div>`}
function art(src,i,n){const layouts=[[16,12,240,145,-7],[105,145,230,140,5],[205,34,132,105,6],[20,205,190,120,-4]];let [x,y,w,h,r]=layouts[i%4];if(n===2&&i===0){x=10;y=30;w=334;h=205;r=0}if(n===2&&i===1){x=70;y=220;w=235;h=145;r=0}return `<img class="art" src="${A+src}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg)" alt="">`}
function phone(c){const imgs=c[5].map((s,i)=>art(s,i,c[5].length)).join('');return `<div class="phone" style="--bg:${c[2]}"><div class="top"><div class="pill">148 stars</div><div class="pill">Settings</div></div><div class="brand"><h2>Latchlings</h2><p>${c[4]}</p></div><div class="stage">${imgs}${L(20,280,'#ef7478','#d96770',0,'big')}${L(128,272,'#8bd49a','#77c286',1,'big')}${L(238,282,'#82a7ef','#7296df',2,'big')}</div><div class="play">${c[3]}</div><div class="subs"><div class="sub"><b>Daily Puzzle</b><span>One cozy route</span></div><div class="sub"><b>Level Select</b><span>400 puzzle boards</span></div></div></div>`}
const grid=document.getElementById('grid'),q=Number(new URLSearchParams(location.search).get('c')||0),nav=document.getElementById('nav');nav.innerHTML=C.map((_,i)=>`<a href="?c=${i+1}">${i+1}</a>`).join(' · ');if(q>=1&&q<=10){grid.innerHTML=`<article class="card solo"><div class="meta"><div><b>${C[q-1][0]}</b><small>${C[q-1][1]}</small></div><a href="./">All 10</a></div>${phone(C[q-1])}</article>`}else C.forEach((c,i)=>grid.insertAdjacentHTML('beforeend',`<article class="card"><div class="meta"><div><b>Concept ${String(i+1).padStart(2,'0')} — ${c[0]}</b><small>${c[1]}</small></div><a href="?c=${i+1}">Open</a></div>${phone(c)}<div class="caption"><b>${c[0]}</b>${c[1]}</div></article>`));
</script></body></html>
