<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#b9dcf4" />
<title>Latchlings</title>
<link rel="stylesheet" href="style400-ui.css">
<link rel="stylesheet" href="style400-game.css">
<link rel="stylesheet" href="style400-themes.css">
<link rel="stylesheet" href="style400-story-theme.css">
</head>
<body data-screen="home">
<div id="app">
  <div class="chapter-material-backdrop" id="chapterMaterialBackdrop" aria-hidden="true"></div>
  <div class="screen-whoosh" id="screenWhoosh" aria-hidden="true"><i class="whoosh-streak one"></i><i class="whoosh-streak two"></i></div>
  <main id="home" class="screen active production-home" aria-label="Latchlings home">
    <div class="production-home-wrap">
      <iframe id="homeTitleFrame" class="production-home-frame" src="title-island-concepts/?c=2&amp;embed=1" title="Latchlings Little Home" scrolling="no"></iframe>
    </div>
  </main>

  <main id="levels" class="screen">
    <div class="topbar card"><button class="iconbtn" id="levelsBack" aria-label="Back"></button><div class="game-title" style="font-size:23px">Level Select</div><div class="spacer"></div></div>
    <div id="chapterHead" class="chapter-head card"></div>
    <div id="chapterNav" class="chapter-nav"></div>
    <div id="rangeNav" class="range-nav"></div>
    <div id="levelGrid" class="level-grid card"></div>
    <div class="level-footer"><button class="secondary-btn" id="resetProgressBtn">Reset Progress</button><button class="secondary-btn" id="continueBtn">Continue</button></div>
  </main>

  <main id="story" class="screen story-screen" aria-label="Story and residents">
    <div class="topbar card story-topbar"><button class="iconbtn" id="storyBack" aria-label="Back"></button><div class="game-title" style="font-size:22px">Story &amp; Residents</div><div class="spacer"></div><button class="story-rules-btn" id="storyRules">Rules</button></div>
    <section class="story-screen-card card">
      <div class="theme-kicker">The Latchlands</div>
      <h1>Little Home</h1>
      <p id="storyPremise"></p>
      <div class="story-role-card" id="storyRole"></div>
      <h2>Residents</h2>
      <div class="story-cast" id="storyCast"></div>
      <h2>Current chapter</h2>
      <div class="story-current-chapter" id="storyChapter"></div>
    </section>
  </main>

  <main id="game" class="screen">
    <div class="topbar card game-top"><div class="logo">Latchlings<small></small></div><div class="game-title" id="levelTitle">Level 1</div><div class="moves-box"><span>Moves left</span><strong id="movesLeft">0</strong></div><button class="iconbtn story-card-trigger" id="storyCardBtn" aria-label="Story for this level" title="Story"></button><button class="iconbtn" id="pauseBtn" aria-label="Pause"></button></div>
    <div class="mechanic-note" id="mechanicNote"></div>
    <div class="board-wrap"><div class="level-props" id="levelProps" aria-hidden="true"></div><div class="theme-flourish left" aria-hidden="true"></div><div class="board" id="board"><div class="piece-layer" id="pieceLayer"></div></div><div class="theme-flourish right" aria-hidden="true"></div></div>
    <div class="controls"><button class="side-action" id="resetLevelBtn"><span id="resetIcon"></span><span>Reset</span></button><div class="dpad" aria-label="Directional pad">
<svg class="dpad-base" viewBox="0 0 240 240" aria-hidden="true"><path class="dpad-edge" d="M100 10 H140 Q160 10 160 30 V70 Q160 80 170 80 H210 Q230 80 230 100 V140 Q230 160 210 160 H170 Q160 160 160 170 V210 Q160 230 140 230 H100 Q80 230 80 210 V170 Q80 160 70 160 H30 Q10 160 10 140 V100 Q10 80 30 80 H70 Q80 80 80 70 V30 Q80 10 100 10 Z"/></svg>
<svg class="dpad-rocker" id="dpadRocker" viewBox="0 0 240 240" aria-hidden="true">
<defs><linearGradient id="rockerFace" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff9ef"/><stop offset="46%" stop-color="#f4e2c4"/><stop offset="100%" stop-color="#e4c18e"/></linearGradient><radialGradient id="rockerShine" cx="35%" cy="27%" r="72%"><stop offset="0%" stop-color="#ffffff"/><stop offset="62%" stop-color="#ffffff" stop-opacity=".18"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></radialGradient></defs>
<path class="dpad-face" d="M100 10 H140 Q160 10 160 30 V70 Q160 80 170 80 H210 Q230 80 230 100 V140 Q230 160 210 160 H170 Q160 160 160 170 V210 Q160 230 140 230 H100 Q80 230 80 210 V170 Q80 160 70 160 H30 Q10 160 10 140 V100 Q10 80 30 80 H70 Q80 80 80 70 V30 Q80 10 100 10 Z"/><path class="dpad-shine" d="M100 10 H140 Q160 10 160 30 V70 Q160 80 170 80 H210 Q230 80 230 100 V140 Q230 160 210 160 H170 Q160 160 160 170 V210 Q160 230 140 230 H100 Q80 230 80 210 V170 Q80 160 70 160 H30 Q10 160 10 140 V100 Q10 80 30 80 H70 Q80 80 80 70 V30 Q80 10 100 10 Z"/><path class="dpad-inner" d="M100 10 H140 Q160 10 160 30 V70 Q160 80 170 80 H210 Q230 80 230 100 V140 Q230 160 210 160 H170 Q160 160 160 170 V210 Q160 230 140 230 H100 Q80 230 80 210 V170 Q80 160 70 160 H30 Q10 160 10 140 V100 Q10 80 30 80 H70 Q80 80 80 70 V30 Q80 10 100 10 Z"/>
<path class="dpad-arrow" d="M103 66 120 49l17 17"/><path class="dpad-arrow" d="m67 103-17 17 17 17"/><path class="dpad-arrow" d="m173 103 17 17-17 17"/><path class="dpad-arrow" d="m103 174 17 17 17-17"/>
</svg>
<button class="dpad-cycle" id="cycleLatchlingBtn" aria-label="Select next Latchling" title="Select next Latchling"><svg viewBox="0 0 64 64" aria-hidden="true"><path class="cycle-ring" d="M18 23a18 18 0 0 1 29-5"/><path class="cycle-ring" d="M46 41a18 18 0 0 1-29 5"/><path class="cycle-tip" d="m43 11 5 8-9 1"/><path class="cycle-tip" d="m21 53-5-8 9-1"/><circle cx="24" cy="32" r="3.5"/><circle cx="32" cy="32" r="3.5"/><circle cx="40" cy="32" r="3.5"/></svg></button><button class="dpad-hit up" data-dir="U" aria-label="Move up"></button><button class="dpad-hit left" data-dir="L" aria-label="Move left"></button><button class="dpad-hit right" data-dir="R" aria-label="Move right"></button><button class="dpad-hit down" data-dir="D" aria-label="Move down"></button></div><button class="side-action" id="hintBtn"><span id="hintIcon"></span><span>Hint</span></button></div>
  </main>

  <main id="complete" class="screen">
    <div class="home-main"><section class="hero card"><div class="logo" style="font-size:24px">Latchlings<small></small></div><h1 style="font-size:40px;margin-top:20px">The Skyway Lives Again</h1><p>The islands keep drifting. Now the routes move with them, tended by neighbors and Waykeepers across the Latchlands.</p><div class="island" aria-hidden="true"><div class="island-base"></div><div class="home-house"></div><div class="hero-latch one"><i class="mini-eye e1"></i><i class="mini-eye e2"></i><i class="mini-mouth"></i></div><div class="hero-latch two"><i class="mini-eye e1"></i><i class="mini-eye e2"></i><i class="mini-mouth"></i></div><div class="hero-latch three"><i class="mini-eye e1"></i><i class="mini-eye e2"></i><i class="mini-mouth"></i></div></div><button class="primary-btn" id="completeLevels">Level Select</button><button class="secondary-btn" id="completeHome" style="margin-top:12px">Return to Little Home</button></section></div>
  </main>
</div>
<div class="story-card-overlay" id="storyCardOverlay" aria-hidden="true">
  <section class="story-card-panel" id="storyCardPanel" role="dialog" aria-modal="true" aria-labelledby="storyCardTitle">
    <button class="story-card-x" id="storyCardClose" aria-label="Close story">×</button>
    <div class="story-card-scene" id="storyCardScene" aria-hidden="true"></div>
    <div class="story-card-body">
      <div class="story-card-meta"><span class="story-card-kind" id="storyCardKind"></span><span class="story-card-location" id="storyCardLocation"></span></div>
      <h2 id="storyCardTitle"></h2>
      <p class="story-card-context" id="storyCardContext"></p>
      <p class="story-card-flavor" id="storyCardFlavor"></p>
      <div class="story-card-actions"><button class="story-card-continue" id="storyCardContinue">Continue</button></div>
    </div>
  </section>
</div>
<div class="overlay" id="overlay"><div class="modal card" id="modal"></div></div>
<div class="debug" id="debug"></div>
<script src="campaign400-1.js"></script>
<script src="campaign400-2.js"></script>
<script src="campaign400-3.js"></script>
<script src="campaign400-4.js"></script>
<script src="campaign400-5.js"></script>
<script src="campaign400-6.js"></script>
<script src="campaign400-7.js"></script>
<script src="campaign400-8.js"></script>
<script src="story400.js"></script>
<script src="game400-a.js"></script>
<script src="game400-b.js"></script>
<script src="music400.js"></script>
<script src="sfx400.js"></script>
<script src="story-theme400.js"></script>
</body>
</html>
